- id: mat-alg-base-0002
  subject: math
  topic: math.algebra.basics
  source:
    type: authored_drill
    label: "แบบฝึกหัดพัฒนาทักษะพื้นฐาน: การแยกตัวประกอบพหุนามกำลังสอง"
  verification:
    tier: B
    verified_by: automated_assertion
    status: reviewed
  skills:
    primary: quadratic_factoring
    secondary:
      - zero_product_property
  stem: "ผลบวกของคำตอบทั้งหมดของสมการ $x^2 - 7x + 12 = 0$ มีค่าเท่าใด?"
  answer:
    type: numeric
    correct_value: 7
    tolerance: 0.001
    require_unit: false
  difficulty: 1
  estimated_seconds: 60
  hints:
    - level: 1
      text: "แยกตัวประกอบเป็นสองวงเล็บ (x - a)(x - b) = 0 หรือใช้สมบัติผลบวกของราก -b/a"
    - level: 2
      text: "x² - 7x + 12 = (x - 3)(x - 4) = 0 คำตอบคือ x = 3 และ x = 4"
  solution:
    steps:
      - id: s1
        text: "แยกตัวประกอบ: $(x - 3)(x - 4) = 0 \\implies x = 3, 4$"
      - id: s2
        text: "ผลบวกของคำตอบ: $3 + 4 = 7$ (หรือใช้สูตร Vieta's formulas: $-(-7)/1 = 7$)"
    summary: "ผลบวกของคำตอบเท่ากับ 7"
