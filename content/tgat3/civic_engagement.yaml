- id: tgat3-civ-drill-001
  subject: tgat3
  topic: tgat3.civic_engagement
  source:
    type: authored_drill
    label: "TGAT3 ชุดฝึกทักษะการเป็นพลเมืองที่มีส่วนร่วมของสังคม"
  verification:
    tier: A
    status: verified
    verified_by: academic_lead
  skills:
    primary: civic_action
    secondary:
      - environmental_stewardship
      - peaceful_problem_solving
  stem: "คุณสังเกตเห็นว่าร้านค้าในตลาดสดใกล้บ้านทิ้งน้ำมันพืชใช้แล้วลงในท่อระบายน้ำสาธารณะโดยตรงจนท่อเริ่มอุดตันและส่งกลิ่นเหม็น ในฐานะพลเมืองตื่นรู้ (Active Citizen) ขั้นตอนการแก้ปัญหาที่ถูกต้องและสันติวิธีคือข้อใด"
  answer:
    type: single_choice
    options:
      - id: "1"
        text: "พูดคุยกับผู้ค้าอย่างสุภาพเพื่อแนะนำจุดรับซื้อน้ำมันพืชเก่าเพื่อทำไบโอดีเซล พร้อมประสานงานเทศบาลจัดถังรับน้ำมันและลอกท่อระบายน้ำ"
        correct: true
        explanation: "แก้ปัญหาอย่างสร้างสรรค์ ชี้ให้เห็นทางเลือกที่ได้ประโยชน์ และทำงานร่วมกับหน่วยงานรัฐ"
      - id: "2"
        text: "แอบถ่ายคลิปใบหน้าแม่ค้าแล้วโพสต์ด่าทอลงในเพจข่าวท้องถิ่นเพื่อให้สังคมรุมประณาม"
        correct: false
        error_tag: emotional_reactivity
        explanation: "ละเมิดสิทธิส่วนบุคคล ก่อให้เกิดความเกลียดชัง และไม่แก้ปัญหาในเชิงระบบ"
      - id: "3"
        text: "นำขยะในบ้านตนเองไปเททิ้งลงท่อระบายน้ำนั้นด้วยเพราะเห็นว่าคนอื่นก็ทำได้"
        correct: false
        error_tag: ethical_violation
        explanation: "ขาดจิตสำนึกพลเมืองและซ้ำเติมปัญหาสิ่งแวดล้อมให้วิกฤตยิ่งขึ้น"
      - id: "4"
        text: "เพิกเฉยและไม่สนใจเพราะคิดว่าไม่ใช่หน้าบ้านของตนเอง"
        correct: false
        error_tag: passive_bystander
        explanation: "ละเลยหน้าที่พลเมืองในการปกป้องสุขอนามัยและสิ่งแวดล้อมส่วนรวม"
  difficulty: 3
  estimated_seconds: 60
  hints:
    - level: 1
      text: "Active Citizen มุ่งเน้นการหาทางออกที่เป็นประโยชน์แก่ทุกฝ่ายและประสานความร่วมมือกับชุมชน"
  solution:
    summary: "การเป็นพลเมืองที่กระตือรือร้นต้องช่วยเสนอทางเลือกที่เป็นประโยชน์ (Win-Win) และประสานงานกลไกท้องถิ่น ตัวเลือก 1 ช่วยแก้ไขปัญหาท่อตันพร้อมสร้างมูลค่าจากของเสีย"
    steps:
      - id: s1
        text: "ปัญหาน้ำมันใช้แล้วสร้างความเสียหายต่อระบบสุขาภิบาลสาธารณะ"
      - id: s2
        text: "ตัวเลือก 1 เสนอทางเลือกใหม่ (ขายทำไบโอดีเซล) และประสานเทศบาลเข้ามาจัดการ"
      - id: s3
        text: "ตัวเลือก 2 สร้างความเกลียดชัง ตัวเลือก 3 ผิดจริยธรรม ตัวเลือก 4 เพิกเฉยต่อปัญหาส่วนรวม"

- id: tgat3-civ-drill-002
  subject: tgat3
  topic: tgat3.civic_engagement
  source:
    type: authored_drill
    label: "TGAT3 ชุดฝึกทักษะการเป็นพลเมืองที่มีส่วนร่วมของสังคม"
  verification:
    tier: A
    status: verified
    verified_by: academic_lead
  skills:
    primary: democratic_values
    secondary:
      - electoral_integrity
      - fact_based_decision_making
  stem: "ในระหว่างการรณรงค์หาเสียงเลือกตั้งกรรมการนักเรียน มีผู้ไม่ประสงค์ดีแจกใบปลิวใส่ร้ายผู้สมัครคนหนึ่งด้วยเรื่องส่วนตัวอันเป็นเท็จ หากคุณพบเห็นเหตุการณ์นี้ควรปฏิบัติตนอย่างไร"
  answer:
    type: single_choice
    options:
      - id: "1"
        text: "นำหลักฐานใบปลิวแจ้งต่อคณะกรรมการการเลือกตั้งนักเรียนเพื่อดำเนินการสอบสวนตามระเบียบ และรณรงค์ให้เพื่อนๆ ตัดสินใจจากนโยบายมากกว่าข่าวลือ"
        correct: true
        explanation: "เคารพกระบวนการยุติธรรม ปกป้องความบริสุทธิ์ของการเลือกตั้ง และส่งเสริมวัฒนธรรมประชาธิปไตย"
      - id: "2"
        text: "ช่วยถ่ายรูปใบปลิวและแชร์ลงในกลุ่มแชตเพื่อนสนิทเพื่อช่วยกระจายข่าว"
        correct: false
        error_tag: irresponsible_information_sharing
        explanation: "กลายเป็นเครื่องมือในการแพร่กระจายข้อมูลเท็จและทำลายเกียรติของผู้อื่น"
      - id: "3"
        text: "ไปดักทำร้ายร่างกายผู้ต้องสงสัยที่แจกใบปลิวเพื่อแก้แค้นแทนเพื่อน"
        correct: false
        error_tag: emotional_reactivity
        explanation: "ใช้ศาลเตี้ยและความรุนแรง ผิดกฎหมายและวินัยนักเรียนอย่างร้ายแรง"
      - id: "4"
        text: "นิ่งเฉยและหัวเราะเยาะกับเรื่องส่วนตัวที่ถูกใส่ร้าย"
        correct: false
        error_tag: passive_bystander
        explanation: "เพิกเฉยต่อความอยุติธรรมและสนับสนุนวัฒนธรรมการกลั่นแกล้ง"
  difficulty: 3
  estimated_seconds: 60
  hints:
    - level: 1
      text: "ประชาธิปไตยที่มีคุณภาพต้องตั้งอยู่บนความโปร่งใส การเคารพกติกา และการไม่ส่งต่อข้อมูลเท็จ"
  solution:
    summary: "การปกป้องกระบวนการเลือกตั้งให้บริสุทธิ์ยุติธรรมต้องพึ่งพากลไกการตรวจสอบที่เป็นทางการและการตัดสินใจบนนโยบาย ตัวเลือก 1 ปฏิบัติถูกต้องตามวิถีประชาธิปไตย"
    steps:
      - id: s1
        text: "การใส่ร้ายป้ายสีทำลายความชอบธรรมของการเลือกตั้ง"
      - id: s2
        text: "ตัวเลือก 1 ส่งหลักฐานให้กรรมการการเลือกตั้งและส่งเสริมการมองที่นโยบาย"
      - id: s3
        text: "ตัวเลือกอื่นๆ ซ้ำเติมความเสียหายหรือใช้ความรุนแรงที่ผิดกฎหมาย"

- id: tgat3-civ-drill-003
  subject: tgat3
  topic: tgat3.civic_engagement
  source:
    type: authored_drill
    label: "TGAT3 ชุดฝึกทักษะการเป็นพลเมืองที่มีส่วนร่วมของสังคม"
  verification:
    tier: A
    status: verified
    verified_by: academic_lead
  skills:
    primary: public_interest
    secondary:
      - ethical_transparency
      - genuine_volunteering
  stem: "บริษัทของคุณจัดโครงการจิตอาสาพัฒนาโรงเรียนในถิ่นทุรกันดาร แต่คุณสังเกตเห็นว่ามีการใช้งบประมาณส่วนใหญ่ไปกับการถ่ายทำวิดีโอประชาสัมพันธ์ภาพลักษณ์ผู้บริหารมากกว่าการซ่อมแซมอาคารเรียนจริง ในฐานะพนักงานที่มีจิตสำนึกสาธารณะ ควรมีท่าทีอย่างไร"
  answer:
    type: single_choice
    options:
      - id: "1"
        text: "เสนอข้อคิดเห็นอย่างสร้างสรรค์ในที่ประชุมทีมงาน ให้ปรับสัดส่วนงบประมาณส่วนใหญ่ไปที่การจัดซื้อสื่อการเรียนรู้และซ่อมแซมอาคารเรียน เพื่อให้เกิดประโยชน์แท้จริงแก่เด็กๆ"
        correct: true
        explanation: "ยืนหยัดในคุณค่าแท้จริงของกิจกรรมจิตอาสาและทักท้วงการใช้งบประมาณอย่างมีเหตุผล"
      - id: "2"
        text: "ร่วมแสดงความยินดีกับผู้บริหารและช่วยจัดฉากถ่ายทำให้ดูน่าสงสารยิ่งขึ้นเพื่อเรียกยอดไลก์"
        correct: false
        error_tag: superficial_innovation
        explanation: "ร่วมมือในการสร้างภาพลวงตาโดยไม่ได้ช่วยเหลือผู้เดือดร้อนจริง"
      - id: "3"
        text: "แอบขโมยเงินงบประมาณส่วนที่เหลือมาใช้เองเพราะเห็นว่าบริษัทก็ไม่ได้จริงใจ"
        correct: false
        error_tag: ethical_violation
        explanation: "ทุจริตต่อหน้าที่และกระทำความผิดอาญา"
      - id: "4"
        text: "ลาออกจากบริษัททันทีโดยไม่พยายามทักท้วงหรือให้ข้อเสนอแนะใดๆ"
        correct: false
        error_tag: passive_resignation
        explanation: "ขาดความพยายามในการผลักดันให้เกิดการเปลี่ยนแปลงเชิงบวก"
  difficulty: 3
  estimated_seconds: 60
  hints:
    - level: 1
      text: "จิตอาสาที่แท้จริงต้องมุ่งเน้นผลประโยชน์ของผู้รับมากกว่าภาพลักษณ์ของผู้ให้"
  solution:
    summary: "จิตสำนึกสาธารณะเรียกร้องความจริงใจในการช่วยเหลือสังคม การเสนอปรับงบประมาณตามตัวเลือก 1 ช่วยให้โครงการบรรลุเป้าหมายการพัฒนาที่แท้จริง"
    steps:
      - id: s1
        text: "วิเคราะห์เจตนารมณ์: กิจกรรม CSR ต้องสร้างคุณค่าแก่ชุมชน ไม่ใช่แค่การประชาสัมพันธ์"
      - id: s2
        text: "ตัวเลือก 1 เสนอแนะอย่างสร้างสรรค์เพื่อจัดสรรทรัพยากรไปยังเด็กๆ และอาคารเรียน"
      - id: s3
        text: "ตัวเลือกอื่นๆ ขาดความจริงใจ กระทำผิดกฎหมาย หรือยอมจำนน"

- id: tgat3-civ-drill-004
  subject: tgat3
  topic: tgat3.civic_engagement
  source:
    type: authored_drill
    label: "TGAT3 ชุดฝึกทักษะการเป็นพลเมืองที่มีส่วนร่วมของสังคม"
  verification:
    tier: A
    status: verified
    verified_by: academic_lead
  skills:
    primary: privacy_rights
    secondary:
      - data_governance
      - pdpa_compliance
  stem: "เมื่อพบข้อมูลส่วนบุคคลของผู้สมัครงาน (เช่น ประวัติการรักษาพยาบาล, ที่อยู่, สำเนาบัตรประชาชน) ถูกวางทิ้งไว้บนโต๊ะส่วนกลางในสำนักงานโดยไม่มีการดูแล พนักงานที่มีจิตสำนึกด้านสิทธิข้อมูลควรทำอย่างไร"
  answer:
    type: single_choice
    options:
      - id: "1"
        text: "รวบรวมเอกสารเหล่านั้นนำไปมอบให้เจ้าหน้าที่ฝ่ายทรัพยากรบุคคลโดยตรง พร้อมแจ้งเตือนเรื่องการจัดเก็บเอกสารในตู้ล็อกตามมาตรฐานการคุ้มครองข้อมูลส่วนบุคคล"
        correct: true
        explanation: "ปกป้องสิทธิและความเป็นส่วนตัวของผู้อื่น และช่วยยกระดับการปฏิบัติตามกฎหมายในองค์กร"
      - id: "2"
        text: "ถ่ายรูปประวัติการรักษาพยาบาลไปให้เพื่อนร่วมงานดูเพื่อความเพลิดเพลิน"
        correct: false
        error_tag: ethical_violation
        explanation: "ละเมิดสิทธิความเป็นส่วนตัวและกฎหมาย PDPA อย่างร้ายแรง"
      - id: "3"
        text: "ทิ้งเอกสารทั้งหมดลงถังขยะธรรมดาเพื่อจะได้ไม่มีใครเห็น"
        correct: false
        error_tag: ignores_systemic_ripple_effects
        explanation: "เสี่ยงต่อการรั่วไหลออกสู่ภายนอกและทำให้ข้อมูลสำคัญของผู้สมัครสูญหาย"
      - id: "4"
        text: "เดินผ่านไปเฉยๆ เพราะไม่ใช่หน้าที่ในความรับผิดชอบของตนเอง"
        correct: false
        error_tag: passive_bystander
        explanation: "เพิกเฉยต่อความเสี่ยงด้านความปลอดภัยของข้อมูลผู้อื่น"
  difficulty: 3
  estimated_seconds: 60
  hints:
    - level: 1
      text: "สิทธิในข้อมูลส่วนบุคคลเป็นสิทธิมนุษยชนขั้นพื้นฐานที่ทุกคนต้องช่วยกันปกป้อง"
  solution:
    summary: "การเคารพสิทธิความเป็นส่วนตัวตามมาตรฐาน PDPA กำหนดให้ต้องดูแลข้อมูลอ่อนไหวอย่างเข้มงวด ตัวเลือก 1 ส่งมอบให้ผู้รับผิดชอบและเตือนการจัดเก็บอย่างปลอดภัย"
    steps:
      - id: s1
        text: "ข้อมูลสุขภาพและบัตรประชาชนเป็นข้อมูลส่วนบุคคลที่มีความอ่อนไหวสูง"
      - id: s2
        text: "ตัวเลือก 1 ป้องกันข้อมูลรั่วไหลและช่วยให้องค์กรปฏิบัติตามมาตรฐานความปลอดภัย"
      - id: s3
        text: "ตัวเลือก 2 ละเมิดกฎหมาย ตัวเลือก 3 ทำลายเอกสารสำคัญ ตัวเลือก 4 เพิกเฉยต่อความเสี่ยง"
