      - id: "4"
        text: "6 วัน"
      - id: "5"
        text: "7 วัน"
    correct_answer: "3"
    solution: "งาน A ใช้ 2 วัน จากนั้นงาน B (3 วัน) และ C (1 วัน) ทำขนานกัน สายวิกฤตคือ A + B = 2 + 3 = 5 วัน"

