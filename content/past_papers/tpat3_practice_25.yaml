    stem: "โครงการหนึ่งมี 3 งานย่อย: งาน A ใช้เวลา 2 วัน, งาน B ต้องรองาน A เสร็จและใช้เวลา 3 วัน, งาน C ทำพร้อมงาน B ได้และใช้เวลา 1 วัน เมื่อเริ่มพร้อมกันโครงการจะเสร็จในเวลากี่วัน"
