- number: 64
  question_id: tgat2-bp80-q64
  topic: tgat2.logical
  skill: logical_deduction
  score: 1.25
  answer_type: single_choice
  stem: ข้อความใดแสดงเหตุผลแบบ 'อุปนัย' (Inductive Reasoning)
  options:
  - id: '1'
    text: คนทุกคนต้องตาย สมบัติเป็นคน ดังนั้นสมบัติต้องตาย
  - id: '2'
    text: สามเหลี่ยมทุกรูปมีมุมภายในรวมกันได้ 180 องศา
  - id: '3'
    text: จากการสังเกตกา 100 ตัวพบว่าเป็นสีดำทั้งสิ้น จึงสรุปว่ากาทุกตัวในโลกมีสีดำ
  - id: '4'
    text: จำนวนคู่ทุกจำนวนหารด้วย 2 ลงตัว เลข 8 เป็นจำนวนคู่ ดังนั้น 8 หารด้วย 2 ลงตัว
  - id: '5'
    text: สัตว์เลี้ยงลูกด้วยนมหายใจด้วยปอด วาฬเป็นสัตว์เลี้ยงลูกด้วยนม ดังนั้นวาฬหายใจด้วยปอด
  correct_answer: '3'
  solution: การอุปนัย (Inductive) คือการสังเกตตัวอย่างย่อยจำนวนหนึ่งแล้วสรุปเป็นกฎทั่วไป
    เช่น สังเกตกา 100 ตัวแล้วสรุปถึงกาทั้งหมด
- number: 65
  question_id: tgat2-bp80-q65
  topic: tgat2.logical
  skill: logical_deduction
  score: 1.25
  answer_type: single_choice
  stem: ถ้า A > B และ B > C แต่ C < D ข้อใดสรุปได้ถูกต้องแน่นอน
  options:
  - id: '1'
    text: A > D
  - id: '2'
    text: A < D
  - id: '3'
    text: A > C
  - id: '4'
    text: B = D
  - id: '5'
    text: D > B
  correct_answer: '3'
  solution: จาก A > B และ B > C โดยสมบัติการถ่ายทอดจะได้ A > C แน่นอน ส่วนความสัมพันธ์ระหว่าง
    A กับ D หรือ B กับ D ไม่สามารถระบุได้แน่ชัด
- number: 66
  question_id: tgat2-bp80-q66
  topic: tgat2.logical
  skill: logical_arguments
  score: 1.25
  answer_type: single_choice
  stem: 'พิจารณาข้อความ: ''ผู้ที่ออกกำลังกายสม่ำเสมอทุกคนจะมีสุขภาพแข็งแรง'' หากสมศรีมีสุขภาพไม่แข็งแรง
    ข้อสรุปใดเป็นจริงอย่างแน่นอน (ข้อ 66)'
  options:
  - id: '1'
    text: สมศรีไม่ได้ออกกำลังกายอย่างสม่ำเสมอ
  - id: '2'
    text: สมศรีรับประทานอาหารไม่ถูกสุขลักษณะ
  - id: '3'
    text: สมศรีออกกำลังกายมากเกินไป
  - id: '4'
    text: สมศรีมีโรคประจำตัวเรื้อรัง
  - id: '5'
    text: ไม่สามารถสรุปสิ่งใดได้เลย
  correct_answer: '1'
  solution: 'จากตรรกศาสตร์ Contrapositive: ออกกำลังกายสม่ำเสมอ -> แข็งแรง สมมูลกับ
    ไม่แข็งแรง -> ไม่ได้ออกกำลังกายสม่ำเสมอ ดังนั้นสรุปได้แน่นอนว่าสมศรีไม่ได้ออกกำลังกายอย่างสม่ำเสมอ'
