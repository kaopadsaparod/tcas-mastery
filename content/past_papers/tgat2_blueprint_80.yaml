- number: 1
  question_id: tgat2-bp80-q01
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อใดใช้ภาษาได้ถูกต้องตามหลักภาษาและกาลเทศะที่สุดในการติดต่อราชการ
  options:
  - id: '1'
    text: ผมขอส่งเรื่องด่วนจี๋ให้ท่านเซ็นภายในวันนี้ด้วยครับ
  - id: '2'
    text: จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติ จะเป็นพระคุณยิ่ง
  - id: '3'
    text: รบกวนช่วยดูเอกสารให้หน่อยว่ามีตรงไหนต้องแก้อีก
  - id: '4'
    text: หากท่านว่างแล้ว ช่วยกรุณาจัดการเรื่องนี้ให้ด้วยนะครับ
  - id: '5'
    text: ส่งมาให้ตรวจแล้ว หวังว่าจะเรียบร้อยดี
  correct_answer: '2'
  solution: ตัวเลือก 2 เป็นระดับภาษาทางการที่ถูกต้องและสุภาพตามแบบฟอร์มหนังสือราชการ
    ส่วนตัวเลือกอื่นมีคำสแลงหรือภาษาปากปน (เช่น 'ด่วนจี๋', 'ช่วยดู...ให้หน่อย')
- number: 2
  question_id: tgat2-bp80-q02
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อความใดมีเจตนา 'เตือนสติ' ชัดเจนที่สุด
  options:
  - id: '1'
    text: น้ำขึ้นให้รีบตัก เพราะโอกาสไม่ได้มีมาบ่อยๆ
  - id: '2'
    text: ความประมาทเป็นหนทางสู่ความตาย อย่าคิดว่าตนเองเก่งกล้าจนไม่ระวัง
  - id: '3'
    text: คนล้มอย่าข้าม เพราะสักวันเขาอาจยืนขึ้นมาใหม่ได้
  - id: '4'
    text: หวานเป็นลม ขมเป็นยา ของอร่อยมักไม่ดีต่อสุขภาพ
  - id: '5'
    text: ไก่เห็นตีนงู งูเห็นนมไก่ ทั้งสองฝ่ายต่างรู้ความลับของกันและกัน
  correct_answer: '2'
  solution: ตัวเลือก 2 มีเจตนาเตือนสติโดยตรงให้ระลึกถึงภัยของความประมาท
- number: 3
  question_id: tgat2-bp80-q03
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: สำนวนในข้อใดมีความหมายสอดคล้องกับข้อความ 'ทำสิ่งที่ไม่เกิดประโยชน์อันใด มีแต่จะสูญเปล่าทั้งเวลาและทรัพย์สิน'
  options:
  - id: '1'
    text: ขี่ช้างจับตั๊กแตน
  - id: '2'
    text: ตำน้ำพริกละลายแม่น้ำ
  - id: '3'
    text: ชี้โพรงให้กระรอก
  - id: '4'
    text: จับปลาสองมือ
  - id: '5'
    text: เอาทองไปรู่กระเบื้อง
  correct_answer: '2'
  solution: '''ตำน้ำพริกละลายแม่น้ำ'' หมายถึง ลงทุนไปเป็นจำนวนมากแต่ไม่ได้ประโยชน์อะไรกลับมาเลย
    ส่วน ''ขี่ช้างจับตั๊กแตน'' เน้นการลงทุนใหญ่เกินความจำเป็น'
- number: 4
  question_id: tgat2-bp80-q04
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: '''การพัฒนาเมืองที่มุ่งเน้นแต่สิ่งปลูกสร้างโดยละเลยพื้นที่สีเขียว เปรียบเสมือนการสร้างร่างกายที่ใหญ่โตแต่ไร้ปอด''

    ผู้เขียนต้องการสื่อถึงสิ่งใดเป็นสำคัญ'
  options:
  - id: '1'
    text: สิ่งปลูกสร้างในเมืองมีความทันสมัยแต่ขาดความแข็งแรง
  - id: '2'
    text: พื้นที่สีเขียวมีความสำคัญอย่างยิ่งต่อความสมดุลและการดำรงอยู่ของเมือง
  - id: '3'
    text: คนเมืองส่วนใหญ่มีปัญหาสุขภาพระบบทางเดินหายใจ
  - id: '4'
    text: ควรยุติการก่อสร้างอาคารสูงทุกประเภททันที
  - id: '5'
    text: ร่างกายมนุษย์ต้องการพื้นที่สีเขียวมากกว่าสิ่งอำนวยความสะดวก
  correct_answer: '2'
  solution: การเปรียบเทียบพื้นที่สีเขียวเป็น 'ปอด' ของเมือง สื่อถึงความจำเป็นในการรักษาสิ่งแวดล้อมให้สมดุลควบคู่กับการพัฒนาโครงสร้างพื้นฐาน
- number: 5
  question_id: tgat2-bp80-q05
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: คำที่ขีดเส้นใต้ในข้อใดใช้ผิดความหมายในบริบทประโยค
  options:
  - id: '1'
    text: เขาถูก 'ปรามาส' ว่าไม่สามารถสอบผ่านได้ แต่เขาก็พิสูจน์ตนเองสำเร็จ
  - id: '2'
    text: ตำรวจทำการ 'สืบสวน' หาพยานหลักฐานในที่เกิดเหตุอย่างละเอียด
  - id: '3'
    text: เธอรู้สึก 'กระดาก' อายเมื่อต้องขึ้นไปพูดต่อหน้าธารกำนัล
  - id: '4'
    text: คณะกรรมการมีมติ 'อนุมัติ' ให้ยกเลิกโครงการเนื่องจากขาดงบประมาณ
  - id: '5'
    text: สถานการณ์เศรษฐกิจกำลัง 'วิกฤต' จนต้องขอความช่วยเหลือฉุกเฉิน
  correct_answer: '4'
  solution: การยกเลิกโครงการเนื่องจากขาดงบประมาณ ควรใช้คำว่า 'มีมติเห็นชอบ' หรือ 'สั่งการ'
    มากกว่า 'อนุมัติให้ยกเลิก' หรือในบริบทนี้คำว่า อนุมัติ ใช้กับการขออนุญาตดำเนินงาน
- number: 6
  question_id: tgat2-bp80-q06
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อความใดแสดงทรรศนะเชิง 'ประเมินค่า'
  options:
  - id: '1'
    text: โครงการรถไฟฟ้าสายสีส้มมีระยะทางรวมทั้งสิ้น 35.9 กิโลเมตร
  - id: '2'
    text: ภาพยนตร์เรื่องนี้สะท้อนปัญหาความเหลื่อมล้ำได้อย่างลึกซึ้งและทรงพลังที่สุดในรอบทศวรรษ
  - id: '3'
    text: อุณหภูมิเฉลี่ยของโลกในเดือนกรกฎาคมสูงที่สุดเท่าที่เคยมีการบันทึกมา
  - id: '4'
    text: รัฐบาลประกาศวันหยุดราชการเพิ่มเติมในสัปดาห์หน้า
  - id: '5'
    text: การแข่งขันกีฬาจัดขึ้นระหว่างวันที่ 1 ถึง 10 ธันวาคม
  correct_answer: '2'
  solution: การใช้คำว่า 'ลึกซึ้งและทรงพลังที่สุดในรอบทศวรรษ' เป็นการตัดสินคุณค่า (Value
    judgment) จากมุมมองส่วนบุคคล ไม่ใช่เพียงข้อเท็จจริงเชิงประจักษ์
- number: 7
  question_id: tgat2-bp80-q07
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: คำคู่ใดมีความสัมพันธ์ในลักษณะ 'เหตุและผล' (เหตุ -> ผล)
  options:
  - id: '1'
    text: 'ขยันหมั่นเพียร : ประสบความสำเร็จ'
  - id: '2'
    text: 'น้ำท่วม : ฝนตกหนัก'
  - id: '3'
    text: 'รถชน : ขับรถเร็ว'
  - id: '4'
    text: 'สอบตก : ไม่อ่านหนังสือ'
  - id: '5'
    text: 'ไฟดับ : พายุพัดเสาไฟล้ม'
  correct_answer: '1'
  solution: ขยันหมั่นเพียร (เหตุ) นำไปสู่ ประสบความสำเร็จ (ผล) ส่วนข้ออื่นเรียงจาก
    ผล -> เหตุ
- number: 8
  question_id: tgat2-bp80-q08
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: 'ข้อใดเรียงลำดับประโยคต่อไปนี้ได้สละสลวยและได้ใจความถูกต้องที่สุด

    (1) เพื่อนำไปสู่การพัฒนาพลังงานสะอาดอย่างยั่งยืน

    (2) ปัจจุบันเทคโนโลยีเซลล์แสงอาทิตย์ได้รับการพัฒนาอย่างก้าวกระโดด

    (3) ส่งผลให้ต้นทุนในการผลิตกระแสไฟฟ้าลดลงอย่างเห็นได้ชัด

    (4) และทำให้ประชาชนสามารถเข้าถึงการติดตั้งบนหลังคาเรือนได้ง่ายขึ้น'
  options:
  - id: '1'
    text: (2) -> (3) -> (4) -> (1)
  - id: '2'
    text: (1) -> (2) -> (3) -> (4)
  - id: '3'
    text: (2) -> (4) -> (3) -> (1)
  - id: '4'
    text: (3) -> (2) -> (4) -> (1)
  - id: '5'
    text: (2) -> (1) -> (3) -> (4)
  correct_answer: '1'
  solution: 'ลำดับเหตุผล: เทคโนโลยีพัฒนา (2) -> ต้นทุนลดลง (3) -> ประชาชนเข้าถึงง่ายขึ้น
    (4) -> เพื่อนำไปสู่พลังงานสะอาดอย่างยั่งยืน (1)'
- number: 9
  question_id: tgat2-bp80-q09
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อความใดมีการใช้ 'อุปมาโวหาร' (การเปรียบเทียบ)
  options:
  - id: '1'
    text: สายน้ำไหลรินกระทบโขดหินเกิดเสียงดังกังวานไปทั่วหุบเขา
  - id: '2'
    text: จิตใจของเธอบริสุทธิ์ผุดผ่องดั่งหยาดน้ำค้างบนยอดหญ้ายามเช้า
  - id: '3'
    text: ดวงอาทิตย์กำลังจะลับขอบฟ้าทางทิศตะวันตก
  - id: '4'
    text: ลมหนาวพัดกรรโชกแรงจนต้นไม้เอนลู่ไปตามแรงลม
  - id: '5'
    text: เขานั่งอ่านหนังสืออย่างเงียบเชียบในห้องสมุด
  correct_answer: '2'
  solution: มีคำว่า 'ดั่ง' เปรียบเทียบจิตใจกับหยาดน้ำค้าง
- number: 10
  question_id: tgat2-bp80-q10
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อใดเป็นข้อเท็จจริง (Fact) มิใช่ข้อคิดเห็น (Opinion)
  options:
  - id: '1'
    text: การเดินทางด้วยรถไฟฟ้าน่ารื่นรมย์กว่าการขับรถยนต์ส่วนตัว
  - id: '2'
    text: ประเทศไทยตั้งอยู่ในภูมิภาคเอเชียตะวันออกเฉียงใต้
  - id: '3'
    text: อาหารรสเผ็ดจัดเป็นอาหารที่อร่อยที่สุดในโลก
  - id: '4'
    text: ฤดูหนาวเป็นฤดูกาลที่ทุกคนรอคอยมากที่สุด
  - id: '5'
    text: การอ่านหนังสือนิยายมีประโยชน์มากกว่าการเล่นเกมเสมอ
  correct_answer: '2'
  solution: ข้อ 2 เป็นข้อมูลทางภูมิศาสตร์ที่มีหลักฐานยืนยันได้ทางภววิสัย ไม่ขึ้นกับความรู้สึกส่วนบุคคล
- number: 11
  question_id: tgat2-bp80-q11
  topic: tgat2.verbal
  skill: verbal_reasoning
  score: 1.25
  answer_type: single_choice
  stem: ข้อความในการสื่อสารข้อใดมีน้ำเสียง 'ชักชวนและสร้างแรงบันดาลใจ' เหมาะสมที่สุดสำหรับเยาวชน
