- number: 1
  question_id: math1-bp30-q01
  topic: math.real_numbers
  skill: remainder_theorem
  score: 3.0
  answer_type: single_choice
  stem: ถ้าพหุนาม $P(x) = x^3 - 2x^2 + ax + 6$ หารด้วย $x - 2$ แล้วเหลือเศษ $4$ แล้วเศษที่ได้จากการหาร
    $P(x)$ ด้วย $x + 1$ มีค่าเท่ากับเท่าใด
  options:
  - id: '1'
    text: '-2'
  - id: '2'
    text: '0'
  - id: '3'
    text: '2'
  - id: '4'
    text: '4'
  - id: '5'
    text: '6'
  correct_answer: '5'
  solution: 'จากทฤษฎีบทเศษเหลือ P(2) = 4: 2^3 - 2(2^2) + a(2) + 6 = 4 => 8 - 8 + 2a
    + 6 = 4 => 2a = -2 => a = -1

    ดังนั้น P(x) = x^3 - 2x^2 - x + 6

    เมื่อหารด้วย x + 1 จะได้เศษคือ P(-1) = (-1)^3 - 2(-1)^2 - (-1) + 6 = -1 - 2 +
    1 + 6 = 4... เดี๋ยวนะ: -1 - 2 = -3, -3 + 1 = -2, -2 + 6 = 4! ดังนั้นเศษคือ 4 (ตัวเลือก
    4)'
