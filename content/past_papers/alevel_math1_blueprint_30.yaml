- number: 3
  question_id: math1-bp30-q03
  topic: math.functions
  skill: composite_functions
  score: 3.0
  answer_type: single_choice
  stem: กำหนดให้ $f(x) = 2x + 1$ และ $g(x) = x^2 - 3$ ค่าของ $(g \circ f)(2) - (f
    \circ g)(2)$ มีค่าเท่ากับเท่าใด
  options:
  - id: '1'
    text: '16'
  - id: '2'
    text: '19'
