  solution: 'เงื่อนไขหลัง log: x + 3 > 0 และ x - 1 > 0 => x > 1

    จากสมบัติ log: log_2[(x + 3)(x - 1)] = 5

    แปลงเป็นเลขยกกำลัง: (x + 3)(x - 1) = 2^5 = 32

    x^2 + 2x - 3 = 32 => x^2 + 2x - 35 = 0

