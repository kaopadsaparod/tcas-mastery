    text: '28'
  correct_answer: '2'
  solution: '1. หา f(2) = 2(2) + 1 = 5, ดังนั้น (g o f)(2) = g(5) = 5^2 - 3 = 25 -
    3 = 22

    2. หา g(2) = 2^2 - 3 = 1, ดังนั้น (f o g)(2) = f(1) = 2(1) + 1 = 3

    3. ผลต่าง: (g o f)(2) - (f o g)(2) = 22 - 3 = 19'
- number: 4
  question_id: math1-bp30-q04
  topic: math.functions
  skill: inverse_functions
  score: 3.0
  answer_type: single_choice
  stem: กำหนดฟังก์ชันหนึ่งต่อหนึ่ง $f(x) = \frac{3x - 1}{x + 2}$ เมื่อ $x \ne -2$
    ค่าของ $f^{-1}(2)$ เท่ากับข้อใด
  options:
  - id: '1'
    text: '3'
