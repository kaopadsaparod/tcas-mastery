  - id: '5'
    text: '-5'
  correct_answer: '2'
  solution: 'ให้ f^{-1}(2) = k แสดงว่า f(k) = 2

    ดังนั้น (3k - 1)/(k + 2) = 2

    คูณไขว้: 3k - 1 = 2(k + 2) = 2k + 4

    ย้ายข้าง: 3k - 2k = 4 + 1 => k = 5'
