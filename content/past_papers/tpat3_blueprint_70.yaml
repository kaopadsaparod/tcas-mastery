- number: 1
  question_id: tpat3-70-q01
  topic: tpat3.quantitative
  skill: sequence_pattern
  score: 1.3333333333333333
  answer_type: single_choice
  stem: 'พิจารณาอนุกรมตัวเลข: $3, 8, 15, 24, 35, ?$ ตัวเลขถัดไปคือค่าใด'
  options:
  - id: '1'
    text: '46'
    error_tag: constant_difference_fallacy
    explanation: คิดว่าผลต่างเพิ่มขึ้นคงที่เพียง +11 ทำให้ได้ 35 + 11 = 46 ซึ่งไม่สอดคล้องกับผลต่างชั้นที่สอง (+2)
  - id: '2'
    text: '48'
    explanation: ถูกต้อง ผลต่างชั้นที่หนึ่งคือ 5, 7, 9, 11 ซึ่งเพิ่มขึ้นทีละ 2 ดังนั้นผลต่างขั้นถัดไปคือ 13 จะได้ 35 + 13
      = 48 หรือคิดจากรูปทั่วไป (6+1)² - 1 = 48
  - id: '3'
    text: '50'
    error_tag: difference_increment_doubled
    explanation: บวกผลต่างเพิ่มด้วย 15 เกินไป 2 แต้ม (คิดเป็น 35 + 15 = 50)
  - id: '4'
    text: '52'
    error_tag: multiplicative_pattern_miscalc
    explanation: คาดเดารูปแบบการคูณหรือบวกด้วย 17 โดยไม่มีพื้นฐานจากผลต่างชั้นที่สอง
  - id: '5'
    text: '54'
    error_tag: arithmetic_extrapolation_error
    explanation: คำนวณรูปแบบตัวเลขคลาดเคลื่อนเกินจริง
  correct_answer: '2'
  solution: "วิเคราะห์อนุกรม: 3, 8, 15, 24, 35, ?\nวิธีที่ 1: พิจารณาผลต่างระหว่างพจน์ (First Differences)\n  8 - 3 = 5\n\
    \  15 - 8 = 7\n  24 - 15 = 9\n  35 - 24 = 11\nผลต่างชั้นที่หนึ่งเพิ่มขึ้นทีละ +2 (ลำดับเลขคณิต)\nดังนั้น ผลต่างถัดไปต้องเป็น\
    \ 11 + 2 = 13\nตัวเลขถัดไปคือ 35 + 13 = 48\nวิธีที่ 2: พิจารณารูปทั่วไป a_n = (n + 1)² - 1\n  สำหรับ n = 1: 2² - 1 = 3\n\
    \  สำหรับ n = 2: 3² - 1 = 8\n  สำหรับ n = 3: 4² - 1 = 15\n  สำหรับ n = 4: 5² - 1 = 24\n  สำหรับ n = 5: 6² - 1 = 35\n \
    \ สำหรับ n = 6: 7² - 1 = 49 - 1 = 48\nสรุป คำตอบที่ถูกต้องคือ 48 (ตัวเลือก 2)"
- number: 2
  question_id: tpat3-70-q02
  topic: tpat3.quantitative
  skill: ratio_proportion
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เครื่องสูบน้ำ 4 เครื่อง สูบน้ำหมดสระในเวลา 6 ชั่วโมง ถ้าต้องการสูบน้ำหมดสระในเวลา 4 ชั่วโมง จะต้องใช้เครื่องสูบน้ำทั้งหมดกี่เครื่อง
  options:
  - id: '1'
    text: 5 เครื่อง
    error_tag: underestimated_machine_count
    explanation: 5 เครื่องในเวลา 4 ชั่วโมงทำงานได้เพียง 5 × 4 = 20 เครื่อง·ชม. ซึ่งไม่หมดสระ
  - id: '2'
    text: 6 เครื่อง
    explanation: ถูกต้อง ปริมาณงานทั้งหมดคือ 4 × 6 = 24 เครื่อง·ชม. เมื่อต้องการสูบให้เสร็จใน 4 ชม. ต้องใช้เครื่องสูบน้ำ 24
      / 4 = 6 เครื่อง
  - id: '3'
    text: 7 เครื่อง
    error_tag: arithmetic_rounding_up
    explanation: คำนวณเกินความจำเป็น จะได้งาน 28 เครื่อง·ชม. ซึ่งเกินกว่าปริมาณน้ำในสระ
  - id: '4'
    text: 8 เครื่อง
    error_tag: direct_proportion_fallacy
    explanation: เข้าใจผิดว่าจำนวนเครื่องแปรผันตรงกับเวลา หรือคิดสัดส่วน 4 × (6/4) สลับทิศทาง
  - id: '5'
    text: 9 เครื่อง
    error_tag: squared_ratio_misapplication
    explanation: ใช้อัตราส่วนยกกำลังสองซึ่งไม่เกี่ยวข้องกับงานแปรผกผันเชิงเส้น
  correct_answer: '2'
  solution: "โจทย์การทำงานของเครื่องสูบน้ำเป็นความสัมพันธ์แบบแปรผกผัน (Inverse Variation)\nขั้นตอนที่ 1: คำนวณปริมาณงานทั้งหมด\
    \ (Total Work Capacity)\n  งานทั้งหมด = จำนวนเครื่องสูบน้ำ × เวลาที่ใช้\n  งานทั้งหมด = 4 เครื่อง × 6 ชั่วโมง = 24 เครื่อง·ชั่วโมง\n\
    ขั้นตอนที่ 2: หาจำนวนเครื่องสูบน้ำที่ต้องการเพื่อให้เสร็จใน 4 ชั่วโมง\n  จำนวนเครื่องสูบน้ำ = ปริมาณงานทั้งหมด / เวลาเป้าหมาย\n\
    \  จำนวนเครื่องสูบน้ำ = 24 เครื่อง·ชั่วโมง / 4 ชั่วโมง = 6 เครื่อง\nสรุป ต้องใช้เครื่องสูบน้ำทั้งหมด 6 เครื่อง (ตัวเลือก\
    \ 2)"
- number: 3
  question_id: tpat3-70-q03
  topic: tpat3.quantitative
  skill: flow_rate_pipe
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ท่อประปา A เติมน้ำเต็มถังใน 3 ชม. ท่อ B เติมเต็มถังใน 6 ชม. ถ้าเปิดท่อทั้งสองพร้อมกัน น้ำจะเต็มถังในเวลากี่ชั่วโมง
  options:
  - id: '1'
    text: 1.5 ชม.
    error_tag: harmonic_mean_halved
    explanation: นำเวลาของท่อ A มาหาร 2 (3 / 2 = 1.5 ชม.) ซึ่งเป็นอัตราที่เร็วเกินจริง
  - id: '2'
    text: 2.0 ชม.
    explanation: ถูกต้อง อัตราการไหลรวมคือ 1/3 + 1/6 = 1/2 ถังต่อชั่วโมง ดังนั้นเวลาที่ใช้เติมจนเต็มถังคือ 1 / (1/2) = 2.0
      ชั่วโมง
  - id: '3'
    text: 2.5 ชม.
    error_tag: arithmetic_rate_rounding
    explanation: คำนวณบวกเศษส่วนคลาดเคลื่อน
  - id: '4'
    text: 4.0 ชม.
    error_tag: subtracted_time_difference
    explanation: นำเวลาของทั้งสองท่อมาลบกัน 6 - 3 = 3 แล้วบวกค่าชดเชย
  - id: '5'
    text: 4.5 ชม.
    error_tag: average_time_fallacy
    explanation: นำเวลามาเฉลี่ยกันตรงๆ (3 + 6)/2 = 4.5 ชม. ซึ่งเป็นความเข้าใจผิดร้ายแรง เพราะเปิดสองท่อย่อมเร็วกว่าเปิดท่อเดียว
  correct_answer: '2'
  solution: "โจทย์อัตราการไหลของท่อเติมน้ำ (Pipe Flow Rate Problem)\nขั้นตอนที่ 1: กำหนดอัตราการทำงานของแต่ละท่อต่อ 1 ชั่วโมง\n\
    \  ท่อ A เติมเต็มถังใน 3 ชม. -> อัตราการไหลของ A = 1/3 ถังต่อชั่วโมง\n  ท่อ B เติมเต็มถังใน 6 ชม. -> อัตราการไหลของ B\
    \ = 1/6 ถังต่อชั่วโมง\nขั้นตอนที่ 2: หาอัตราการไหลรวมเมื่อเปิดทั้งสองท่อพร้อมกัน\n  อัตราการไหลรวม = 1/3 + 1/6 = 2/6 +\
    \ 1/6 = 3/6 = 1/2 ถังต่อชั่วโมง\nขั้นตอนที่ 3: คำนวณเวลาที่น้ำจะเต็มถัง\n  เวลา = 1 / (อัตราการไหลรวม) = 1 / (1/2) = 2.0\
    \ ชั่วโมง\nสรุป น้ำจะเต็มถังในเวลา 2.0 ชั่วโมง (ตัวเลือก 2)"
- number: 4
  question_id: tpat3-70-q04
  topic: tpat3.quantitative
  skill: linear_speed_gear
  score: 1.3333333333333333
  answer_type: single_choice
  stem: รอกขนาดเส้นผ่านศูนย์กลาง 40 cm หมุนด้วยอัตราเร็ว 120 รอบต่อนาที อัตราเร็วเชิงเส้นของสายพานเป็นกี่เมตรต่อวินาที (กำหนด
    π ≈ 3.14)
  options:
  - id: '1'
    text: 1.26 m/s
    error_tag: used_radius_as_10cm
    explanation: ใช้รัศมี 0.10 m (แบ่งครึ่งรัศมีซ้ำซ้อน) ทำให้คำตอบลดลงครึ่งหนึ่งเหลือ 1.26 m/s
  - id: '2'
    text: 2.51 m/s
    explanation: ถูกต้อง รัศมี r = 0.20 m, อัตราเร็วเชิงมุม ω = 120 × 2π / 60 = 4π rad/s, อัตราเร็วเชิงเส้น v = ωr = 4π ×
      0.20 = 0.8π ≈ 2.51 m/s
  - id: '3'
    text: 3.77 m/s
    error_tag: arithmetic_pi_scaling
    explanation: คูณค่าคงที่หรือสัมประสิทธิ์ผิดพลาด (0.8 × 4.71)
  - id: '4'
    text: 5.02 m/s
    error_tag: used_diameter_instead_of_radius
    explanation: นำเส้นผ่านศูนย์กลาง 0.40 m ไปแทนรัศมีในสมการ v = ωr ทำให้คำตอบเป็นสองเท่า (5.02 m/s)
  - id: '5'
    text: 6.28 m/s
    error_tag: omitted_radius_multiplication
    explanation: ลืมคูณรัศมี r โดยคำนวณเฉพาะ 2π(120/60) = 4π หรือคิด 2π = 6.28 m/s
  correct_answer: '2'
  solution: "การคำนวณอัตราเร็วเชิงเส้นของรอกและสายพาน (Linear & Angular Speed)\nขั้นตอนที่ 1: รวบรวมข้อมูลตัวแปรทางฟิสิกส์\n\
    \  เส้นผ่านศูนย์กลาง D = 40 cm -> รัศมี r = 40 / 2 = 20 cm = 0.20 m\n  อัตราเร็วรอบ n = 120 รอบต่อนาที (rpm)\nขั้นตอนที่\
    \ 2: แปลงอัตราเร็วรอบเป็นอัตราเร็วเชิงมุม (Angular Velocity, ω)\n  ω = 2π × (n / 60) = 2π × (120 / 60) = 4π rad/s\nขั้นตอนที่\
    \ 3: คำนวณอัตราเร็วเชิงเส้นของสายพาน (v = ωr)\n  v = 4π × 0.20 = 0.8π m/s\n  แทนค่า π ≈ 3.14159: v = 0.8 × 3.14159 ≈ 2.513\
    \ m/s ≈ 2.51 m/s\nสรุป อัตราเร็วเชิงเส้นของสายพานเท่ากับ 2.51 m/s (ตัวเลือก 2)"
- number: 5
  question_id: tpat3-70-q05
  topic: tpat3.quantitative
  skill: percentage_efficiency
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เครื่องยนต์รับพลังงานความร้อน 5,000 J และเปลี่ยนเป็นงานกลได้ 1,750 J ประสิทธิภาพเชิงความร้อนของเครื่องยนต์เป็นกี่เปอร์เซ็นต์
  options:
  - id: '1'
    text: 25%
    error_tag: underestimated_percentage
    explanation: คิดเลขผิดพลาดเป็น 1,250 / 5,000 = 25%
  - id: '2'
    text: 30%
    error_tag: arithmetic_division_miscalc
    explanation: ประมาณการตัวเลขเศษส่วนผิดเป็น 30%
  - id: '3'
    text: 35%
    explanation: ถูกต้อง ประสิทธิภาพเชิงความร้อน η = (งานที่ได้ / ความร้อนที่ป้อนเข้า) × 100% = (1,750 / 5,000) × 100% = 35%
  - id: '4'
    text: 40%
    error_tag: overestimated_percentage
    explanation: คิดเลขผิดพลาดเป็น 2,000 / 5,000 = 40%
  - id: '5'
    text: 45%
    error_tag: ratio_miscalculation
    explanation: คำนวณสัดส่วนผิดพลาดเป็น 45%
  correct_answer: '3'
  solution: "การคำนวณประสิทธิภาพเชิงความร้อน (Thermal Efficiency, η)\nขั้นตอนที่ 1: กำหนดตัวแปรและสูตรคำนวณ\n  พลังงานความร้อนที่ป้อนเข้า\
    \ (Heat Input, Q_in) = 5,000 J\n  งานกลที่มีประโยชน์ที่ได้ (Useful Work, W_out) = 1,750 J\n  ประสิทธิภาพ η = (W_out /\
    \ Q_in) × 100%\nขั้นตอนที่ 2: แทนค่าตัวเลขลงในสมการ\n  η = (1,750 / 5,000) × 100%\n  η = (175 / 500) × 100% = (35 / 100)\
    \ × 100% = 35%\nสรุป ประสิทธิภาพเชิงความร้อนของเครื่องยนต์เท่ากับ 35% (ตัวเลือก 3)"
- number: 6
  question_id: tpat3-70-q06
  topic: tpat3.quantitative
  skill: exponential_decay
  score: 1.3333333333333333
  answer_type: single_choice
  stem: สารกัมมันตรังสีชนิดหนึ่งมีครึ่งชีวิต 8 วัน ถ้าเริ่มต้นมีสาร 80 กรัม เมื่อเวลาผ่านไป 24 วัน จะเหลือสารกี่กรัม
  options:
  - id: '1'
    text: 5 กรัม
    error_tag: overcounted_half_lives
    explanation: คิดเป็น 4 รอบครึ่งชีวิต (80 / 16 = 5 กรัม)
  - id: '2'
    text: 10 กรัม
    explanation: ถูกต้อง จำนวนช่วงครึ่งชีวิต n = 24 / 8 = 3 รอบ ปริมาณสารที่เหลือ = 80 / (2³) = 80 / 8 = 10 กรัม
  - id: '3'
    text: 15 กรัม
    error_tag: arithmetic_linear_decay_error
    explanation: คิดการสลายตัวแบบเชิงเส้นคลาดเคลื่อน
  - id: '4'
    text: 20 กรัม
    error_tag: undercounted_half_lives
    explanation: คิดเพียง 2 รอบครึ่งชีวิต (80 / 4 = 20 กรัม)
  - id: '5'
    text: 40 กรัม
    error_tag: single_half_life_only
    explanation: คิดเพียง 1 รอบครึ่งชีวิต (80 / 2 = 40 กรัม)
  correct_answer: '2'
  solution: "การสลายตัวของสารกัมมันตรังสีและครึ่งชีวิต (Radioactive Half-life Decay)\nขั้นตอนที่ 1: คำนวณจำนวนรอบของครึ่งชีวิต\
    \ (Number of Half-lives, n)\n  ครึ่งชีวิต T_half = 8 วัน, เวลาที่ผ่านไป t = 24 วัน\n  n = t / T_half = 24 / 8 = 3 รอบ\n\
    ขั้นตอนที่ 2: คำนวณปริมาณสารที่เหลือ (Remaining Amount, N)\n  จากสมการ N = N₀ / (2ⁿ)\n  N = 80 / (2³) = 80 / 8 = 10 กรัม\n\
    \  (หรือคิดทีละช่วง: เริ่มต้น 80 กรัม -> 8 วันเหลือ 40 กรัม -> 16 วันเหลือ 20 กรัม -> 24 วันเหลือ 10 กรัม)\nสรุป เมื่อเวลาผ่านไป\
    \ 24 วัน จะเหลือสาร 10 กรัม (ตัวเลือก 2)"
- number: 7
  question_id: tpat3-70-q07
  topic: tpat3.quantitative
  skill: scale_map
  score: 1.3333333333333333
  answer_type: single_choice
  stem: 'แผนที่มาตราส่วน 1 : 50,000 ถ้าระยะทางระหว่างสองเมืองบนแผนที่วัดได้ 12 cm ระยะทางจริงบนพื้นดินคือกี่กิโลเมตร'
  options:
  - id: '1'
    text: 3 km
    error_tag: halved_scale_factor
    explanation: หารด้วย 2 คลาดเคลื่อนในขั้นตอนการแปลงหน่วย ทำให้ได้ 3 km
  - id: '2'
    text: 6 km
    explanation: ถูกต้อง ระยะทางจริง = 12 cm × 50,000 = 600,000 cm แปลงเป็นเมตรคือ 6,000 m และแปลงเป็นกิโลเมตรคือ 6 km
  - id: '3'
    text: 12 km
    error_tag: unit_conversion_power_ten_error
    explanation: ลืมหารด้วยตัวประกอบ 50,000 ให้ถูกต้อง หรือสับสนกับตัวเลข 12 บนแผนที่
  - id: '4'
    text: 24 km
    error_tag: doubled_distance_miscalc
    explanation: คำนวณเกินสองเท่าเป็น 24 km
  - id: '5'
    text: 60 km
    error_tag: decimal_place_unit_shift
    explanation: เลื่อนจุดทศนิยมผิดพลาดในการแปลง cm เป็น km โดยใช้ 10,000 แทน 100,000 ทำให้ได้ 60 km
  correct_answer: '2'
  solution: "การคำนวณระยะทางจริงจากมาตราส่วนแผนที่ (Map Scale Conversion)\nขั้นตอนที่ 1: กำหนดสูตรและคำนวณระยะจริงในหน่วยเซนติเมตร\n\
    \  มาตราส่วน 1 : 50,000 หมายถึง 1 cm บนแผนที่ เท่ากับ 50,000 cm บนพื้นดินจริง\n  ระยะทางจริง = 12 cm × 50,000 = 600,000\
    \ cm\nขั้นตอนที่ 2: แปลงหน่วยเซนติเมตรเป็นกิโลเมตร\n  1 เมตร (m) = 100 cm -> 600,000 cm = 6,000 m\n  1 กิโลเมตร (km) =\
    \ 1,000 m -> 6,000 m = 6 km\n  (หรือใช้ตัวแปลง: 1 km = 100,000 cm -> 600,000 / 100,000 = 6 km)\nสรุป ระยะทางจริงบนพื้นดินคือ\
    \ 6 กิโลเมตร (ตัวเลือก 2)"
- number: 8
  question_id: tpat3-70-q08
  topic: tpat3.quantitative
  skill: arithmetic_mean
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ค่าเฉลี่ยเลขคณิตของข้อมูล 5 จำนวนคือ 18 ถ้าเพิ่มข้อมูลอีกหนึ่งจำนวนเข้าไป ทำให้ค่าเฉลี่ยใหม่เป็น 20 ข้อมูลที่เพิ่มเข้ามามีค่าเท่าใด
  options:
  - id: '1'
    text: '24'
    error_tag: added_mean_difference_to_initial
    explanation: คิดคำนวณผิดวิธีโดยนำผลต่างค่าเฉลี่ยไปบวกค่าเดิมคลาดเคลื่อน
  - id: '2'
    text: '26'
    error_tag: arithmetic_sum_difference_miscalc
    explanation: คำนวณผลรวมใหม่ผิดพลาด
  - id: '3'
    text: '28'
    error_tag: arithmetic_subtraction_error
    explanation: ลบเลขผิดพลาด 120 - 92 = 28
  - id: '4'
    text: '30'
    explanation: ถูกต้อง ผลรวมเดิมของ 5 จำนวน = 5 × 18 = 90, ผลรวมใหม่ของ 6 จำนวน = 6 × 20 = 120, ค่าข้อมูลที่เพิ่มเข้ามา
      = 120 - 90 = 30
  - id: '5'
    text: '32'
    error_tag: overcounted_new_sum
    explanation: คิดผลรวมใหม่เกินจริงเป็น 122 - 90 = 32
  correct_answer: '4'
  solution: "การคำนวณค่าเฉลี่ยเลขคณิตและผลรวมข้อมูล (Arithmetic Mean & Sum)\nขั้นตอนที่ 1: หาผลรวมของข้อมูลชุดเดิม 5 จำนวน\n\
    \  ผลรวมเดิม = ค่าเฉลี่ยเดิม × จำนวนข้อมูลเดิม\n  ผลรวมเดิม = 18 × 5 = 90\nขั้นตอนที่ 2: หาผลรวมของข้อมูลชุดใหม่หลังเพิ่ม\
    \ 1 จำนวน (รวมเป็น 6 จำนวน)\n  ผลรวมใหม่ = ค่าเฉลี่ยใหม่ × จำนวนข้อมูลใหม่\n  ผลรวมใหม่ = 20 × 6 = 120\nขั้นตอนที่ 3:\
    \ หาค่าของข้อมูลที่เพิ่มเข้ามา\n  ข้อมูลใหม่ = ผลรวมใหม่ - ผลรวมเดิม = 120 - 90 = 30\nสรุป ข้อมูลที่เพิ่มเข้ามามีค่าเท่ากับ\
    \ 30 (ตัวเลือก 4)"
- number: 9
  question_id: tpat3-70-q09
  topic: tpat3.quantitative
  skill: linear_interpolation
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เทอร์โมมิเตอร์แสดงค่า 0° เมื่ออุณหภูมิจริง -10°C และแสดงค่า 100° เมื่ออุณหภูมิจริง 110°C ถ้าอ่านค่าได้ 50° อุณหภูมิจริงคือเท่าใด
  options:
  - id: '1'
    text: 45°C
    error_tag: underestimated_span_scaling
    explanation: คำนวณสัดส่วนสเกลคลาดเคลื่อนเหลือ 45°C
  - id: '2'
    text: 50°C
    explanation: ถูกต้อง สเกล 0° ถึง 100° กว้าง 100 ช่อง ตรงกับอุณหภูมิจริง 110 - (-10) = 120°C ค่าอ่าน 50° อยู่กึ่งกลางสเกล
      อุณหภูมิจริงจึงเท่ากับ -10 + (50/100) × 120 = -10 + 60 = 50°C
  - id: '3'
    text: 55°C
    error_tag: linear_interpolation_offset_error
    explanation: คิดสเกล 100 ช่องเท่ากับ 110°C แทน 120°C ทำให้ได้ 55°C
  - id: '4'
    text: 60°C
    error_tag: ignored_negative_lower_bound
    explanation: ลืมบวกจุดเริ่มต้นที่เป็นลบ (-10°C) โดยตอบ 60°C ตรงๆ จาก 120 / 2
  - id: '5'
    text: 65°C
    error_tag: arithmetic_scale_shift
    explanation: คำนวณออฟเซตอุณหภูมิผิดพลาดเป็น 65°C
  correct_answer: '2'
  solution: "การประมาณค่าเชิงเส้นและการเทียบสเกลเทอร์โมมิเตอร์ (Linear Interpolation)\nขั้นตอนที่ 1: กำหนดความสัมพันธ์เชิงเส้นระหว่างค่าที่อ่านได้\
    \ (R) กับอุณหภูมิจริง (T)\n  สเกลของเทอร์โมมิเตอร์: 0° ถึง 100° -> ช่วงการวัด ΔR = 100 - 0 = 100 ช่อง\n  อุณหภูมิจริง:\
    \ -10°C ถึง 110°C -> ช่วงอุณหภูมิจริง ΔT = 110 - (-10) = 120°C\nขั้นตอนที่ 2: เทียบสัดส่วนเชิงเส้น (T - T_min) / ΔT =\
    \ (R - R_min) / ΔR\n  (T - (-10)) / 120 = (50 - 0) / 100\n  (T + 10) / 120 = 50 / 100 = 1/2\n  T + 10 = 120 × (1/2) =\
    \ 60\n  T = 60 - 10 = 50°C\nสรุป อุณหภูมิจริงคือ 50°C (ตัวเลือก 2)"
- number: 10
  question_id: tpat3-70-q10
  topic: tpat3.quantitative
  skill: probability_dice
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ทอยลูกเต๋าเที่ยงตรง 2 ลูกพร้อมกัน ความน่าจะเป็นที่ผลรวมของแต้มเป็น 7 เท่ากับเท่าใด
  options:
  - id: '1'
    text: 1/12
    error_tag: counted_only_3_ordered_pairs
    explanation: นับคู่ผลลัพธ์เพียง 3 คู่โดยไม่สลับลำดับลูกเต๋า (3/36 = 1/12)
  - id: '2'
    text: 1/9
    error_tag: miscounted_favorable_outcomes_as_4
    explanation: นับเหตุการณ์ที่แต้มรวมเป็น 7 ขาดไป เหลือ 4 คู่ (4/36 = 1/9)
  - id: '3'
    text: 5/36
    error_tag: confused_with_sum_of_6_or_8
    explanation: สับสนกับผลรวมแต้ม 6 หรือ 8 ซึ่งมีผลลัพธ์ 5 คู่ (5/36)
  - id: '4'
    text: 1/6
    explanation: ถูกต้อง ผลลัพธ์ทั้งหมดคือ 6 × 6 = 36 แบบ เหตุการณ์ที่ผลรวมเป็น 7 มี 6 แบบ คือ (1,6), (2,5), (3,4), (4,3),
      (5,2), (6,1) ดังนั้น ความน่าจะเป็น = 6/36 = 1/6
  - id: '5'
    text: 7/36
    error_tag: numerator_matches_sum_value
    explanation: นำตัวเลขผลรวมแต้ม 7 ไปใส่เป็นตัวเศษโดยตรง (7/36)
  correct_answer: '4'
  solution: "การคำนวณความน่าจะเป็นของการทอยลูกเต๋า 2 ลูก (Probability & Combinatorics)\nขั้นตอนที่ 1: หาจำนวนผลลัพธ์ที่เป็นไปได้ทั้งหมดในแซมเปิลสเปซ\
    \ (Sample Space, n(S))\n  ลูกเต๋าแต่ละลูกมี 6 หน้า (1 ถึง 6)\n  n(S) = 6 × 6 = 36 แบบ\nขั้นตอนที่ 2: แจกแจงคู่อันดับที่ผลรวมแต้มเท่ากับ\
    \ 7 (Event, E)\n  (ลูกที่ 1, ลูกที่ 2):\n  (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1)\n  จำนวนเหตุการณ์ที่สนใจ n(E)\
    \ = 6 แบบ\nขั้นตอนที่ 3: คำนวณความน่าจะเป็น P(E) = n(E) / n(S)\n  P(E) = 6 / 36 = 1/6\nสรุป ความน่าจะเป็นที่ผลรวมแต้มเป็น\
    \ 7 เท่ากับ 1/6 (ตัวเลือก 4)"
- number: 11
  question_id: tpat3-70-q11
  topic: tpat3.quantitative
  skill: work_rate
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ช่าง 3 คนสร้างกำแพงเสร็จใน 4 วัน ถ้ามีช่าง 6 คนทำงานด้วยอัตราเร็วเท่ากันจะสร้างกำแพงขนาดเท่าเดิมเสร็จในกี่วัน
  options:
  - id: '1'
    text: 1 วัน
    error_tag: halved_time_twice
    explanation: หารสองซ้ำซ้อนสองครั้งทำให้เหลือ 1 วัน
  - id: '2'
    text: 2 วัน
    explanation: ถูกต้อง ปริมาณงานคงที่ = 3 คน × 4 วัน = 12 คน·วัน เมื่อเพิ่มช่างเป็น 6 คน เวลาที่ใช้คือ 12 / 6 = 2 วัน
  - id: '3'
    text: 3 วัน
    error_tag: linear_subtraction_fallacy
    explanation: นำ 6 - 3 = 3 วัน ซึ่งเป็นการคาดเดาโดยไม่ใช้หลักงานแปรผกผัน
  - id: '4'
    text: 4 วัน
    error_tag: constant_time_assumption
    explanation: เข้าใจผิดว่าเวลาทำงานไม่เปลี่ยนแปลงแม้จะเพิ่มคนทำงาน
  - id: '5'
    text: 5 วัน
    error_tag: direct_proportion_fallacy
    explanation: เข้าใจผิดว่าจำนวนคนแปรผันตรงกับเวลา (คิดว่าเพิ่มคนแล้วเวลาต้องเพิ่มขึ้น)
  correct_answer: '2'
  solution: "โจทย์การทำงานและอัตราเร็วคงที่ (Work Rate & Inverse Variation)\nขั้นตอนที่ 1: คำนวณปริมาณงานทั้งหมดในหน่วย 'คน·วัน'\
    \ (Man-Days)\n  งานทั้งหมด = จำนวนคน × จำนวนวัน\n  งานทั้งหมด = 3 คน × 4 วัน = 12 คน·วัน\nขั้นตอนที่ 2: คำนวณเวลาที่ใช้เมื่อมีช่าง\
    \ 6 คน\n  จำนวนวัน = ปริมาณงานทั้งหมด / จำนวนช่าง\n  จำนวนวัน = 12 คน·วัน / 6 คน = 2 วัน\nสรุป ช่าง 6 คนจะสร้างกำแพงเสร็จใน\
    \ 2 วัน (ตัวเลือก 2)"
- number: 12
  question_id: tpat3-70-q12
  topic: tpat3.quantitative
  skill: density_mixture
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ผสมของเหลว A (ความหนาแน่น 800 kg/m³) 2 ลิตร กับของเหลว B (ความหนาแน่น 1100 kg/m³) 1 ลิตร ความหนาแน่นเฉลี่ยของสารผสมเป็นกี่
    kg/m³ (สมมติปริมาตรรวมอนุรักษ์)
  options:
  - id: '1'
    text: 900 kg/m³
    explanation: ถูกต้อง มวลรวม = 800(2) + 1100(1) = 1600 + 1100 = 2700 หน่วยมวล ปริมาตรรวม = 3 ลิตร ความหนาแน่นเฉลี่ย = 2700
      / 3 = 900 kg/m³
  - id: '2'
    text: 950 kg/m³
    error_tag: simple_arithmetic_mean_fallacy
    explanation: หาค่าเฉลี่ยตรงๆ (800 + 1100)/2 = 950 kg/m³ โดยไม่ถ่วงน้ำหนักตามสัดส่วนปริมาตรที่ผสม
  - id: '3'
    text: 1000 kg/m³
    error_tag: inverted_volume_weighting
    explanation: สลับสัดส่วนปริมาตรเป็น A 1 ลิตร และ B 2 ลิตร ((800 + 2200)/3 = 1000 kg/m³)
  - id: '4'
    text: 1050 kg/m³
    error_tag: volume_ratio_miscalculation
    explanation: คำนวณสัดส่วนการผสมคลาดเคลื่อนเป็น 1050 kg/m³
  - id: '5'
    text: 1100 kg/m³
    error_tag: selected_higher_density_component
    explanation: ตอบเท่ากับความหนาแน่นของของเหลว B ซึ่งเป็นค่าสูงสุด
  correct_answer: '1'
  solution: "การคำนวณความหนาแน่นเฉลี่ยของสารผสม (Average Density of Mixture)\nขั้นตอนที่ 1: คำนวณมวลของสารแต่ละชนิดจาก m =\
    \ ρV\n  สาร A: ปริมาตร V_A = 2 ลิตร, ความหนาแน่น ρ_A = 800 kg/m³\n  มวลของ A สัดส่วน = 800 × 2 = 1,600 หน่วย\n  สาร B:\
    \ ปริมาตร V_B = 1 ลิตร, ความหนาแน่น ρ_B = 1,100 kg/m³\n  มวลของ B สัดส่วน = 1,100 × 1 = 1,100 หน่วย\nขั้นตอนที่ 2: คำนวณมวลรวมและปริมาตรรวม\n\
    \  มวลรวม = 1,600 + 1,100 = 2,700 หน่วย\n  ปริมาตรรวม = 2 + 1 = 3 ลิตร\nขั้นตอนที่ 3: คำนวณความหนาแน่นเฉลี่ย\n  ρ_avg\
    \ = มวลรวม / ปริมาตรรวม = 2,700 / 3 = 900 kg/m³\nสรุป ความหนาแน่นเฉลี่ยของสารผสมเท่ากับ 900 kg/m³ (ตัวเลือก 1)"
- number: 13
  question_id: tpat3-70-q13
  topic: tpat3.quantitative
  skill: electrical_energy_cost
  score: 1.3333333333333333
  answer_type: single_choice
  stem: หลอดไฟขนาด 100 วัตต์ เปิดใช้งานวันละ 10 ชั่วโมง เป็นเวลา 30 วัน ใช้พลังงานไฟฟ้าไปกี่หน่วย (kWh)
  options:
  - id: '1'
    text: 15 หน่วย
    error_tag: halved_energy_calculation
    explanation: คิดชั่วโมงใช้งานเพียง 5 ชม./วัน หรือคำนวณผลลัพธ์หายไปครึ่งหนึ่ง
  - id: '2'
    text: 30 หน่วย
    explanation: ถูกต้อง กำลังไฟฟ้า 100 W = 0.1 kW ใช้งานรวม 10 ชม./วัน × 30 วัน = 300 ชม. พลังงานไฟฟ้า = 0.1 kW × 300 h =
      30 kWh (หน่วย)
  - id: '3'
    text: 45 หน่วย
    error_tag: arithmetic_factor_error
    explanation: คูณตัวเลขผิดพลาดเป็น 1.5 เท่า ได้ 45 หน่วย
  - id: '4'
    text: 60 หน่วย
    error_tag: doubled_energy_calculation
    explanation: คิดว่าเปิดใช้งานวันละ 20 ชั่วโมง หรือคูณสองเกินขนาดเป็น 60 หน่วย
  - id: '5'
    text: 300 หน่วย
    error_tag: omitted_watt_to_kilowatt_conversion
    explanation: ลืมหารด้วย 1,000 เพื่อแปลงวัตต์เป็นกิโลวัตต์ ตอบเป็น 100 × 300 / 100 = 300 หน่วย
  correct_answer: '2'
  solution: "การคำนวณพลังงานไฟฟ้าในหน่วยยูนิต (Kilowatt-Hour Electrical Energy)\nขั้นตอนที่ 1: แปลงกำลังไฟฟ้าเป็นกิโลวัตต์\
    \ (kW)\n  กำลังไฟฟ้า P = 100 W = 100 / 1,000 kW = 0.1 kW\nขั้นตอนที่ 2: คำนวณเวลาการใช้งานรวมทั้งหมดในหน่วยชั่วโมง (Hours)\n\
    \  เวลาต่อวัน = 10 ชั่วโมง/วัน, จำนวนวัน = 30 วัน\n  เวลารวม t = 10 × 30 = 300 ชั่วโมง\nขั้นตอนที่ 3: คำนวณพลังงานไฟฟ้า\
    \ (Energy = Power × Time)\n  พลังงาน (kWh) = 0.1 kW × 300 h = 30 kWh (หน่วย)\nสรุป ใช้พลังงานไฟฟ้าไปทั้งหมด 30 หน่วย (ตัวเลือก\
    \ 2)"
- number: 14
  question_id: tpat3-70-q14
  topic: tpat3.quantitative
  skill: geometric_series
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ลวดเส้นหนึ่งถูกตัดออก 1/3 ของความยาวที่เหลือในแต่ละขั้นตอน ถ้าเริ่มต้นยาว 81 cm หลังตัด 3 ครั้งจะเหลือความยาวกี่ cm
  options:
  - id: '1'
    text: 16 cm
    error_tag: applied_cut_fraction_decay
    explanation: คำนวณสัดส่วน 81 × (1/3) หรือคำนวณขั้นที่ 4 คลาดเคลื่อน
  - id: '2'
    text: 24 cm
    explanation: ถูกต้อง ในแต่ละขั้นตอน ลวดจะเหลือความยาวเป็นสัดส่วน 2/3 เสมอ เมื่อตัด 3 ครั้ง ความยาวที่เหลือ = 81 × (2/3)³
      = 81 × 8/27 = 24 cm
  - id: '3'
    text: 27 cm
    error_tag: stopped_after_first_cut
    explanation: คิดเฉพาะปริมาณที่ตัดออกในครั้งแรก 81 / 3 = 27 cm
  - id: '4'
    text: 32 cm
    error_tag: subtracted_fixed_amount_per_step
    explanation: ลบออกทีละค่าคงที่โดยไม่คิดอัตราส่วนเรขาคณิต
  - id: '5'
    text: 36 cm
    error_tag: stopped_at_two_cuts
    explanation: 'คำนวณการตัดเพียง 2 ครั้ง: 81 × (2/3)² = 81 × 4/9 = 36 cm'
  correct_answer: '2'
  solution: "การคำนวณความยาวที่เหลือด้วยลำดับเรขาคณิต (Geometric Sequence Fraction)\nขั้นตอนที่ 1: วิเคราะห์สัดส่วนที่เหลือในแต่ละขั้นตอน\n\
    \  ในแต่ละขั้นตอน ลวดถูกตัดออก 1/3 ของความยาวที่เหลือ\n  ดังนั้น ลวดจะเหลือความยาวเป็นสัดส่วน 1 - 1/3 = 2/3 ของความยาวก่อนหน้าเสมอ\n\
    ขั้นตอนที่ 2: คำนวณความยาวหลังตัดซ้ำ 3 ครั้ง\n  ความยาวเริ่มต้น L₀ = 81 cm\n  ความยาวหลังตัด 1 ครั้ง: L₁ = 81 × (2/3)\
    \ = 54 cm\n  ความยาวหลังตัด 2 ครั้ง: L₂ = 54 × (2/3) = 36 cm\n  ความยาวหลังตัด 3 ครั้ง: L₃ = 36 × (2/3) = 24 cm\n  หรือคำนวณรวดเดียว:\
    \ L₃ = 81 × (2/3)³ = 81 × (8/27) = 3 × 8 = 24 cm\nสรุป หลังตัด 3 ครั้งจะเหลือความยาว 24 cm (ตัวเลือก 2)"
- number: 15
  question_id: tpat3-70-q15
  topic: tpat3.quantitative
  skill: thermal_expansion
  score: 1.3333333333333333
  answer_type: single_choice
  stem: รางรถไฟเหล็กยาว 20 m ที่ 20°C สัมประสิทธิ์การขยายตัวเชิงเส้น α = 1.2 × 10⁻⁵ K⁻¹ เมื่ออุณหภูมิเพิ่มเป็น 50°C รางจะขยายตัวกี่มิลลิเมตร
  options:
  - id: '1'
    text: 3.6 mm
    error_tag: halved_temperature_change
    explanation: ใช้ผลต่างอุณหภูมิเพียง 15°C แทน 30°C ทำให้ได้ 3.6 mm
  - id: '2'
    text: 7.2 mm
    explanation: ถูกต้อง ผลต่างอุณหภูมิ ΔT = 50 - 20 = 30°C การขยายตัว ΔL = L₀αΔT = 20 × (1.2 × 10⁻⁵) × 30 = 7.2 × 10⁻³ m
      = 7.2 mm
  - id: '3'
    text: 10.8 mm
    error_tag: used_final_temperature_directly
    explanation: ใช้ค่าอุณหภูมิ 45°C หรือคำนวณเกิน 1.5 เท่า ได้ 10.8 mm
  - id: '4'
    text: 14.4 mm
    error_tag: doubled_thermal_expansion
    explanation: คูณสองผลลัพธ์ หรือใช้ความยาวเดิม 40 m ทำให้ได้ 14.4 mm
  - id: '5'
    text: 18.0 mm
    error_tag: used_final_temp_without_baseline
    explanation: นำอุณหภูมิสุดท้าย 50°C หรือ 75°C มาคูณโดยไม่ลบอุณหภูมิเริ่มต้น
  correct_answer: '2'
  solution: "การขยายตัวเชิงความร้อนตามยาว (Linear Thermal Expansion)\nขั้นตอนที่ 1: กำหนดตัวแปรและสูตรการขยายตัว\n  ความยาวเริ่มต้น\
    \ L₀ = 20 m\n  สัมประสิทธิ์การขยายตัวเชิงเส้น α = 1.2 × 10⁻⁵ K⁻¹ (หรือ °C⁻¹)\n  การเปลี่ยนแปลงอุณหภูมิ ΔT = T_final -\
    \ T_initial = 50°C - 20°C = 30°C\nขั้นตอนที่ 2: คำนวณการเปลี่ยนแปลงความยาว (ΔL = L₀ × α × ΔT)\n  ΔL = 20 m × (1.2 × 10⁻⁵\
    \ °C⁻¹) × 30°C\n  ΔL = 600 × 1.2 × 10⁻⁵ = 720 × 10⁻⁵ m = 7.2 × 10⁻³ m\nขั้นตอนที่ 3: แปลงหน่วยเป็นมิลลิเมตร (1 m = 1,000\
    \ mm)\n  ΔL = 7.2 × 10⁻³ × 1,000 mm = 7.2 mm\nสรุป รางรถไฟจะขยายตัว 7.2 มิลลิเมตร (ตัวเลือก 2)"
- number: 16
  question_id: tpat3-70-q16
  topic: tpat3.spatial_relations
  skill: isometric_orthographic
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เมื่อมองวัตถุรูปตัว L คว่ำจาก 'ด้านบน (Top View)' ภาพที่ได้จะเป็นรูปทรงเรขาคณิตใด
  options:
  - id: '1'
    text: รูปสี่เหลี่ยมผืนผ้าชิ้นเดียว
    explanation: ถูกต้อง เมื่อมองจากด้านบนตรงๆ (Top View) พื้นผิวแนวนอนด้านบนของตัว L คว่ำจะฉายลงมาเป็นรูปสี่เหลี่ยมผืนผ้าชิ้นเดียวต่อเนื่องกัน
  - id: '2'
    text: รูปตัว T
    error_tag: confused_with_t_profile
    explanation: สับสนกับรูปทรงหน้าตัดของวัตถุอื่น เช่น ชิ้นงานรูปตัว T
  - id: '3'
    text: รูปสี่เหลี่ยมจัตุรัสมีเส้นประ
    error_tag: false_hidden_line_assumption
    explanation: เข้าใจผิดว่ามองเห็นเส้นประของขอบล่าง ทั้งที่ระนาบบนทึบบังมิดและมีขนาดเท่ากันในแนวตั้ง
  - id: '4'
    text: รูปตัว U
    error_tag: confused_with_u_profile
    explanation: สับสนกับรูปทรงหน้าตัดตัว U
  - id: '5'
    text: รูปสามเหลี่ยม
    error_tag: unrelated_geometric_primitive
    explanation: ไม่มีมุมสอบเอียงที่จะเกิดรูปสามเหลี่ยมในภาพฉายมุมบน
  correct_answer: '1'
  solution: "การวิเคราะห์ภาพฉายมุมมองด้านบน (Top View Orthographic Projection)\nขั้นตอนที่ 1: วิเคราะห์รูปทรงเรขาคณิตสามมิติของวัตถุรูปตัว\
    \ L คว่ำ\n  วัตถุรูปตัว L คว่ำ ประกอบด้วยท่อนอนแนวนอนด้านบน และท่อดิ่งที่ยื่นลงด้านล่าง\nขั้นตอนที่ 2: พิจารณาระนาบที่มองเห็นจากด้านบนตรงๆ\
    \ (Top View)\n  เมื่อมองจากด้านบนในมุม 90 องศากับพื้นราบ สายตาจะมองเห็นเฉพาะพื้นผิวด้านบนสุดของท่อนอน\n  พื้นผิวด้านบนนี้เป็นระนาบแบนราบชิ้นเดียวต่อเนื่องกัน\
    \ ไม่มีรอยบากหรือระดับขั้น\nขั้นตอนที่ 3: สรุปภาพฉายสองมิติ\n  ภาพฉายที่ได้บนระนาบแนวนอนจึงเป็นรูปสี่เหลี่ยมผืนผ้าชิ้นเดียวต่อเนื่อง\n\
    สรุป ภาพที่ได้คือ รูปสี่เหลี่ยมผืนผ้าชิ้นเดียว (ตัวเลือก 1)"
- number: 17
  question_id: tpat3-70-q17
  topic: tpat3.spatial_relations
  skill: cube_net_folding
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ลูกเต๋ามาตรฐาน หน้าตรงข้ามกันมีแต้มรวมเท่ากับ 7 เสมอ หากคลี่ลูกเต๋าออก หน้ารูปแต้ม 2 จะอยู่ตรงข้ามกับแต้มใด
  options:
  - id: '1'
    text: '1'
    error_tag: adjacent_face_misidentified
    explanation: แต้ม 1 อยู่ตรงข้ามกับแต้ม 6 (1 + 6 = 7) และอยู่ติดกับหน้า 2
  - id: '2'
    text: '3'
    error_tag: adjacent_face_misidentified
    explanation: แต้ม 3 อยู่ตรงข้ามกับแต้ม 4 (3 + 4 = 7) และอยู่ติดกับหน้า 2
  - id: '3'
    text: '4'
    error_tag: adjacent_face_misidentified
    explanation: แต้ม 4 อยู่ตรงข้ามกับแต้ม 3 และอยู่ติดกับหน้า 2
  - id: '4'
    text: '5'
    explanation: ถูกต้อง กฎของลูกเต๋ามาตรฐานคือผลรวมแต้มหน้าตรงข้ามต้องเท่ากับ 7 เสมอ ดังนั้นหน้า 2 จึงตรงข้ามกับหน้า 5 (2
      + 5 = 7)
  - id: '5'
    text: '6'
    error_tag: adjacent_face_misidentified
    explanation: แต้ม 6 อยู่ตรงข้ามกับแต้ม 1 และอยู่ติดกับหน้า 2
  correct_answer: '4'
  solution: "การวิเคราะห์การคลี่ลูกเต๋าและหน้าตรงข้าม (Standard Cube Net Properties)\nขั้นตอนที่ 1: ทบทวนกฎเกณฑ์ของลูกเต๋ามาตรฐาน\
    \ (Standard Die Rule)\n  ลูกเต๋ามาตรฐาน หน้าตรงข้ามกันทุกคู่จะมีแต้มรวมเท่ากับ 7 เสมอ\nขั้นตอนที่ 2: จับคู่หน้าตรงข้ามของลูกเต๋า\n\
    \  หน้าแต้ม 1 ตรงข้ามกับหน้าแต้ม 6 (1 + 6 = 7)\n  หน้าแต้ม 2 ตรงข้ามกับหน้าแต้ม 5 (2 + 5 = 7)\n  หน้าแต้ม 3 ตรงข้ามกับหน้าแต้ม\
    \ 4 (3 + 4 = 7)\nขั้นตอนที่ 3: สรุปคำตอบ\n  หน้าแต้ม 2 จะอยู่ตรงข้ามกับหน้าแต้ม 5 เสมอ ไม่ว่าจะพับหรือคลี่ลูกเต๋าออกในรูปแบบใด\n\
    สรุป หน้ารูปแต้ม 2 จะอยู่ตรงข้ามกับแต้ม 5 (ตัวเลือก 4)"
- number: 18
  question_id: tpat3-70-q18
  topic: tpat3.spatial_relations
  skill: rotation_3d
  score: 1.3333333333333333
  answer_type: single_choice
  stem: หมุนลูกบาศก์ไปทางขวา 90 องศา แล้วหมุนคว่ำลงข้างหน้าอีก 90 องศา หน้าที่เดิมอยู่ 'ด้านซ้าย' จะย้ายไปอยู่ที่ตำแหน่งใด
  options:
  - id: '1'
    text: ด้านหน้า
    error_tag: stopped_at_first_rotation_step
    explanation: หยุดคิดแค่การหมุนสเต็ปแรก (หมุนขวา 90° ทำให้ด้านซ้ายมาอยู่ด้านหน้า) แต่ลืมคิดการคว่ำลงข้างหน้า
  - id: '2'
    text: ด้านหลัง
    error_tag: inverted_pitch_direction
    explanation: คิดทิศทางการคว่ำลงข้างหน้าสลับทางกลายเป็นหงายไปด้านหลัง
  - id: '3'
    text: ด้านบน
    error_tag: opposite_vertical_orientation
    explanation: คิดทิศทางการพลิกคว่ำกลับทิศ 180° ทำให้ได้ด้านบน
  - id: '4'
    text: ด้านล่าง
    explanation: 'ถูกต้อง สเต็ป 1: หมุนลูกบาศก์ไปทางขวา 90° รอบแกนดิ่ง หน้าที่เดิมอยู่ ''ด้านซ้าย'' จะย้ายมาอยู่ ''ด้านหน้า''
      สเต็ป 2: หมุนคว่ำลงข้างหน้าอีก 90° รอบแกนนอน หน้าที่อยู่ ''ด้านหน้า'' จะพลิกคว่ำลงไปอยู่ ''ด้านล่าง'''
  - id: '5'
    text: ด้านขวา
    error_tag: confused_with_original_left_opposite
    explanation: คิดว่าหน้าซ้ายสลับไปอยู่ด้านขวาตรงๆ โดยไม่ตามแกนการหมุนจริง
  correct_answer: '4'
  solution: "การวิเคราะห์การหมุนวัตถุสามมิติทีละแกน (3D Spatial Rotation Transformation)\nขั้นตอนที่ 1: พิจารณาการหมุนรอบแกนดิ่ง\
    \ (Vertical Axis Rotation)\n  หมุนลูกบาศก์ไปทางขวา 90 องศา รอบแกนดิ่ง:\n  - หน้าด้านซ้าย จะหมุนมาอยู่ที่ 'ด้านหน้า'\n\
    \  - หน้าด้านหน้า จะหมุนไปอยู่ที่ 'ด้านขวา'\n  - หน้าด้านบน และ ด้านล่าง ยังคงอยู่ที่เดิม\nขั้นตอนที่ 2: พิจารณาการหมุนรอบแกนนอน\
    \ (Horizontal Axis Pitch Rotation)\n  หมุนคว่ำลงข้างหน้าอีก 90 องศา รอบแกนนอน:\n  - หน้าที่เพิ่งย้ายมาอยู่ที่ 'ด้านหน้า'\
    \ (ซึ่งเดิมคือด้านซ้าย) จะพลิกคว่ำลงไปอยู่ที่ 'ด้านล่าง'\n  - หน้าด้านบน จะพลิกมาอยู่ที่ 'ด้านหน้า'\nขั้นตอนที่ 3: สรุปผลลัพธ์ตำแหน่งสุดท้าย\n\
    \  หน้าที่เดิมอยู่ 'ด้านซ้าย' จะย้ายไปอยู่ที่ตำแหน่ง 'ด้านล่าง'\nสรุป คำตอบที่ถูกต้องคือ ด้านล่าง (ตัวเลือก 4)"
- number: 19
  question_id: tpat3-70-q19
  topic: tpat3.spatial_relations
  skill: cross_section
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เมื่อใช้ระนาบตัดทรงกรวยกลมตรงในแนวเฉียงที่ทำมุมกับแกนกรวยมากกว่ามุมยอด แต่ไม่ตัดผ่านฐาน รอยตัดที่เกิดขึ้นจะเป็นภาคตัดกรวยชนิดใด
  options:
  - id: '1'
    text: วงกลม
    error_tag: perpendicular_cut_only
    explanation: วงกลมจะเกิดขึ้นเมื่อระนาบตัดตั้งฉากกับแกนสมมาตรของกรวยเท่านั้น (ไม่ใช่แนวเฉียง)
  - id: '2'
    text: วงรี
    explanation: ถูกต้อง ระนาบตัดที่ทำมุมเฉียงกับแกนกรวยมากกว่ามุมยอดและตัดผ่านผิวกรวยโดยรอบโดยไม่ตัดผ่านฐาน จะให้รอยตัดแบบปิดเป็นรูปวงรี
      (Ellipse)
  - id: '3'
    text: พาราโบลา
    error_tag: parallel_generator_cut_confused
    explanation: พาราโบลาจะเกิดขึ้นเมื่อระนาบตัดขนานกับเส้นกำเนิดกรวย (ทำมุมเท่ากับมุมยอดพอดี)
  - id: '4'
    text: ไฮเพอร์โบลา
    error_tag: steep_angle_cut_confused
    explanation: ไฮเพอร์โบลาเกิดขึ้นเมื่อระนาบตัดชันมากจนตัดผ่านฐานหรือขนานกับแกนกรวย
  - id: '5'
    text: สามเหลี่ยมหน้าจั่ว
    error_tag: apex_intersecting_cut_only
    explanation: สามเหลี่ยมหน้าจั่วเกิดขึ้นเฉพาะเมื่อระนาบตัดผ่านจุดยอดของกรวย (Apex) เท่านั้น
  correct_answer: '2'
  solution: "การวิเคราะห์รอยตัดระนาบกับทรงกรวยกลมตรง (Conic Sections Analysis)\nขั้นตอนที่ 1: ทบทวนทฤษฎีภาคตัดกรวยตามมุมของระนาบตัดเทียบกับแกนกรวย\n\
    \  - ระนาบตัดตั้งฉากกับแกนกรวย (90°): ได้รูปวงกลม (Circle)\n  - ระนาบตัดเฉียงทำมุมมากกว่ามุมยอด และตัดเฉพาะผิวด้านข้างโดยไม่ตัดผ่านฐาน:\
    \ ได้รูปวงรี (Ellipse)\n  - ระนาบตัดขนานกับเส้นกำเนิดกรวย (ทำมุมเท่ากับมุมยอด): ได้รูปพาราโบลา (Parabola)\n  - ระนาบตัดทำมุมน้อยกว่ามุมยอดหรือขนานกับแกนกรวย:\
    \ ได้รูปไฮเพอร์โบลา (Hyperbola)\nขั้นตอนที่ 2: เปรียบเทียบกับเงื่อนไขในโจทย์\n  โจทย์ระบุว่า 'ระนาบตัดแนวเฉียงทำมุมกับแกนกรวยมากกว่ามุมยอด\
    \ แต่ไม่ตัดผ่านฐาน'\n  รอยตัดจึงเป็นเส้นโค้งปิดรูปวงรี (Ellipse)\nสรุป รอยตัดที่เกิดขึ้นคือ วงรี (ตัวเลือก 2)"
- number: 20
  question_id: tpat3-70-q20
  topic: tpat3.spatial_relations
  skill: hidden_lines
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ในแบบร่างทางวิศวกรรม (Engineering Drawing) เส้นประ (Hidden Line) ใช้เพื่อแสดงสิ่งใด
  options:
  - id: '1'
    text: เส้นขอบของวัตถุที่มองเห็นชัดเจน
    error_tag: visible_outline_confused
    explanation: เส้นขอบของวัตถุที่มองเห็นชัดเจนใช้เส้นเต็มหนา (Continuous Visible Line)
  - id: '2'
    text: ขอบหรือรอยต่อของวัตถุที่ถูกบดบังอยู่ด้านใน
    explanation: ถูกต้อง ตามมาตรฐานเขียนแบบวิศวกรรม (ISO/ASME) เส้นประ (Hidden Line) ใช้แสดงขอบ ร่อง หรือรอยต่อของวัตถุที่ถูกเนื้อวัสดุบดบังจากมุมมองนั้น
  - id: '3'
    text: เส้นแสดงแกนสมมาตรของทรงกระบอก
    error_tag: centerline_confused
    explanation: 'เส้นแสดงแกนสมมาตรใช้เส้นศูนย์กลาง (Center Line: เส้นลูกโซ่สั้นสลับยาว)'
  - id: '4'
    text: เส้นแสดงขนาดและระยะพิกัด
    error_tag: dimension_line_confused
    explanation: 'เส้นแสดงขนาดใช้เส้นบอกขนาด (Dimension Line: เส้นเต็มบางมีหัวลูกศร)'
  - id: '5'
    text: เส้นตัดแบ่งชิ้นงานเพื่อแสดงภาพตัด
    error_tag: cutting_plane_line_confused
    explanation: เส้นแสดงแนวตัดใช้เส้นตัด (Cutting Plane Line)
  correct_answer: '2'
  solution: "มาตรฐานการเขียนแบบทางวิศวกรรม (Engineering Drawing Line Standards)\nขั้นตอนที่ 1: ทบทวนชนิดของเส้นตามมาตรฐานสากล\
    \ (ISO 128 / ASME Y14.2)\n  - เส้นเต็มหนา (Continuous Thick Line): แสดงเส้นขอบชิ้นงานที่มองเห็นได้ชัดเจน (Visible Outlines)\n\
    \  - เส้นประ (Hidden / Dashed Line): แสดงขอบ ส่วนขอบ หรือร่องที่ถูกเนื้อวัสดุบดบังอยู่ด้านใน (Hidden Features)\n  - เส้นลูกโซ่บาง\
    \ (Center Line): แสดงแกนสมมาตรของวงกลมหรือทรงกระบอก\n  - เส้นเต็มบางมีหัวลูกศร (Dimension Line): แสดงขนาดและพิกัดความเผื่อ\n\
    \  - เส้นแนวตัด (Cutting Plane Line): แสดงแนวการตัดชิ้นงานเพื่อวาดภาพตัด\nขั้นตอนที่ 2: สรุปหน้าที่ของเส้นประ\n  เส้นประมีหน้าที่หลักในการแสดงรายละเอียดส่วนที่มองไม่เห็นจากมุมมองนั้น\n\
    สรุป เส้นประใช้แสดง 'ขอบหรือรอยต่อของวัตถุที่ถูกบดบังอยู่ด้านใน' (ตัวเลือก 2)"
- number: 21
  question_id: tpat3-70-q21
  topic: tpat3.spatial_relations
  skill: symmetry_reflection
  score: 1.3333333333333333
  answer_type: single_choice
  stem: วัตถุชี้ไปทางทิศตะวันออกเฉียงเหนือ เมื่อสะท้อนผ่านกระจกเงาราบในแนวดิ่งทิศเหนือ-ใต้ ภาพจะชี้ไปทางทิศใด
  options:
  - id: '1'
    text: ทิศตะวันตกเฉียงเหนือ
    explanation: ถูกต้อง กระจกวางแนวเหนือ-ใต้ (แกน Y) การสะท้อนจะกลับทิศทางแนวนอน (ตะวันออกกลายเป็นตะวันตก) แต่ทิศทางแนวดิ่งยังคงเดิม
      (เหนือยังคงเป็นเหนือ) ภาพจึงชี้ไปทิศตะวันตกเฉียงเหนือ
  - id: '2'
    text: ทิศตะวันออกเฉียงใต้
    error_tag: vertical_axis_inversion_fallacy
    explanation: สลับทิศเหนือ-ใต้แทนที่จะสลับทิศตะวันออก-ตก (เกิดจากการสะท้อนผ่านแนวกระจกตะวันออก-ตก)
  - id: '3'
    text: ทิศตะวันตกเฉียงใต้
    error_tag: point_inversion_origin_fallacy
    explanation: กลับทิศทั้งสองแกน (การสมมาตรเทียบกับจุดกำเนิดหรือการหมุน 180°)
  - id: '4'
    text: ทิศเหนือ
    error_tag: axis_projection_loss
    explanation: ตัดทิศทางแนวนอนทิ้งโดยไม่มีเหตุผลทางเรขาคณิต
  - id: '5'
    text: ทิศใต้
    error_tag: orthogonal_inversion_error
    explanation: กลับทิศเป็นทิศใต้คลาดเคลื่อน
  correct_answer: '1'
  solution: "การสะท้อนผ่านกระจกเงาราบและสมมาตรแกน (Planar Reflection Transformation)\nขั้นตอนที่ 1: กำหนดระบบพิกัดและทิศทาง\n\
    \  - กำหนดให้ทิศเหนือเป็นแกน +Y และทิศใต้เป็นแกน -Y\n  - กำหนดให้ทิศตะวันออกเป็นแกน +X และทิศตะวันตกเป็นแกน -X\n  - วัตถุชี้ไปทางทิศตะวันออกเฉียงเหนือ\
    \ คือเวกเตอร์ในทิศ (+X, +Y)\nขั้นตอนที่ 2: วิเคราะห์การสะท้อนผ่านแนวกระจก\n  - กระจกเงาวางในแนวดิ่งทิศเหนือ-ใต้ คือระนาบสมมาตรตามแนวแกน\
    \ Y (x = 0)\n  - การสะท้อนผ่านกระจกตามแกน Y จะทำให้พิกัด X กลับเครื่องหมาย (+X -> -X) ในขณะที่พิกัด Y คงเดิม (+Y -> +Y)\n\
    \  - ดังนั้น ทิศตะวันออก (+X) จะกลายเป็นทิศตะวันตก (-X) ส่วนทิศเหนือ (+Y) ยังคงเป็นทิศเหนือเช่นเดิม\nขั้นตอนที่ 3: สรุปทิศทางของภาพ\n\
    \  ภาพที่สะท้อนจึงชี้ไปทางทิศ (-X, +Y) นั่นคือ 'ทิศตะวันตกเฉียงเหนือ'\nสรุป ภาพจะชี้ไปทางทิศตะวันตกเฉียงเหนือ (ตัวเลือก\
    \ 1)"
- number: 22
  question_id: tpat3-70-q22
  topic: tpat3.spatial_relations
  skill: gear_rotation_direction
  score: 1.3333333333333333
  answer_type: single_choice
  stem: เฟือง 3 ตัวเรียงขนานกันเป็นแถว เฟือง 1 ขบกับเฟือง 2 และเฟือง 2 ขบกับเฟือง 3 ถ้าเฟือง 1 หมุนตามเข็มนาฬิกา เฟือง 3 จะหมุนอย่างไร
  options:
  - id: '1'
    text: หมุนตามเข็มนาฬิกา
    explanation: 'ถูกต้อง การขบกันของเฟืองภายนอกจะกลับทิศทางหมุนเสมอ: เฟือง 1 (ตามเข็ม) → เฟือง 2 (ทวนเข็ม) → เฟือง 3 (ตามเข็มนาฬิกา)'
  - id: '2'
    text: หมุนทวนเข็มนาฬิกา
    error_tag: single_mesh_reversal_only
    explanation: คิดการกลับทิศเพียงครั้งเดียว ซึ่งเป็นทิศทางของเฟือง 2 (ทวนเข็มนาฬิกา)
  - id: '3'
    text: ไม่หมุน
    error_tag: gear_locking_misconception
    explanation: เฟืองเรียงเป็นแถวเปิดไม่เกิดการขัดล็อก (Jamming) เหมือนการเรียงเป็นวงปิดคี่
  - id: '4'
    text: หมุนแกว่งสลับไปมา
    error_tag: non_uniform_motion_fallacy
    explanation: การส่งกำลังของเฟืองขบตรงอย่างต่อเนื่องทำให้หมุนสม่ำเสมอ ไม่แกว่งไปมา
  - id: '5'
    text: หมุนเร็วกว่าเฟือง 1 สองเท่าเสมอ
    error_tag: gear_ratio_unfounded_assumption
    explanation: โจทย์ไม่ได้ระบุจำนวนฟัน จึงไม่สามารถระบุอัตราเร็วรอบได้
  correct_answer: '1'
  solution: "การวิเคราะห์ทิศทางการหมุนของชุดเฟืองตรง (Gear Train Rotation Kinematics)\nขั้นตอนที่ 1: ทบทวนหลักการขบของเฟืองภายนอก\
    \ (External Gear Meshing)\n  เมื่อเฟืองสองตัวขบกันจากภายนอก ทิศทางการหมุนของเฟืองทั้งสองจะตรงกันข้ามเสมอ\nขั้นตอนที่ 2:\
    \ ไล่ลำดับทิศทางการหมุนของเฟืองทีละคู่\n  - เฟือง 1 หมุน 'ตามเข็มนาฬิกา' (Clockwise - CW)\n  - เฟือง 1 ขบกับเฟือง 2 ->\
    \ เฟือง 2 ต้องหมุน 'ทวนเข็มนาฬิกา' (Counter-Clockwise - CCW)\n  - เฟือง 2 ขบกับเฟือง 3 -> เฟือง 3 ต้องหมุน 'ตามเข็มนาฬิกา'\
    \ (Clockwise - CW)\nขั้นตอนที่ 3: สรุปกฎทั่วไป\n  สำหรับชุดเฟืองเรียงเป็นแถวเดี่ยวจำนวน n ตัว ถ้า n เป็นจำนวนคี่ เฟืองตัวสุดท้ายจะหมุนทิศเดียวกับเฟืองตัวแรก\n\
    สรุป เฟือง 3 จะหมุนตามเข็มนาฬิกา (ตัวเลือก 1)"
- number: 23
  question_id: tpat3-70-q23
  topic: tpat3.spatial_relations
  skill: block_counting
  score: 1.3333333333333333
  answer_type: single_choice
  stem: กองลูกบาศก์ขนาดเท่ากันวางซ้อนกัน 3 ชั้น โดยฐานชั้นล่างมี 4x4 ก้อน ชั้นสองมี 3x3 ก้อน และชั้นบนสุดมี 2x2 ก้อน มีลูกบาศก์ทั้งหมดกี่ก้อน
  options:
  - id: '1'
    text: 25 ก้อน
    error_tag: omitted_top_layer
    explanation: ลืมบวกชั้นบนสุด 4 ก้อน (คิดเพียง 16 + 9 = 25 ก้อน)
  - id: '2'
    text: 27 ก้อน
    error_tag: arithmetic_sum_error
    explanation: บวกเลขผิดพลาด 16 + 9 + 4 = 27
  - id: '3'
    text: 29 ก้อน
    explanation: ถูกต้อง ชั้นล่างสุดมี 4 × 4 = 16 ก้อน ชั้นสองมี 3 × 3 = 9 ก้อน ชั้นบนสุดมี 2 × 2 = 4 ก้อน รวมทั้งหมด 16 +
      9 + 4 = 29 ก้อน
  - id: '4'
    text: 31 ก้อน
    error_tag: overcounted_layers
    explanation: บวกเลขเกิน 2 ก้อน (คิดเป็น 31 ก้อน)
  - id: '5'
    text: 33 ก้อน
    error_tag: arithmetic_addition_error
    explanation: คำนวณบวกเลขผิดพลาดเป็น 33 ก้อน
  correct_answer: '3'
  solution: "การนับจำนวนลูกบาศก์ในกองซ้อนสามมิติ (Layered Block Counting)\nขั้นตอนที่ 1: คำนวณจำนวนลูกบาศก์ในแต่ละชั้น (Layer-by-Layer)\n\
    \  - ชั้นล่างสุด (ชั้นที่ 1): ขนาด 4 × 4 ก้อน = 16 ก้อน\n  - ชั้นกลาง (ชั้นที่ 2): ขนาด 3 × 3 ก้อน = 9 ก้อน\n  - ชั้นบนสุด\
    \ (ชั้นที่ 3): ขนาด 2 × 2 ก้อน = 4 ก้อน\nขั้นตอนที่ 2: รวมจำนวนลูกบาศก์ทุกชั้นเข้าด้วยกัน\n  จำนวนรวม = 16 + 9 + 4\n \
    \ 16 + 9 = 25\n  25 + 4 = 29 ก้อน\nสรุป มีลูกบาศก์ทั้งหมด 29 ก้อน (ตัวเลือก 3)"
- number: 24
  question_id: tpat3-70-q24
  topic: tpat3.spatial_relations
  skill: paper_folding_punch
  score: 1.3333333333333333
  answer_type: single_choice
  stem: พับกระดาษสี่เหลี่ยมจัตุรัสครึ่งหนึ่งจากล่างขึ้นบน แล้วพับครึ่งจากซ้ายไปขวา เจาะรูกลมตรงมุมพับกึ่งกลาง เมื่อคลี่ออกจะมีรูกี่รู
  options:
  - id: '1'
    text: 1 รูตรงกลางแผ่น
    explanation: ถูกต้อง มุมที่พับทบสองครั้งนั้นคือจุดกึ่งกลางของแผ่นกระดาษเดิม เมื่อเจาะรูที่จุดร่วมศูนย์กลางนี้ เมื่อคลี่กระดาษออกทุกส่วน
      รอยตัดจะมาประกบรวมเป็น 1 รูกลมสมบูรณ์ตรงกลางแผ่น
  - id: '2'
    text: 2 รู
    error_tag: partial_unfold_miscount
    explanation: คิดว่าคลี่ออกเพียงทบเดียว
  - id: '3'
    text: 4 รู
    error_tag: punched_outer_corner_fallacy
    explanation: เข้าใจผิดว่าเจาะมุมเปิดด้านนอก (ซึ่งจะทำให้เกิด 4 รูตามมุมกระดาษ) ทั้งที่โจทย์ระบุว่าเจาะตรงมุมพับกึ่งกลาง
  - id: '4'
    text: 8 รู
    error_tag: layer_multiplication_fallacy
    explanation: คูณจำนวนทบกระดาษซ้ำซ้อนโดยไม่พิจารณาจุดร่วมศูนย์กลาง
  - id: '5'
    text: ไม่ทะลุ
    error_tag: zero_hole_absurdity
    explanation: การเจาะทะลุกระดาษย่อมเกิดรูเมื่อคลี่ออกอย่างแน่นอน
  correct_answer: '1'
  solution: "การวิเคราะห์การพับกระดาษและเจาะรู (Paper Folding & Hole Punching)\nขั้นตอนที่ 1: ติดตามการพับกระดาษ\n  - เริ่มจากกระดาษสี่เหลี่ยมจัตุรัสแผ่นเต็ม\n\
    \  - พับครึ่งจากล่างขึ้นบน: แนวพับอยู่ที่ขอบล่างของชิ้นงานพับ\n  - พับครึ่งจากซ้ายไปขวา: เกิดมุมพับที่รวบจุดศูนย์กลางดั้งเดิมของกระดาษไว้ด้วยกัน\n\
    ขั้นตอนที่ 2: ระบุตำแหน่งที่เจาะรู\n  - โจทย์ระบุว่า 'เจาะรูกลมตรงมุมพับกึ่งกลาง'\n  - มุมพับกึ่งกลางนี้คือจุดตัดของรอยพับทั้งสอง\
    \ ซึ่งเป็นจุดใจกลางแผ่นกระดาษเดิม (Center Point)\nขั้นตอนที่ 3: วิเคราะห์เมื่อคลี่กระดาษออก\n  - เมื่อเจาะมุมที่เป็นจุดศูนย์กลางแผ่น\
    \ ทั้ง 4 ควอแดรนต์จะถูกตัดตรงมุมยอดที่มาบรรจบกันพอดี\n  - เมื่อคลี่กระดาษออก รอยตัดเสี้ยววงกลมทั้ง 4 ส่วนจะมาประกบเข้าด้วยกันเป็น\
    \ 1 รูกลมสมบูรณ์ตรงกลางแผ่น\nสรุป เมื่อคลี่ออกจะมี 1 รูตรงกลางแผ่น (ตัวเลือก 1)"
- number: 25
  question_id: tpat3-70-q25
  topic: tpat3.spatial_relations
  skill: orthographic_projection
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ภาพฉายมุมมองที่หนึ่ง (First Angle Projection) ภาพด้านข้างซ้าย (Left View) จะถูกวาดไว้ที่ตำแหน่งใดของภาพด้านหน้า (Front
    View)
  options:
  - id: '1'
    text: ด้านซ้าย
    error_tag: third_angle_projection_confused
    explanation: การวาดภาพด้านซ้ายไว้ด้านซ้ายคือมาตรฐานมุมมองที่สาม (Third Angle Projection ที่นิยมในสหรัฐฯ)
  - id: '2'
    text: ด้านขวา
    explanation: ถูกต้อง ในระบบ First Angle Projection วัตถุอยู่ระหว่างผู้สังเกตกับระนาบรับภาพ ดังนั้นการมองจากซ้ายจะฉายภาพไปตกบนระนาบด้านขวาของภาพด้านหน้า
  - id: '3'
    text: ด้านบน
    error_tag: top_bottom_projection_confused
    explanation: ด้านบนคือตำแหน่งของภาพด้านล่าง (Bottom View) ในระบบ First Angle
  - id: '4'
    text: ด้านล่าง
    error_tag: plan_view_position_confused
    explanation: ด้านล่างคือตำแหน่งของภาพด้านบน (Top View) ในระบบ First Angle
  - id: '5'
    text: ซ้อนทับภาพด้านหน้า
    error_tag: projection_plane_overlap_fallacy
    explanation: การเขียนแบบวิศวกรรมแยกภาพฉายคนละระนาบ ไม่ซ้อนทับภาพด้านหน้า
  correct_answer: '2'
  solution: "มาตรฐานระบบภาพฉายมุมมองที่หนึ่ง (First Angle Projection Conventions)\nขั้นตอนที่ 1: ทบทวนหลักการวางตำแหน่งในระบบ\
    \ First Angle Projection (ISO)\n  ในระบบ First Angle วัตถุจะอยู่ระหว่างผู้สังเกต (Observer) และระนาบรับภาพ (Projection\
    \ Plane)\n  ภาพที่มองเห็นจะถูกฉายทะลุวัตถุไปตกบนระนาบด้านหลังของทิศที่มองเสมอ:\n  - มองจากด้านหน้า (Front View): วาดที่ตำแหน่งกลาง\n\
    \  - มองจากด้านบน (Top / Plan View): ฉายลงด้านล่าง จึงวาดอยู่ 'ใต้' ภาพด้านหน้า\n  - มองจากด้านซ้าย (Left View): ฉายไปทางขวา\
    \ จึงวาดอยู่ 'ด้านขวา' ของภาพด้านหน้า\n  - มองจากด้านขวา (Right View): ฉายไปทางซ้าย จึงวาดอยู่ 'ด้านซ้าย' ของภาพด้านหน้า\n\
    ขั้นตอนที่ 2: สรุปตำแหน่งของภาพด้านข้างซ้าย (Left View)\n  ดังนั้น ภาพที่มองจากข้างซ้ายจะถูกนำไปวาดไว้ที่ 'ด้านขวา' ของภาพด้านหน้า\n\
    สรุป ถูกวาดไว้ที่ตำแหน่ง ด้านขวา (ตัวเลือก 2)"
- number: 26
  question_id: tpat3-70-q26
  topic: tpat3.spatial_relations
  skill: surface_development
  score: 1.3333333333333333
  answer_type: single_choice
  stem: การคลี่พื้นผิวข้างของทรงกระบอกกลมตรง (Cylinder) จะได้เป็นรูปเรขาคณิตสองมิติใด
  options:
  - id: '1'
    text: รูปวงกลม
    error_tag: base_circle_confused
    explanation: รูปวงกลมเป็นหน้าตัดฐานของทรงกระบอก ไม่ใช่พื้นผิวข้างที่คลี่ออก
  - id: '2'
    text: รูปสี่เหลี่ยมผืนผ้า
    explanation: ถูกต้อง เมื่อผ่าพื้นผิวข้างตามความสูงแล้วคลี่ออก จะได้รูปสี่เหลี่ยมผืนผ้าที่มีความยาวเท่ากับ 2πr และกว้างเท่ากับความสูง
      h
  - id: '3'
    text: รูปสามเหลี่ยม
    error_tag: unrelated_polygon_confused
    explanation: ทรงกระบอกไม่มีจุดยอดที่สอบเอียงเหมือนกรวย จึงไม่เกิดรูปสามเหลี่ยม
  - id: '4'
    text: รูปสี่เหลี่ยมคางหมู
    error_tag: conical_frustum_confused
    explanation: สี่เหลี่ยมคางหมูหรือส่วนของวงแหวนเกิดจากการคลี่กรวยตัดยอด ไม่ใช่ทรงกระบอกตรง
  - id: '5'
    text: รูปเซกเตอร์ของวงกลม
    error_tag: cone_development_confused
    explanation: รูปเซกเตอร์ของวงกลม (รูปพัด) เกิดจากการคลี่ผิวข้างของทรงกรวยกลมตรง
  correct_answer: '2'
  solution: "การคลี่พื้นผิวข้างของทรงเรขาคณิตสามมิติ (Surface Development of Cylinder)\nขั้นตอนที่ 1: วิเคราะห์พื้นผิวข้างของทรงกระบอกกลมตรง\
    \ (Right Circular Cylinder)\n  ทรงกระบอกกลมตรงมีหน้าตัดหัวท้ายเป็นรูปวงกลมรัศมี r และมีความสูง h\nขั้นตอนที่ 2: พิจารณาการผ่าและคลี่ออกบนระนาบสองมิติ\n\
    \  เมื่อผ่าพื้นผิวข้างตามเส้นแนวดิ่งขนานกับแกนทรงกระบอก แล้วกางออกเป็นแผ่นเรียบสองมิติ:\n  - ด้านความยาวของแผ่นคลี่จะเท่ากับความยาวเส้นรอบวงของวงกลมฐาน\
    \ = 2πr\n  - ด้านความกว้างของแผ่นคลี่จะเท่ากับความสูงของทรงกระบอก = h\n  - มุมระหว่างขอบทั้งสองด้านตั้งฉากกัน 90 องศาตลอดแนว\n\
    ขั้นตอนที่ 3: สรุปรูปร่างทางเรขาคณิตสองมิติ\n  แผ่นคลี่ของพื้นผิวข้างจึงเป็นรูปสี่เหลี่ยมผืนผ้า (Rectangle)\nสรุป ได้เป็นรูปสี่เหลี่ยมผืนผ้า\
    \ (ตัวเลือก 2)"
- number: 27
  question_id: tpat3-70-q27
  topic: tpat3.spatial_relations
  skill: shadow_projection
  score: 1.3333333333333333
  answer_type: single_choice
  stem: วางวัตถุทรงกลมตันใต้แหล่งกำเนิดแสงแบบจุด (Point Source) เงาที่ตกทอดลงบนระนาบพื้นราบจะเป็นรูปทรงใด
  options:
  - id: '1'
    text: รูปวงกลมหรือวงรี
    explanation: ถูกต้อง ลำแสงจากจุดกำเนิดที่สัมผัสผิวทรงกลมจะรวมเป็นรูปกรวยแสง เมื่อกรวยแสงตัดกับระนาบพื้นราบ เงาที่ได้จะเป็นภาคตัดกรวยแบบปิด
      คือ รูปวงกลม (เมื่อแสงอยู่ตรงแนวดิ่ง) หรือรูปวงรี (เมื่อแสงทำมุมเอียง)
  - id: '2'
    text: รูปสี่เหลี่ยม
    error_tag: cube_shadow_confused
    explanation: ทรงกลมมีผิวโค้งเรียบไม่มีขอบเหลี่ยมมุมที่จะสร้างเงารูปสี่เหลี่ยม
  - id: '3'
    text: รูปจุดหนึ่งจุด
    error_tag: zero_dimensional_shadow_absurdity
    explanation: เงาตกทอดของวัตถุสามมิติต้องครอบคลุมพื้นที่สองมิติ ไม่ใช่จุดมิติเดียว
  - id: '4'
    text: รูปพาราโบลา
    error_tag: unbounded_conic_fallacy
    explanation: พาราโบลาเป็นเส้นโค้งเปิด จะไม่เกิดเป็นเงาปิดของทรงกลมใต้แหล่งกำเนิดแสงบนพื้นราบ
  - id: '5'
    text: รูปวงแหวน
    error_tag: torus_shadow_confused
    explanation: ทรงกลมตันไม่มีรูตรงกลาง เงาที่ได้จึงทึบเต็มรูปไม่เป็นวงแหวน
  correct_answer: '1'
  solution: "การวิเคราะห์เงาตกทอดจากแหล่งกำเนิดแสงแบบจุด (Shadow Projection Geometry)\nขั้นตอนที่ 1: วิเคราะห์ลำแสงที่สัมผัสวัตถุทรงกลมตัน\n\
    \  ลำแสงที่แผ่ออกจากแหล่งกำเนิดแสงแบบจุด (Point Source) และพุ่งไปสัมผัสผิวทรงกลมตันโดยรอบ จะประกอบกันเป็น 'กรวยแสงสัมผัส'\
    \ (Tangential Light Cone) โดยมีแหล่งกำเนิดแสงเป็นจุดยอดกรวย\nขั้นตอนที่ 2: พิจารณาการตัดกันของกรวยแสงกับระนาบพื้นราบ\n\
    \  เงาตกทอดบนพื้นราบคือภาคตัดกรวย (Conic Section) ที่เกิดจากระนาบพื้นราบตัดกับกรวยแสง:\n  - หากแหล่งกำเนิดแสงอยู่ตรงแนวดิ่งเหนือศูนย์กลางทรงกลม\
    \ ระนาบพื้นจะตั้งฉากกับแกนกรวยแสง เงาที่ได้จะเป็น 'รูปวงกลม'\n  - หากแหล่งกำเนิดแสงอยู่เยื้องมุมเอียง ระนาบพื้นจะตัดกรวยแสงในแนวเฉียงโดยไม่ตัดขนานเส้นกำเนิดกรวย\
    \ เงาที่ได้จะเป็น 'รูปวงรี'\nขั้นตอนที่ 3: สรุปผลลัพธ์\n  เงาที่ตกทอดลงบนระนาบพื้นราบจึงมีลักษณะเป็นรูปวงกลมหรือรูปวงรีเสมอ\n\
    สรุป รูปทรงของเงาคือ รูปวงกลมหรือวงรี (ตัวเลือก 1)"
- number: 28
  question_id: tpat3-70-q28
  topic: tpat3.spatial_relations
  skill: puzzle_assembly
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ชิ้นส่วนลูกบาศก์ 3 มิติที่มี 5 ก้อนทรงลูกบาศก์เชื่อมติดกัน เรียกว่ารูปทรงใดในเรขาคณิตสามมิติ
  options:
  - id: '1'
    text: Pentomino
    error_tag: two_dimensional_polyomino_confused
    explanation: Pentomino คือการเรียงต่อกันของรูปสี่เหลี่ยมจัตุรัส 5 รูปในระนาบสองมิติ ไม่ใช่รูปทรงสามมิติ
  - id: '2'
    text: Polycube (Pentacube)
    explanation: ถูกต้อง รูปทรงเรขาคณิตสามมิติที่เกิดจากการต่อกันของลูกบาศก์ 5 ชิ้น เรียกว่า Pentacube ซึ่งจัดอยู่ในตระกูล
      Polycube (พอลีคิวบ์)
  - id: '3'
    text: Tetromino
    error_tag: four_unit_polyomino_confused
    explanation: Tetromino คือรูปสองมิติที่เกิดจากสี่เหลี่ยม 4 ช่อง (เช่น ตัวต่อ Tetris)
  - id: '4'
    text: Hexomino
    error_tag: six_unit_polyomino_confused
    explanation: Hexomino ประกอบด้วย 6 รูปสี่เหลี่ยมในสองมิติ
  - id: '5'
    text: Heptacube
    error_tag: seven_unit_polycube_confused
    explanation: Heptacube คือการต่อกันของ 7 ลูกบาศก์
  correct_answer: '2'
  solution: "คำศัพท์และนิยามเรขาคณิตสามมิติของตัวต่อลูกบาศก์ (Polycube Nomenclature)\nขั้นตอนที่ 1: ทบทวนคำศัพท์ทางคณิตศาสตร์สันทนาการและเรขาคณิตสามมิติ\n\
    \  - Polyomino: รูปร่างสองมิติที่เกิดจากการเชื่อมต่อกันของสี่เหลี่ยมจัตุรัสตามขอบ (เช่น Monomino, Domino, Tromino, Tetromino,\
    \ Pentomino)\n  - Polycube: รูปทรงสามมิติที่เกิดจากการเชื่อมต่อกันของลูกบาศก์ขนาดเท่ากันตามหน้าสัมผัส\nขั้นตอนที่ 2: ระบุชื่อเรียกตามจำนวนชิ้นส่วนลูกบาศก์\n\
    \  - 1 ลูกบาศก์: Monocube\n  - 2 ลูกบาศก์: Dicube\n  - 3 ลูกบาศก์: Tricube\n  - 4 ลูกบาศก์: Tetracube (เช่น ชิ้นส่วนของ\
    \ Soma Cube บางชิ้น)\n  - 5 ลูกบาศก์: Pentacube (จัดอยู่ในตระกูล Polycube)\nขั้นตอนที่ 3: สรุปคำตอบ\n  ชิ้นส่วนสามมิติที่ประกอบจาก\
    \ 5 ก้อนลูกบาศก์เรียกว่า Polycube หรือ Pentacube\nสรุป คำตอบคือ Polycube (Pentacube) (ตัวเลือก 2)"
- number: 29
  question_id: tpat3-70-q29
  topic: tpat3.spatial_relations
  skill: sectional_view_hatching
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ในแบบวิศวกรรม เส้นลายตัด (Section Hatching Lines) มักเขียนทำมุมกี่องศากับแนวระดับ
  options:
  - id: '1'
    text: 30 องศา
    error_tag: isometric_axis_angle_confused
    explanation: 30° เป็นมุมเอียงของแกนภาพไอโซเมตริกเทียบกับแนวระดับ ไม่ใช่มุมมาตรฐานของลายตัด
  - id: '2'
    text: 45 องศา
    explanation: ถูกต้อง มาตรฐานการเขียนแบบสากล (ISO 128) กำหนดให้เส้นแสดงแนวเนื้อวัสดุหรือลายตัด (Hatching) เอียงทำมุม 45°
      กับแนวระดับเพื่อความชัดเจนและไม่สับสนกับเส้นขอบชิ้นงาน
  - id: '3'
    text: 60 องศา
    error_tag: alternative_angle_misidentified
    explanation: 60° ใช้เป็นมุมสำรองเฉพาะกรณีที่ชิ้นงานสองชิ้นประกบติดกันและตัดผ่านพร้อมกัน แต่มุมหลักมาตรฐานคือ 45°
  - id: '4'
    text: 75 องศา
    error_tag: non_standard_hatching_angle
    explanation: 75° ไม่ใช่ค่ามุมมาตรฐานในการเขียนแบบทางเทคนิค
  - id: '5'
    text: 90 องศา
    error_tag: vertical_line_confused_with_edge
    explanation: 90° (แนวดิ่ง) จะสับสนกับเส้นขอบชิ้นงานจริง
  correct_answer: '2'
  solution: "มาตรฐานการเขียนแบบวิศวกรรมสำหรับเส้นลายตัด (Section Hatching Lines Standard)\nขั้นตอนที่ 1: วัตถุประสงค์ของเส้นลายตัด\
    \ (Hatching / Section Lines)\n  เส้นลายตัดใช้เพื่อแสดงพื้นที่เนื้อวัสดุที่ถูกระนาบตัดผ่าน เพื่อให้เห็นรายละเอียดโครงสร้างภายในของชิ้นงาน\n\
    ขั้นตอนที่ 2: มาตรฐานการกำหนดมุมเอียงตาม ISO 128 และ ASME Y14.2M\n  - เส้นลายตัดเขียนด้วยเส้นเต็มบาง (Continuous Thin\
    \ Line)\n  - ค่ามุมมาตรฐานกำหนดให้เขียนเอียงทำมุม 45 องศากับแนวระดับหรือแกนหลักของชิ้นงาน\n  - เหตุผลที่เลือกมุม 45° เพราะเป็นมุมเฉียงที่สังเกตเห็นได้ชัดเจน\
    \ และไม่ขนานหรือสับสนกับเส้นขอบชิ้นงานที่เป็นแนวนอน (0°) หรือแนวดิ่ง (90°)\nขั้นตอนที่ 3: สรุปคำตอบ\n  เส้นลายตัดตามมาตรฐานสากลเขียนทำมุม\
    \ 45 องศากับแนวระดับ\nสรุป คำตอบที่ถูกต้องคือ 45 องศา (ตัวเลือก 2)"
- number: 30
  question_id: tpat3-70-q30
  topic: tpat3.spatial_relations
  skill: topological_connectedness
  score: 1.3333333333333333
  answer_type: single_choice
  stem: รูปทรงโดนัท (Torus) มีจำนวนรูทะลุ (Genus) เท่ากับกี่รู
  options:
  - id: '1'
    text: 0 รู
    error_tag: sphere_topology_confused
    explanation: Genus = 0 เป็นลักษณะของพื้นผิวทรงกลม (Sphere) ซึ่งไม่มีรูทะลุ
  - id: '2'
    text: 1 รู
    explanation: ถูกต้อง ในทางทอพอโลยี (Topology) รูปทรงโดนัทหรือทอรัส (Torus) มีรูทะลุผ่านพื้นผิวปิด 1 รู จึงมีจีนัส Genus
      g = 1
  - id: '3'
    text: 2 รู
    error_tag: double_torus_confused
    explanation: 2 รูคือ Double Torus (พื้นผิวคล้ายขนมเพรทเซลสองรู)
  - id: '4'
    text: 3 รู
    error_tag: triple_torus_confused
    explanation: 3 รูคือ Triple Torus
  - id: '5'
    text: ไม่จำกัด
    error_tag: infinite_genus_absurdity
    explanation: รูปทรงโดนัทเดี่ยวมีรูทะลุจำกัดแน่นอนคือ 1 รู
  correct_answer: '2'
  solution: "การวิเคราะห์จำนวนรูทะลุทางทอพอโลยี (Topological Genus of Surfaces)\nขั้นตอนที่ 1: นิยามของจีนัส (Genus, g) ในทางทอพอโลยี\n\
    \  จีนัส (Genus) ของพื้นผิวสองมิติปิดที่วางตัวได้ (Orientable Closed Surface) หมายถึง จำนวนรูทะลุ (Number of Holes / Handles)\
    \ ผ่านรูปทรงนั้น\nขั้นตอนที่ 2: เปรียบเทียบรูปทรงเรขาคณิตพื้นฐาน\n  - ทรงกลม (Sphere): ไม่มีรูทะลุเลย -> Genus g = 0\n\
    \  - ทรงโดนัท (Torus): มีรูทะลุผ่านตรงกลาง 1 รูพอดี -> Genus g = 1\n  - เพรทเซลสองรู (Double Torus): มีรูทะลุ 2 รู ->\
    \ Genus g = 2\nขั้นตอนที่ 3: สรุปคำตอบ\n  รูปทรงโดนัท (Torus) มีจำนวนรูทะลุ Genus เท่ากับ 1 รู\nสรุป Torus มีจำนวนรูทะลุ\
    \ (Genus) เท่ากับ 1 รู (ตัวเลือก 2)"
- number: 31
  question_id: tpat3-70-q31
  topic: tpat3.engineering_mechanics
  skill: lever_mechanical_advantage
  score: 1.3333333333333333
  answer_type: single_choice
  stem: คานอันหนึ่งยาว 2.0 m วางจุดหมุนห่างจากวัตถุหนัก 300 N เป็นระยะ 0.5 m จะต้องออกแรงกดที่ปลายอีกข้างอย่างน้อยกี่นิวตันเพื่อยกวัตถุ
  options:
  - id: '1'
    text: 75 N
