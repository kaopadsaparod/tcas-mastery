    text: สมชายไม่ใช่คน
  - id: '3'
    text: สมชายไม่ใช่วิศวกร
  - id: '4'
    text: วิศวกรบางคนไม่ใช่สมชาย
  - id: '5'
    text: สรุปไม่ได้แน่ชัด
  correct_answer: '3'
  solution: 'ตามหลักตรรกศาสตร์ Modus Tollens: ถ้า p แล้ว q, นิเสธ q จึงสรุปได้ว่า
    นิเสธ p (สมชายไม่ใช่วิศวกร)'
- number: 62
  question_id: tpat3-70-q62
  topic: tpat3.logic_reasoning
  skill: conditional_logic
  score: 1.6
  answer_type: single_choice
  stem: ประพจน์ 'ถ้าฝนตกแล้วถนนจะเปียก' จะสมมูล (Equivalence) กับข้อความใด
  options:
  - id: '1'
    text: ถ้าถนนเปียกแล้วฝนตก
  - id: '2'
    text: ถ้าถนนไม่เปียกแล้วฝนไม่ตก
  - id: '3'
    text: ถ้าฝนไม่ตกแล้วถนนไม่เปียก
  - id: '4'
    text: ฝนตกและถนนเปียก
  - id: '5'
    text: ถนนเปียกหรือฝนตก
  correct_answer: '2'
  solution: 'p -> q สมมูลกับ ~q -> ~p (Contrapositive: ถ้าถนนไม่เปียกแล้วฝนไม่ตก)'
- number: 63
  question_id: tpat3-70-q63
  topic: tpat3.logic_reasoning
  skill: cause_effect_analysis
  score: 1.6
  answer_type: single_choice
  stem: โรงงานพบว่าสินค้ามีตำหนิเพิ่มขึ้นในกะดึก การวิเคราะห์หาสาเหตุรากเหง้า (Root
    Cause) ควรเริ่มจากเครื่องมือใด
  options:
  - id: '1'
    text: แผนภูมิก้างปลา (Ishikawa Diagram) และ 5-Whys
  - id: '2'
    text: การไล่พนักงานกะดึกออกทันที
  - id: '3'
    text: การเพิ่มราคาขายสินค้า
  - id: '4'
    text: การยกเลิกการผลิตกะดึกถาวร
  - id: '5'
    text: การลดเกณฑ์ตรวจสอบคุณภาพลง
  correct_answer: '1'
  solution: แผนภูมิก้างปลา (Fishbone/Ishikawa) และเทคนิค 5-Whys เป็นเครื่องมือมาตรฐานสากลในการค้นหาสาเหตุแท้จริง
- number: 64
  question_id: tpat3-70-q64
  topic: tpat3.logic_reasoning
  skill: engineering_ethics
  score: 1.6
  answer_type: single_choice
  stem: หากวิศวกรตรวจพบว่าโครงสร้างสะพานที่กำลังก่อสร้างไม่เป็นไปตามมาตรฐานความปลอดภัย
    และผู้รับเหมาเสนอเงินเพื่อขอให้เซ็นอนุมัติผ่าน วิศวกรควรปฏิบัติตามจรรยาบรรณวิชาชีพอย่างไร
  options:
  - id: '1'
    text: รับเงินและเซ็นอนุมัติเพื่อรักษาความสัมพันธ์
  - id: '2'
    text: ปฏิเสธการรับเงิน และรายงานข้อบกพร่องตามขั้นตอนทางวิชาชีพทันที
  - id: '3'
    text: เพิกเฉยและลาออกจากงานเงียบๆ
  - id: '4'
    text: เซ็นอนุมัติแล้วค่อยมาซ่อมภายหลังเปิดใช้งาน
  - id: '5'
    text: ขอเพิ่มจำนวนเงินก่อนพิจารณา
  correct_answer: '2'
  solution: จรรยาบรรณวิศวกรยึดถือความปลอดภัยและชีวิตของสาธารณชนเป็นลำดับสูงสุด ต้องปฏิเสธสินบนและรายงานความจริง
- number: 65
  question_id: tpat3-70-q65
  topic: tpat3.logic_reasoning
  skill: pattern_matrices
  score: 1.6
  answer_type: single_choice
  stem: 'พิจารณาความสัมพันธ์: รถยนต์ : น้ำมันเชื้อเพลิง :: เซลล์สิ่งมีชีวิต : ?'
  options:
  - id: '1'
    text: ดีเอ็นเอ
  - id: '2'
    text: สารอาหารกลูโคสและ ATP
  - id: '3'
    text: ออกซิเจนบริสุทธิ์ 100%
  - id: '4'
    text: น้ำเกลือ
  - id: '5'
    text: แสงแดด
  correct_answer: '2'
  solution: 'ความสัมพันธ์เชิงอุปมาอุปไมย (Analogy): รถยนต์ต้องการน้ำมันเป็นแหล่งพลังงาน
    เช่นเดียวกับเซลล์ต้องการกลูโคส/ATP เป็นพลังงานขับเคลื่อน'
- number: 66
  question_id: tpat3-70-q66
  topic: tpat3.logic_reasoning
  skill: falsifiability_popper
  score: 1.6
  answer_type: single_choice
  stem: ตามหลักปรัชญาวิทยาศาสตร์ สมมติฐานที่ดีทางวิทยาศาสตร์จะต้องมีคุณสมบัติสำคัญในข้อใด
  options:
  - id: '1'
    text: ต้องเป็นความจริงสัมบูรณ์ที่ไม่สามารถหักล้างได้
  - id: '2'
    text: ต้องสามารถทดสอบและมีโอกาสถูกพิสูจน์ว่าเป็นเท็จได้ (Falsifiability)
  - id: '3'
    text: ต้องได้รับการยอมรับจากคนส่วนใหญ่โดยไม่ต้องทดลอง
  - id: '4'
    text: ต้องไม่มีสมการคณิตศาสตร์เกี่ยวข้อง
  - id: '5'
    text: ต้องทำนายอนาคตได้ถูกต้อง 100% เสมอ
  correct_answer: '2'
  solution: ตามหลักของ Karl Popper ทฤษฎีวิทยาศาสตร์ต้องเปิดให้ทดสอบและหักล้างได้ (Falsifiable)
- number: 67
  question_id: tpat3-70-q67
  topic: tpat3.logic_reasoning
  skill: critical_path_method
  score: 1.6
  answer_type: single_choice
  stem: ในแผนงานโครงการวิศวกรรม เส้นทางวิกฤต (Critical Path) คือเส้นทางที่ส่งผลต่อโครงการอย่างไรมากที่สุด
  options:
  - id: '1'
    text: เส้นทางที่มีค่าใช้จ่ายต่ำที่สุด
  - id: '2'
    text: เส้นทางของกิจกรรมที่ใช้เวลานานที่สุด ซึ่งหากล่าช้าจะทำให้ทั้งโครงการล่าช้าทันที
  - id: '3'
    text: เส้นทางที่มีพนักงานมากที่สุด
  - id: '4'
    text: เส้นทางที่ไม่จำเป็นต้องทำก็ได้
  - id: '5'
    text: เส้นทางที่เสร็จสิ้นเร็วที่สุด
  correct_answer: '2'
  solution: Critical Path คือลำดับกิจกรรมที่กำหนดระยะเวลาสั้นที่สุดที่โครงการจะแล้วเสร็จได้
    หากกิจกรรมบนสายวิกฤตล่าช้า โครงการจะล่าช้าตาม
- number: 68
  question_id: tpat3-70-q68
  topic: tpat3.logic_reasoning
  skill: fairness_algorithm
  score: 1.6
  answer_type: single_choice
  stem: การพัฒนาปัญญาประดิษฐ์ (AI) ในระบบคัดเลือกคนเข้าศึกษาต่อ สิ่งสำคัญที่ต้องระมัดระวังเพื่อความยุติธรรมคือข้อใด
  options:
  - id: '1'
    text: การให้อัลกอริทึมทำงานช้าลง
  - id: '2'
    text: การป้องกันอคติในชุดข้อมูลฝึกสอน (Data Bias) ที่อาจเลือกปฏิบัติต่อกลุ่มประชากร
  - id: '3'
    text: การห้ามไม่ให้ใช้คอมพิวเตอร์
  - id: '4'
    text: การสุ่มผลลัพธ์แบบเดาสุ่ม 100%
  - id: '5'
    text: การไม่เปิดเผยผลการสอบแก่นักเรียน
  correct_answer: '2'
  solution: ปัญหา Algorithmic Bias เกิดจากข้อมูลในอดีตที่มีอคติ จึงต้องมีกระบวนการตรวจสอบ
    Fairness ใน AI
- number: 69
  question_id: tpat3-70-q69
  topic: tpat3.logic_reasoning
  skill: tcas_regulation
  score: 1.6
  answer_type: single_choice
  stem: ข้อสอบ TPAT3 จัดสอบโดย ทปอ. เป็นข้อสอบวัดความถนัดที่เน้นวัดสิ่งใดเป็นสำคัญ
  options:
  - id: '1'
    text: การท่องจำเนื้อหาตามตำราเรียนทั้งหมด 100%
  - id: '2'
    text: ศักยภาพ ความถนัด และกระบวนการคิดเชิงวิทยาศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์
  - id: '3'
    text: การวาดภาพจิตรกรรมสีน้ำ
  - id: '4'
    text: ความรู้ด้านประวัติศาสตร์โบราณคดี
  - id: '5'
    text: ทักษะการเล่นกีฬา
  correct_answer: '2'
  solution: TPAT3 เน้นวัดสมรรถนะการคิดเชิงตรรกะ ตัวเลข มิติสัมพันธ์ และฟิสิกส์ประยุกต์
    ไม่ใช่ข้อสอบท่องจำล้วน
- number: 70
  question_id: tpat3-70-q70
  topic: tpat3.logic_reasoning
  skill: cybersecurity_phishing
  score: 1.6
  answer_type: single_choice
  stem: หากได้รับอีเมลแจ้งว่า 'บัญชีระบบสอบของคุณกำลังจะถูกลบ กรุณาคลิกลิงก์และกรอกรหัสผ่านทันที'
    วิธีการปฏิบัติตนที่ถูกต้องและปลอดภัยที่สุดคือข้อใด
  options:
  - id: '1'
    text: รีบคลิกลิงก์และกรอกรหัสผ่านทันทีเพื่อไม่ให้โดนลบ
  - id: '2'
    text: ส่งรหัสผ่านให้เพื่อนช่วยกรอก
  - id: '3'
    text: ตรวจสอบ URL ผู้ส่ง และเข้าสู่เว็บไซต์หลักของระบบโดยตรงโดยไม่คลิกลิงก์ในอีเมลแปลกปลอม
      (ป้องกัน Phishing)
  - id: '4'
    text: ตอบกลับอีเมลพร้อมแนบภาพบัตรประชาชน
  - id: '5'
    text: โอนเงินตามที่อีเมลร้องขอ
  correct_answer: '3'
  solution: อีเมลดังกล่าวมีลักษณะของ Phishing Attack ต้องไม่คลิกลิงก์ที่ไม่น่าไว้วางใจ
    และตรวจสอบผ่านช่องทางทางการโดยตรง
