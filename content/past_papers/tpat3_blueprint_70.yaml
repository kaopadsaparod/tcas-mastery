  - id: '4'
    text: 200 N
    error_tag: arithmetic_moment_error
    explanation: คำนวณอัตราส่วนโมเมนต์ผิดพลาดเป็น 200 N
  - id: '5'
    text: 300 N
    error_tag: zero_mechanical_advantage_assumption
    explanation: คิดว่าต้องออกแรงเท่ากับน้ำหนักวัตถุ 300 N โดยไม่ได้ประโยชน์จากการผ่อนแรงของคาน
  correct_answer: '2'
  solution: "การคำนวณสมดุลของคานและโมเมนต์ของแรง (Moment of Force & Lever Equilibrium)\nขั้นตอนที่ 1: กำหนดระยะและแรงในระบบคาน\n\
    \  - ความยาวคานทั้งหมด L = 2.0 m\n  - วัตถุหนัก W = 300 N วางห่างจากจุดหมุนระยะ d₁ = 0.5 m\n  - ปลายอีกข้างที่เป็นจุดออกแรงกด\
    \ F อยู่ห่างจากจุดหมุน d₂ = L - d₁ = 2.0 - 0.5 = 1.5 m\nขั้นตอนที่ 2: ตั้งสมการสมดุลการหมุนรอบจุดหมุน (ΣM = 0)\n  โมเมนต์ทวนเข็มนาฬิกา\
    \ = โมเมนต์ตามเข็มนาฬิกา\n  W × d₁ = F × d₂\n  300 N × 0.5 m = F × 1.5 m\n  150 N·m = 1.5 F\nขั้นตอนที่ 3: คำนวณหาแรงกด\
    \ F\n  F = 150 / 1.5 = 100 N\nสรุป ต้องออกแรงกดที่ปลายอีกข้างอย่างน้อย 100 นิวตัน (ตัวเลือก 2)"
