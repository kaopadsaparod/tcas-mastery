  correct_answer: '2'
  solution: "การคำนวณแรงบนพื้นเอียงลื่น (Equilibrium on Frictionless Inclined Plane)\nขั้นตอนที่ 1: วิเคราะห์แรงที่กระทำต่อวัตถุมวล\
    \ m = 20 kg\n  - แรงโน้มถ่วงดิ่งลงสู่ศูนย์กลางโลก W = mg = 20 kg × 10 m/s² = 200 N\n  - แตกแรง W เข้าสู่แกนพื้นเอียง:\n\
    \    * แนวขนานพื้นเอียงดิ่งลง = mg sin(θ) = 200 sin(30°)\n    * แนวตั้งฉากพื้นเอียงกดลง = mg cos(θ) = 200 cos(30°)\nขั้นตอนที่\
    \ 2: พิจารณาเงื่อนไขการเคลื่อนที่ด้วยความเร็วคงที่ (Equilibrium, a = 0)\n  เมื่อพื้นเอียงลื่น (ไม่มีแรงเสียดทาน) และเคลื่อนที่ด้วยความเร็วคงที่\
    \ แรงลัพธ์ขนานพื้นเอียงต้องเป็นศูนย์ (ΣF = 0):\n  F = mg sin(30°)\nขั้นตอนที่ 3: แทนค่าตัวเลข (sin(30°) = 0.5)\n  F =\
    \ 200 × 0.5 = 100 N\nสรุป ต้องออกแรงขนานกับพื้นเอียง 100 นิวตัน (ตัวเลือก 2)"
- number: 34
  question_id: tpat3-70-q34
  topic: tpat3.engineering_mechanics
  skill: hydraulic_press
  score: 1.3333333333333333
  answer_type: single_choice
  stem: แม่แรงไฮดรอลิก ลูกสูบเล็กมีพื้นที่หน้าตัด 5 cm² ลูกสูบใหญ่มีพื้นที่ 100 cm² ถ้าออกแรงกดลูกสูบเล็ก 50 N ลูกสูบใหญ่จะยกน้ำหนักได้สูงสุดกี่นิวตัน
  options:
  - id: '1'
    text: 500 N
    error_tag: ratio_scaling_error
    explanation: คิดอัตราส่วนพื้นที่เป็น 10 เท่าแทนที่จะเป็น 20 เท่า (50 × 10 = 500 N)
  - id: '2'
    text: 1000 N
    explanation: ถูกต้อง ตามกฎของปัสกาล ความดันในของไหลเท่ากัน F₁/A₁ = F₂/A₂ ดังนั้น F₂ = F₁ × (A₂/A₁) = 50 × (100/5) = 50
      × 20 = 1,000 N
  - id: '3'
    text: 1500 N
    error_tag: arithmetic_hydraulic_error
    explanation: คำนวณผลคูณผิดพลาดเป็น 1,500 N
  - id: '4'
    text: 2000 N
    error_tag: doubled_pressure_ratio
    explanation: คิดอัตราทดเป็น 40 เท่า (50 × 40 = 2,000 N)
  - id: '5'
    text: 2500 N
    error_tag: squared_area_ratio_misapplication
    explanation: นำอัตราส่วนพื้นที่มายกกำลังสองซ้ำซ้อน (50 × 20² / ...)
  correct_answer: '2'
  solution: "การคำนวณหลักการของปัสกาลในแม่แรงไฮดรอลิก (Pascal's Principle & Hydraulic Press)\nขั้นตอนที่ 1: ทบทวนหลักการของปัสกาล\
    \ (Pascal's Law)\n  ความดันที่กระทำต่อของเหลวปิดจะถูกถ่ายทอดไปยังทุกส่วนของของเหลวและผนังภาชนะอย่างเท่าเทียมกัน\n  P₁\
    \ = P₂  =>  F₁ / A₁ = F₂ / A₂\nขั้นตอนที่ 2: รวบรวมตัวแปรและแทนค่า\n  - ลูกสูบเล็ก: พื้นที่ A₁ = 5 cm², แรงกด F₁ = 50\
    \ N\n  - ลูกสูบใหญ่: พื้นที่ A₂ = 100 cm², แรงยกสูงสุด F₂ = ?\n  (หน่วยพื้นที่ทั้งสองเป็น cm² จึงสามารถใช้อัตราส่วนได้โดยตรง)\n\
    ขั้นตอนที่ 3: คำนวณหาแรง F₂\n  F₂ = F₁ × (A₂ / A₁) = 50 N × (100 cm² / 5 cm²)\n  F₂ = 50 × 20 = 1,000 N\nสรุป ลูกสูบใหญ่จะยกน้ำหนักได้สูงสุด\
    \ 1,000 นิวตัน (ตัวเลือก 2)"
