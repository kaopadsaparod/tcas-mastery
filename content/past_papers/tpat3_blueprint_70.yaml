    \ (Single Movable Pulley)\n  - รอกเบาไม่มีแรงเสียดทาน มีเชือก 2 เส้นขนานกันช่วยพยุงน้ำหนักวัตถุ W = 800 N\n  - เชือกเส้นหนึ่งยึดกับเพดาน\
