  answer_type: single_choice
  stem: ดันกล่องมวล 20 kg ขึ้นพื้นเอียงลื่นทำมุม 30° กับแนวระดับด้วยความเร็วคงที่ ต้องออกแรงขนานกับพื้นเอียงกี่นิวตัน (กำหนด
    g = 10 m/s²)
  options:
