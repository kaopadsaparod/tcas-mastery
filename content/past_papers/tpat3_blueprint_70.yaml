    explanation: คิดแขนของแรงเป็น 2.0 m โดยไม่ลบระยะจุดหมุน (150 / 2.0 = 75 N)
  - id: '2'
    text: 100 N
    explanation: 'ถูกต้อง แขนของแรงพยายามคือ 2.0 - 0.5 = 1.5 m สมดุลโมเมนต์รอบจุดหมุน: 300 N × 0.5 m = F × 1.5 m จะได้ 150
      = 1.5F ดังนั้น F = 100 N'
  - id: '3'
