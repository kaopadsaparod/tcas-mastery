    explanation: 'นำพลังงานจลน์ต้นและปลายมาบวกกันแทนการหาผลต่าง: -(36 + 100) = -136 J'
  - id: '5'
    text: -164 J
    error_tag: arithmetic_kinetic_energy_error
    explanation: คำนวณผลต่างพลังงานจลน์คลาดเคลื่อนเป็น -164 J
  correct_answer: '2'
  solution: "การคำนวณงานจากทฤษฎีบทงาน-พลังงานจลน์ (Work-Energy Theorem)\nขั้นตอนที่ 1: ทบทวนทฤษฎีบทงาน-พลังงานจลน์ (Work-Kinetic\
    \ Energy Theorem)\n  งานรวมของแรงลัพธ์ภายนอก (W_net) เท่ากับการเปลี่ยนแปลงพลังงานจลน์ของวัตถุ (ΔE_k):\n  W = E_k,final\
    \ - E_k,initial = (1/2)m(v² - u²)\nขั้นตอนที่ 2: รวบรวมข้อมูลตัวแปร\n  - มวล m = 2 kg\n  - ความเร็วต้น u = 10 m/s  ->\
    \  u² = 100 (m/s)²\n  - ความเร็วปลาย v = 6 m/s   ->  v² = 36 (m/s)²\nขั้นตอนที่ 3: แทนค่าและคำนวณงานของแรงต้าน\n  W =\
    \ (1/2) × 2 kg × (6² - 10²)\n  W = 1 × (36 - 100) = -64 J\n  (เครื่องหมายลบแสดงว่างานของแรงต้านมีทิศทางตรงข้ามกับการเคลื่อนที่\
    \ ทำให้พลังงานจลน์ลดลง)\nสรุป งานของแรงต้านมีขนาด -64 จูล (ตัวเลือก 2)"
- number: 37
  question_id: tpat3-70-q37
  topic: tpat3.engineering_mechanics
  skill: power_pump
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ปั๊มน้ำสูบน้ำมวล 600 kg ขึ้นที่สูง 10 m ภายในเวลา 1 นาที กำลังที่มีประโยชน์ของปั๊มน้ำเป็นกี่วัตต์ (g = 10 m/s²)
  options:
  - id: '1'
    text: 100 W
    error_tag: power_of_ten_division_error
    explanation: เลื่อนจุดทศนิยมผิดพลาด ได้ 100 W
  - id: '2'
    text: 500 W
    error_tag: halved_work_output
    explanation: หารสองงานโดยไม่มีเหตุผล ได้ 500 W
  - id: '3'
    text: 1000 W
    explanation: ถูกต้อง งานที่ทำได้ = mgh = 600 × 10 × 10 = 60,000 J เวลา t = 1 นาที = 60 วินาที กำลัง P = W / t = 60,000
      / 60 = 1,000 W
  - id: '4'
    text: 6000 W
    error_tag: divided_by_10s_instead_of_60s
    explanation: ใช้เวลา 10 วินาทีแทน 60 วินาที ทำให้ได้ 6,000 W
  - id: '5'
    text: 60000 W
    error_tag: omitted_time_division_minute
    explanation: หารด้วยเวลา 1 (นาที) โดยไม่ได้แปลงเป็นวินาที ตอบเป็นงานแทนกำลัง (60,000 W)
  correct_answer: '3'
  solution: "การคำนวณกำลังงานกลของปั๊มน้ำ (Mechanical Power Calculation)\nขั้นตอนที่ 1: คำนวณงานที่ใช้ในการยกน้ำ (Work, W)\n\
    \  มวลของน้ำ m = 600 kg, ความสูง h = 10 m, g = 10 m/s²\n  งานที่ต้องการ = mgh = 600 kg × 10 m/s² × 10 m = 60,000 J\nขั้นตอนที่\
    \ 2: แปลงเวลาให้อยู่ในหน่วยวินาที (Time, t)\n  เวลา t = 1 นาที = 60 วินาที\nขั้นตอนที่ 3: คำนวณหากำลังที่มีประโยชน์ (Power,\
    \ P = W / t)\n  P = 60,000 J / 60 s = 1,000 W (หรือ 1 kW)\nสรุป กำลังที่มีประโยชน์ของปั๊มน้ำเท่ากับ 1,000 วัตต์ (ตัวเลือก\
    \ 3)"
- number: 38
  question_id: tpat3-70-q38
  topic: tpat3.engineering_mechanics
  skill: spring_potential_energy
  score: 1.3333333333333333
  answer_type: single_choice
  stem: สปริงมีค่านิจสปริง k = 400 N/m ถูกกดให้หดสั้นลง 0.1 m พลังงานศักย์ยืดหยุ่นที่สะสมในสปริงมีค่ากี่จูล
  options:
  - id: '1'
    text: 2 J
    explanation: ถูกต้อง พลังงานศักย์ยืดหยุ่น Ep = (1/2) k x² = 0.5 × 400 × (0.1)² = 200 × 0.01 = 2 J
  - id: '2'
    text: 4 J
    error_tag: forgot_half_factor
    explanation: ลืมตัวคูณ 1/2 ในสูตรพลังงานศักย์ยืดหยุ่น (400 × 0.01 = 4 J)
  - id: '3'
    text: 20 J
    error_tag: forgot_square_of_displacement
    explanation: ลืมยกกำลังสองระยะหด x โดยคิดเป็น (1/2)kx = 200 × 0.1 = 20 J
  - id: '4'
    text: 40 J
    error_tag: used_hookes_law_force_as_energy
    explanation: คำนวณแรงสปริงตามกฎของฮุก F = kx = 400 × 0.1 = 40 N มาตอบเป็นพลังงาน
  - id: '5'
    text: 200 J
    error_tag: half_k_without_displacement_square
    explanation: คิดเฉพาะ (1/2)k = 200 โดยไม่ได้คูณระยะหด x²
  correct_answer: '1'
  solution: "การคำนวณพลังงานศักย์ยืดหยุ่นในสปริง (Elastic Potential Energy)\nขั้นตอนที่ 1: กำหนดสูตรพลังงานศักย์ยืดหยุ่น\n\
    \  E_p = (1/2) k x²\n  โดยที่:\n    k = ค่านิจสปริง (Spring Constant) = 400 N/m\n    x = ระยะที่สปริงหดสั้นลง (Displacement)\
    \ = 0.1 m\nขั้นตอนที่ 2: แทนค่าและคำนวณผลลัพธ์\n  x² = (0.1)² = 0.01 m²\n  E_p = 0.5 × 400 N/m × 0.01 m²\n  E_p = 200\
    \ × 0.01 = 2 J\nสรุป พลังงานศักย์ยืดหยุ่นที่สะสมในสปริงเท่ากับ 2 จูล (ตัวเลือก 1)"
- number: 39
  question_id: tpat3-70-q39
  topic: tpat3.engineering_mechanics
  skill: bernoulli_flow
  score: 1.3333333333333333
  answer_type: single_choice
  stem: น้ำไหลในท่อที่มีพื้นที่หน้าตัดแคบลง อัตราเร็วของน้ำและความดันในท่อตรงคอดแคบจะเปลี่ยนแปลงอย่างไรตามหลักของแบร์นูลลี
  options:
  - id: '1'
    text: ความเร็วเพิ่มขึ้น ความดันเพิ่มขึ้น
    error_tag: intuitive_pressure_fallacy
    explanation: เข้าใจผิดตามสัญชาตญาณว่าบริเวณที่บีบแคบความดันต้องสูงขึ้น ทั้งที่ความเร็วที่เพิ่มขึ้นเปลี่ยนพลังงานความดันไปเป็นพลังงานจลน์
  - id: '2'
    text: ความเร็วเพิ่มขึ้น ความดันลดลง
    explanation: ถูกต้อง จากสมการความต่อเนื่อง A₁v₁ = A₂v₂ เมื่อพื้นที่หน้าตัดลดลง ความเร็วจะเพิ่มขึ้น และจากหลักของแบร์นูลลี
      เมื่อความเร็วเพิ่มขึ้น ความดันสถิตจะลดลง (Venturi effect)
  - id: '3'
    text: ความเร็วลดลง ความดันเพิ่มขึ้น
    error_tag: continuity_inversion_fallacy
    explanation: เข้าใจผิดว่าท่อแคบน้ำจะไหลช้าลง ขัดกับสมการความต่อเนื่อง
  - id: '4'
    text: ความเร็วลดลง ความดันลดลง
    error_tag: energy_depletion_misconception
    explanation: เข้าใจผิดว่าทั้งความเร็วและความดันลดลงพร้อมกัน ซึ่งขัดกับกฎการอนุรักษ์พลังงานของไหล
  - id: '5'
    text: ความเร็วเท่าเดิม ความดันลดลง
    error_tag: constant_velocity_fallacy
    explanation: เข้าใจผิดว่าความเร็วไม่เปลี่ยนแปลงแม้พื้นที่หน้าตัดจะลดลง
  correct_answer: '2'
  solution: "การวิเคราะห์การไหลของของไหลตามสมการความต่อเนื่องและหลักของแบร์นูลลี (Bernoulli's Principle)\nขั้นตอนที่ 1: วิเคราะห์อัตราเร็วตามสมการความต่อเนื่อง\
    \ (Continuity Equation)\n  สำหรับของไหลที่ไม่ยุบตัว (Incompressible Fluid): อัตราการไหล Q = A × v = คงที่\n  เมื่อน้ำไหลผ่านท่อที่มีพื้นที่หน้าตัด\
    \ A แคบลง (A₂ < A₁) ความเร็วของน้ำ v จะต้อง 'เพิ่มขึ้น' (v₂ > v₁)\nขั้นตอนที่ 2: วิเคราะห์ความดันตามสมการของแบร์นูลลี\
    \ (Bernoulli's Equation)\n  P + (1/2)ρv² + ρgh = ค่าคงที่\n  สำหรับท่อแนวนอนระดับเดียวกัน (h คงที่):\n  เมื่อความเร็ว\
    \ v เพิ่มขึ้น พลังงานจลน์ต่อหน่วยปริมาตร (1/2)ρv² จะเพิ่มขึ้น ส่งผลให้ความดันสถิต P ต้อง 'ลดลง' เพื่อให้อนุรักษ์พลังงานรวม\n\
    ขั้นตอนที่ 3: สรุปผลการเปลี่ยนแปลง\n  ความเร็วของน้ำจะเพิ่มขึ้น และความดันในท่อจะลดลง (ปรากฏการณ์เวนจูรี - Venturi Effect)\n\
    สรุป ความเร็วเพิ่มขึ้น ความดันลดลง (ตัวเลือก 2)"
- number: 40
  question_id: tpat3-70-q40
  topic: tpat3.engineering_mechanics
  skill: stress_strain
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ลวดเหล็กมีความเค้นดึง (Tensile Stress) 2 × 10⁸ N/m² และมีค่ามอดุลัสของยังก์ 2 × 10¹¹ N/m² ความเครียด (Strain) ของลวดมีค่าเท่าใด
  options:
  - id: '1'
    text: 1 × 10⁻⁴
    error_tag: order_of_magnitude_shift_minus_one
    explanation: คำนวณเลขยกกำลังคลาดเคลื่อน 10⁸ / 10¹¹ = 10⁻³ ไม่ใช่ 10⁻⁴
  - id: '2'
    text: 1 × 10⁻³
    explanation: ถูกต้อง ความเครียด (Strain) ε = ความเค้น (Stress) / ยังมอดุลัส (Y) = (2 × 10⁸) / (2 × 10¹¹) = 1 × 10⁻³ (ไม่มีหน่วย)
  - id: '3'
    text: 1 × 10⁻²
    error_tag: order_of_magnitude_shift_plus_one
    explanation: คำนวณเลขยกกำลังผิดพลาดเป็น 1 × 10⁻²
  - id: '4'
    text: 1 × 10⁻¹
    error_tag: large_power_discrepancy
    explanation: คำนวณอัตราส่วนคลาดเคลื่อนไป 2 อันดับขนาดเป็น 1 × 10⁻¹
  - id: '5'
    text: 1 × 10³
    error_tag: inverted_stress_strain_formula
    explanation: กลับเศษเป็นส่วนโดยนำยังมอดุลัสตั้งหารด้วยความเค้น (2 × 10¹¹ / 2 × 10⁸ = 1 × 10³)
  correct_answer: '2'
  solution: "การคำนวณความเครียดตามกฎของฮุกและมอดุลัสของยังก์ (Young's Modulus Stress & Strain)\nขั้นตอนที่ 1: ทบทวนนิยามของมอดุลัสของยังก์\
    \ (Young's Modulus, Y)\n  ยังมอดุลัสคืออัตราส่วนระหว่างความเค้นดึง (Stress, σ) ต่อความเครียด (Strain, ε):\n  Y = σ / ε\n\
    ขั้นตอนที่ 2: จัดรูปสมการเพื่อหาความเครียด (ε)\n  ε = σ / Y\nขั้นตอนที่ 3: แทนค่าตัวเลขลงในสมการ\n  ความเค้น σ = 2 × 10⁸\
    \ N/m²\n  มอดุลัสของยังก์ Y = 2 × 10¹¹ N/m²\n  ε = (2 × 10⁸) / (2 × 10¹¹) = 1 × 10⁸⁻¹¹ = 1 × 10⁻³\n  (ความเครียดเป็นปริมาณไร้มิติ\
    \ ไม่มีหน่วย)\nสรุป ความเครียดของลวดมีค่าเท่ากับ 1 × 10⁻³ (ตัวเลือก 2)"
- number: 41
  question_id: tpat3-70-q41
  topic: tpat3.engineering_mechanics
  skill: torque_rotation
  score: 1.3333333333333333
  answer_type: single_choice
  stem: ใช้ประแจยาว 25 cm ขันน็อต โดยออกแรง 80 N ตั้งฉากกับปลายประแจ ทอร์กที่กระทำต่อน็อตมีขนาดกี่นิวตัน·เมตร
  options:
  - id: '1'
    text: 2 N·m
    error_tag: decimal_point_shift_error
    explanation: เลื่อนจุดทศนิยมผิดพลาด ได้ 2 N·m
  - id: '2'
    text: 20 N·m
    explanation: ถูกต้อง แปลงความยาวประแจเป็นเมตร r = 25 cm = 0.25 m ทอร์ก τ = F × r = 80 N × 0.25 m = 20 N·m
  - id: '3'
    text: 200 N·m
    error_tag: centimeter_conversion_omitted_divided_10
    explanation: หารด้วย 10 แทนที่จะหารด้วย 100 ได้ 200 N·m
  - id: '4'
    text: 2000 N·m
    error_tag: used_centimeter_without_meter_conversion
    explanation: ลืมแปลงหน่วยเซนติเมตรเป็นเมตร นำ 80 × 25 = 2,000 N·m มาตอบทันที
  - id: '5'
    text: 320 N·m
    error_tag: divided_force_by_length
    explanation: นำแรงตั้งหารด้วยความยาวแขนประแจ (80 / 0.25 = 320 N/m)
  correct_answer: '2'
  solution: "การคำนวณทอร์กหรือโมเมนต์ของแรงหมุน (Torque & Rotational Mechanics)\nขั้นตอนที่ 1: ทบทวนสูตรการคำนวณทอร์ก (Torque,\
    \ τ)\n  τ = F × r × sin(θ)\n  โดยที่:\n    F = ขนาดของแรงที่กระทำ = 80 N\n    r = ระยะห่างจากแกนหมุนถึงแนวแรง (ความยาวประแจ)\
    \ = 25 cm\n    θ = มุมระหว่างแนวแรงกับประแจ = 90° (ตั้งฉาก, sin(90°) = 1)\nขั้นตอนที่ 2: แปลงหน่วยความยาวเป็นเมตร (SI\
    \ Units)\n  r = 25 cm = 25 / 100 m = 0.25 m\nขั้นตอนที่ 3: คำนวณหาขนาดของทอร์ก\n  τ = 80 N × 0.25 m = 20 N·m\nสรุป ทอร์กที่กระทำต่อน็อตมีขนาด\
    \ 20 นิวตัน·เมตร (ตัวเลือก 2)"
- number: 42
  question_id: tpat3-70-q42
  topic: tpat3.engineering_mechanics
  skill: buoyancy_archimedes
  score: 1.3333333333333333
  answer_type: single_choice
  stem: วัตถุปริมาตร 0.005 m³ จมมิดอยู่ใต้น้ำ แรงพยุงของน้ำที่กระทำต่อวัตถุมีขนาดกี่นิวตัน (ความหนาแน่นน้ำ 1000 kg/m³, g =
    10 m/s²)
  options:
  - id: '1'
    text: 5 N
    error_tag: forgot_gravitational_acceleration_g
    explanation: ลืมคูณค่า g = 10 m/s² (1,000 × 0.005 = 5 N ตอบเป็นมวลของน้ำที่แทนที่แทนแรง)
  - id: '2'
    text: 25 N
    error_tag: arbitrary_halving_error
    explanation: หารสองผลลัพธ์โดยไม่มีเหตุผล ได้ 25 N
  - id: '3'
    text: 50 N
    explanation: ถูกต้อง ตามหลักของอาร์คิมีดีส แรงพยุง Fb = ρ_เหลว × g × V_จม = 1,000 kg/m³ × 10 m/s² × 0.005 m³ = 50 N
  - id: '4'
    text: 500 N
    error_tag: order_of_magnitude_multiplication_error
    explanation: คำนวณจุดทศนิยมผิดพลาดเป็น 10 เท่า ได้ 500 N
  - id: '5'
    text: 5000 N
    error_tag: used_volume_as_0_5_m3
    explanation: ใช้ปริมาตรผิดเป็น 0.5 m³ แทน 0.005 m³ ทำให้ได้ 5,000 N
  correct_answer: '3'
  solution: "การคำนวณแรงพยุงตามหลักการของอาร์คิมีดีส (Archimedes' Buoyancy Principle)\nขั้นตอนที่ 1: ทบทวนหลักการของอาร์คิมีดีส\
    \ (Archimedes' Principle)\n  แรงพยุง (Buoyant Force, F_b) เท่ากับน้ำหนักของของไหลที่ถูกวัตถุแทนที่:\n  F_b = ρ_fluid ×\
    \ g × V_submerged\nขั้นตอนที่ 2: รวบรวมข้อมูลตัวแปร\n  - ความหนาแน่นของน้ำ ρ_fluid = 1,000 kg/m³\n  - ความเร่งโน้มถ่วง\
    \ g = 10 m/s²\n  - ปริมาตรวัตถุที่จมมิดใต้น้ำ V_submerged = 0.005 m³\nขั้นตอนที่ 3: แทนค่าและคำนวณหาแรงพยุง\n  F_b = 1,000\
    \ kg/m³ × 10 m/s² × 0.005 m³\n  F_b = 10,000 × 0.005 = 50 N\nสรุป แรงพยุงของน้ำที่กระทำต่อวัตถุมีขนาด 50 นิวตัน (ตัวเลือก\
    \ 3)"
- number: 43
  question_id: tpat3-70-q43
  topic: tpat3.engineering_mechanics
  skill: heat_conduction
  score: 1.3333333333333333
  answer_type: single_choice
  stem: การถ่ายโอนความร้อนผ่านผนังโลหะของหม้อต้มน้ำไปยังน้ำด้านใน เป็นการถ่ายโอนความร้อนในรูปแบบใดเป็นหลัก
  options:
  - id: '1'
    text: การนำความร้อน
    explanation: ถูกต้อง การส่งผ่านความร้อนผ่านเนื้อของแข็ง (โลหะหม้อ) จากอนุภาคหนึ่งไปยังอนุภาคข้างเคียงโดยที่อนุภาคไม่ได้เคลื่อนที่ตาม
      เกิดขึ้นผ่าน 'การนำความร้อน (Conduction)' เป็นหลัก
  - id: '2'
    text: การพาความร้อน
    error_tag: fluid_convection_confused
    explanation: การพาความร้อน (Convection) เกิดขึ้นภายในมวลของไหล (น้ำในหม้อที่หมุนวน) ไม่ใช่ผ่านเนื้อผนังโลหะของแข็ง
  - id: '3'
    text: การแผ่รังสีความร้อน
    error_tag: electromagnetic_radiation_confused
    explanation: การแผ่รังสี (Radiation) เกิดจากคลื่นแม่เหล็กไฟฟ้า เช่น รังสีจากเปลวไฟหรือเตา ไม่ใช่การส่งผ่านเนื้อโลหะ
  - id: '4'
    text: การระเหย
    error_tag: phase_change_cooling_confused
    explanation: การระเหยคือการเปลี่ยนสถานะจากของเหลวเป็นไอ ไม่ใช่รูปแบบการถ่ายโอนความร้อนผ่านของแข็ง
  - id: '5'
    text: การดูดกลืนแสง
    error_tag: light_absorption_irrelevant
    explanation: การดูดกลืนแสงไม่ใช่กลไกหลักในการต้มน้ำด้วยความร้อนจากเตา
  correct_answer: '1'
  solution: "การจำแนกรูปแบบการถ่ายโอนความร้อน (Modes of Heat Transfer)\nขั้นตอนที่ 1: ทบทวน 3 รูปแบบหลักของการถ่ายโอนความร้อน\n\
    \  1. การนำความร้อน (Conduction): การส่งผ่านความร้อนผ่านตัวกลางที่เป็น 'ของแข็ง' จากอนุภาคหนึ่งไปยังอนุภาคข้างเคียงที่สั่นสะเทือนโดยที่เนื้ออนุภาคไม่ได้เคลื่อนที่ตาม\n\
    \  2. การพาความร้อน (Convection): การถ่ายโอนความร้อนผ่าน 'ของไหล' (ของเหลวหรือก๊าซ) โดยที่โมเลกุลของตัวกลางเคลื่อนที่พาความร้อนไปด้วย\
    \ (เช่น กระแสน้ำวนในหม้อ)\n  3. การแผ่รังสีความร้อน (Radiation): การถ่ายโอนความร้อนในรูปคลื่นแม่เหล็กไฟฟ้า โดยไม่ต้องอาศัยตัวกลาง\
    \ (เช่น รังสีอินฟราเรดจากเตา)\nขั้นตอนที่ 2: วิเคราะห์สถานการณ์ในโจทย์\n  โจทย์ระบุว่า 'การถ่ายโอนความร้อนผ่านผนังโลหะของหม้อต้มน้ำ'\n\
    \  ผนังหม้อเป็นโลหะของแข็ง การส่งผ่านความร้อนจึงเกิดขึ้นผ่านกลไก 'การนำความร้อน' เป็นหลัก\nสรุป รูปแบบการถ่ายโอนความร้อนหลักคือ\
    \ การนำความร้อน (ตัวเลือก 1)"
- number: 44
  question_id: tpat3-70-q44
  topic: tpat3.engineering_mechanics
  skill: circuit_ohm
  score: 1.3333333333333333
  answer_type: single_choice
  stem: หลอดไฟ 2 หลอด ความต้านทาน 6 โอห์ม และ 12 โอห์ม ต่อขนานกัน แล้วต่อเข้ากับแบตเตอรี่ 12 V กระแสไฟฟ้ารวมที่ออกจากแบตเตอรี่คือกี่แอมแปร์
  options:
  - id: '1'
    text: 1 A
    error_tag: calculated_branch_current_of_12_ohm_only
    explanation: คิดเฉพาะกระแสไฟฟ้าที่ไหลผ่านหลอด 12 โอห์มสาขาเดียว (12 V / 12 Ω = 1 A)
  - id: '2'
    text: 2 A
    error_tag: calculated_branch_current_of_6_ohm_only
    explanation: คิดเฉพาะกระแสไฟฟ้าที่ไหลผ่านหลอด 6 โอห์มสาขาเดียว (12 V / 6 Ω = 2 A)
  - id: '3'
    text: 3 A
    explanation: ถูกต้อง ความต้านทานรวมขนาน Req = (6 × 12) / (6 + 12) = 72 / 18 = 4 โอห์ม กระแสไฟฟ้ารวม I = V / Req = 12 V
      / 4 Ω = 3 A (หรือคิดกระแสแยกสาขา 12/6 + 12/12 = 2 + 1 = 3 A)
  - id: '4'
    text: 4 A
    error_tag: confused_equivalent_resistance_with_current
    explanation: นำค่าความต้านทานรวม 4 โอห์ม มาตอบเป็นค่ากระแสไฟฟ้า
  - id: '5'
    text: 6 A
    error_tag: series_parallel_formula_miscalc
    explanation: คำนวณความต้านทานรวมผิดพลาดเป็น 2 โอห์ม ทำให้ได้กระแส 12 / 2 = 6 A
  correct_answer: '3'
  solution: "การคำนวณวงจรไฟฟ้าความต้านทานต่อขนานและกฎของโอห์ม (Parallel Resistors & Ohm's Law)\nขั้นตอนที่ 1: คำนวณความต้านทานสมมูลรวม\
    \ (Equivalent Resistance, R_total)\n  หลอดไฟสองหลอดต่อขนานกัน: R₁ = 6 Ω, R₂ = 12 Ω\n  1 / R_total = 1 / R₁ + 1 / R₂ =\
    \ 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4\n  R_total = 4 Ω\n  (หรือใช้สูตรผลคูณหารผลบวก: R_total = (6 × 12) / (6 + 12) =\
    \ 72 / 18 = 4 Ω)\nขั้นตอนที่ 2: คำนวณกระแสไฟฟ้ารวมจากแบตเตอรี่ (Total Current, I)\n  จากกฎของโอห์ม I = V / R_total\n \
    \ I = 12 V / 4 Ω = 3 A\n  (วิธีคิดแบบแยกสาขา: กระแสสาขา 1 = 12/6 = 2 A, กระแสสาขา 2 = 12/12 = 1 A, รวมกันได้ 2 + 1 = 3\
    \ A)\nสรุป กระแสไฟฟ้ารวมที่ออกจากแบตเตอรี่คือ 3 แอมแปร์ (ตัวเลือก 3)"
- number: 45
  question_id: tpat3-70-q45
  topic: tpat3.engineering_mechanics
  skill: center_of_gravity
  score: 1.3333333333333333
  answer_type: single_choice
  stem: วัตถุจะทรงตัวได้อย่างมีเสถียรภาพสูงสุด (Most Stable Equilibrium) เมื่อมีลักษณะใด
  options:
  - id: '1'
    text: จุดศูนย์ถ่วงอยู่สูง และฐานแคบ
    error_tag: unstable_equilibrium_characteristics
    explanation: จุดศูนย์ถ่วงสูงและฐานแคบทำให้วัตถุล้มง่ายที่สุด เป็นลักษณะของสมดุลไม่เสถียร (Unstable Equilibrium)
  - id: '2'
    text: จุดศูนย์ถ่วงอยู่ต่ำ และฐานกว้าง
    explanation: ถูกต้อง เสถียรภาพจะสูงสุด (Most Stable) เมื่อจุดศูนย์ถ่วง (CG) อยู่ต่ำที่สุดเพื่อลดพลังงานศักย์ และมีฐานรองรับ
      (Base of support) กว้างที่สุดเพื่อป้องกันไม่ให้แนวแรงน้ำหนักหลุดออกนอกฐาน
  - id: '3'
    text: จุดศูนย์ถ่วงอยู่สูง และฐานกว้าง
    error_tag: elevated_cg_reduces_stability
    explanation: จุดศูนย์ถ่วงสูงทำให้มุมเอียงวิกฤตลดลง วัตถุจะล้มง่ายกว่าจุดศูนย์ถ่วงต่ำ
  - id: '4'
    text: จุดศูนย์ถ่วงอยู่ต่ำ และฐานแคบ
    error_tag: narrow_base_reduces_stability
    explanation: ฐานแคบทำให้เส้นแนวน้ำหนักหลุดออกนอกฐานได้ง่ายเมื่อเอียงเพียงเล็กน้อย
  - id: '5'
    text: จุดศูนย์ถ่วงอยู่นอกตัววัตถุ
    error_tag: irrelevant_cg_location_characteristic
    explanation: การที่จุดศูนย์ถ่วงอยู่นอกตัววัตถุ (เช่น วงแหวน) ไม่ได้รับประกันว่าจะมีความเสถียรสูงสุด
  correct_answer: '2'
  solution: "การวิเคราะห์เสถียรภาพของการทรงตัวของวัตถุ (Stable Equilibrium Mechanics)\nขั้นตอนที่ 1: เงื่อนไขการทรงตัวอย่างมีเสถียรภาพ\
    \ (Equilibrium Stability)\n  วัตถุจะอยู่ในภาวะ 'สมดุลเสถียรสูงสุด' (Most Stable Equilibrium) เมื่อทนทานต่อแรงรบกวนให้เอียงและสามารถกลับคืนสู่ตำแหน่งเดิมได้ดีที่สุด\n\
    ขั้นตอนที่ 2: ปัจจัยกำหนดเสถียรภาพ\n  1. ตำแหน่งจุดศูนย์ถ่วง (Center of Gravity, CG): ยิ่งอยู่ 'ต่ำ' พลังงานศักย์ของวัตถุจะยิ่งต่ำ\
    \ ทำให้เมื่อถูกเอียง จุดศูนย์ถ่วงจะต้องถูกยกลอยขึ้นสูง ต้องใช้พลังงานภายนอกมากในการทำให้ล้ม\n  2. พื้นที่ฐานรองรับ (Base\
    \ of Support): ยิ่งมีฐาน 'กว้าง' เส้นแนวดิ่งของแรงโน้มถ่วงที่ลากผ่านจุดศูนย์ถ่วงจะยังคงตกลงภายในพื้นที่ฐานได้ในมุมเอียงที่กว้างมาก\
    \ ไม่หลุดออกนอกฐานโดยง่าย\nขั้นตอนที่ 3: สรุปเกณฑ์เสถียรภาพสูงสุด\n  วัตถุจะมีเสถียรภาพสูงสุดเมื่อ 'จุดศูนย์ถ่วงอยู่ต่ำ\
    \ และฐานกว้าง' (เช่น ฐานปิรามิด หรือรถแข่งฟอร์มูล่าวัน)\nสรุป คำตอบคือ จุดศูนย์ถ่วงอยู่ต่ำ และฐานกว้าง (ตัวเลือก 2)"
- number: 46
  question_id: tpat3-70-q46
  topic: tpat3.science_technology
  skill: scientific_method
  score: 1.6
  answer_type: single_choice
  stem: ขั้นตอนแรกสุดของกระบวนการสืบเสาะทางวิทยาศาสตร์และการออกแบบทางวิศวกรรมคือข้อใด
  options:
  - id: '1'
    text: การตั้งสมมติฐาน
    error_tag: premature_hypothesis_without_problem_definition
    explanation: การตั้งสมมติฐานต้องอาศัยข้อมูลจากการสังเกตและประเด็นปัญหาที่ชัดเจนก่อน จึงไม่ใช่ขั้นตอนแรกสุด
  - id: '2'
    text: การระบุปัญหาและการสังเกต
    explanation: ถูกต้อง กระบวนการทางวิทยาศาสตร์และการออกแบบเชิงวิศวกรรมต้องเริ่มต้นจากการสังเกตปรากฏการณ์และระบุประเด็นปัญหาให้ชัดเจน
      (Problem Identification & Observation) ก่อนดำเนินการขั้นอื่น
  - id: '3'
    text: การทดลองและสร้างต้นแบบ
    error_tag: premature_prototyping_without_planning
    explanation: การทดลองและสร้างต้นแบบเป็นขั้นตอนลงมือปฏิบัติหลังจากวางแผนและตั้งสมมติฐานแล้ว
  - id: '4'
    text: การวิเคราะห์ผล
    error_tag: post_experiment_analysis_step
    explanation: การวิเคราะห์ผลเกิดขึ้นหลังจากได้ผลการทดลองหรือข้อมูลเชิงประจักษ์แล้ว
  - id: '5'
    text: การเผยแพร่ผลงาน
    error_tag: final_stage_communication
    explanation: การเผยแพร่ผลงานเป็นขั้นตอนสุดท้ายในการสื่อสารผลลัพธ์สู่วงวิชาการหรือตลาด
  correct_answer: '2'
  solution: "กระบวนการสืบเสาะทางวิทยาศาสตร์และการออกแบบเชิงวิศวกรรม (Scientific Method & Engineering Design Process)\nขั้นตอนที่\
    \ 1: ลำดับขั้นตอนมาตรฐานของกระบวนการทางวิทยาศาสตร์และวิศวกรรม\n  1. การสังเกตและระบุปัญหา (Observation & Problem Identification):\
    \ สังเกตปรากฏการณ์ ตั้งคำถาม และกำหนดขอบเขตปัญหาให้ชัดเจน\n  2. การรวบรวมข้อมูลและค้นคว้าความรู้ที่เกี่ยวข้อง (Background\
    \ Research)\n  3. การตั้งสมมติฐานหรือกำหนดเกณฑ์การออกแบบ (Hypothesis Formulation / Design Criteria)\n  4. การวางแผน ออกแบบ\
    \ และดำเนินการทดลอง/สร้างต้นแบบ (Experimentation & Prototyping)\n  5. การวิเคราะห์ข้อมูลและประเมินผล (Data Analysis &\
    \ Evaluation)\n  6. การสรุปผลและเผยแพร่ผลงาน (Conclusion & Communication)\nขั้นตอนที่ 2: สรุปขั้นตอนแรกสุด\n  จุดเริ่มต้นของทั้งการค้นพบทางวิทยาศาสตร์และนวัตกรรมวิศวกรรมคือ\
    \ 'การระบุปัญหาและการสังเกต'\nสรุป ขั้นตอนแรกสุดคือ การระบุปัญหาและการสังเกต (ตัวเลือก 2)"
- number: 47
  question_id: tpat3-70-q47
  topic: tpat3.science_technology
  skill: sensor_technology
  score: 1.6
  answer_type: single_choice
  stem: เซนเซอร์ชนิดใดที่ใช้ในสมาร์ตโฟนเพื่อตรวจจับการเอียงและการหมุนของหน้าจอระหว่างใช้งาน
  options:
  - id: '1'
    text: Barometer
    error_tag: pressure_sensor_confused
    explanation: Barometer ใช้ตรวจวัดความกดอากาศเพื่อคำนวณระดับความสูง ไม่ได้ตรวจจับการหมุนหน้าจอ
  - id: '2'
    text: Gyroscope / Accelerometer
    explanation: ถูกต้อง Accelerometer ตรวจวัดความเร่งเชิงเส้น (รวมแรงโน้มถ่วงบอกแนวตั้ง/นอน) และ Gyroscope ตรวจวัดอัตราเร็วเชิงมุมการหมุนในแกน
      3 มิติ ใช้ร่วมกันปรับหมุนหน้าจอสมาร์ตโฟน
  - id: '3'
    text: Proximity Sensor
    error_tag: distance_sensor_confused
    explanation: Proximity Sensor ใช้ตรวจจับการแนบแก้มของผู้ใช้เพื่อปิดหน้าจอระหว่างสนทนาโทรศัพท์
  - id: '4'
    text: Thermocouple
    error_tag: temperature_sensor_confused
    explanation: Thermocouple เป็นเซนเซอร์วัดอุณหภูมิสูงในงานอุตสาหกรรม
  - id: '5'
    text: Hall Effect Sensor
    error_tag: magnetic_sensor_confused
    explanation: Hall Effect Sensor ใช้ตรวจจับความเข้มสนามแม่เหล็ก เช่น ระบบฝาพับเคสเปิดปิดหน้าจอ
  correct_answer: '2'
  solution: "หลักการทำงานของเซนเซอร์ในอุปกรณ์สมาร์ตโฟน (Smartphone Sensor Technology)\nขั้นตอนที่ 1: หน้าที่ของ Gyroscope\
    \ และ Accelerometer ในสมาร์ตโฟน\n  - เซนเซอร์วัดความเร่ง (Accelerometer): ตรวจวัดความเร่งเชิงเส้น (Linear Acceleration)\
    \ รวมถึงเวกเตอร์แรงโน้มถ่วงของโลก (g) ทำให้เครื่องรับรู้ว่าวางในแนวตั้งหรือแนวนอน\n  - เซนเซอร์วัดการหมุน (Gyroscope):\
    \ ตรวจวัดอัตราเร็วเชิงมุมของการหมุน (Angular Velocity) รอบแกน 3 มิติ (Roll, Pitch, Yaw) ทำให้รับรู้การพลิกเอียงและหมุนของเครื่องได้อย่างแม่นยำและรวดเร็ว\n\
    ขั้นตอนที่ 2: เปรียบเทียบกับเซนเซอร์ชนิดอื่น\n  - Barometer: วัดความกดอากาศเพื่อคำนวณความสูง\n  - Proximity Sensor: เซนเซอร์ตรวจจับระยะใกล้เพื่อดับหน้าจอเวลาแนบหูโทร\n\
    \  - Thermocouple: เซนเซอร์วัดอุณหภูมิในงานอุตสาหกรรม\n  - Hall Effect Sensor: เซนเซอร์ตรวจจับสนามแม่เหล็ก (เช่น ฝาพับเคสแม่เหล็ก)\n\
    ขั้นตอนที่ 3: สรุปคำตอบ\n  เซนเซอร์ที่ใช้ตรวจจับการเอียงและการหมุนหน้าจอคือ Gyroscope / Accelerometer\nสรุป คำตอบคือ Gyroscope\
    \ / Accelerometer (ตัวเลือก 2)"
- number: 48
  question_id: tpat3-70-q48
  topic: tpat3.science_technology
  skill: renewable_energy
  score: 1.6
  answer_type: single_choice
  stem: เซลล์แสงอาทิตย์ (Solar Cell) ทำหน้าที่เปลี่ยนรูปพลังงานใดเป็นพลังงานใด
  options:
  - id: '1'
    text: พลังงานความร้อนเป็นพลังงานเคมี
    error_tag: solar_thermal_confused
    explanation: การเปลี่ยนพลังงานความร้อนเป็นพลังงานเคมีไม่ใช่หน้าที่ของเซลล์แสงอาทิตย์โฟโตโวลตาอิก
  - id: '2'
    text: พลังงานแสงเป็นพลังงานไฟฟ้า
    explanation: ถูกต้อง เซลล์แสงอาทิตย์ทำงานด้วยปรากฏการณ์โฟโตโวลตาอิก (Photovoltaic Effect) ดูดกลืนอนุภาคโฟตอนของแสงเพื่อกระตุ้นอิเล็กตรอน
      เกิดเป็นกระแสและพลังงานไฟฟ้าโดยตรง
  - id: '3'
    text: พลังงานกลเป็นพลังงานไฟฟ้า
    error_tag: generator_dynamo_confused
    explanation: การเปลี่ยนพลังงานกลเป็นพลังงานไฟฟ้าเป็นหน้าที่ของเครื่องกำเนิดไฟฟ้าหรือไดนาโม (Generator)
  - id: '4'
    text: พลังงานเคมีเป็นพลังงานไฟฟ้า
    error_tag: battery_cell_confused
    explanation: การเปลี่ยนพลังงานเคมีเป็นพลังงานไฟฟ้าเป็นหน้าที่ของแบตเตอรี่หรือเซลล์เชื้อเพลิง (Fuel Cell)
  - id: '5'
    text: พลังงานรังสีเป็นพลังงานกล
    error_tag: nonexistent_direct_energy_conversion
    explanation: ไม่มีการเปลี่ยนรูปแสงเป็นพลังงานกลโดยตรงในแผงโซลาร์เซลล์
  correct_answer: '2'
  solution: "การเปลี่ยนรูปพลังงานในเซลล์แสงอาทิตย์ (Photovoltaic Energy Conversion)\nขั้นตอนที่ 1: หลักการทางฟิสิกส์ของเซลล์แสงอาทิตย์\
    \ (Solar Cell / Photovoltaic Cell)\n  เซลล์แสงอาทิตย์ผลิตจากสารกึ่งตัวนำ (เช่น ซิลิคอน) ที่มีรอยต่อ p-n junction\nขั้นตอนที่\
    \ 2: กลไกปรากฏการณ์โฟโตโวลตาอิก (Photovoltaic Effect)\n  1. โฟตอนของแสงอาทิตย์ (Light Energy) ตกกระทบผิวสารกึ่งตัวนำ\n\
    \  2. ถ่ายทอดพลังงานให้อิเล็กตรอน หลุดเป็นคู่อิเล็กตรอน-โฮลอิสระ (Electron-Hole Pairs)\n  3. สนามไฟฟ้าภายในรอยต่อผลักให้อิเล็กตรอนเคลื่อนที่ไปยังขั้วลบ\
    \ เกิดความต่างศักย์และกระแสไฟฟ้ากระแสตรง (DC Electricity)\nขั้นตอนที่ 3: สรุปการเปลี่ยนรูปพลังงาน\n  เป็นการเปลี่ยน 'พลังงานแสง'\
    \ เป็น 'พลังงานไฟฟ้า' โดยตรงโดยไม่ต้องผ่านพลังงานกลหรือกังหันไอน้ำ\nสรุป เซลล์แสงอาทิตย์เปลี่ยนพลังงานแสงเป็นพลังงานไฟฟ้า\
    \ (ตัวเลือก 2)"
- number: 49
  question_id: tpat3-70-q49
  topic: tpat3.science_technology
  skill: semiconductor_material
  score: 1.6
  answer_type: single_choice
  stem: สารกึ่งตัวนำ (Semiconductor) ชนิดใดที่นิยมนำมาผลิตชิปประมวลผลคอมพิวเตอร์และทรานซิสเตอร์มากที่สุดในปัจจุบัน
  options:
  - id: '1'
    text: ทองแดง (Copper)
    error_tag: conductor_metal_confused
    explanation: ทองแดงเป็นโลหะตัวนำไฟฟ้าที่ดีเยี่ยม นิยมใช้ทำสายไฟและลายวงจร ไม่ใช่สารกึ่งตัวนำสำหรับสร้างทรานซิสเตอร์
  - id: '2'
    text: ซิลิคอน (Silicon)
    explanation: ถูกต้อง ซิลิคอน (Si) ธาตุหมู่ 4 เป็นสารกึ่งตัวนำที่มีความเสถียร สามารถโดปสารสร้าง p-n junction ได้ดี และมีปริมาณมากในเปลือกโลก
      เป็นหัวใจหลักของชิปสารกึ่งตัวนำ
  - id: '3'
    text: แกรไฟต์ (Graphite)
    error_tag: carbon_allotrope_conductor_confused
    explanation: แกรไฟต์เป็นอัญรูปของคาร์บอนที่นำไฟฟ้าได้ ไม่ใช่สารกึ่งตัวนำหลักที่ใช้ในชิปคอมพิวเตอร์เชิงพาณิชย์
  - id: '4'
    text: อะลูมิเนียม (Aluminium)
    error_tag: conductor_metal_confused
    explanation: อะลูมิเนียมเป็นโลหะตัวนำไฟฟ้า นิยมใช้ทำแผ่นระบายความร้อนและสายเชื่อมต่อ
  - id: '5'
    text: แพลทินัม (Platinum)
    error_tag: noble_metal_catalyst_confused
    explanation: แพลทินัมเป็นโลหะมีค่า ใช้เป็นตัวเร่งปฏิกิริยาเคมีหรือขั้วไฟฟ้าพิเศษ
  correct_answer: '2'
  solution: "วัสดุสารกึ่งตัวนำในอุตสาหกรรมอิเล็กทรอนิกส์ (Semiconductor Materials & Microchips)\nขั้นตอนที่ 1: คุณสมบัติของสารกึ่งตัวนำ\
    \ (Semiconductor)\n  สารกึ่งตัวนำมีค่าสภาพนำไฟฟ้าระหว่างตัวนำและฉนวน สามารถควบคุมการนำไฟฟ้าได้อย่างแม่นยำด้วยการโดปสารเจือปน\
    \ (Doping) และการป้อนแรงดันไฟฟ้าที่เกตของทรานซิสเตอร์\nขั้นตอนที่ 2: เหตุผลที่ซิลิคอน (Silicon, Si) เป็นวัสดุหลักอันดับ\
    \ 1\n  1. มี Energy Bandgap (ประมาณ 1.1 eV) เหมาะสมต่อการทำงานที่อุณหภูมิห้องโดยมีกระแสรั่วไหลต่ำ\n  2. สามารถสร้างชั้นฉนวน\
    \ Silicon Dioxide (SiO₂) ที่มีคุณภาพสูงและเสถียรบนผิวผลึกได้ง่าย ซึ่งเป็นหัวใจสำคัญของเทคโนโลยี MOSFET\n  3. มีปริมาณอุดมสมบูรณ์มากในเปลือกโลก\
    \ (ทราย/ควอตซ์) ทำให้ต้นทุนการผลิตต่ำ\nขั้นตอนที่ 3: สรุปคำตอบ\n  สารกึ่งตัวนำที่ใช้ผลิตชิปประมวลผลคอมพิวเตอร์และทรานซิสเตอร์มากที่สุดในปัจจุบันคือ\
    \ ซิลิคอน (Silicon)\nสรุป คำตอบคือ ซิลิคอน (Silicon) (ตัวเลือก 2)"
- number: 50
  question_id: tpat3-70-q50
  topic: tpat3.science_technology
  skill: data_binary_bytes
  score: 1.6
  answer_type: single_choice
  stem: หน่วยความจำขนาด 1 Megabyte (MB) คิดเป็นกี่ Kilobytes (KB) ในระบบไบนารีฐานสองของคอมพิวเตอร์
  options:
  - id: '1'
    text: 1,000 KB
    error_tag: decimal_si_prefix_confused
    explanation: 1,000 เป็นตัวคูณระบบฐานสิบ (SI) มาตรฐานทั่วไป ไม่ใช่ระบบไบนารีฐานสองของคอมพิวเตอร์
  - id: '2'
    text: 1,024 KB
    explanation: ถูกต้อง ในระบบสถาปัตยกรรมคอมพิวเตอร์ฐานสอง 1 MB = 2¹⁰ KB = 1,024 KB (หรือ 1 MiB ในระบบ IEC)
  - id: '3'
    text: 1,048 KB
    error_tag: confused_with_bytes_multiplier
    explanation: สับสนกับตัวเลข 1,048,576 ซึ่งเป็นจำนวนไบต์ทั้งหมดใน 1 MB (1,024 × 1,024 ไบต์)
  - id: '4'
    text: 2,048 KB
    error_tag: doubled_binary_multiplier
    explanation: คิดเป็นสองเท่าของ 1,024 (2,048 KB)
  - id: '5'
    text: 10,000 KB
    error_tag: arbitrary_decimal_power_error
    explanation: ตัวเลข 10,000 เป็นค่าประมาณการคลาดเคลื่อนที่ไม่มีความสัมพันธ์กับระบบคอมพิวเตอร์
  correct_answer: '2'
  solution: "การแปลงหน่วยความจำในระบบคอมพิวเตอร์ฐานสอง (Binary Data Units & Prefixes)\nขั้นตอนที่ 1: ระบบไบนารีฐานสองในสถาปัตยกรรมคอมพิวเตอร์\n\
    \  คอมพิวเตอร์ทำงานด้วยระบบเลขฐานสอง (Binary: 0 และ 1) ดังนั้นหน่วยคูณจึงอิงกับเลขยกกำลังของ 2:\n  - 1 Byte = 8 Bits\n\
    \  - 1 Kilobyte (KB / KiB) = 2¹⁰ Bytes = 1,024 Bytes\n  - 1 Megabyte (MB / MiB) = 2¹⁰ KB = 1,024 Kilobytes\nขั้นตอนที่\
    \ 2: เปรียบเทียบกับระบบฐานสิบ (Decimal SI)\n  ในระบบฐานสิบ (SI Prefixes) เช่น ผู้ผลิตฮาร์ดดิสก์บางราย อาจใช้ 1 MB = 1,000\
    \ KB\n  แต่โจทย์ระบุเจาะจงว่า 'ในระบบไบนารีฐานสองของคอมพิวเตอร์'\n  ดังนั้นต้องใช้ตัวคูณ 2¹⁰ = 1,024\nขั้นตอนที่ 3: สรุปคำตอบ\n\
    \  1 Megabyte (MB) คิดเป็น 1,024 Kilobytes (KB)\nสรุป คำตอบคือ 1,024 KB (ตัวเลือก 2)"
- number: 51
  question_id: tpat3-70-q51
  topic: tpat3.science_technology
  skill: electric_vehicle_ev
  score: 1.6
  answer_type: single_choice
  stem: แบตเตอรี่ชนิดใดที่ใช้เป็นแหล่งพลังงานขับเคลื่อนหลักในยานยนต์ไฟฟ้า (EV) ยุคปัจจุบันอย่างแพร่หลายที่สุด
  options:
  - id: '1'
    text: แบตเตอรี่ตะกั่ว-กรด (Lead-Acid)
    error_tag: heavy_starter_battery_confused
    explanation: แบตเตอรี่ตะกั่ว-กรดมีความหนาแน่นพลังงานต่ำและหนักมาก เหมาะสำหรับระบบสตาร์ต 12V ไม่ใช่ขับเคลื่อนหลัก
  - id: '2'
    text: แบตเตอรี่ลิเทียมไอออน (Lithium-ion)
    explanation: ถูกต้อง แบตเตอรี่ลิเทียมไอออน (Li-ion/LFP/NMC) มีความหนาแน่นพลังงานต่อน้ำหนัก (Energy Density) สูงสุด ประสิทธิภาพการอัดประจุสูง
      และรอบอายุยาวนาน จึงใช้ขับเคลื่อนยานยนต์ไฟฟ้าเป็นหลัก
  - id: '3'
    text: แบตเตอรี่นิกเกิล-แคดเมียม (Ni-Cd)
    error_tag: toxic_outdated_battery_confused
    explanation: Ni-Cd มีปัญหา Memory Effect และสารแคดเมียมเป็นพิษร้ายแรง เลิกใช้ในยานยนต์แล้ว
  - id: '4'
    text: แบตเตอรี่อัลคาไลน์
    error_tag: primary_dry_cell_confused
    explanation: แบตเตอรี่อัลคาไลน์เป็นเซลล์ปฐมภูมิที่ไม่สามารถชาร์จประจุซ้ำได้
  - id: '5'
    text: เซลล์กัลวานิกแห้ง
    error_tag: low_capacity_cell_confused
    explanation: ให้แรงดันและความจุต่ำ ไม่สามารถขับเคลื่อนมอเตอร์กำลังสูงของยานยนต์ไฟฟ้าได้
  correct_answer: '2'
  solution: "เทคโนโลยีแบตเตอรี่ในยานยนต์ไฟฟ้า (Electric Vehicle Traction Batteries)\nขั้นตอนที่ 1: ข้อกำหนดของแบตเตอรี่ขับเคลื่อนยานยนต์ไฟฟ้า\
    \ (EV Traction Battery)\n  - ต้องมีความหนาแน่นพลังงานต่อน้ำหนัก (Specific Energy) และต่อปริมาตรสูง เพื่อให้รถวิ่งได้ระยะทางไกลโดยไม่หนักเกินไป\n\
    \  - มีประสิทธิภาพการอัดประจุและการคายประจุสูง (High Round-trip Efficiency > 90%)\n  - มีอายุรอบการชาร์จยาวนาน (Cycle\
    \ Life > 1,500 - 3,000 รอบ)\nขั้นตอนที่ 2: เปรียบเทียบชนิดของแบตเตอรี่\n  1. แบตเตอรี่ลิเทียมไอออน (Lithium-ion เช่น NMC,\
    \ NCA, LFP): มีความหนาแน่นพลังงานสูงที่สุด (150-280 Wh/kg) จ่ายกระแสไฟฟ้าได้เร็ว จึงเป็นมาตรฐานหลักของ EV ทั่วโลก\n  2.\
    \ แบตเตอรี่ตะกั่ว-กรด (Lead-Acid): หนักมาก หนาแน่นพลังงานต่ำ (30-40 Wh/kg) ใช้เฉพาะไฟเลี้ยงระบบ 12V เสริม\n  3. แบตเตอรี่นิกเกิล-แคดเมียม\
    \ (Ni-Cd): หนัก มี Memory Effect และแคดเมียมเป็นพิษต่อสิ่งแวดล้อม\nขั้นตอนที่ 3: สรุปคำตอบ\n  แบตเตอรี่ขับเคลื่อนหลักในยานยนต์ไฟฟ้ายุคปัจจุบันคือ\
    \ แบตเตอรี่ลิเทียมไอออน (Lithium-ion)\nสรุป คำตอบคือ แบตเตอรี่ลิเทียมไอออน (Lithium-ion) (ตัวเลือก 2)"
- number: 52
  question_id: tpat3-70-q52
  topic: tpat3.science_technology
  skill: 3d_printing_fdm
  score: 1.6
  answer_type: single_choice
  stem: เทคโนโลยีการพิมพ์ 3 มิติแบบ FDM (Fused Deposition Modeling) ใช้วิธีการใดในการขึ้นรูปชิ้นงาน
  options:
  - id: '1'
    text: การฉายแสง UV ใส่เรซินเหลว
    error_tag: stereolithography_sla_confused
    explanation: การฉายแสง UV ใส่เรซินเหลวเป็นเทคโนโลยีแบบ SLA (Stereolithography) หรือ DLP
  - id: '2'
    text: การหลอมเส้นพลาสติกผ่านหัวฉีดแล้วปูทีละชั้น
    explanation: ถูกต้อง FDM (Fused Deposition Modeling) ทำงานโดยการให้ความร้อนหลอมเส้นพลาสติกเทอร์โมพลาสติก (Filament) ผ่านหัวฉีดความร้อน
      (Nozzle) แล้วฉีดปูลงบนฐานสร้างชิ้นงานทีละเลเยอร์
  - id: '3'
    text: การใช้แสงเลเซอร์เผาผงโลหะ
    error_tag: selective_laser_sintering_sls_confused
    explanation: การใช้เลเซอร์เผาผงโลหะหรือพอลิเมอร์เป็นเทคโนโลยี SLS หรือ SLM (Selective Laser Melting)
  - id: '4'
    text: การตัดแผ่นกระดาษด้วยเลเซอร์
    error_tag: laminated_object_manufacturing_confused
    explanation: การตัดแผ่นกระดาษซ้อนชั้นคือเทคนิค LOM (Laminated Object Manufacturing)
  - id: '5'
    text: การหล่อปูนปลาสเตอร์ลงในแม่พิมพ์
    error_tag: traditional_casting_confused
    explanation: เป็นการหล่อแบบดั้งเดิม ไม่ใช่เทคโนโลยีการพิมพ์ 3 มิติ FDM
  correct_answer: '2'
  solution: "เทคโนโลยีการผลิตแบบเพิ่มเนื้อวัสดุและการพิมพ์สามมิติ (Additive Manufacturing & 3D Printing)\nขั้นตอนที่ 1: การจำแนกประเภทเทคโนโลยี\
    \ 3D Printing\n  - FDM (Fused Deposition Modeling): ป้อนเส้นพลาสติกเทอร์โมพลาสติก (Filament เช่น PLA, ABS, PETG) ผ่านหัวฉีดความร้อน\
    \ (Extruder/Nozzle) ให้หลอมเหลว แล้วฉีดปูลงบนฐานพิมพ์ทีละเส้นทีละเลเยอร์จนแข็งตัวเป็นชิ้นงาน\n  - SLA / DLP (Stereolithography):\
    \ ฉายแสงเลเซอร์หรือแสง UV ลงในอ่างเรซินเหลวไวแสง (Photopolymer Resin) ให้แข็งตัวทีละชั้น\n  - SLS (Selective Laser Sintering):\
    \ ใช้แสงเลเซอร์พลังงานสูงเผาผนึกผงวัสดุ (โลหะหรือไนลอน) ทีละชั้น\nขั้นตอนที่ 2: วิเคราะห์กลไกของ FDM\n  FDM ทำงานโดย 'การหลอมเส้นพลาสติกผ่านหัวฉีดแล้วปูทีละชั้น'\n\
    สรุป คำตอบคือ การหลอมเส้นพลาสติกผ่านหัวฉีดแล้วปูทีละชั้น (ตัวเลือก 2)"
- number: 53
  question_id: tpat3-70-q53
  topic: tpat3.science_technology
  skill: greenhouse_gases
  score: 1.6
  answer_type: single_choice
  stem: ก๊าซในข้อใดมีศักยภาพในการก่อให้เกิดภาวะโลกร้อน (GWP) ต่อน้ำหนักหนึ่งโมเลกุลสูงกว่าก๊าซคาร์บอนไดออกไซด์หลายสิบเท่า
  options:
  - id: '1'
    text: ออกซิเจน (O2)
    error_tag: atmospheric_diatomic_gas_confused
    explanation: ออกซิเจน (O₂) เป็นก๊าซสองอะตอมที่สมมาตร ไม่ดูดกลืนรังสีอินฟราเรด จึงไม่ใช่ก๊าซเรือนกระจก
  - id: '2'
    text: มีเทน (CH4)
    explanation: ถูกต้อง ก๊าซมีเทน (CH₄) มีศักยภาพในการกักเก็บความร้อนและทำให้โลกร้อน (Global Warming Potential - GWP) สูงกว่าก๊าซคาร์บอนไดออกไซด์ประมาณ
      28-36 เท่าในช่วง 100 ปี
  - id: '3'
    text: ไนโตรเจน (N2)
    error_tag: non_greenhouse_inert_gas_confused
    explanation: ไนโตรเจน (N₂) คิดเป็น 78% ของบรรยากาศและไม่มีสมบัติเป็นก๊าซเรือนกระจก
  - id: '4'
    text: อาร์กอน (Ar)
    error_tag: noble_gas_confused
    explanation: อาร์กอน (Ar) เป็นก๊าซเฉื่อย ไม่ดูดกลืนรังสีอินฟราเรด
  - id: '5'
    text: ฮีเลียม (He)
    error_tag: noble_gas_confused
    explanation: ฮีเลียม (He) เป็นก๊าซเฉื่อยเบา ไม่ก่อให้เกิดภาวะเรือนกระจก
  correct_answer: '2'
  solution: "วิทยาศาสตร์สิ่งแวดล้อมและศักยภาพการก่อให้เกิดภาวะโลกร้อน (Global Warming Potential - GWP)\nขั้นตอนที่ 1: นิยามของ\
    \ Global Warming Potential (GWP)\n  GWP เป็นดัชนีชี้วัดความสามารถในการกักเก็บความร้อนของก๊าซเรือนกระจกแต่ละชนิดในชั้นบรรยากาศ\
    \ โดยเทียบกับก๊าซคาร์บอนไดออกไซด์ (CO₂) ซึ่งกำหนดให้ GWP ของ CO₂ = 1\nขั้นตอนที่ 2: เปรียบเทียบค่า GWP ของก๊าซต่างๆ (ช่วงเวลา\
    \ 100 ปี)\n  - คาร์บอนไดออกไซด์ (CO₂): GWP = 1\n  - มีเทน (CH₄): GWP ≈ 28 ถึง 36 เท่าของ CO₂ (มีความสามารถในการดักจับความร้อนสูงกว่า\
    \ CO₂ หลายสิบเท่า)\n  - ไนตรัสออกไซด์ (N₂O): GWP ≈ 265 - 298 เท่า\n  - ก๊าซอื่นๆ เช่น O₂, N₂, Ar, He: ไม่ใช่ก๊าซเรือนกระจก\
    \ ไม่มีค่า GWP\nขั้นตอนที่ 3: สรุปคำตอบ\n  ก๊าซที่มีเทน (CH₄) เป็นก๊าซเรือนกระจกที่มีค่า GWP สูงกว่า CO₂ หลายสิบเท่า\n\
    สรุป คำตอบคือ มีเทน (CH4) (ตัวเลือก 2)"
- number: 54
  question_id: tpat3-70-q54
  topic: tpat3.science_technology
  skill: artificial_intelligence
  score: 1.6
  answer_type: single_choice
  stem: การเรียนรู้ของเครื่องแบบใดที่ระบบเรียนรู้ผ่านการลองผิดลองถูกและได้รับรางวัล (Reward) หรือบทลงโทษ (Penalty)
  options:
  - id: '1'
    text: Supervised Learning
    error_tag: labeled_data_learning_confused
    explanation: Supervised Learning คือการเรียนรู้โดยมีผู้สอนผ่านข้อมูลที่มีป้ายกำกับเฉลย (Labeled data)
  - id: '2'
    text: Unsupervised Learning
    error_tag: pattern_clustering_learning_confused
    explanation: Unsupervised Learning คือการเรียนรู้เพื่อจัดกลุ่มข้อมูลโดยไม่มีเฉลย (Clustering/Association)
  - id: '3'
    text: Reinforcement Learning
    explanation: ถูกต้อง การเรียนรู้แบบเสริมกำลัง (Reinforcement Learning) ให้ตัวกระทำ (Agent) มีปฏิสัมพันธ์กับสภาพแวดล้อม
      ลองผิดลองถูก และปรับนโยบายเพื่อเพิ่มผลตอบแทนสูงสุด (Maximize Reward)
  - id: '4'
    text: Semi-supervised Learning
    error_tag: partially_labeled_learning_confused
    explanation: Semi-supervised Learning เป็นการผสมผสานระหว่างข้อมูลที่มีป้ายเฉลยจำนวนน้อยกับข้อมูลไม่มีเฉลยจำนวนมาก
  - id: '5'
    text: Transfer Learning
    error_tag: pre_trained_knowledge_transfer_confused
    explanation: Transfer Learning คือการนำโมเดลที่ฝึกสำเร็จแล้วในงานหนึ่งมาปรับใช้ต่อยอดกับอีกงานหนึ่ง
  correct_answer: '3'
  solution: "กระบวนทัศน์การเรียนรู้ของเครื่องในปัญญาประดิษฐ์ (Machine Learning Paradigms)\nขั้นตอนที่ 1: จำแนก 3 กระบวนทัศน์หลักของ\
    \ Machine Learning\n  1. Supervised Learning (การเรียนรู้แบบมีผู้สอน): ระบบเรียนรู้จากชุดข้อมูลที่มีทั้งอินพุตและคำตอบเฉลยกำกับ\
    \ (Labeled Data) เช่น การจำแนกภาพหมา/แมว\n  2. Unsupervised Learning (การเรียนรู้แบบไม่มีผู้สอน): ระบบค้นหารูปแบบ ความสัมพันธ์\
    \ หรือจัดกลุ่มข้อมูล (Clustering) เองโดยไม่มีป้ายกำกับเฉลย\n  3. Reinforcement Learning (การเรียนรู้แบบเสริมกำลัง): ตัวกระทำ\
    \ (Agent) เรียนรู้ผ่านการมีปฏิสัมพันธ์กับสภาพแวดล้อม (Environment) โดยการลองผิดลองถูก (Trial-and-Error) แล้วได้รับสัญญาณ\
    \ 'รางวัล (Reward)' เมื่อทำได้ดี หรือ 'บทลงโทษ (Penalty)' เมื่อทำผิดพลาด เพื่อปรับปรุงนโยบาย (Policy) ให้ได้รางวัลสะสมสูงสุด\n\
    ขั้นตอนที่ 2: สรุปคำตอบ\n  การเรียนรู้ผ่านการลองผิดลองถูกและรับรางวัล/บทลงโทษคือ Reinforcement Learning (เช่น การสอน AI\
    \ เล่นหมากรุก AlphaGo หรือควบคุมหุ่นยนต์เดิน)\nสรุป คำตอบคือ Reinforcement Learning (ตัวเลือก 3)"
- number: 55
  question_id: tpat3-70-q55
  topic: tpat3.science_technology
  skill: polymer_plastics
  score: 1.6
  answer_type: single_choice
  stem: พลาสติกชนิดใดที่สามารถนำกลับมาหลอมขึ้นรูปใหม่ได้ซ้ำๆ เมื่อได้รับความร้อน (Thermoplastic)
  options:
  - id: '1'
    text: อีพ็อกซีเรซิน
    error_tag: thermosetting_resin_confused
    explanation: อีพ็อกซีเรซินเป็นพลาสติกเทอร์โมเซต (Thermoset) ที่มีโครงสร้างร่างแหพันธะโคเวเลนต์ เมื่อได้รับความร้อนจะไหม้เกรียม
      ไม่สามารถหลอมซ้ำได้
  - id: '2'
    text: พอลิเอทิลีน (Polyethylene - PE)
    explanation: ถูกต้อง พอลิเอทิลีน (PE) เป็นเทอร์โมพลาสติก (Thermoplastic) ที่มีโครงสร้างโมเลกุลแบบโซ่ยาว ยึดเหนี่ยวด้วยแรงแวนเดอร์วาลส์
      จึงสามารถหลอมเหลวและขึ้นรูปใหม่ได้ซ้ำๆ
  - id: '3'
    text: เมลามีนฟอร์มาลดีไฮด์
    error_tag: thermosetting_plastic_confused
    explanation: เมลามีนฟอร์มาลดีไฮด์เป็นพลาสติกเทอร์โมเซต ทนความร้อนสูงแต่ไม่สามารถหลอมเหลวใหม่ได้
  - id: '4'
    text: เบกาไลต์
    error_tag: thermosetting_phenol_formaldehyde_confused
    explanation: เบกาไลต์ (Bakelite) เป็นพลาสติกเทอร์โมเซตชนิดแรก ไม่หลอมเหลวเมื่อโดนความร้อน
  - id: '5'
    text: ยางวัลคาไนซ์
    error_tag: cross_linked_elastomer_confused
    explanation: ยางที่ผ่านกระบวนการวัลคาไนเซชันมีสะพานกำมะถันเชื่อมขวาง (Cross-link) จึงคืนรูปและไม่หลอมเหลวซ้ำ
  correct_answer: '2'
  solution: "การจำแนกประเภทและโครงสร้างโมเลกุลของพลาสติก (Thermoplastics vs Thermosetting Plastics)\nขั้นตอนที่ 1: ความแตกต่างระหว่างพลาสติก\
    \ 2 กลุ่มหลัก\n  1. เทอร์โมพลาสติก (Thermoplastics): โครงสร้างโมเลกุลเป็นสายโซ่ยาวแบบตรง (Linear) หรือแบบกิ่ง (Branched)\
    \ ยึดเหนี่ยวกันด้วยแรงแวนเดอร์วาลส์แบบอ่อน เมื่อได้รับความร้อนจะอ่อนตัวและหลอมเหลว เมื่อเย็นตัวจะแข็งตัว สามารถนำกลับมาหลอมขึ้นรูปใหม่ได้ซ้ำๆ\
    \ (Recyclable)\n     * ตัวอย่าง: พอลิเอทิลีน (PE), พอลิโพรพีลีน (PP), พอลิไวนิลคลอไรด์ (PVC), พอลิสไตรีน (PS)\n  2. พลาสติกเทอร์โมเซต\
    \ (Thermosetting Plastics): โครงสร้างโมเลกุลเชื่อมขวางเป็นร่างแหสามมิติ (Cross-linked Network) ด้วยพันธะโคเวเลนต์ เมื่อขึ้นรูปแข็งตัวครั้งแรกแล้วจะไม่สามารถหลอมซ้ำได้\
    \ เมื่อถูกความร้อนสูงจะไหม้เกรียมหรือสลายตัว\n     * ตัวอย่าง: เมลามีน, เบกาไลต์, อีพ็อกซีเรซิน, ยางวัลคาไนซ์\nขั้นตอนที่\
    \ 2: สรุปคำตอบ\n  พลาสติกที่หลอมขึ้นรูปใหม่ได้ซ้ำๆ คือ พอลิเอทิลีน (Polyethylene - PE)\nสรุป คำตอบคือ พอลิเอทิลีน (Polyethylene\
    \ - PE) (ตัวเลือก 2)"
- number: 56
  question_id: tpat3-70-q56
  topic: tpat3.science_technology
  skill: aerodynamics
  score: 1.6
  answer_type: single_choice
  stem: ปีกเครื่องบินถูกออกแบบให้ด้านบนโค้งนูนมากกว่าด้านล่างเพื่อสร้างแรงยกตามหลักการใด
  options:
  - id: '1'
    text: กฎแรงโน้มถ่วงสากล
    error_tag: gravitational_attraction_confused
    explanation: กฎแรงโน้มถ่วงสากลอธิบายแรงดึงดูดระหว่างมวลในทิศดิ่งลงสู่โลก ไม่ใช่การสร้างแรงยกทางอากาศพลศาสตร์
  - id: '2'
    text: หลักการของแบร์นูลลี
    explanation: ถูกต้อง รูปทรงปีกแอร์ฟอยล์ (Airfoil) ทำให้อากาศที่ไหลผ่านด้านบนเดินทางด้วยความเร็วสูงกว่าด้านล่าง ตามหลักของแบร์นูลลี
      ความดันอากาศด้านบนจึงต่ำกว่าด้านล่าง เกิดแรงยก (Lift) ดันปีกขึ้น
  - id: '3'
    text: กฎการสะท้อนของคลื่น
    error_tag: wave_reflection_optics_confused
    explanation: กฎการสะท้อนใช้กับคลื่นแสงหรือเสียง ไม่เกี่ยวกับการไหลของไหลสร้างแรงยก
  - id: '4'
    text: หลักการของปัสกาล
    error_tag: hydrostatic_pressure_transmission_confused
    explanation: หลักการของปัสกาลใช้กับการส่งผ่านความดันในของเหลวปิดในระบบไฮดรอลิก ไม่ใช่การไหลเปิดของอากาศ
  - id: '5'
    text: กฎของคูลอมบ์
    error_tag: electrostatic_force_confused
    explanation: กฎของคูลอมบ์อธิบายแรงดึงดูดหรือผลักกันระหว่างประจุไฟฟ้าสถิต
  correct_answer: '2'
  solution: "หลักอากาศพลศาสตร์และการเกิดแรงยกของปีกเครื่องบิน (Aerodynamics & Lift Generation)\nขั้นตอนที่ 1: การออกแบบรูปทรงปีกแอร์ฟอยล์\
    \ (Airfoil Profile)\n  ปีกเครื่องบินถูกออกแบบให้พื้นผิวด้านบนมีความโค้งนูนมากกว่าพื้นผิวด้านล่าง\nขั้นตอนที่ 2: การประยุกต์หลักการของแบร์นูลลี\
    \ (Bernoulli's Principle)\n  1. เมื่อเครื่องบินเคลื่อนที่ไปข้างหน้า กระแสอากาศที่ไหลผ่านผิวด้านบนที่โค้งนูนจะต้องเคลื่อนที่ด้วยอัตราเร็วเฉลี่ยสูงกว่าอากาศที่ไหลผ่านใต้ปีกที่ค่อนข้างแบน\n\
    \  2. ตามหลักการของแบร์นูลลี (P + 1/2 ρv² = คงที่): บริเวณที่อากาศไหลเร็วกว่า (ด้านบน) จะมีความดันอากาศต่ำกว่า (P_top\
    \ < P_bottom)\n  3. ความแตกต่างของความดันระหว่างใต้ปีกและบนปีกทำให้เกิดแรงลัพธ์ในทิศพุ่งขึ้น เรียกว่า 'แรงยก' (Aerodynamic\
    \ Lift)\nขั้นตอนที่ 3: สรุปคำตอบ\n  แรงยกของปีกเครื่องบินถูกอธิบายด้วย 'หลักการของแบร์นูลลี'\nสรุป คำตอบคือ หลักการของแบร์นูลลี\
    \ (ตัวเลือก 2)"
- number: 57
  question_id: tpat3-70-q57
  topic: tpat3.science_technology
  skill: materials_composite
  score: 1.6
  answer_type: single_choice
  stem: วัสดุคอมโพสิต (Composite Material) เช่น คาร์บอนไฟเบอร์เสริมแรง มีจุดเด่นสำคัญที่สุดด้านใดเมื่อเทียบกับโลหะทั่วไป
  options:
  - id: '1'
    text: นำไฟฟ้าได้สูงที่สุด
    error_tag: electrical_conductivity_fallacy
    explanation: โลหะตัวนำ เช่น ทองแดงและเงิน นำไฟฟ้าได้ดีกว่าคอมโพสิตอย่างมหาศาล
  - id: '2'
    text: ความแข็งแรงต่อน้ำหนักสูงและน้ำหนักเบา
    explanation: ถูกต้อง จุดเด่นสำคัญที่สุดของ CFRP คืออัตราส่วนความแข็งแรงต่อน้ำหนัก (Strength-to-Weight Ratio) ที่สูงมาก
      แข็งแรงเทียบเท่าหรือดีกว่าเหล็กกล้าแต่น้ำหนักเบากว่ามาก
  - id: '3'
    text: ทนความร้อนได้เกินหมื่นองศา
    error_tag: extreme_temperature_exaggeration
    explanation: เมทริกซ์พอลิเมอร์เรซินจะเสื่อมสภาพและไหม้ที่อุณหภูมิเพียงไม่กี่ร้อยองศาเซลเซียส ไม่สามารถทนความร้อนสูงเกินหมื่นองศา
  - id: '4'
    text: ราคาถูกที่สุดในท้องตลาด
    error_tag: cost_factor_fallacy
    explanation: เส้นใยคาร์บอนและกระบวนการอบขึ้นรูปในหม้อนึ่งความดัน (Autoclave) มีต้นทุนสูงกว่าการรีดโลหะทั่วไป
  - id: '5'
    text: ย่อยสลายได้ในดินอย่างรวดเร็ว
    error_tag: biodegradability_misconception
    explanation: คาร์บอนไฟเบอร์เสริมแรงเป็นพอลิเมอร์สังเคราะห์ที่ย่อยสลายทางชีวภาพได้ยากมาก
  correct_answer: '2'
  solution: "คุณสมบัติเชิงกลของวัสดุคอมโพสิตขั้นสูง (Advanced Composite Materials Mechanics)\nขั้นตอนที่ 1: โครงสร้างของวัสดุคอมโพสิต\
    \ (Composite Materials)\n  วัสดุคอมโพสิตประกอบด้วยวัสดุสองชนิดขึ้นไปที่รวมกันทางกายภาพ โดยมี 'เนื้อวัสดุหลัก (Matrix เช่น\
    \ เรซินพอลิเมอร์)' และ 'ตัวเสริมแรง (Reinforcement เช่น เส้นใยคาร์บอน - Carbon Fiber)'\nขั้นตอนที่ 2: จุดเด่นสำคัญของคาร์บอนไฟเบอร์เสริมแรง\
    \ (CFRP)\n  - มีความหนาแน่นต่ำ (น้ำหนักเบากว่าเหล็กกล้าประมาณ 4-5 เท่า และเบากว่าอะลูมิเนียมเกือบ 2 เท่า)\n  - มีความต้านทานแรงดึง\
    \ (Tensile Strength) สูงมาก\n  - ส่งผลให้มี 'อัตราส่วนความแข็งแรงต่อน้ำหนัก (Specific Strength / Strength-to-Weight Ratio)'\
    \ สูงมากเมื่อเทียบกับโลหะทั่วไป นิยมใช้ในอากาศยาน รถแข่ง Formula 1 และอุปกรณ์กีฬา\nขั้นตอนที่ 3: สรุปคำตอบ\n  จุดเด่นสำคัญที่สุดคือ\
    \ ความแข็งแรงต่อน้ำหนักสูงและน้ำหนักเบา\nสรุป คำตอบคือ ความแข็งแรงต่อน้ำหนักสูงและน้ำหนักเบา (ตัวเลือก 2)"
- number: 58
  question_id: tpat3-70-q58
  topic: tpat3.science_technology
  skill: internet_of_things
  score: 1.6
  answer_type: single_choice
  stem: ระบบ IoT (Internet of Things) ในโรงงานอัจฉริยะ (Industry 4.0) มีบทบาทหลักคือข้อใด
  options:
  - id: '1'
    text: ทดแทนแรงงานคนด้วยกระดาษ
    error_tag: analog_reversion_absurdity
    explanation: ตรงกันข้าม โรงงานอัจฉริยะเปลี่ยนสู่ระบบดิจิทัลไร้กระดาษ (Paperless Automation)
  - id: '2'
    text: เชื่อมต่อเซนเซอร์และอุปกรณ์ให้ส่งข้อมูลสื่อสารกันผ่านเครือข่าย
    explanation: ถูกต้อง IoT เชื่อมต่อเครื่องจักรและเซนเซอร์เข้ากับเครือข่ายเพื่อวิเคราะห์ข้อมูลแบบเรียลไทม์ นำไปสู่การบำรุงรักษาเชิงคาดการณ์
      (Predictive Maintenance)
  - id: '3'
    text: ยกเลิกการใช้อินเทอร์เน็ตในสายการผลิต
    error_tag: disconnect_fallacy
    explanation: IIoT จำเป็นต้องพึ่งพาเครือข่ายอินเทอร์เน็ตหรือเครือข่ายอุตสาหกรรม (Industrial Ethernet) ในการแลกเปลี่ยนข้อมูล
  - id: '4'
    text: เพิ่มการปล่อยมลพิษเพื่อเร่งเครื่องจักร
    error_tag: anti_environmental_absurdity
    explanation: ขัดกับเป้าหมายความยั่งยืนและการลดการปล่อยมลพิษของ Industry 4.0
  - id: '5'
    text: ตัดการเชื่อมต่อคลาวด์เพื่อความปลอดภัย
    error_tag: cloud_isolation_fallacy
    explanation: การเชื่อมต่อคลาวด์และเอดจ์คอมพิวติ้งเป็นหัวใจสำคัญในการประมวลผลข้อมูลขนาดใหญ่
  correct_answer: '2'
  solution: "บทบาทของระบบอินเทอร์เน็ตของสรรพสิ่งในอุตสาหกรรม 4.0 (Industrial IoT in Smart Factory)\nขั้นตอนที่ 1: นิยามของ\
    \ Industrial Internet of Things (IIoT)\n  IIoT คือการติดตั้งเซนเซอร์ อุปกรณ์วัด และโมดูลสื่อสาร เข้ากับเครื่องจักร ชิ้นงาน\
    \ และสายการผลิตในโรงงานอุตสาหกรรม\nขั้นตอนที่ 2: บทบาทและประโยชน์หลักของ IIoT\n  1. เชื่อมต่ออุปกรณ์และเซนเซอร์ให้สื่อสาร\
    \ ส่งถ่ายข้อมูลผ่านเครือข่ายอินเทอร์เน็ตหรือเครือข่ายอุตสาหกรรม\n  2. รวบรวมข้อมูลสถานะการทำงาน อุณหภูมิ การสั่นสะเทือน\
    \ ความเร็ว แบบเรียลไทม์\n  3. นำข้อมูลไปวิเคราะห์บนระบบคลาวด์หรือ Edge เพื่อทำ Predictive Maintenance (การบำรุงรักษาเชิงคาดการณ์ก่อนเครื่องจักรเสีย)\
    \ และเพิ่มประสิทธิภาพ OEE\nขั้นตอนที่ 3: สรุปคำตอบ\n  บทบาทหลักคือ การเชื่อมต่อเซนเซอร์และอุปกรณ์ให้ส่งข้อมูลสื่อสารกันผ่านเครือข่าย\n\
    สรุป คำตอบคือ เชื่อมต่อเซนเซอร์และอุปกรณ์ให้ส่งข้อมูลสื่อสารกันผ่านเครือข่าย (ตัวเลือก 2)"
- number: 59
  question_id: tpat3-70-q59
  topic: tpat3.science_technology
  skill: refrigeration_cycle
  score: 1.6
  answer_type: single_choice
  stem: ในวัฏจักรการทำความเย็นของตู้เย็น สารทำความเย็นดูดกลืนความร้อนจากภายในตู้เย็นที่อุปกรณ์ใด
  options:
  - id: '1'
    text: คอมเพรสเซอร์ (Compressor)
    error_tag: pressure_pump_component_confused
    explanation: คอมเพรสเซอร์ทำหน้าที่อัดไอสารทำความเย็นให้มีความดันและอุณหภูมิสูงขึ้น ใช้พลังงานไฟฟ้าขับเคลื่อน ไม่ได้ทำหน้าที่ดูดความร้อนจากช่องแช่
  - id: '2'
    text: คอนเดนเซอร์ (Condenser / แผงระบายความร้อน)
    error_tag: heat_rejection_component_confused
    explanation: คอนเดนเซอร์ (คอยล์ร้อน) ทำหน้าที่ระบายความร้อนทิ้งออกสู่ภายนอกตู้เย็น
  - id: '3'
    text: อีวาพอเรเตอร์ (Evaporator / คอยล์เย็น)
    explanation: ถูกต้อง อีวาพอเรเตอร์ (Evaporator หรือคอยล์เย็น) อยู่ภายในตู้เย็น ทำหน้าที่ให้สารทำความเย็นความดันต่ำเดือดและระเหยกลายเป็นไอ
      โดยดูดกลืนความร้อนแฝงจากการกลายเป็นไอมาจากภายในตู้เย็น
  - id: '4'
    text: วาล์วขยายตัว (Expansion Valve)
    error_tag: throttling_device_confused
    explanation: วาล์วขยายตัวทำหน้าที่ลดความดันและอุณหภูมิของสารทำความเย็นเหลวผ่านกระบวนการ Throttling
  - id: '5'
    text: ถังพักน้ำยาแอร์
    error_tag: storage_receiver_confused
    explanation: ถังพักสารทำความเย็นทำหน้าที่สำรองน้ำยาแอร์ ไม่ได้เป็นอุปกรณ์แลกเปลี่ยนความร้อนหลัก
  correct_answer: '3'
  solution: "วัฏจักรการทำความเย็นแบบอัดไอ (Vapor-Compression Refrigeration Cycle)\nขั้นตอนที่ 1: ลำดับขั้นตอนและอุปกรณ์หลัก\
    \ 4 ชิ้นในวัฏจักรการทำความเย็น\n  1. คอมเพรสเซอร์ (Compressor): อัดสารทำความเย็นที่เป็นไอความดันต่ำให้กลายเป็นไอความดันสูงและอุณหภูมิสูง\n\
    \  2. คอนเดนเซอร์ (Condenser / คอยล์ร้อน): ระบายความร้อนออกจากสารทำความเย็นสู่สิ่งแวดล้อมภายนอก ทำให้ไอควบแน่นเป็นของเหลวความดันสูง\n\
    \  3. วาล์วลดความดัน (Expansion Valve): ลดความดันและอุณหภูมิของสารทำความเย็นเหลวอย่างรวดเร็ว\n  4. อีวาพอเรเตอร์ (Evaporator\
    \ / คอยล์เย็น): ติดตั้งอยู่ภายในช่องแช่เย็น สารทำความเย็นที่อุณหภูมิต่ำจะดูดกลืนความร้อนจากภายในตู้เย็น เพื่อนำไปใช้เป็นความร้อนแฝงในการเดือดและระเหยกลายเป็นไอ\
    \ ส่งผลให้อุณหภูมิภายในตู้เย็นลดต่ำลง\nขั้นตอนที่ 2: สรุปอุปกรณ์ที่ดูดกลืนความร้อน\n  อุปกรณ์ที่ทำหน้าที่ดูดกลืนความร้อนจากภายในตู้เย็นคือ\
    \ อีวาพอเรเตอร์ (Evaporator / คอยล์เย็น)\nสรุป คำตอบคือ อีวาพอเรเตอร์ (Evaporator / คอยล์เย็น) (ตัวเลือก 3)"
- number: 60
  question_id: tpat3-70-q60
  topic: tpat3.science_technology
  skill: cryptography_blockchain
  score: 1.6
  answer_type: single_choice
  stem: เทคโนโลยีบล็อกเชน (Blockchain) มีคุณสมบัติเด่นในเรื่องใดที่ทำให้ข้อมูลยากต่อการปลอมแปลง
  options:
  - id: '1'
    text: การจัดเก็บข้อมูลไว้ที่เซิร์ฟเวอร์ส่วนกลางแห่งเดียว
    error_tag: centralized_architecture_confused
    explanation: การจัดเก็บข้อมูลไว้ที่เซิร์ฟเวอร์ส่วนกลางแห่งเดียวเป็นระบบรวมศูนย์ (Centralized) ที่เสี่ยงต่อการถูกเจาะระบบและแก้ไขข้อมูลจุดเดียว
      (Single Point of Failure)
  - id: '2'
    text: การกระจายศูนย์ (Decentralized) และการเข้ารหัสแบบลูกโซ่ที่ไม่สามารถย้อนแก้ไขได้
    explanation: ถูกต้อง บล็อกเชนใช้สมุดบัญชีแบบกระจายศูนย์ (Distributed Ledger) ร่วมกับ Hash ยืนยันความสมบูรณ์ของบล็อกก่อนหน้า
      ทำให้หากแก้ไขบล็อกใดบล็อกหนึ่ง แฮชจะเปลี่ยนและถูกปฏิเสธทันที
  - id: '3'
    text: การอนุญาตให้แอดมินลบประวัติย้อนหลังได้ทุกเมื่อ
    error_tag: mutable_admin_privilege_fallacy
    explanation: บล็อกเชนไม่มีแอดมินกลางที่สามารถแก้ไขหรือลบประวัติธุรกรรมย้อนหลังได้ตามใจชอบ (Immutability)
  - id: '4'
    text: การบีบอัดไฟล์ให้เหลือ 0 ไบต์
    error_tag: zero_byte_compression_absurdity
    explanation: การบีบอัดไฟล์เหลือ 0 ไบต์เป็นไปไม่ได้ในทฤษฎีสารสนเทศ
  - id: '5'
    text: การไม่ใช้คอมพิวเตอร์ในการประมวลผล
    error_tag: non_computational_absurdity
    explanation: บล็อกเชนต้องอาศัยการคำนวณและตรวจสอบจากเครื่องคอมพิวเตอร์ในเครือข่ายทั่วโลก
  correct_answer: '2'
  solution: "สถาปัตยกรรมความมั่นคงปลอดภัยของเทคโนโลยีบล็อกเชน (Blockchain Security Architecture)\nขั้นตอนที่ 1: กลไกสำคัญของเทคโนโลยีบล็อกเชน\
    \ (Blockchain)\n  บล็อกเชนเป็นเทคโนโลยีสมุดบัญชีแบบกระจายศูนย์ (Distributed Ledger Technology - DLT)\nขั้นตอนที่ 2: คุณสมบัติที่ทำให้ข้อมูลยากต่อการปลอมแปลง\
    \ (Tamper-Resistance / Immutability)\n  1. การกระจายศูนย์ (Decentralization): ไม่มีเซิร์ฟเวอร์กลาง ทุกโหนดในเครือข่ายมีสำเนาสมุดบัญชีชุดเดียวกัน\
    \ การจะแก้ไขข้อมูลต้องได้รับการยินยอมผ่าน Consensus Mechanism (เช่น PoW, PoS) เกิน 51% ของเครือข่าย\n  2. การเข้ารหัสแบบลูกโซ่\
    \ (Cryptographic Hash Chaining): แต่ละบล็อกจะเก็บค่าแฮชของบล็อกก่อนหน้า (Previous Hash) หากมีการแอบแก้ไขข้อมูลในบล็อกใด\
    \ ค่าแฮชจะเปลี่ยนทันที ทำให้สายโซ่ขาดออกจากกันและถูกปฏิเสธโดยโหนดอื่นในเครือข่าย\nขั้นตอนที่ 3: สรุปคำตอบ\n  คุณสมบัติเด่นคือ\
    \ การกระจายศูนย์ (Decentralized) และการเข้ารหัสแบบลูกโซ่ที่ไม่สามารถย้อนแก้ไขได้\nสรุป คำตอบคือ การกระจายศูนย์ (Decentralized)\
    \ และการเข้ารหัสแบบลูกโซ่ที่ไม่สามารถย้อนแก้ไขได้ (ตัวเลือก 2)"
- number: 61
  question_id: tpat3-70-q61
  topic: tpat3.logic_reasoning
  skill: syllogism
  score: 1.6
  answer_type: single_choice
  stem: 'กำหนดข้อความ: ''วิศวกรทุกคนต้องมีความคิดเชิงระบบ'' และ ''สมชายไม่มีความคิดเชิงระบบ'' ข้อสรุปใดสมเหตุสมผลที่สุด'
  options:
  - id: '1'
    text: สมชายเป็นวิศวกร
    error_tag: contradiction_of_modus_tollens
    explanation: ขัดแย้งกับหลักตรรกศาสตร์ เพราะถ้าสมชายเป็นวิศวกร สมชายจะต้องมีความคิดเชิงระบบตามเงื่อนไขที่กำหนด
  - id: '2'
    text: สมชายไม่ใช่คน
    error_tag: category_error_conclusion
    explanation: ข้อความไม่ได้กำหนดความสัมพันธ์ระหว่างความเป็นมนุษย์กับความคิดเชิงระบบ จึงเป็นการด่วนสรุปนอกขอบเขต
  - id: '3'
    text: สมชายไม่ใช่วิศวกร
    explanation: 'ถูกต้อง ตามกฎตรรกศาสตร์ Modus Tollens (ถ้า p แล้ว q, นิเสธ q สรุป นิเสธ p): วิศวกรทุกคนมีความคิดเชิงระบบ
      สมชายไม่มีความคิดเชิงระบบ จึงสรุปได้อย่างสมเหตุสมผลว่าสมชายไม่ใช่วิศวกร'
  - id: '4'
    text: วิศวกรบางคนไม่ใช่สมชาย
    error_tag: irrelevant_existential_statement
    explanation: ไม่ใช่ข้อสรุปเฉพาะเจาะจงที่ได้จากการเชื่อมโยงเหตุทั้งสองอย่างสมเหตุสมผล
  - id: '5'
    text: สรุปไม่ได้แน่ชัด
    error_tag: false_indeterminacy_claim
    explanation: รูปแบบตรรกศาสตร์นี้มีความสมบูรณ์ทางโครงสร้าง (Valid Syllogism) จึงสามารถสรุปผลได้อย่างแน่นอน
  correct_answer: '3'
  solution: "การอนุมานตรรกศาสตร์ตามกฎ Modus Tollens (Formal Logic & Syllogism)\nขั้นตอนที่ 1: วิเคราะห์ข้อความในรูปประพจน์เชิงตรรกะ\n\
    \  กำหนดให้:\n    p แทนข้อความ 'เป็นวิศวกร'\n    q แทนข้อความ 'มีความคิดเชิงระบบ'\n  ข้อความที่ 1: 'วิศวกรทุกคนต้องมีความคิดเชิงระบบ'\
    \ เขียนเป็นประพจน์เงื่อนไขได้ว่า: p -> q\n  ข้อความที่ 2: 'สมชายไม่มีความคิดเชิงระบบ' เขียนเป็นประพจน์ได้ว่า: ~q (นิเสธของ\
    \ q)\nขั้นตอนที่ 2: ประยุกต์กฎการอนุมานแบบ Modus Tollens\n  ตามหลักตรรกศาสตร์นิรนัย กฎ Modus Tollens ระบุว่า:\n    เหตุ\
    \ 1: p -> q (ถ้า p แล้ว q)\n    เหตุ 2: ~q (ไม่ใช่ q)\n    ผลสรุป: ~p (ไม่ใช่ p)\nขั้นตอนที่ 3: ตีความผลสรุปกลับสู่บริบทโจทย์\n\
    \  ผลลัพธ์ ~p คือ 'สมชายไม่ใช่วิศวกร'\nสรุป ข้อสรุปที่สมเหตุสมผลที่สุดคือ สมชายไม่ใช่วิศวกร (ตัวเลือก 3)"
- number: 62
  question_id: tpat3-70-q62
  topic: tpat3.logic_reasoning
  skill: conditional_logic
  score: 1.6
  answer_type: single_choice
  stem: ประพจน์ 'ถ้าฝนตกแล้วถนนจะเปียก' จะสมมูล (Equivalence) กับข้อความใด
  options:
  - id: '1'
    text: ถ้าถนนเปียกแล้วฝนตก
    error_tag: converse_fallacy
    explanation: q → p (บทกลับ) ไม่สมมูลกับ p → q เพราะถนนอาจเปียกจากสาเหตุอื่นได้ เช่น รถรดน้ำ
  - id: '2'
    text: ถ้าถนนไม่เปียกแล้วฝนไม่ตก
    explanation: ถูกต้อง ตามกฎ Contrapositive ประพจน์ p → q สมมูลกับ ~q → ~p เสมอ (ถ้าถนนไม่เปียก ย่อมแสดงว่าฝนต้องไม่ตก)
  - id: '3'
    text: ถ้าฝนไม่ตกแล้วถนนไม่เปียก
    error_tag: inverse_fallacy
    explanation: ~p → ~q (บทตรงข้าม) ไม่สมมูลกับ p → q เป็นข้อผิดพลาดในการอนุมาน (Denying the antecedent)
  - id: '4'
    text: ฝนตกและถนนเปียก
    error_tag: conjunction_fallacy
    explanation: p ∧ q เป็นประพจน์เชื่อมด้วย 'และ' ไม่สมมูลกับประพจน์เงื่อนไข
  - id: '5'
    text: ถนนเปียกหรือฝนตก
    error_tag: disjunction_fallacy
    explanation: p → q สมมูลกับ ~p ∨ q ไม่ใช่ q ∨ p
  correct_answer: '2'
  solution: "การสมมูลของประพจน์เงื่อนไขและแย้งสลับที่ (Conditional Logic & Contrapositive Equivalence)\nขั้นตอนที่ 1: กำหนดสัญลักษณ์ทางตรรกศาสตร์\n\
    \  ให้ p แทน 'ฝนตก'\n  ให้ q แทน 'ถนนเปียก'\n  ประพจน์ในโจทย์คือ: p -> q ('ถ้าฝนตกแล้วถนนจะเปียก')\nขั้นตอนที่ 2: ทบทวนกฎการสมมูลของประพจน์เงื่อนไข\
    \ (Logical Equivalences)\n  1. แย้งสลับที่ (Contrapositive): p -> q สมมูลกับ ~q -> ~p (ตารางค่าความจริงเหมือนกันทุกกรณี)\n\
    \  2. บทกลับ (Converse): q -> p ('ถ้าถนนเปียกแล้วฝนตก') ไม่สมมูลกับ p -> q\n  3. บทตรงข้าม (Inverse): ~p -> ~q ('ถ้าฝนไม่ตกแล้วถนนไม่เปียก')\
    \ ไม่สมมูลกับ p -> q\nขั้นตอนที่ 3: ตรวจสอบข้อความของ Contrapositive (~q -> ~p)\n  ~q คือ 'ถนนไม่เปียก'\n  ~p คือ 'ฝนไม่ตก'\n\
    \  ดังนั้น ข้อความที่สมมูลกันคือ 'ถ้าถนนไม่เปียกแล้วฝนไม่ตก'\nสรุป ประพจน์สมมูลคือ ถ้าถนนไม่เปียกแล้วฝนไม่ตก (ตัวเลือก\
    \ 2)"
- number: 63
  question_id: tpat3-70-q63
  topic: tpat3.logic_reasoning
  skill: cause_effect_analysis
  score: 1.6
  answer_type: single_choice
  stem: โรงงานพบว่าสินค้ามีตำหนิเพิ่มขึ้นในกะดึก การวิเคราะห์หาสาเหตุรากเหง้า (Root Cause) ควรเริ่มจากเครื่องมือใด
  options:
  - id: '1'
    text: แผนภูมิก้างปลา (Ishikawa Diagram) และ 5-Whys
    explanation: ถูกต้อง ในกระบวนการควบคุมคุณภาพและวิศวกรรมอุตสาหการ แผนภูมิก้างปลา (Fishbone/Ishikawa Diagram) จัดหมวดหมู่ปัจจัย
      4M1E และเทคนิค 5-Whys ใช้เจาะลึกเพื่อค้นหาสาเหตุรากเหง้าอย่างเป็นระบบ
  - id: '2'
    text: การไล่พนักงานกะดึกออกทันที
    error_tag: blame_culture_without_investigation
    explanation: การลงโทษพนักงานทันทีโดยไม่มีข้อมูลชี้ชัดเป็นการด่วนสรุปตามอคติและไม่ช่วยแก้ปัญหาเชิงระบบ
  - id: '3'
    text: การเพิ่มราคาขายสินค้า
    error_tag: irrelevant_commercial_reaction
    explanation: การขึ้นราคาไม่เกี่ยวข้องกับการแก้ปัญหาความบกพร่องในการผลิต และทำให้สูญเสียความสามารถในการแข่งขัน
  - id: '4'
    text: การยกเลิกการผลิตกะดึกถาวร
    error_tag: avoidant_drastic_action
    explanation: การยกเลิกกะดึกเป็นการหลีกเลี่ยงปัญหาที่กระทบต่อกำลังการผลิตรวมของโรงงานอย่างรุนแรง
  - id: '5'
    text: การลดเกณฑ์ตรวจสอบคุณภาพลง
    error_tag: compromising_quality_standards
    explanation: การลดมาตรฐานตรวจสอบจะส่งสินค้าไม่ได้คุณภาพไปสู่ลูกค้า ทำลายชื่อเสียงและความปลอดภัย
  correct_answer: '1'
  solution: "เครื่องมือวิเคราะห์สาเหตุรากเหง้าในการควบคุมคุณภาพ (Root Cause Analysis - RCA Tools)\nขั้นตอนที่ 1: หลักการแก้ปัญหาอย่างเป็นระบบในงานวิศวกรรมอุตสาหการ\
    \ (Industrial Engineering)\n  เมื่อเกิดปัญหาด้านคุณภาพ เช่น สินค้ามีตำหนิเพิ่มขึ้นในกะดึก การแก้ไขอย่างยั่งยืนต้องค้นหาสาเหตุรากเหง้า\
    \ (Root Cause) ไม่ใช่แก้ที่ปลายเหตุหรือใช้อารมณ์ตัดสิน\nขั้นตอนที่ 2: เครื่องมือมาตรฐานในการสืบค้นสาเหตุรากเหง้า\n  1.\
    \ แผนภูมิก้างปลา (Ishikawa / Fishbone Diagram หรือ Cause-and-Effect Diagram): จำแนกและระดมสมองหาสาเหตุที่เป็นไปได้ตามหมวดหมู่ปัจจัย\
    \ 4M1E (Man-คน, Machine-เครื่องจักร, Material-วัตถุดิบ, Method-วิธีการทำงาน, Environment-สภาพแวดล้อมเช่นแสงสว่าง/ความล้าตอนกลางคืน)\n\
    \  2. เทคนิค 5-Whys: การตั้งคำถาม 'ทำไม' ซ้ำๆ 5 ครั้งเพื่อเจาะลึกจากอาการที่เห็นไปสู่ต้นตอแท้จริง\nขั้นตอนที่ 3: สรุปคำตอบ\n\
    \  เครื่องมือเริ่มต้นที่ถูกต้องตามหลักวิศวกรรมคือ แผนภูมิก้างปลา (Ishikawa Diagram) และ 5-Whys\nสรุป คำตอบคือ แผนภูมิก้างปลา\
    \ (Ishikawa Diagram) และ 5-Whys (ตัวเลือก 1)"
- number: 64
  question_id: tpat3-70-q64
  topic: tpat3.logic_reasoning
  skill: engineering_ethics
  score: 1.6
  answer_type: single_choice
  stem: หากวิศวกรตรวจพบว่าโครงสร้างสะพานที่กำลังก่อสร้างไม่เป็นไปตามมาตรฐานความปลอดภัย และผู้รับเหมาเสนอเงินเพื่อขอให้เซ็นอนุมัติผ่าน
    วิศวกรควรปฏิบัติตามจรรยาบรรณวิชาชีพอย่างไร
  options:
  - id: '1'
    text: รับเงินและเซ็นอนุมัติเพื่อรักษาความสัมพันธ์
    error_tag: corrupt_collusion_safety_violation
    explanation: ผิดจรรยาบรรณวิชาชีพขั้นร้ายแรงและผิดกฎหมายอาญา เสี่ยงต่อความปลอดภัยในชีวิตของประชาชน
  - id: '2'
    text: ปฏิเสธการรับเงิน และรายงานข้อบกพร่องตามขั้นตอนทางวิชาชีพทันที
    explanation: ถูกต้อง จรรยาบรรณแห่งวิชาชีพวิศวกรรมยึดถือสวัสดิภาพและความปลอดภัยของสาธารณชนเป็นลำดับสูงสุด วิศวกรต้องปฏิเสธผลประโยชน์ทับซ้อน
      สินบน และรายงานความไม่ปลอดภัยตามสายงานทันที
  - id: '3'
    text: เพิกเฉยและลาออกจากงานเงียบๆ
    error_tag: passive_negligence_of_duty
    explanation: การละเลยไม่แจ้งเตือนอันตรายทำให้โครงสร้างที่ไม่ได้มาตรฐานยังถูกสร้างต่อ ถือว่าบกพร่องต่อความรับผิดชอบ
  - id: '4'
    text: เซ็นอนุมัติแล้วค่อยมาซ่อมภายหลังเปิดใช้งาน
    error_tag: postponing_critical_safety_hazard
    explanation: การเปิดใช้งานสะพานที่บกพร่องอาจเกิดการพังทลายและสร้างความเสียหายรุนแรง
  - id: '5'
    text: ขอเพิ่มจำนวนเงินก่อนพิจารณา
    error_tag: extortion_and_bribery
    explanation: เป็นการกระทำทุจริตและขู่กรรโชก ผิดกฎหมายอาญา
  correct_answer: '2'
  solution: "จรรยาบรรณวิชาชีพวิศวกรรมและความปลอดภัยสาธารณะ (Engineering Professional Ethics)\nขั้นตอนที่ 1: หลักการพื้นฐานของจรรยาบรรณวิศวกร\
    \ (Fundamental Canons of Engineering Ethics)\n  ตามข้อบังคับของสภาวิศวกรและมาตรฐานสากล (NSPE / IEEE): 'วิศวกรต้องถือว่าความปลอดภัย\
    \ สุขภาพ และสวัสดิภาพของสาธารณชนเป็นสิ่งสำคัญสูงสุด' (Hold paramount the safety, health, and welfare of the public)\n\
    ขั้นตอนที่ 2: การวิเคราะห์สถานการณ์ตามหลักจริยธรรม\n  - ตรวจพบโครงสร้างสะพานไม่เป็นไปตามมาตรฐานความปลอดภัย: เสี่ยงต่อการพังทลายและเป็นอันตรายถึงชีวิตของผู้ใช้ทาง\n\
    \  - ผู้รับเหมาเสนอเงินเพื่อขอให้เซ็นอนุมัติผ่าน: ถือเป็นการให้สินบน (Bribery) และการทุจริตต่อวิชาชีพ\nขั้นตอนที่ 3: แนวทางปฏิบัติที่ถูกต้องตามจรรยาบรรณ\n\
    \  วิศวกรต้องปฏิเสธการรับเงินสินบนโดยเด็ดขาด และจัดทำรายงานชี้แจงข้อบกพร่องตามขั้นตอนทางวิศวกรรมและสายงานบังคับบัญชาทันทีเพื่อระงับความเสี่ยง\n\
    สรุป คำตอบคือ ปฏิเสธการรับเงิน และรายงานข้อบกพร่องตามขั้นตอนทางวิชาชีพทันที (ตัวเลือก 2)"
- number: 65
  question_id: tpat3-70-q65
  topic: tpat3.logic_reasoning
  skill: pattern_matrices
  score: 1.6
  answer_type: single_choice
  stem: 'พิจารณาความสัมพันธ์: รถยนต์ : น้ำมันเชื้อเพลิง :: เซลล์สิ่งมีชีวิต : ?'
  options:
  - id: '1'
    text: ดีเอ็นเอ
    error_tag: confused_blueprint_with_energy_source
    explanation: DNA ทำหน้าที่เก็บรหัสพันธุกรรม เปรียบเสมือนแบบแปลนโครงสร้าง ไม่ใช่แหล่งพลังงานขับเคลื่อน
  - id: '2'
    text: สารอาหารกลูโคสและ ATP
    explanation: 'ถูกต้อง ความสัมพันธ์เชิงอุปมาอุปไมย (Analogy): น้ำมันเชื้อเพลิงเป็นสารให้พลังงานขับเคลื่อนเครื่องยนต์ของรถยนต์
      เช่นเดียวกับกลูโคสและ ATP ที่เป็นสารชีวโมเลกุลให้พลังงานเคมีขับเคลื่อนกระบวนการต่างๆ ภายในเซลล์'
  - id: '3'
    text: ออกซิเจนบริสุทธิ์ 100%
    error_tag: oxidizer_confused_with_fuel
    explanation: ออกซิเจนเป็นตัวรับอิเล็กตรอนในการหายใจระดับเซลล์ เปรียบเสมือนอากาศที่ช่วยเผาไหม้ ไม่ใช่เชื้อเพลิงหลัก
  - id: '4'
    text: น้ำเกลือ
    error_tag: electrolyte_confused_with_energy
    explanation: น้ำเกลือเป็นสารละลายอิเล็กโทรไลต์เพื่อรักษาสมดุลแรงดันออสโมซิส ไม่ใช่สารให้พลังงานเคมี
  - id: '5'
    text: แสงแดด
    error_tag: external_energy_photosynthesis_only
    explanation: แสงแดดเป็นพลังงานภายนอกเฉพาะในเซลล์พืช แต่เซลล์สัตว์และสิ่งมีชีวิตทั่วไปใช้กลูโคสและ ATP
  correct_answer: '2'
  solution: "การคิดเชิงอุปมาอุปไมยและความสัมพันธ์เชิงหน้าที่ (Functional Analogical Reasoning)\nขั้นตอนที่ 1: วิเคราะห์คู่ความสัมพันธ์แรก\
    \ (รถยนต์ : น้ำมันเชื้อเพลิง)\n  - รถยนต์ (เครื่องจักร) เป็นระบบกลไกที่ต้องการพลังงานในการทำงาน\n  - น้ำมันเชื้อเพลิง\
    \ ทำหน้าที่เป็น 'สารตั้งต้นที่ให้พลังงานเคมี (Energy Source)' ผ่านการเผาไหม้เพื่อขับเคลื่อนการทำงานของรถยนต์\nขั้นตอนที่\
    \ 2: เทียบเคียงกับคู่ความสัมพันธ์ที่สอง (เซลล์สิ่งมีชีวิต : ?)\n  - เซลล์สิ่งมีชีวิต (หน่วยทางชีววิทยา) ต้องการพลังงานเคมีในการขับเคลื่อนกระบวนการเมแทบอลิซึมและการทำงานต่างๆ\n\
    \  - สิ่งที่ทำหน้าที่เป็น 'แหล่งพลังงานเคมีหลัก' ที่เซลล์นำไปสลายและใช้งานโดยตรงคือ สารอาหารกลูโคส (Glucose) และสารพลังงานสูง\
    \ ATP (Adenosine Triphosphate)\nขั้นตอนที่ 3: สรุปคำตอบ\n  คู่ความสัมพันธ์ที่สอดคล้องกันคือ สารอาหารกลูโคสและ ATP\nสรุป\
    \ คำตอบคือ สารอาหารกลูโคสและ ATP (ตัวเลือก 2)"
- number: 66
  question_id: tpat3-70-q66
  topic: tpat3.logic_reasoning
  skill: falsifiability_popper
  score: 1.6
  answer_type: single_choice
  stem: ตามหลักปรัชญาวิทยาศาสตร์ สมมติฐานที่ดีทางวิทยาศาสตร์จะต้องมีคุณสมบัติสำคัญในข้อใด
  options:
  - id: '1'
    text: ต้องเป็นความจริงสัมบูรณ์ที่ไม่สามารถหักล้างได้
    error_tag: dogmatic_absolutism_fallacy
    explanation: ความจริงสัมบูรณ์ที่ไม่เปิดให้หักล้างเป็นลักษณะของลัทธิความเชื่อ (Dogma) ไม่ใช่วิทยาศาสตร์ที่พัฒนาจากการตรวจสอบ
  - id: '2'
    text: ต้องสามารถทดสอบและมีโอกาสถูกพิสูจน์ว่าเป็นเท็จได้ (Falsifiability)
    explanation: ถูกต้อง ตามหลักปรัชญาวิทยาศาสตร์ของ คาร์ล ป็อปเปอร์ (Karl Popper) สมมติฐานทางวิทยาศาสตร์ต้องมีคุณสมบัติ Falsifiability
      คือสามารถออกแบบการทดลองที่มีโอกาสพิสูจน์ว่าข้อเสนอนั้นเป็นเท็จได้
  - id: '3'
    text: ต้องได้รับการยอมรับจากคนส่วนใหญ่โดยไม่ต้องทดลอง
    error_tag: appeal_to_popularity_fallacy
    explanation: วิทยาศาสตร์ตัดสินด้วยหลักฐานเชิงประจักษ์และการทดลอง ไม่ใช่ความนิยมของคนส่วนใหญ่ (Appeal to popularity)
  - id: '4'
    text: ต้องไม่มีสมการคณิตศาสตร์เกี่ยวข้อง
    error_tag: anti_mathematical_bias
    explanation: คณิตศาสตร์เป็นเครื่องมือพื้นฐานที่จำเป็นในการสร้างโมเดลและพิสูจน์ทฤษฎีทางวิทยาศาสตร์
  - id: '5'
    text: ต้องทำนายอนาคตได้ถูกต้อง 100% เสมอ
    error_tag: unrealistic_deterministic_perfection
    explanation: ทฤษฎีทางวิทยาศาสตร์มีขอบเขตความคลาดเคลื่อนและการพัฒนาต่อยอด ไม่มีทฤษฎีใดสมบูรณ์แบบถาวรโดยไม่ถูกท้าทาย
  correct_answer: '2'
  solution: "ปรัชญาวิทยาศาสตร์และหลักการพิสูจน์ว่าเป็นเท็จได้ของคาร์ล ป็อปเปอร์ (Philosophy of Science & Falsifiability)\n\
    ขั้นตอนที่ 1: ทฤษฎีปรัชญาวิทยาศาสตร์ของ Karl Popper\n  คาร์ล ป็อปเปอร์ (Karl Popper) เสนอปัญหาการแบ่งเขต (Demarcation\
    \ Problem) เพื่อแยกแยะ 'วิทยาศาสตร์แท้' ออกจาก 'วิทยาศาสตร์เทียม (Pseudoscience)' หรือความเชื่อทางอภิปรัชญา\nขั้นตอนที่\
    \ 2: นิยามของ Falsifiability (ความสามารถในการถูกพิสูจน์ว่าเป็นเท็จได้)\n  - สมมติฐานที่ดีทางวิทยาศาสตร์ต้องมีความชัดเจนและกล้าหาญพอที่จะเปิดโอกาสให้สังเกตหรือทดลองเพื่อหักล้างได้\n\
    \  - หากสมมติฐานใดถูกตั้งขึ้นมาในลักษณะที่ไม่ว่าผลการทดลองจะออกมาเป็นอย่างไรก็อธิบายเข้าข้างตัวเองได้เสมอและไม่มีทางพิสูจน์ว่าผิดได้\
    \ สมมติฐานนั้นไม่ใช่หลักการทางวิทยาศาสตร์\nขั้นตอนที่ 3: สรุปคำตอบ\n  สมมติฐานที่ดีทางวิทยาศาสตร์ต้อง 'สามารถทดสอบและมีโอกาสถูกพิสูจน์ว่าเป็นเท็จได้\
    \ (Falsifiability)'\nสรุป คำตอบคือ ต้องสามารถทดสอบและมีโอกาสถูกพิสูจน์ว่าเป็นเท็จได้ (Falsifiability) (ตัวเลือก 2)"
- number: 67
  question_id: tpat3-70-q67
  topic: tpat3.logic_reasoning
  skill: critical_path_method
  score: 1.6
  answer_type: single_choice
  stem: ในแผนงานโครงการวิศวกรรม เส้นทางวิกฤต (Critical Path) คือเส้นทางที่ส่งผลต่อโครงการอย่างไรมากที่สุด
  options:
  - id: '1'
    text: เส้นทางที่มีค่าใช้จ่ายต่ำที่สุด
    error_tag: least_cost_path_confused
    explanation: Critical Path พิจารณาจากระยะเวลาของกิจกรรม ไม่ใช่เส้นทางที่มีค่าใช้จ่ายต่ำที่สุด
  - id: '2'
    text: เส้นทางของกิจกรรมที่ใช้เวลานานที่สุด ซึ่งหากล่าช้าจะทำให้ทั้งโครงการล่าช้าทันที
    explanation: ถูกต้อง ในการบริหารโครงการ (CPM) เส้นทางวิกฤตคือลำดับกิจกรรมที่ต่อเนื่องกันยาวนานที่สุด มีเวลาเผื่อ (Float/Slack)
      เท่ากับศูนย์ หากกิจกรรมบนเส้นทางนี้ล่าช้าแม้แต่วันเดียว โครงการทั้งหมดจะล่าช้าทันที
  - id: '3'
    text: เส้นทางที่มีพนักงานมากที่สุด
    error_tag: resource_headcount_confused
    explanation: สายงานวิกฤตไม่ได้วัดจากจำนวนบุคลากรหรือพนักงานในกิจกรรม
  - id: '4'
    text: เส้นทางที่ไม่จำเป็นต้องทำก็ได้
    error_tag: optional_scope_confused
    explanation: กิจกรรมบนสายงานวิกฤตเป็นงานจำเป็นหลักที่ขาดไม่ได้
  - id: '5'
    text: เส้นทางที่เสร็จสิ้นเร็วที่สุด
    error_tag: shortest_duration_path_confused
    explanation: เส้นทางที่ใช้เวลาน้อยที่สุดมักมีเวลาเผื่อว่าง (Float สูง) และไม่กำหนดเวลาสิ้นสุดของโครงการ
  correct_answer: '2'
  solution: "การบริหารโครงการวิศวกรรมด้วยวิธีสายงานวิกฤต (Critical Path Method - CPM)\nขั้นตอนที่ 1: นิยามของสายงานวิกฤต (Critical\
    \ Path)\n  ในแผนผังเครือข่ายโครงการ (Project Network Diagram) สายงานวิกฤตคือ 'ลำดับกิจกรรมที่ต่อเนื่องกันยาวนานที่สุดจากจุดเริ่มต้นจนถึงสิ้นสุดโครงการ'\n\
    ขั้นตอนที่ 2: คุณลักษณะเฉพาะของกิจกรรมบนสายงานวิกฤต\n  - เป็นเส้นทางที่กำหนด 'ระยะเวลาที่สั้นที่สุดที่โครงการจะแล้วเสร็จสมบูรณ์ได้'\n\
    \  - กิจกรรมทุกตัวบนสายงานนี้จะมีค่าเวลาเผื่อว่าง (Total Float / Slack Time) เท่ากับศูนย์ (Float = 0)\n  - ผลกระทบ: หากมีกิจกรรมใดกิจกรรมหนึ่งบนสายงานวิกฤตล่าช้าไปแม้แต่วันเดียว\
    \ จะส่งผลให้ 'วันสิ้นสุดของโครงการทั้งหมดล่าช้าออกไปทันที'\nขั้นตอนที่ 3: สรุปคำตอบ\n  สายงานวิกฤตคือ เส้นทางของกิจกรรมที่ใช้เวลานานที่สุด\
    \ ซึ่งหากล่าช้าจะทำให้ทั้งโครงการล่าช้าทันที\nสรุป คำตอบคือ เส้นทางของกิจกรรมที่ใช้เวลานานที่สุด ซึ่งหากล่าช้าจะทำให้ทั้งโครงการล่าช้าทันที\
    \ (ตัวเลือก 2)"
- number: 68
  question_id: tpat3-70-q68
  topic: tpat3.logic_reasoning
  skill: fairness_algorithm
  score: 1.6
  answer_type: single_choice
  stem: การพัฒนาปัญญาประดิษฐ์ (AI) ในระบบคัดเลือกคนเข้าศึกษาต่อ สิ่งสำคัญที่ต้องระมัดระวังเพื่อความยุติธรรมคือข้อใด
  options:
  - id: '1'
    text: การให้อัลกอริทึมทำงานช้าลง
    error_tag: throughput_degradation_irrelevant
    explanation: ความเร็วในการประมวลผลไม่เกี่ยวข้องกับความยุติธรรมของผลลัพธ์
  - id: '2'
    text: การป้องกันอคติในชุดข้อมูลฝึกสอน (Data Bias) ที่อาจเลือกปฏิบัติต่อกลุ่มประชากร
    explanation: ถูกต้อง ปัญหา Algorithmic Bias เกิดจากข้อมูลในอดีตที่มีอคติเชิงโครงสร้าง การพัฒนา AI จึงต้องมีมาตรการตรวจสอบความเที่ยงธรรม
      (Fairness) เพื่อไม่ให้ระบบเลือกปฏิบัติต่อกลุ่มประชากรตามเพศ ฐานะ หรือภูมิหลัง
  - id: '3'
    text: การห้ามไม่ให้ใช้คอมพิวเตอร์
    error_tag: technophobia_absurdity
    explanation: เป็นการปฏิเสธเทคโนโลยีโดยสิ้นเชิง ไม่ใช่แนวทางแก้ปัญหาทางจริยธรรม
  - id: '4'
    text: การสุ่มผลลัพธ์แบบเดาสุ่ม 100%
    error_tag: pure_randomness_fallacy
    explanation: การสุ่มเดาไร้เหตุผลขัดกับเป้าหมายการคัดเลือกตามศักยภาพและความสามารถ
  - id: '5'
    text: การไม่เปิดเผยผลการสอบแก่นักเรียน
    error_tag: lack_of_transparency
    explanation: การปิดบังผลการสอบขัดต่อหลักการโปร่งใสและตรวจสอบได้ (Explainability & Transparency)
  correct_answer: '2'
  solution: "จริยธรรมปัญญาประดิษฐ์และความเป็นธรรมของอัลกอริทึม (AI Ethics & Algorithmic Fairness)\nขั้นตอนที่ 1: ความเสี่ยงในการใช้\
    \ AI ตัดสินใจคัดเลือกบุคคล (High-Stakes AI Decision Making)\n  การนำ AI มาใช้ในงานที่มีผลต่ออนาคตของคน เช่น การคัดเลือกเข้าเรียนหรือรับเข้าทำงาน\
    \ อาจเกิดความไม่เป็นธรรมหากไม่ได้รับการควบคุมอย่างรอบคอบ\nขั้นตอนที่ 2: สาเหตุของความไม่เป็นธรรม (Data Bias & Historical\
    \ Prejudice)\n  - โมเดล AI เรียนรู้จากข้อมูลในอดีต (Training Data) หากข้อมูลในอดีตมีอคติ เช่น การเลือกปฏิบัติตามเพศ ฐานะ\
    \ หรือภูมิหลัง โมเดลจะจดจำและขยายผลอคตินั้นต่อไป\n  - การขาดตัวแทนข้อมูลที่ครอบคลุม (Sampling Bias) อาจทำให้โมเดลตัดสินใจผิดพลาดต่อกลุ่มประชากรชายขอบ\n\
    ขั้นตอนที่ 3: สรุปประเด็นสำคัญที่ต้องระมัดระวัง\n  สิ่งสำคัญที่สุดเพื่อความยุติธรรมคือ 'การป้องกันอคติในชุดข้อมูลฝึกสอน\
    \ (Data Bias) ที่อาจเลือกปฏิบัติต่อกลุ่มประชากร'\nสรุป คำตอบคือ การป้องกันอคติในชุดข้อมูลฝึกสอน (Data Bias) ที่อาจเลือกปฏิบัติต่อกลุ่มประชากร\
    \ (ตัวเลือก 2)"
- number: 69
  question_id: tpat3-70-q69
  topic: tpat3.logic_reasoning
  skill: tcas_regulation
  score: 1.6
  answer_type: single_choice
  stem: ข้อสอบ TPAT3 จัดสอบโดย ทปอ. เป็นข้อสอบวัดความถนัดที่เน้นวัดสิ่งใดเป็นสำคัญ
  options:
  - id: '1'
    text: การท่องจำเนื้อหาตามตำราเรียนทั้งหมด 100%
    error_tag: rote_memorization_misconception
    explanation: TPAT3 เป็นข้อสอบวัดความถนัด (Aptitude) และการคิดประยุกต์ ไม่เน้นการท่องจำเนื้อหาล้วนเหมือน A-Level
  - id: '2'
    text: ศักยภาพ ความถนัด และกระบวนการคิดเชิงวิทยาศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์
    explanation: ถูกต้อง โครงสร้างข้อสอบ TPAT3 ของ ทปอ. เน้นประเมินความถนัดเชิงตัวเลข มิติสัมพันธ์ เชิงกลและฟิสิกส์ประยุกต์
      ตลอดจนความคิดเชิงตรรกะและเทคโนโลยี
  - id: '3'
    text: การวาดภาพจิตรกรรมสีน้ำ
    error_tag: fine_arts_tpat2_confused
    explanation: ทักษะทางศิลปะเป็นเนื้อหาการสอบของ TPAT2 (ความถนัดศิลปกรรมศาสตร์)
  - id: '4'
    text: ความรู้ด้านประวัติศาสตร์โบราณคดี
    error_tag: social_studies_confused
    explanation: ความรู้ประวัติศาสตร์เป็นสาระในกลุ่มวิชาสังคมศึกษา ไม่เกี่ยวกับ TPAT3
  - id: '5'
    text: ทักษะการเล่นกีฬา
    error_tag: physical_education_confused
    explanation: ทักษะกีฬาไม่ใช่เนื้อหาการทดสอบของ TPAT3
  correct_answer: '2'
  solution: "โครงสร้างและวัตถุประสงค์ของข้อสอบ TPAT3 ตามกรอบ ทปอ. (TPAT3 Framework & Assessment Objectives)\nขั้นตอนที่ 1:\
    \ วัตถุประสงค์การจัดสอบ TPAT3 โดยที่ประชุมอธิการบดีแห่งประเทศไทย (ทปอ.)\n  TPAT3 (Thai Professional Aptitude Test 3) คือแบบทดสอบความถนัดด้านวิทยาศาสตร์\
    \ เทคโนโลยี และวิศวกรรมศาสตร์\nขั้นตอนที่ 2: โครงสร้างการวัดและประเมินผล\n  ข้อสอบแบ่งออกเป็น 2 ส่วนหลัก:\n  1. ส่วนความถนัด\
    \ (Aptitude Test: 60 คะแนน): ความถนัดเชิงตัวเลข (Numerical Reasoning), ความถนัดเชิงมิติสัมพันธ์ (Spatial Relations), และความถนัดเชิงกลและฟิสิกส์ประยุกต์\
    \ (Mechanical & Physics Reasoning)\n  2. ส่วนความคิดและความสนใจ (Thinking & Awareness: 40 คะแนน): ความคิดเชิงวิทยาศาสตร์และเทคโนโลยี\
    \ และความรู้ความเข้าใจด้านตรรกะและเทคโนโลยี\nขั้นตอนที่ 3: สรุปสิ่งที่เน้นวัด\n  ข้อสอบไม่ได้วัดการท่องจำเนื้อหาตามตำราแบบ\
    \ A-Level แต่วัด 'ศักยภาพ ความถนัด และกระบวนการคิดเชิงวิทยาศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์'\nสรุป คำตอบคือ ศักยภาพ\
    \ ความถนัด และกระบวนการคิดเชิงวิทยาศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์ (ตัวเลือก 2)"
- number: 70
  question_id: tpat3-70-q70
  topic: tpat3.logic_reasoning
  skill: cybersecurity_phishing
  score: 1.6
  answer_type: single_choice
  stem: หากได้รับอีเมลแจ้งว่า 'บัญชีระบบสอบของคุณกำลังจะถูกลบ กรุณาคลิกลิงก์และกรอกรหัสผ่านทันที' วิธีการปฏิบัติตนที่ถูกต้องและปลอดภัยที่สุดคือข้อใด
  options:
  - id: '1'
    text: รีบคลิกลิงก์และกรอกรหัสผ่านทันทีเพื่อไม่ให้โดนลบ
    error_tag: falling_victim_to_credential_phishing
    explanation: การคลิกลิงก์และกรอกรหัสผ่านจะทำให้ผู้ไม่หวังดีขโมยข้อมูลประจำตัว (Credentials) ไปได้ทันที
  - id: '2'
    text: ส่งรหัสผ่านให้เพื่อนช่วยกรอก
    error_tag: credential_sharing_security_risk
    explanation: การเปิดเผยรหัสผ่านแก่ผู้อื่นเป็นการละเมิดความปลอดภัยของบัญชีและไม่ช่วยป้องกันการถูกหลอก
  - id: '3'
    text: ตรวจสอบ URL ผู้ส่ง และเข้าสู่เว็บไซต์หลักของระบบโดยตรงโดยไม่คลิกลิงก์ในอีเมลแปลกปลอม (ป้องกัน Phishing)
    explanation: ถูกต้อง อีเมลดังกล่าวมีลักษณะของฟิชชิง (Phishing Attack) ที่สร้างความตื่นตระหนกเพื่อขโมยรหัสผ่าน วิธีที่ปลอดภัยที่สุดคือไม่คลิกลิงก์ใดๆ
      ในอีเมล และเปิดเบราว์เซอร์พิมพ์ URL ทางการของระบบเพื่อตรวจสอบด้วยตนเอง
  - id: '4'
    text: ตอบกลับอีเมลพร้อมแนบภาพบัตรประชาชน
    error_tag: identity_theft_pii_exposure
    explanation: การส่งข้อมูลส่วนบุคคล (PII) เช่น บัตรประชาชน ให้ผู้ไม่หวังดีจะนำไปสู่การขโมยอัตลักษณ์ (Identity Theft)
  - id: '5'
    text: โอนเงินตามที่อีเมลร้องขอ
    error_tag: financial_fraud_victim
    explanation: ระบบการสอบไม่มีการเรียกเก็บเงินเพื่อรักษาสถานะบัญชีในลักษณะนี้ เป็นการหลอกลวงทางการเงิน
  correct_answer: '3'
  solution: "ความตระหนักรู้ด้านความมั่นคงปลอดภัยไซเบอร์และการป้องกันฟิชชิง (Cybersecurity & Phishing Prevention)\nขั้นตอนที่\
    \ 1: ลักษณะของการโจมตีแบบฟิชชิง (Phishing Attack)\n  การส่งอีเมลปลอมแปลงที่สร้างสถานการณ์ฉุกเฉินและข่มขู่ เช่น 'บัญชีจะถูกลบ'\
    \ เพื่อบีบให้ผู้ใช้เกิดความตื่นตระหนกและรีบคลิกลิงก์เพื่อกรอกข้อมูลส่วนตัวหรือรหัสผ่านบนเว็บไซต์ปลอม\nขั้นตอนที่ 2: แนวทางการรับมือที่ปลอดภัยตามหลักสากล\
    \ (Cybersecurity Best Practices)\n  1. ตรวจสอบชื่อผู้ส่งและโดเมนอีเมลอย่างละเอียด (มักสะกดผิดหรือใช้โดเมนแปลกปลอม)\n \
    \ 2. 'ห้ามคลิกลิงก์' หรือเปิดไฟล์แนบในอีเมลที่ไม่น่าไว้วางใจโดยเด็ดขาด\n  3. หากต้องการตรวจสอบสถานะบัญชี ให้เปิดเบราว์เซอร์ใหม่และพิมพ์\
    \ URL เว็บไซต์ทางการของระบบโดยตรงด้วยตนเอง\nขั้นตอนที่ 3: สรุปคำตอบ\n  วิธีการที่ถูกต้องและปลอดภัยที่สุดคือ 'ตรวจสอบ URL\
    \ ผู้ส่ง และเข้าสู่เว็บไซต์หลักของระบบโดยตรงโดยไม่คลิกลิงก์ในอีเมลแปลกปลอม (ป้องกัน Phishing)'\nสรุป คำตอบคือ ตรวจสอบ\
    \ URL ผู้ส่ง และเข้าสู่เว็บไซต์หลักของระบบโดยตรงโดยไม่คลิกลิงก์ในอีเมลแปลกปลอม (ตัวเลือก 3)"
