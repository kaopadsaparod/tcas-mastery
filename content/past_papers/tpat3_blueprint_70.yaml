- number: 36
  question_id: tpat3-70-q36
  topic: tpat3.engineering_mechanics
  skill: kinetic_energy_work
  score: 1.3333333333333333
  answer_type: single_choice
  stem: วัตถุมวล 2 kg เคลื่อนที่ด้วยความเร็ว 10 m/s ถ้ามีแรงต้านกระทำจนกระทั่งความเร็วลดลงเหลือ 6 m/s งานของแรงต้านมีขนาดกี่จูล
  options:
