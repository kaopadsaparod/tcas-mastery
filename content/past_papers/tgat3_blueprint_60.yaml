  correct_answer: '2'
  solution: "การมีส่วนร่วมของพลเมืองต้องใช้หลักฐานเชิงประจักษ์ (Data Collection) และกระบวนการตามกฎหมายเพื่อความยั่งยืน ตัวเลือก 2 เป็นแนวทางประชาธิปไตยที่มีพลังและถูกต้อง"

- number: 49
  question_id: tgat3-60-q49
  topic: tgat3.civic_engagement
  skill: esg_sustainability
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "บริษัทของคุณกำลังพิจารณาโครงการที่สร้างผลกำไรสูงมาก แต่กระบวนการผลิตจะปล่อยน้ำเสียที่อาจส่งผลกระทบต่อแหล่งน้ำของชุมชนในระยะยาว ในฐานะตัวแทนฝ่ายวางแผน คุณควรเสนอความเห็นอย่างไร"
  options:
  - id: '1'
    text: "เสนอให้จัดสรรงบประมาณติดตั้งระบบบำบัดน้ำเสียมาตรฐานสากล และทำประชาพิจารณ์รับฟังความคิดเห็นของชุมชนก่อนดำเนินโครงการ"
    correct: true
    explanation: "ดำเนินธุรกิจอย่างรับผิดชอบตามหลัก ESG คำนึงถึงสิ่งแวดล้อมและเสียงของชุมชน"
  - id: '2'
    text: "สนับสนุนโครงการเต็มที่เพราะผลกำไรของบริษัทสำคัญที่สุด ชุมชนจะเป็นอย่างไรไม่ใช่เรื่องของเรา"
    correct: false
    error_tag: prioritizes_private_over_public_interest
    explanation: "ยึดกำไรส่วนตัว ละเลยความรับผิดชอบต่อสังคมและสิ่งแวดล้อม (ESG)"
  - id: '3'
    text: "แอบปล่อยน้ำเสียในเวลากลางคืนเพื่อไม่ให้ชาวบ้านและเจ้าหน้าที่ตรวจพบ"
    correct: false
    error_tag: ethical_violation
    explanation: "ละเมิดกฎหมายอย่างร้ายแรงและทำลายสิ่งแวดล้อมอย่างไม่อาจยอมรับได้"
  - id: '4'
    text: "ลาออกจากบริษัทเงียบๆ เพื่อจะได้ไม่ต้องรับรู้ผลกระทบที่จะเกิดขึ้น"
    correct: false
    error_tag: passive_bystander
    explanation: "เพิกเฉยและละทิ้งโอกาสในการทักท้วงเพื่อปกป้องประโยชน์สาธารณะ"
  correct_answer: '1'
  solution: "หลักบรรษัทภิบาลและการพัฒนาที่ยั่งยืน (ESG) เรียกร้องให้ธุรกิจเติบโตควบคู่กับการดูแลสิ่งแวดล้อมและชุมชน ตัวเลือก 1 เป็นข้อเสนอที่รับผิดชอบต่อสังคมอย่างแท้จริง"

- number: 50
  question_id: tgat3-60-q50
  topic: tgat3.civic_engagement
  skill: universal_design
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการจัดงานนิทรรศการสาธารณะของโรงเรียน การออกแบบตามหลัก 'Universal Design' เพื่อส่งเสริมความเท่าเทียม (Inclusivity) ควรคำนึงถึงสิ่งใด"
  options:
  - id: '1'
    text: "ออกแบบเฉพาะบันไดสูงชันเพื่อให้ดูโอ่อ่า โดยไม่จำเป็นต้องสร้างทางลาด"
    correct: false
    error_tag: discriminatory_bias
    explanation: "กีดกันผู้ใช้วีลแชร์ ผู้สูงอายุ และคนพิการจากการเข้าร่วมงาน"
  - id: '2'
    text: "ไม่อนุญาตให้ผู้พิการเข้าร่วมงานเพราะเกรงว่าจะทำให้การจัดงานล่าช้า"
    correct: false
    error_tag: discriminatory_bias
    explanation: "เป็นการเลือกปฏิบัติอย่างไม่เป็นธรรมและละเมิดสิทธิมนุษยชน"
  - id: '3'
    text: "สร้างทางลาดเฉพาะจุดที่ลับตาคนเพื่อประหยัดงบประมาณ"
    correct: false
    error_tag: superficial_innovation
    explanation: "ปฏิบัติแบบขอไปทีและไม่ได้คำนึงถึงความสะดวกปลอดภัยที่แท้จริง"
  - id: '4'
    text: "จัดเตรียมทางลาด ป้ายอักษรเบรลล์ คำบรรยายเสียง และทางเดินที่กว้างขวางเพื่อให้คนทุกกลุ่มรวมถึงคนพิการสามารถเข้าถึงได้อย่างเสมอภาค"
    correct: true
    explanation: "การออกแบบเพื่อคนทั้งมวลช่วยให้ทุกคนเข้าถึงพื้นที่และบริการได้อย่างเท่าเทียมและมีศักดิ์ศรี"
  correct_answer: '4'
  solution: "Universal Design (การออกแบบเพื่อทุกคน) มุ่งเน้นให้คนทุกวัยและทุกสภาพร่างกายสามารถเข้าถึงพื้นที่และบริการได้อย่างเท่าเทียมและมีศักดิ์ศรี ตัวเลือก 4 ถูกต้องตามหลักการ"

- number: 51
  question_id: tgat3-60-q51
  topic: tgat3.civic_engagement
  skill: pdpa_data_privacy
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณสังเกตเห็นว่าระบบคอมพิวเตอร์ของหน่วยงานแสดงหมายเลขบัตรประชาชนและเบอร์โทรศัพท์ของประชาชนสู่สาธารณะโดยไม่มีการเข้ารหัส การเป็นพลเมืองที่มีความรับผิดชอบต่อสิทธิข้อมูลส่วนบุคคล (PDPA) คือข้อใด"
  options:
  - id: '1'
    text: "นำข้อมูลเหล่านั้นไปขายให้บริษัทประกันเพื่อหารายได้พิเศษ"
    correct: false
    error_tag: ethical_violation
    explanation: "ละเมิดกฎหมายคุ้มครองข้อมูลส่วนบุคคลและก่ออาชญากรรมทางไซเบอร์"
  - id: '2'
    text: "รีบแจ้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล (DPO) หรือฝ่ายเทคโนโลยีสารสนเทศเพื่อระงับการเข้าถึงและแก้ไขช่องโหว่ความปลอดภัยทันที"
    correct: true
    explanation: "แจ้งเตือนผู้รับผิดชอบทันทีเพื่อปกป้องสิทธิและความปลอดภัยในข้อมูลส่วนบุคคลของประชาชน"
  - id: '3'
    text: "แคปหน้าจอข้อมูลของคนดังไปโพสต์แชร์ในกลุ่มเพื่อนเพื่อความสนุกสนาน"
    correct: false
    error_tag: irresponsible_information_sharing
    explanation: "ละเมิดสิทธิความเป็นส่วนตัวของผู้อื่นและผิดกฎหมายคอมพิวเตอร์"
  - id: '4'
    text: "เพิกเฉยเพราะคิดว่าไม่ใช่ข้อมูลของตนเอง จึงไม่มีความจำเป็นต้องใส่ใจ"
    correct: false
    error_tag: passive_bystander
    explanation: "ละเลยต่อความปลอดภัยของสังคมส่วนรวม"
  correct_answer: '2'
  solution: "การปกป้องข้อมูลส่วนบุคคลเป็นหน้าที่ของทุกคนในยุคดิจิทัล การแจ้งผู้รับผิดชอบทันทีช่วยป้องกันความเสียหายต่อประชาชนในวงกว้าง ตัวเลือก 2 แสดงถึงความรับผิดชอบต่อสังคม"

- number: 52
  question_id: tgat3-60-q52
  topic: tgat3.civic_engagement
  skill: anti_corruption
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในช่วงเทศกาลปีใหม่ มีบริษัทคู่ค้าส่งกระเช้าของขวัญมูลค่าสูงพร้อมซองเงินสดมาให้คุณเป็นการส่วนตัว ในขณะที่คุณกำลังทำหน้าที่เป็นกรรมการตรวจรับพัสดุ แนวทางปฏิบัติที่ถูกต้องตามหลักคุณธรรมและความโปร่งใสคือข้อใด"
  options:
  - id: '1'
    text: "รับเงินสดและของขวัญไว้เงียบๆ แล้วช่วยตรวจรับงานของคู่ค้ารายนั้นให้ผ่านเป็นพิเศษ"
    correct: false
    error_tag: ethical_violation
    explanation: "เป็นการรับสินบนและทุจริตต่อหน้าที่อย่างชัดเจน"
  - id: '2'
    text: "รับเงินสดไว้แต่นำไปบริจาคทำบุญเพื่อความสบายใจ"
    correct: false
    error_tag: ethical_violation
    explanation: "การนำเงินสินบนไปทำบุญไม่ได้ลบล้างการกระทำที่ขัดต่อกฎหมายและผลประโยชน์ทับซ้อน"
  - id: '3'
    text: "ปฏิเสธการรับของขวัญและเงินสดตามนโยบาย No Gift Policy ชี้แจงให้คู่ค้าเข้าใจระเบียบ และรายงานให้ผู้บังคับบัญชาทราบอย่างโปร่งใส"
    correct: true
    explanation: "ยึดมั่นในนโยบาย No Gift Policy เพื่อป้องกันผลประโยชน์ทับซ้อน (Conflict of Interest)"
  - id: '4'
    text: "เรียกร้องเงินสดเพิ่มขึ้นเป็นสองเท่าเพื่อแลกกับการไม่เปิดเผยเรื่องนี้"
    correct: false
    error_tag: ethical_violation
    explanation: "กรรโชกทรัพย์และกระทำผิดกฎหมายอาญาอย่างร้ายแรง"
  correct_answer: '3'
  solution: "นโยบาย No Gift Policy และการหลีกเลี่ยงผลประโยชน์ทับซ้อน (Conflict of Interest) เป็นหัวใจสำคัญของความโปร่งใส ตัวเลือก 3 ยึดมั่นในจริยธรรมวิชาชีพอย่างถูกต้อง"

- number: 53
  question_id: tgat3-60-q53
  topic: tgat3.civic_engagement
  skill: civic_participation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หากต้องการรณรงค์เรื่องการคัดแยกขยะในโรงเรียนให้เกิดผลสัมฤทธิ์อย่างยั่งยืน วิธีการใดสร้างการมีส่วนร่วม (Civic Participation) ได้ดีที่สุด"
  options:
  - id: '1'
    text: "ออกกฎหมายลงโทษปรับเงินนักเรียนทุกคนที่ทิ้งขยะผิดถังโดยไม่มีการให้ความรู้"
    correct: false
    error_tag: aggressive_imposition
    explanation: "เน้นการลงโทษโดยไม่สร้างความตระหนักรู้ ทำให้เกิดการต่อต้าน"
  - id: '2'
    text: "จัดตั้งตัวแทนนักเรียนร่วมวางแผน ออกแบบจุดทิ้งขยะที่เข้าใจง่าย ให้ความรู้เรื่องวงจรขยะ และนำรายได้จากการขายขยะรีไซเคิลมาพัฒนาสวัสดิการนักเรียน"
    correct: true
    explanation: "สร้างการมีส่วนร่วมตั้งแต่ร่วมคิด ร่วมทำ และรับประโยชน์ร่วมกันเพื่อสร้างจิตสำนึกระยะยาว"
  - id: '3'
    text: "ให้นักการภารโรงเป็นผู้ตามคัดแยกขยะเองทั้งหมดหลังเลิกเรียน"
    correct: false
    error_tag: ignores_user_pain_points
    explanation: "ผลักภาระให้ผู้อื่นและไม่ช่วยสร้างจิตสำนึกของนักเรียน"
  - id: '4'
    text: "ประกาศยกเลิกถังขยะทั้งหมดในโรงเรียนเพื่อไม่ให้มีขยะทิ้ง"
    correct: false
    error_tag: lacks_feasibility
    explanation: "แก้ปัญหาแบบสุดโต่งและจะทำให้ขยะถูกทิ้งเกลื่อนกลาดตามพื้น"
  correct_answer: '2'
  solution: "การมีส่วนร่วมของพลเมืองที่ยั่งยืนต้องเปิดให้ผู้มีส่วนได้ส่วนเสียร่วมคิด ร่วมทำ และได้รับประโยชน์ร่วมกัน ตัวเลือก 2 สร้าง Sense of Ownership อย่างแท้จริง"

- number: 54
  question_id: tgat3-60-q54
  topic: tgat3.civic_engagement
  skill: upstander_cyberbullying
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณเห็นเพื่อนนักเรียนกำลังถูกรุมกลั่นแกล้งและคอมเมนต์ด่าทออย่างหยาบคายในสื่อสังคมออนไลน์ (Cyberbullying) การกระทำที่ถูกต้องของ 'ผู้พบเห็นเหตุการณ์' (Upstander) คือข้อใด"
  options:
  - id: '1'
    text: "ไม่ส่งต่อข้อความ ให้กำลังใจเพื่อนที่ถูกกลั่นแกล้งเป็นการส่วนตัว และช่วยกดรายงาน (Report) บัญชีผู้กระทำความผิดต่อแพลตฟอร์มหรือครู"
    correct: true
    explanation: "ทำหน้าที่เป็น Upstander ช่วยเหลือผู้ถูกรังแก สกัดกั้นการแพร่กระจาย และรายงานเหตุตามช่องทางที่ถูกต้อง"
  - id: '2'
    text: "ร่วมพิมพ์ด่าทอตามกระแสเพื่อจะได้ไม่แปลกแยกจากเพื่อนกลุ่มใหญ่"
    correct: false
    error_tag: ethical_violation
    explanation: "ร่วมกระทำการกลั่นแกล้งและซ้ำเติมเหยื่อ ขาดความกล้าหาญทางจริยธรรม"
  - id: '3'
    text: "นั่งดูเฉยๆ และกดแชร์เพื่อให้เรื่องราวดังขึ้น"
    correct: false
    error_tag: irresponsible_information_sharing
    explanation: "ช่วยขยายผลกระทบของการกลั่นแกล้งให้รุนแรงขึ้น"
  - id: '4'
    text: "ทักไปบอกเพื่อนที่ถูกแกล้งว่า 'สมควรโดนแล้ว ทำตัวเด่นเอง'"
    correct: false
    error_tag: invalidating_others_feelings
    explanation: "โทษเหยื่อ (Victim Blaming) และขาดความเห็นอกเห็นใจ"
  correct_answer: '1'
  solution: "การเปลี่ยนจาก Bystander (ผู้เพิกเฉย) มาเป็น Upstander (ผู้ยืนหยัดเพื่อความถูกต้อง) คือการปกป้องผู้ถูกรังแกและรายงานความผิดตามช่องทาง ตัวเลือก 1 สะท้อนคุณธรรมพลเมือง"

- number: 55
  question_id: tgat3-60-q55
  topic: tgat3.civic_engagement
  skill: community_development
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "กลุ่มเยาวชนในชุมชนต้องการเปลี่ยนพื้นที่รกร้างว่างเปล่าให้กลายเป็น 'ลานกีฬาและสวนผักชุมชน' ขั้นตอนแรกในการขับเคลื่อนโครงการอย่างมีส่วนร่วมคือข้อใด"
  options:
  - id: '1'
    text: "เข้าไปยึดครองพื้นที่และลงมือก่อสร้างทันทีโดยไม่ตรวจสอบกรรมสิทธิ์ที่ดิน"
    correct: false
    error_tag: ethical_violation
    explanation: "ละเมิดสิทธิในทรัพย์สินและอาจถูกดำเนินคดีตามกฎหมาย"
  - id: '2'
    text: "บริจาคเงินจ้างผู้รับเหมาสร้างสนามกีฬาส่วนตัวเพื่อใช้เล่นเฉพาะกลุ่มตนเอง"
    correct: false
    error_tag: prioritizes_private_over_public_interest
    explanation: "ยึดประโยชน์ส่วนตน ละเลยประโยชน์ของชุมชนส่วนรวม"
  - id: '3'
    text: "รอให้ผู้ว่าราชการจังหวัดเดินทางมาพบก่อนจึงค่อยเริ่มคิด"
    correct: false
    error_tag: passive_resignation
    explanation: "ขาดความคิดริเริ่มและการเป็นพลเมืองที่กระตือรือร้น (Active Citizen)"
  - id: '4'
    text: "ตรวจสอบความเป็นเจ้าของพื้นที่ ขออนุญาตอย่างเป็นทางการ และจัดเวทีประชาคมรับฟังความคิดเห็นและความต้องการของคนในชุมชน"
    correct: true
    explanation: "ดำเนินการถูกต้องตามกฎหมายกรรมสิทธิ์และสร้างการมีส่วนร่วมของชุมชนผ่านเวทีประชาคม"
  correct_answer: '4'
  solution: "การพัฒนาชุมชนต้องเคารพกฎหมายและสร้างกระบวนการมีส่วนร่วมของชาวบ้านตั้งแต่เริ่มต้น ตัวเลือก 4 ดำเนินการอย่างรอบคอบ ถูกต้อง และสร้างความยั่งยืน"

- number: 56
  question_id: tgat3-60-q56
  topic: tgat3.civic_engagement
  skill: diversity_and_inclusion
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในสถานที่ทำงานที่มีพนักงานหลากหลายเชื้อชาติ ศาสนา และวัฒนธรรม พฤติกรรมใดแสดงถึงการเคารพความหลากหลาย (Diversity & Inclusion) สูงสุด"
  options:
  - id: '1'
    text: "บังคับให้ทุกคนต้องปฏิบัติตามประเพณีของคนกลุ่มใหญ่เท่านั้นและห้ามแสดงออกความเชื่ออื่น"
    correct: false
    error_tag: discriminatory_bias
    explanation: "ลิดรอนเสรีภาพทางวัฒนธรรมและสร้างความแปลกแยก"
  - id: '2'
    text: "เปิดใจเรียนรู้ ให้เกียรติความแตกต่างทางวัฒนธรรม จัดให้มีวันหยุดหรือพื้นที่ทางศาสนาที่ยืดหยุ่น และไม่นำความเชื่อมาเป็นเกณฑ์ตัดสินความสามารถในการทำงาน"
    correct: true
    explanation: "เปิดรับและอำนวยความสะดวกให้แก่ความแตกต่างทางวัฒนธรรมโดยไม่นำมาเป็นอุปสรรคต่อการทำงาน"
  - id: '3'
    text: "นำสำเนียงภาษาหรือการแต่งกายของเพื่อนร่วมงานต่างชาติมาล้อเลียนในที่ทำงาน"
    correct: false
    error_tag: discriminatory_bias
    explanation: "คุกคามและดูหมิ่นศักดิ์ศรีความเป็นมนุษย์ของผู้อื่น"
  - id: '4'
    text: "หลีกเลี่ยงการร่วมงานกับคนที่มีวัฒนธรรมไม่เหมือนตนเอง"
    correct: false
    error_tag: discriminatory_bias
    explanation: "มีอคติและขัดขวางการทำงานเป็นทีม"
  correct_answer: '2'
  solution: "การเคารพความหลากหลาย (D&I) ต้องยอมรับและให้เกียรติความแตกต่าง พร้อมสร้างสภาพแวดล้อมที่เอื้ออำนวยให้ทุกคนทำงานได้อย่างเสมอภาค ตัวเลือก 2 แสดงถึงความเป็นสากล"

- number: 57
  question_id: tgat3-60-q57
  topic: tgat3.civic_engagement
  skill: participatory_democracy
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "การติดตามตรวจสอบการทำงานของตัวแทนที่ได้รับการเลือกตั้งในระดับท้องถิ่นหรือระดับชาติ ถือเป็นหน้าที่ของพลเมืองตามระบอบประชาธิปไตยอย่างไร"
  options:
  - id: '1'
    text: "ประชาธิปไตยสิ้นสุดลงเมื่อหย่อนบัตรเลือกตั้งเสร็จ จึงไม่จำเป็นต้องสนใจการทำงานของตัวแทนอีกต่อไป"
    correct: false
    error_tag: passive_bystander
    explanation: "เข้าใจผิดในหลักการประชาธิปไตย การเลือกตั้งเป็นเพียงจุดเริ่มต้น"
  - id: '2'
    text: "เชื่อฟังและสนับสนุนทุกการตัดสินใจของตัวแทนโดยไม่มีการตั้งคำถาม"
    correct: false
    error_tag: passive_bystander
    explanation: "สละสิทธิ์ในการตรวจสอบและเปิดช่องให้เกิดการใช้อำนาจมิชอบ"
  - id: '3'
    text: "พลเมืองมีสิทธิติดตามการใช้งบประมาณ นโยบายที่แถลงไว้ และร่วมแสดงความคิดเห็นผ่านช่องทางการมีส่วนร่วมสาธารณะอย่างสม่ำเสมอ"
    correct: true
    explanation: "ประชาธิปไตยแบบมีส่วนร่วมกำหนดให้พลเมืองมีบทบาทติดตามตรวจสอบและแสดงความคิดเห็นต่อการใช้อำนาจรัฐ"
  - id: '4'
    text: "ใช้ความรุนแรงล้มล้างการทำงานของตัวแทนเมื่อไม่ถูกใจนโยบายส่วนบุคคล"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ละเมิดหลักนิติรัฐและทำลายกระบวนการประชาธิปไตย"
  correct_answer: '3'
  solution: "ประชาธิปไตยแบบมีส่วนร่วม (Participatory Democracy) กำหนดให้พลเมืองมีบทบาทในการตรวจสอบความโปร่งใสและการดำเนินนโยบายของตัวแทนอย่างต่อเนื่อง ตัวเลือก 3 ถูกต้องตามหลักรัฐศาสตร์"

- number: 58
  question_id: tgat3-60-q58
  topic: tgat3.civic_engagement
  skill: professional_integrity
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หัวหน้างานสั่งให้คุณลงนามรับรองรายงานประเมินผลกระทบสิ่งแวดล้อมที่ตกแต่งตัวเลขมลพิษให้ต่ำกว่าเกณฑ์จริง เพื่อให้โครงการผ่านการอนุมัติ การตัดสินใจที่ยึดมั่นในความซื่อสัตย์สุจริตคือข้อใด"
  options:
  - id: '1'
    text: "ยอมลงนามตามคำสั่งเพราะกลัวถูกไล่ออกและคิดว่าตนเองเป็นเพียงผู้น้อย"
    correct: false
    error_tag: ethical_violation
    explanation: "สมรู้ร่วมคิดในการกระทำความผิดและละเมิดจริยธรรมวิชาชีพ"
  - id: '2'
    text: "ปฏิเสธการลงนามรับรองข้อมูลเท็จ ชี้แจงผลกระทบทางกฎหมายและความเสี่ยงต่อสิ่งแวดล้อม และยื่นรายงานตามตัวเลขจริงที่ตรวจวัดได้"
    correct: true
    explanation: "ปฏิเสธการปลอมแปลงข้อมูลอย่างเด็ดขาด ยึดมั่นในจริยธรรมวิชาชีพและความถูกต้องตามกฎหมาย"
  - id: '3'
    text: "ขอแบ่งเงินสินบนส่วนแบ่งจากโครงการเพื่อแลกกับการยอมลงนาม"
    correct: false
    error_tag: ethical_violation
    explanation: "แสวงหาประโยชน์มิชอบและทุจริตคอร์รัปชันอย่างชัดเจน"
  - id: '4'
    text: "แอบแก้ไขข้อมูลให้แย่ลงกว่าเดิมเพื่อแกล้งหัวหน้างาน"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ใช้อารมณ์แก้ปัญหาและบิดเบือนข้อเท็จจริง"
  correct_answer: '2'
  solution: "ความซื่อสัตย์สุจริตทางวิชาชีพ (Professional Integrity) ต้องไม่ประนีประนอมกับการปลอมแปลงเอกสารและมลพิษสิ่งแวดล้อม ตัวเลือก 2 แสดงถึงความกล้าหาญทางจริยธรรมในการยึดความจริง"

- number: 59
  question_id: tgat3-60-q59
  topic: tgat3.civic_engagement
  skill: environmental_behavior_change
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "องค์กรต้องการส่งเสริมการประหยัดพลังงานและการใช้ทรัพยากรอย่างยั่งยืน การสร้างจิตสำนึกของพนักงานควรเริ่มต้นที่แนวทางใด"
  options:
  - id: '1'
    text: "รณรงค์ให้เห็นผลกระทบของการใช้พลังงาน จัดระบบปิดไฟอัตโนมัติ และตั้งเป้าหมายลดการใช้ไฟร่วมกันโดยนำเงินที่ประหยัดได้มาจัดกิจกรรมสวัสดิการพนักงาน"
    correct: true
    explanation: "ผสานการให้ความรู้ การปรับปรุงสิ่งแวดล้อมทางกายภาพ และการสร้างแรงจูงใจเชิงบวกที่เห็นผลชัดเจน"
  - id: '2'
    text: "กำหนดบทลงโทษปรับเงินพนักงานทุกคนที่ลืมปิดไฟโต๊ะทำงานในวันแรก"
    correct: false
    error_tag: aggressive_imposition
    explanation: "สร้างบรรยากาศความหวาดกลัวและไม่ได้สร้างความเข้าใจอย่างแท้จริง"
  - id: '3'
    text: "สั่งปิดเครื่องปรับอากาศทั้งหมดในอาคารแม้ในวันที่อากาศร้อนจัด"
    correct: false
    error_tag: lacks_feasibility
    explanation: "บั่นทอนสุขอนามัยและประสิทธิภาพการทำงานของพนักงานอย่างรุนแรง"
  - id: '4'
    text: "จ้างบริษัทโฆษณาภายนอกมาติดโปสเตอร์ประชาสัมพันธ์แต่ผู้บริหารยังคงใช้ไฟฟ้าอย่างสิ้นเปลือง"
    correct: false
    error_tag: superficial_innovation
    explanation: "เป็นการกระทำแบบผักชีโรยหน้าและขาดผู้นำที่เป็นแบบอย่าง"
  correct_answer: '1'
  solution: "การปรับเปลี่ยนพฤติกรรมอย่างยั่งยืนต้องผสานทั้งการให้ความรู้ การปรับปรุงสิ่งแวดล้อมทางกายภาพ และการสร้างแรงจูงใจเชิงบวก ตัวเลือก 1 ครอบคลุมและสร้างสรรค์"

- number: 60
  question_id: tgat3-60-q60
  topic: tgat3.civic_engagement
  skill: active_citizenship_definition
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการเป็นสมาชิกของสังคมที่ต้องเผชิญกับความท้าทายในศตวรรษที่ 21 คุณลักษณะของ 'Active Citizen' (พลเมืองตื่นรู้) ที่สำคัญที่สุดคือข้อใด"
  options:
  - id: '1'
    text: "การสนใจเฉพาะความก้าวหน้าและความมั่งคั่งส่วนตัวโดยไม่สนใจความเป็นไปของสังคม"
    correct: false
    error_tag: prioritizes_private_over_public_interest
    explanation: "ยึดตนเองเป็นศูนย์กลางและขาดความรับผิดชอบต่อส่วนรวม"
  - id: '2'
    text: "การส่งต่อข่าวลือและวิพากษ์วิจารณ์ทุกเรื่องในแง่ลบโดยไม่ลงมือช่วยแก้ไขปัญหาใดๆ"
    correct: false
    error_tag: irresponsible_information_sharing
    explanation: "เป็นเพียงผู้บ่น (Armchair Critic) แต่ไม่สร้างคุณค่าหรือลงมือปฏิบัติ"
  - id: '3'
    text: "การยอมรับทุกคำสั่งของผู้มีอำนาจโดยดุษณีและไม่เคยตั้งคำถามเชิงวิพากษ์"
    correct: false
    error_tag: passive_bystander
    explanation: "ขาดการคิดเชิงวิพากษ์และสูญเสียบทบาทการเป็นพลเมืองในระบอบประชาธิปไตย"
  - id: '4'
    text: "การมีความรับผิดชอบต่อหน้าที่ เคารพสิทธิผู้อื่น ตระหนักในปัญหาสาธารณะ และร่วมมือกับผู้อื่นเพื่อสร้างการเปลี่ยนแปลงเชิงบวกแก่สังคม"
    correct: true
    explanation: "ตระหนักในบทบาทหน้าที่ เคารพสิทธิมนุษยชน มีจิตสาธารณะ และลงมือทำเพื่อพัฒนาสังคมส่วนรวม"
  correct_answer: '4'
  solution: "Active Citizen คือผู้ที่ตระหนักในบทบาทหน้าที่ เคารพสิทธิมนุษยชน มีจิตสาธารณะ และลงมือทำเพื่อพัฒนาสังคมร่วมกัน ตัวเลือก 4 สรุปหัวใจสำคัญของความเป็นพลเมืองได้อย่างสมบูรณ์"
