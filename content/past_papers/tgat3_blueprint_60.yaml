  - id: '2'
    text: "ใช้เมทริกซ์ผลกระทบและความเร่งด่วน (Impact vs. Urgency Matrix) เพื่อคัดเลือกปัญหาที่สร้างความเสียหายสูงสุดก่อน"
    correct: true
    explanation: "จัดลำดับความสำคัญอย่างเป็นระบบโดยพิจารณาความเร่งด่วนและผลกระทบเชิงโครงสร้าง"
  - id: '3'
    text: "สุ่มจับสลากข้อร้องเรียนขึ้นมาแก้ตามดวง"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขาดระบบการจัดการและเสี่ยงต่อการละเลยวิกฤตที่ร้ายแรง"
  - id: '4'
    text: "ปล่อยให้ข้อร้องเรียนค้างไว้จนครบ 30 วันแล้วค่อยเปิดอ่าน"
    correct: false
    error_tag: passive_resignation
    explanation: "ละเลยการบริการและทำให้ความไม่พอใจของลูกค้าทวีความรุนแรง"
  correct_answer: '2'
  solution: "การจัดลำดับความสำคัญที่มีประสิทธิภาพต้องใช้ Impact vs. Urgency เพื่อจัดการกับปัญหาที่มีผลกระทบร้ายแรงและเร่งด่วนก่อน ตัวเลือก 2 ถูกต้องตามหลักการบริหารจัดการ"

- number: 29
  question_id: tgat3-60-q29
  topic: tgat3.complex_problem_solving
  skill: systemic_transport_planning
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เมืองหลวงประสบปัญหาการจราจรติดขัดอย่างหนัก การแก้ไขปัญหาแบบบูรณาการที่มอง 'ระบบคมนาคมทั้งระบบ' (Systems Thinking) คือข้อใด"
  options:
  - id: '1'
    text: "สร้างถนนและทางด่วนเพิ่มขึ้นเรื่อยๆ เพียงอย่างเดียว"
    correct: false
    error_tag: ignores_systemic_ripple_effects
    explanation: "ทำให้เกิด Induced Demand รถยนต์จะเพิ่มขึ้นมาเติมเต็มถนนที่สร้างใหม่เสมอ"
  - id: '2'
    text: "ห้ามประชาชนทุกคนใช้รถยนต์ส่วนบุคคลในทันที"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขาดทางเลือกรองรับและสร้างความเดือดร้อนแก่ประชาชนในวงกว้าง"
  - id: '3'
    text: "แจกคูปองน้ำมันฟรีให้ผู้ขับขี่ทุกคน"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "ยิ่งกระตุ้นให้คนนำรถออกมาขับและทำให้รถติดหนักกว่าเดิม"
  - id: '4'
    text: "พัฒนาระบบขนส่งมวลชนสาธารณะที่เชื่อมต่อกันอย่างไร้รอยต่อ ควบคู่กับการบริหารจัดการที่จอดรถและการเหลื่อมเวลาทำงาน"
    correct: true
    explanation: "ประสานทั้งฝั่ง Demand (เหลื่อมเวลา) และ Supply (ขนส่งมวลชนเชื่อมต่อ) เพื่อแก้ปัญหารถติดเชิงระบบ"
  correct_answer: '4'
  solution: "การคิดเชิงระบบมองว่าการจราจรเกิดจากหลายตัวแปร ต้องผสานทั้ง Demand Management (เหลื่อมเวลาทำงาน) และ Supply (ระบบรางและรถเมล์เชื่อมต่อ) ตัวเลือก 4 เป็นทางแก้เชิงระบบที่แท้จริง"

- number: 30
  question_id: tgat3-60-q30
  topic: tgat3.complex_problem_solving
  skill: crisis_leadership
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เมื่อองค์กรเผชิญกับวิกฤตการณ์ที่ไม่เคยเกิดขึ้นมาก่อน (Unprecedented Crisis) ทักษะใดที่ผู้นำจำเป็นต้องใช้มากที่สุดในการแก้ปัญหา"
  options:
  - id: '1'
    text: "การยึดมั่นในคู่มือการปฏิบัติงานเล่มเดิมอย่างเคร่งครัดแม้สถานการณ์จะเปลี่ยนไปแล้ว"
    correct: false
    error_tag: resists_constructive_feedback
    explanation: "ขาดความยืดหยุ่นและไม่สามารถรับมือกับบริบทใหม่ได้"
  - id: '2'
    text: "การคิดวิเคราะห์อย่างยืดหยุ่น (Cognitive Flexibility) การประเมินสถานการณ์ตามเวลาจริง และการตัดสินใจเชิงรุกร่วมกับทีมงาน"
    correct: true
    explanation: "ความยืดหยุ่นทางความคิดและการตัดสินใจตามข้อมูลสถานการณ์จริงเป็นหัวใจของการนำพาองค์กรฝ่าวิกฤต"
  - id: '3'
    text: "การปิดบังข้อมูลข่าวสารจากสมาชิกในองค์กรเพื่อป้องกันความตื่นตระหนก"
    correct: false
    error_tag: ethical_violation
    explanation: "ทำลายความไว้วางใจและทำให้ทีมงานขาดข้อมูลในการปฏิบัติหน้าที่"
  - id: '4'
    text: "การรอคอยให้วิกฤตการณ์ผ่านพ้นไปเองตามกาลเวลา"
    correct: false
    error_tag: passive_resignation
    explanation: "ภาวะอัมพาตในการตัดสินใจนำไปสู่ความล้มเหลวขององค์กร"
  correct_answer: '2'
  solution: "ในสถานการณ์วิกฤตที่ซับซ้อนและผันผวน ผู้นำต้องมีความยืดหยุ่นทางความคิด สามารถปรับตัวและตัดสินใจบนข้อมูลสถานการณ์จริงได้อย่างรวดเร็ว ตัวเลือก 2 เหมาะสมที่สุด"

- number: 31
  question_id: tgat3-60-q31
  topic: tgat3.emotional_governance
  skill: self_regulation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณถูกหัวหน้างานตำหนิด้วยน้ำเสียงรุนแรงในที่ประชุมต่อหน้าเพื่อนร่วมงานหลายคน โดยที่คุณมั่นใจว่าข้อมูลที่หัวหน้าเข้าใจนั้นคลาดเคลื่อน การตอบสนองที่สะท้อนวุฒิภาวะทางอารมณ์สูงสุดคือข้อใด"
  options:
  - id: '1'
    text: "โต้เถียงกลับทันทีด้วยน้ำเสียงที่ดังกว่าเพื่อปกป้องศักดิ์ศรีของตนเอง"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ยิ่งทำให้สถานการณ์บานปลายและเสียบรรยากาศการทำงานระดับมืออาชีพ"
  - id: '2'
    text: "สงบสติอารมณ์ รับฟังโดยไม่แสดงอาการก้าวร้าว และขอเข้าพบหัวหน้าเป็นการส่วนตัวหลังการประชุมพร้อมนำหลักฐานข้อเท็จจริงไปชี้แจง"
    correct: true
    explanation: "ควบคุมอารมณ์ในที่สาธารณะและเลือกสื่อสารข้อเท็จจริงในจังหวะเวลาที่เหมาะสมอย่างสุภาพ"
  - id: '3'
    text: "ลุกออกจากห้องประชุมทันทีและโพสต์ระบายความคับแค้นใจลงบนสื่อสังคมออนไลน์"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "ขาดความยับยั้งชั่งใจและอาจละเมิดวินัยการทำงาน"
  - id: '4'
    text: "เงียบเฉยและแอบนำงานของหัวหน้าไปทำลายเพื่อแก้แค้น"
    correct: false
    error_tag: ethical_violation
    explanation: "เป็นการกระทำที่ผิดจริยธรรมและมีเจตนาทำลายล้าง"
  correct_answer: '2'
  solution: "วุฒิภาวะทางอารมณ์ (EQ) ต้องควบคุมอารมณ์โกรธในที่สาธารณะ และเลือกชี้แจงข้อเท็จจริงในจังหวะเวลาที่เหมาะสมอย่างสุภาพเป็นส่วนตัว ตัวเลือก 2 สะท้อนความเป็นมืออาชีพสูงสุด"

- number: 32
  question_id: tgat3-60-q32
  topic: tgat3.emotional_governance
  skill: de_escalation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ลูกค้ากำลังโกรธจัดและส่งเสียงดังหน้าเคาน์เตอร์บริการเนื่องจากได้รับสินค้าชำรุด พนักงานบริการควรปฏิบัติตนอย่างไรเพื่อลดระดับความขัดแย้ง (De-escalation)"
  options:
  - id: '1'
    text: "สั่งให้ลูกค้าหยุดตะโกนและขู่ว่าจะแจ้งตำรวจหากไม่เงียบเสียงลง"
    correct: false
    error_tag: aggressive_imposition
    explanation: "เป็นการเติมเชื้อไฟและทำให้ลูกค้ารู้สึกว่าตนเองถูกคุกคาม"
  - id: '2'
    text: "ยืนยิ้มเยาะและพูดว่า 'เรื่องแค่นี้จะโวยวายทำไม'"
    correct: false
    error_tag: invalidating_others_feelings
    explanation: "ดูหมิ่นความรู้สึกของลูกค้าและทำลายภาพลักษณ์ขององค์กรอย่างร้ายแรง"
  - id: '3'
    text: "รับฟังด้วยความเข้าอกเข้าใจ (Active Listening) แสดงความขอโทษต่อความไม่สะดวก และมุ่งเน้นการเสนอแนวทางแก้ไขปัญหาหรือเปลี่ยนสินค้าให้อย่างรวดเร็ว"
    correct: true
    explanation: "รับฟังโดยไม่ตอบโต้ แสดง Empathy และมุ่งเน้นการแก้ปัญหาที่เกิดขึ้นจริงเพื่อคลี่คลายอารมณ์ลูกค้า"
  - id: '4'
    text: "เดินหนีออกจากเคาน์เตอร์และปล่อยให้ลูกค้ายืนอยู่คนเดียว"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "ละทิ้งหน้าที่และแสดงความไม่รับผิดชอบต่อปัญหา"
  correct_answer: '3'
  solution: "หลักการ De-escalation คือการรับฟังอย่างตั้งใจ ไม่ตอบโต้ด้วยความก้าวร้าว และแสดง Empathy พร้อมมุ่งเน้นการแก้ปัญหาที่เกิดขึ้นจริง ตัวเลือก 3 ถูกต้องตามหลักการบริการ"

- number: 33
  question_id: tgat3-60-q33
  topic: tgat3.emotional_governance
  skill: goal_directed_regulation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ก่อนถึงกำหนดส่งรายงานกลุ่มสำคัญเพียง 3 ชั่วโมง คุณพบว่าเพื่อนร่วมทีมคนหนึ่งยังไม่ได้ส่งงานในส่วนของตนเองและติดต่อไม่ได้ อารมณ์ของคุณเริ่มขุ่นมัว การกระทำในข้อใดสร้างสรรค์และแก้ปัญหาได้ดีที่สุด"
  options:
  - id: '1'
    text: "โพสต์ประจานเพื่อนคนนั้นลงในกลุ่มแชตรุ่นเพื่อให้ทุกคนรุมประณาม"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ระบายอารมณ์ส่วนตัวแต่ไม่ได้ทำให้งานเสร็จทันกำหนดส่ง"
  - id: '2'
    text: "ตั้งสติ แบ่งงานส่วนที่ขาดกับเพื่อนสมาชิกที่เหลือเพื่อช่วยกันทำให้เสร็จทันเวลา แล้วค่อยพูดคุยสอบถามเหตุผลกับเพื่อนคนนั้นในภายหลัง"
    correct: true
    explanation: "แยกแยะอารมณ์ออกจากภารกิจเฉพาะหน้า ร่วมมือกับสมาชิกที่เหลือเพื่อเป้าหมายงาน และพูดคุยภายหลังอย่างมีเหตุผล"
  - id: '3'
    text: "ลบชื่อเพื่อนคนนั้นออกจากปกรายงานทันทีและยกเลิกการส่งรายงานทั้งหมด"
    correct: false
    error_tag: pessimistic_resignation
    explanation: "ทำลายคะแนนของตนเองและเพื่อนคนอื่นไปด้วยความหุนหันพลันแล่น"
  - id: '4'
    text: "นั่งร้องไห้และยอมแพ้โดยไม่ลงมือทำอะไรต่อ"
    correct: false
    error_tag: pessimistic_resignation
    explanation: "ขาดความยืดหยุ่นทางจิตใจและทักษะการแก้ปัญหาเฉพาะหน้า"
  correct_answer: '2'
  solution: "การควบคุมอารมณ์เพื่อมุ่งบรรลุเป้าหมายสำคัญ (Goal-directed Emotion Regulation) ต้องแยกเรื่องอารมณ์ออกจากงานเฉพาะหน้า แก้ไขให้งานเสร็จก่อนแล้วจึงจัดการเรื่องคน ตัวเลือก 2 เป็นทางออกที่ดีที่สุด"

- number: 34
  question_id: tgat3-60-q34
  topic: tgat3.emotional_governance
  skill: growth_mindset
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณทุ่มเททำโครงการมานานกว่าหนึ่งเดือน แต่กลับได้รับคำวิจารณ์จากคณะกรรมการว่า 'ทิศทางยังไม่ตอบโจทย์และต้องปรับแก้ครั้งใหญ่' การมีกรอบคิดแบบเติบโต (Growth Mindset) ช่วยคุณได้อย่างไร"
  options:
  - id: '1'
    text: "สรุปว่าตนเองไม่มีความสามารถและไม่ควรริเริ่มโครงการใดๆ อีกต่อไป"
    correct: false
    error_tag: pessimistic_resignation
    explanation: "ตกอยู่ใน Fixed Mindset ที่มองความล้มเหลวเป็นตัวตัดสินคุณค่าของตนเอง"
  - id: '2'
    text: "กล่าวหาว่าคณะกรรมการมีอคติและไม่เข้าใจความล้ำหน้าของผลงาน"
    correct: false
    error_tag: defensive_blame_shifting
    explanation: "ปัดความรับผิดชอบและปฏิเสธการเรียนรู้เพื่อพัฒนาตนเอง"
  - id: '3'
    text: "นำเอกสารโครงการไปเผาทิ้งเพื่อประท้วงผลการประเมิน"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ทำลายล้างด้วยอารมณ์ชั่ววูบและขาดวุฒิภาวะ"
  - id: '4'
    text: "มองคำวิจารณ์เป็นข้อมูลสะท้อนกลับอันมีค่าเพื่อค้นหาจุดบกพร่องและพัฒนาทักษะของตนเองให้ดียิ่งขึ้น"
    correct: true
    explanation: "เปิดรับข้อผิดพลาดเป็นโอกาสในการเรียนรู้และมุ่งมั่นพัฒนาทักษะอย่างต่อเนื่อง"
  correct_answer: '4'
  solution: "Growth Mindset มองคำวิจารณ์และความผิดพลาดเป็นโอกาสในการเรียนรู้และขยายขีดความสามารถ ตัวเลือก 4 เปลี่ยนพลังลบเป็นแรงขับเคลื่อนในการพัฒนา"

- number: 35
  question_id: tgat3-60-q35
  topic: tgat3.emotional_governance
  skill: meeting_facilitation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในระหว่างการประชุมระดมความคิด สมาชิกสองคนเริ่มโต้เถียงกันด้วยถ้อยคำส่วนบุคคลจนบรรยากาศตึงเครียด ในฐานะผู้ดำเนินรายการประชุม คุณควรทำอย่างไร"
  options:
  - id: '1'
    text: "ปล่อยให้ทั้งสองคนด่าทอกันต่อไปเพื่อดูว่าใครจะชนะการโต้วาที"
    correct: false
    error_tag: passive_resignation
    explanation: "ละเลยหน้าที่ผู้ดำเนินรายการและปล่อยให้บรรยากาศการประชุมเสียหาย"
  - id: '2'
    text: "ขอพักการประชุมชั่วคราวเพื่อให้ทั้งสองฝ่ายได้สงบอารมณ์ จากนั้นดึงประเด็นกลับมาที่เป้าหมายร่วมและกติกาการพูดคุยที่เน้นเรื่องงานมากกว่าเรื่องบุคคล"
    correct: true
    explanation: "เบรกอารมณ์ที่ร้อนแรงอย่างสุภาพ และ Re-focus สู่เป้าหมายของงานและกติกากลาง"
  - id: '3'
    text: "ร่วมผสมโรงต่อว่าฝ่ายที่ตนเองไม่ชอบเพื่อขับไล่ออกจากห้องประชุม"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ละเมิดความเป็นกลางและสร้างความแตกแยกให้รุนแรงขึ้น"
  - id: '4'
    text: "ปิดการประชุมถาวรและยกเลิกโครงการนั้นทิ้งทันที"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ตื่นตระหนกและตัดสินใจเกินกว่าเหตุโดยไม่พยายามไกล่เกลี่ย"
  correct_answer: '2'
  solution: "บทบาทของ Facilitator ในการจัดการความขัดแย้งคือการหยุดอารมณ์ (Intervene) สร้างบรรยากาศที่ปลอดภัย และ Re-focus กลับมาที่ประเด็นงาน ตัวเลือก 2 จัดการสถานการณ์ได้อย่างเป็นมืออาชีพ"

- number: 36
  question_id: tgat3-60-q36
  topic: tgat3.emotional_governance
  skill: burnout_prevention
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณเริ่มรู้สึกเหนื่อยล้าสะสม หมดพลังในการทำงาน (Burnout) และเริ่มมีอารมณ์หงุดหงิดง่ายกับคนรอบข้าง ขั้นตอนแรกในการดูแลสุขภาวะทางอารมณ์ของตนเองคือข้อใด"
  options:
  - id: '1'
    text: "รู้เท่าทันสภาวะอารมณ์และร่างกายของตนเอง (Self-Awareness) ยอมรับขีดจำกัด จัดสรรเวลาพักผ่อน และสื่อสารขอปรับภาระงานอย่างเหมาะสม"
    correct: true
    explanation: "การตระหนักรู้และยอมรับขีดจำกัดช่วยให้วางแผนดูแลตนเองและจัดการภาระงานได้อย่างถูกต้อง"
  - id: '2'
    text: "ฝืนทำงานหนักขึ้นเป็นสองเท่าเพื่อลืมความเหนื่อยล้า"
    correct: false
    error_tag: ignores_root_cause
    explanation: "ยิ่งเร่งให้อาการ Burnout รุนแรงจนอาจนำไปสู่ปัญหาสุขภาพจิตและกาย"
  - id: '3'
    text: "ดื่มสุราหรือใช้สารเสพติดเพื่อช่วยให้หลับและคลายเครียด"
    correct: false
    error_tag: short_term_bias
    explanation: "สร้างปัญหาใหม่ต่อสุขภาพและไม่ช่วยฟื้นฟูสุขภาวะระยะยาว"
  - id: '4'
    text: "ลาออกจากงานทันทีโดยไม่มีการวางแผนล่วงหน้า"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ตัดสินใจด้วยความเครียดชั่วขณะและอาจสร้างวิกฤตทางการเงินตามมา"
  correct_answer: '1'
  solution: "การตระหนักรู้ในตนเอง (Self-Awareness) เป็นบันไดขั้นแรกของการบริหารอารมณ์ การรับรู้และยอมรับขีดจำกัดช่วยให้สามารถวางแผนฟื้นฟูพลังได้อย่างถูกวิธี ตัวเลือก 1 เหมาะสมที่สุด"

- number: 37
  question_id: tgat3-60-q37
  topic: tgat3.emotional_governance
  skill: assertive_conflict_resolution
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เพื่อนร่วมงานแอบนำไอเดียโครงการที่คุณคิดขึ้นไปนำเสนอในที่ประชุมว่าเป็นผลงานของตนเองเพียงผู้เดียว การจัดการกับสถานการณ์นี้อย่างสร้างสรรค์และรักษาความสัมพันธ์ในการทำงานคือข้อใด"
  options:
  - id: '1'
    text: "ตะโกนด่าประจานเพื่อนร่วมงานกลางที่ประชุมว่าเป็นคนขี้ขโมย"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ทำลายบรรยากาศการประชุมและทำให้ภาพลักษณ์ของตนเองดูไม่เป็นมืออาชีพ"
  - id: '2'
    text: "เก็บความแค้นไว้และแอบปล่อยข่าวลือเสียหายเกี่ยวกับเพื่อนคนนั้นในองค์กร"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "พฤติกรรมก้าวร้าวแฝงที่ทำลายบรรยากาศองค์กร"
  - id: '3'
    text: "เสริมข้อมูลเพิ่มเติมในที่ประชุมอย่างสุภาพเพื่อแสดงความเชี่ยวชาญในไอเดียนั้น และพูดคุยกับเพื่อนร่วมงานอย่างตรงไปตรงมาเป็นการส่วนตัวเรื่องการให้เครดิต"
    correct: true
    explanation: "แสดงบทบาทในที่ประชุมอย่างสร้างสรรค์และเจรจารักษาสิทธิ์อย่างตรงไปตรงมาในพื้นที่ส่วนตัว"
  - id: '4'
    text: "ปล่อยเลยตามเลยและตัดสินใจว่าจะไม่คิดไอเดียใหม่อีกต่อไป"
    correct: false
    error_tag: pessimistic_resignation
    explanation: "ยอมจำนนและปิดกั้นการเติบโตทางวิชาชีพของตนเอง"
  correct_answer: '3'
  solution: "การสื่อสารแบบ Assertive คือการรักษาสิทธิ์ของตนเองอย่างมั่นคงโดยไม่ก้าวร้าว การเสริมข้อมูลในที่ประชุมแสดงความเป็นเจ้าของผลงานอย่างสุภาพ และการเคลียร์ใจส่วนตัวช่วยรักษาสายสัมพันธ์ ตัวเลือก 3 ดีที่สุด"

- number: 38
  question_id: tgat3-60-q38
  topic: tgat3.emotional_governance
  skill: assertive_refusal
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เมื่อเพื่อนร่วมงานขอให้คุณช่วยทำงานเพิ่ม แต่ตารางงานของคุณเต็มแน่นจนอาจส่งผลกระทบต่อคุณภาพงานหลัก การสื่อสารปฏิเสธแบบ Assertive Communication ควรมีลักษณะอย่างไร"
  options:
  - id: '1'
    text: "'งานแค่นี้ทำเองไม่ได้เหรอ ทำไมต้องมาโยนให้คนอื่นตลอดเวลา'"
    correct: false
    error_tag: aggressive_imposition
    explanation: "สื่อสารแบบก้าวร้าว (Aggressive) ทำลายน้ำใจและความสัมพันธ์ในการทำงาน"
  - id: '2'
    text: "'ขอบคุณที่นึกถึงเรานะ แต่ตอนนี้เรามีกำหนดส่งงานสำคัญช่วงบ่าย ถ้าช่วยตอนนี้อาจทำให้งานทั้งสองชิ้นล่าช้า ขอแนะนำให้ลองปรึกษาพี่สมชายดูนะ'"
    correct: true
    explanation: "ปฏิเสธอย่างสุภาพ ให้เหตุผลที่หนักแน่นเกี่ยวกับภาระงาน และเสนอทางเลือกทดแทน"
  - id: '3'
    text: "ตอบตกลงรับงานมาด้วยความเกรงใจ แล้วแอบนำงานนั้นไปทิ้งถังขยะ"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "รับปากแต่ไม่ทำ สร้างความเสียหายต่อระบบงานโดยรวม"
  - id: '4'
    text: "เงียบเฉย ไม่ตอบข้อความ และหลบหน้าเพื่อนคนนั้นตลอดทั้งสัปดาห์"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "หลีกเลี่ยงปัญหาและทำให้เพื่อนร่วมงานไม่สามารถวางแผนต่อได้"
  correct_answer: '2'
  solution: "การปฏิเสธอย่างมืออาชีพ (Assertive) ต้องชัดเจน ให้เหตุผลเชิงภาระงานโดยไม่ใช้อารมณ์ และเสนอทางเลือกอื่นที่สร้างสรรค์ ตัวเลือก 2 แสดงถึงความเคารพทั้งตนเองและผู้อื่น"

- number: 39
  question_id: tgat3-60-q39
  topic: tgat3.emotional_governance
  skill: empathy_and_dialogue
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "สมาชิกในกลุ่มคนหนึ่งมีพฤติกรรมประชดประชัน ไม่พูดตรงๆ และมักถอนหายใจในที่ประชุม (Passive-Aggressive) คุณควรรับมืออย่างไร"
  options:
  - id: '1'
    text: "ประชดประชันกลับด้วยถ้อยคำที่รุนแรงกว่าเพื่อสั่งสอน"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ยิ่งเพิ่มความขัดแย้งและทำให้พฤติกรรมเป็นพิษขยายวงกว้าง"
  - id: '2'
    text: "รุมกลั่นแกล้งและบอยคอตไม่ให้เพื่อนคนนั้นเข้ากลุ่มทำงาน"
    correct: false
    error_tag: ethical_violation
    explanation: "เป็นการรังแกผู้อื่นในที่ทำงาน (Bullying) ซึ่งผิดจริยธรรม"
  - id: '3'
    text: "แกล้งทำเป็นไม่เห็นและแอบนินทาเขาลับหลังกับคนอื่นๆ"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "ไม่ช่วยแก้ปัญหาและส่งเสริมวัฒนธรรมองค์กรที่เป็นพิษ"
  - id: '4'
    text: "เปิดอกพูดคุยเป็นการส่วนตัวด้วยความใส่ใจ ถามถึงสิ่งที่เขากำลังกังวลหรือไม่สบายใจ และเปิดพื้นที่ให้เขาได้แสดงความคิดเห็นอย่างตรงไปตรงมา"
    correct: true
    explanation: "รับฟังด้วยความเข้าอกเข้าใจและสร้างบรรยากาศที่ปลอดภัยให้เขาได้สื่อสารความต้องการที่แท้จริง"
  correct_answer: '4'
  solution: "พฤติกรรม Passive-Aggressive มักเกิดจากความรู้สึกว่าตนเองไม่ได้รับการรับฟัง การพูดคุยเปิดใจอย่างปลอดภัยช่วยให้เขากล้าสื่อสารความรู้สึกที่แท้จริง ตัวเลือก 4 เป็นทางออกที่เข้าอกเข้าใจ"

- number: 40
  question_id: tgat3-60-q40
  topic: tgat3.emotional_governance
  skill: compassionate_leadership
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หัวหน้าทีมจำเป็นต้องแจ้งข่าวเรื่องการปรับลดงบประมาณโครงการให้แก่สมาชิกในทีมทราบ การสื่อสารที่แสดงถึงความฉลาดทางอารมณ์ควรเป็นอย่างไร"
  options:
  - id: '1'
    text: "ส่งอีเมลสั้นๆ แจ้งตัวเลขลดงบแล้วปิดช่องทางการติดต่อเพื่อหลีกเลี่ยงการตอบคำถาม"
    correct: false
    error_tag: passive_aggressive_avoidance
    explanation: "สร้างความสับสน ความหวาดกลัว และทำลายความไว้วางใจ"
  - id: '2'
    text: "สื่อสารอย่างโปร่งใส เห็นอกเห็นใจ ชี้แจงเหตุผลความจำเป็น รับฟังข้อกังวลของทีม และร่วมกันวางแผนปรับการทำงานให้อยู่ในงบใหม่"
    correct: true
    explanation: "ความโปร่งใสผสาน Empathy และการเปิดพื้นที่ให้ร่วมกันหาทางออกช่วยรักษาขวัญกำลังใจของทีม"
  - id: '3'
    text: "กล่าวโทษฝ่ายบริหารระดับสูงด้วยความโกรธแค้นเพื่อให้ตนเองดูเป็นคนดีในสายตาลูกน้อง"
    correct: false
    error_tag: defensive_blame_shifting
    explanation: "ปัดความรับผิดชอบและสร้างความแตกแยกภายในองค์กร"
  - id: '4'
    text: "พูดโกหกว่างบประมาณไม่ได้ลดลงเพื่อรักษาขวัญกำลังใจชั่วคราว"
    correct: false
    error_tag: ethical_violation
    explanation: "หลอกลวงทีมงานและจะสร้างปัญหาใหญ่เมื่อความจริงเปิดเผย"
  correct_answer: '2'
  solution: "ผู้นำที่มี EQ สูงในการสื่อสารข่าวร้ายต้องมีความโปร่งใส แสดง Empathy รับฟังผลกระทบ และสร้างความร่วมมือในการหาทางออก ตัวเลือก 2 เหมาะสมที่สุด"

- number: 41
  question_id: tgat3-60-q41
  topic: tgat3.emotional_governance
  skill: accountability_and_integrity
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณเผลอส่งเอกสารที่มีข้อผิดพลาดร้ายแรงไปให้ลูกค้าภายนอก ความรู้สึกแรกคือความตื่นตระหนกและกลัวถูกลงโทษ การกระทำที่ถูกต้องตามหลักการกำกับดูแลอารมณ์และจริยธรรมคือข้อใด"
  options:
  - id: '1'
    text: "ตั้งสติ ยอมรับความผิดพลาดอย่างตรงไปตรงมา รีบแจ้งหัวหน้างานเพื่อร่วมกันวางแผนติดต่อลูกค้าขอแก้ไขข้อมูลอย่างเป็นทางการทันที"
    correct: true
    explanation: "เอาชนะความตื่นกลัวด้วยสติ แสดงความรับผิดชอบ และแก้ปัญหาอย่างทันท่วงที"
  - id: '2'
    text: "รีบแก้ไขไฟล์ในระบบและโยนความผิดให้พนักงานฝึกงาน"
    correct: false
    error_tag: defensive_blame_shifting
    explanation: "ไร้ความซื่อสัตย์และเอาเปรียบผู้ที่ด้อยอำนาจกว่า"
  - id: '3'
    text: "ภาวนาให้ลูกค้าไม่ได้เปิดอ่านเอกสารนั้นและทำตัวตามปกติเหมือนไม่มีอะไรเกิดขึ้น"
    correct: false
    error_tag: short_term_bias
    explanation: "ซุกปัญหาไว้ใต้พรมจนอาจก่อให้เกิดความเสียหายร้ายแรงต่อธุรกิจ"
  - id: '4'
    text: "ลบประวัติการส่งอีเมลทิ้งทั้งหมดและแกล้งทำเป็นว่าระบบคอมพิวเตอร์ติดไวรัส"
    correct: false
    error_tag: ethical_violation
    explanation: "ปกปิดความจริงด้วยการโกหกและขาดความรับผิดชอบ"
  correct_answer: '1'
  solution: "เมื่อทำผิดพลาด ต้องเอาชนะความกลัวด้วยความซื่อสัตย์และความรับผิดชอบ การแจ้งหัวหน้าอย่างรวดเร็วช่วยบรรเทาความเสียหายได้ทันท่วงที ตัวเลือก 1 แสดงถึงความกล้าหาญทางจริยธรรม"

- number: 42
  question_id: tgat3-60-q42
  topic: tgat3.emotional_governance
  skill: empathy_and_holding_space
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เพื่อนร่วมงานสนิทกำลังร้องไห้เนื่องจากสูญเสียบุคคลในครอบครัวและส่งผลกระทบต่อสมาธิในการทำงาน การแสดงความเห็นอกเห็นใจ (Empathy) ที่เหมาะสมที่สุดคือข้อใด"
  options:
  - id: '1'
    text: "'อย่าร้องไห้สิ โตแล้วนะ เดี๋ยวงานไม่เสร็จจะโดนไล่ออกนะ'"
    correct: false
    error_tag: invalidating_others_feelings
    explanation: "ด้อยค่าความรู้สึกและซ้ำเติมความทุกข์ด้วยความกลัว"
  - id: '2'
    text: "เล่าเรื่องความทุกข์ของตนเองที่หนักกว่าเพื่อเปรียบเทียบให้เพื่อนเห็นว่าเรื่องของเขายังเล็กน้อย"
    correct: false
    error_tag: invalidating_others_feelings
    explanation: "แย่งพื้นที่ความรู้สึกและไม่ให้เกียรติความสูญเสียของผู้อื่น"
  - id: '3'
    text: "อยู่เคียงข้าง รับฟังด้วยความใส่ใจโดยไม่ตัดสิน แสดงความเสียใจอย่างจริงใจ และเสนอตัวช่วยประสานงานเรื่องการลาหยุดพักใจ"
    correct: true
    explanation: "ให้พื้นที่ความรู้สึก (Holding Space) และช่วยเหลือในทางปฏิบัติอย่างเคารพความสูญเสีย"
  - id: '4'
    text: "เดินหนีเพราะรำคาญเสียงร้องไห้ที่รบกวนสมาธิ"
    correct: false
    error_tag: invalidating_others_feelings
    explanation: "ขาดความเมตตาและความเข้าอกเข้าใจเพื่อนมนุษย์"
  correct_answer: '3'
  solution: "Empathy ไม่ใช่การสอนหรือตัดสิน แต่เป็นการร่วมรับรู้ความรู้สึก (Holding Space) และให้ความช่วยเหลือในทางปฏิบัติอย่างเหมาะสม ตัวเลือก 3 ถูกต้องตามหลักจิตวิทยา"

- number: 43
  question_id: tgat3-60-q43
  topic: tgat3.emotional_governance
  skill: negotiation_composure
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการเจรจาต่อรองธุรกิจ ฝ่ายตรงข้ามพยายามพูดยั่วยุให้อารมณ์เสียเพื่อบีบให้คุณยอมรับข้อตกลงที่ไม่เป็นธรรม กลยุทธ์ทางอารมณ์ที่ดีที่สุดคือข้อใด"
  options:
  - id: '1'
    text: "ระเบิดอารมณ์โกรธใส่และทุบโต๊ะเพื่อแสดงพลังอำนาจ"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ตกหลุมพรางทางจิตวิทยาของคู่เจรจาและสูญเสียการควบคุม"
  - id: '2'
    text: "รู้เท่าทันกลอุบาย หายใจเข้าลึกๆ รักษาความสงบนิ่ง ไม่นำอารมณ์มารวมกับข้อเท็จจริง และยึดมั่นในกรอบเจรจาที่เตรียมมา"
    correct: true
    explanation: "ความสุขุมเยือกเย็นช่วยให้มองเห็นประเด็นข้อเท็จจริงและไม่เสียเปรียบในเกมจิตวิทยา"
  - id: '3'
    text: "ยอมจำนนและเซ็นสัญญาตามที่เขาต้องการเพราะไม่อยากเผชิญหน้ากับความตึงเครียด"
    correct: false
    error_tag: passive_resignation
    explanation: "ขาดความหนักแน่นและทำให้องค์กรเสียผลประโยชน์มหาศาล"
  - id: '4'
    text: "ด่าทอตอบโต้ด้วยคำหยาบคายเพื่อไม่ให้เสียเปรียบ"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ละเมิดมารยาททางธุรกิจและทำลายโอกาสในการเจรจา"
  correct_answer: '2'
  solution: "การรักษาความเยือกเย็น (Emotional Detachment) ช่วยให้มองเห็นกับดักทางจิตวิทยาและควบคุมสถานการณ์การเจรจาได้อย่างมีชั้นเชิง ตัวเลือก 2 ชนะด้วยความสุขุม"

- number: 44
  question_id: tgat3-60-q44
  topic: tgat3.emotional_governance
  skill: resilience_and_bounce_back
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หลังจากที่คุณพ่ายแพ้ในการแข่งขันนำเสนอผลงานระดับประเทศ คุณรู้สึกผิดหวังและท้อแท้มาก แนวทางในการสร้างความฟื้นคืน (Resilience) ให้แก่ตนเองคือข้อใด"
  options:
  - id: '1'
    text: "ตัดสินใจว่าจะไม่เข้าร่วมการแข่งขันหรือท้าทายตนเองในเวทีใดๆ อีกต่อไป"
    correct: false
    error_tag: pessimistic_resignation
    explanation: "ปิดกั้นการพัฒนาและยอมจำนนต่อความพ่ายแพ้"
  - id: '2'
    text: "กล่าวโทษว่าคณะกรรมการตัดสินอย่างไม่ยุติธรรมและแอบรับสินบน"
    correct: false
    error_tag: defensive_blame_shifting
    explanation: "สร้างภาพลวงตาเพื่อปกป้องอีโก้ตนเองโดยไม่เกิดการเรียนรู้"
  - id: '3'
    text: "แกล้งทำเป็นไม่รู้สึกอะไรเลยและเก็บกดความเสียใจไว้คนเดียว"
    correct: false
    error_tag: ignores_root_cause
    explanation: "การปฏิเสธอารมณ์ (Suppression) ส่งผลเสียต่อสุขภาพจิตในระยะยาว"
  - id: '4'
    text: "อนุญาตให้ตนเองรู้สึกเศร้าได้ชั่วคราว จากนั้นทบทวนจุดแข็งและจุดที่ต้องปรับปรุงเพื่อวางแผนฝึกซ้อมใหม่สำหรับเป้าหมายถัดไป"
    correct: true
    explanation: "ยอมรับอารมณ์ตามจริงและฟื้นคืนพลังใจด้วยการถอดบทเรียนเพื่อก้าวต่อไปอย่างแข็งแกร่ง"
  correct_answer: '4'
  solution: "ความยืดหยุ่นทางจิตใจ (Resilience) ประกอบด้วยการยอมรับอารมณ์ตามความจริง (Acknowledge) และการลุกขึ้นใหม่พร้อมบทเรียน (Bounce Back) ตัวเลือก 4 เป็นกระบวนการฟื้นคืนที่แท้จริง"

- number: 45
  question_id: tgat3-60-q45
  topic: tgat3.emotional_governance
  skill: self_awareness_value
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "การตระหนักรู้ในตนเอง (Self-Awareness) มีประโยชน์สูงสุดต่อการทำงานร่วมกับผู้อื่นในข้อใด"
  options:
  - id: '1'
    text: "ทำให้เรารู้จุดอ่อนของผู้อื่นเพื่อใช้เป็นเครื่องมือต่อรอง"
    correct: false
    error_tag: ethical_violation
    explanation: "เป็นการใช้ทักษะเพื่อเอารัดเอาเปรียบ ไม่ใช่เป้าหมายของการตระหนักรู้ในตนเอง"
  - id: '2'
    text: "ทำให้เรารู้เท่าทันอารมณ์ จุดกระตุ้นความโกรธ (Triggers) และอคติของตนเอง เพื่อสามารถควบคุมพฤติกรรมและการสื่อสารได้อย่างเหมาะสม"
    correct: true
    explanation: "รู้ทันอารมณ์และจุดเปราะบางของตนเอง นำไปสู่การกำกับพฤติกรรมและการทำงานเป็นทีมที่ดี"
  - id: '3'
    text: "ทำให้เราสามารถแกล้งแสดงอารมณ์หลอกลวงคนอื่นได้อย่างแนบเนียน"
    correct: false
    error_tag: ethical_violation
    explanation: "การเสแสร้งและบิดเบือนอารมณ์ทำลายความจริงใจในทีมงาน"
  - id: '4'
    text: "ทำให้เรามั่นใจว่าตนเองสมบูรณ์แบบและไม่ต้องปรับตัวเข้าหาใคร"
    correct: false
    error_tag: resists_constructive_feedback
    explanation: "หลงตัวเองและขาดการเปิดรับมุมมองที่แตกต่าง"
  correct_answer: '2'
  solution: "Self-Awareness ช่วยให้เรารู้เท่าทัน Trigger และ Bias ของตนเอง ทำให้ตอบสนองต่อสถานการณ์ต่างๆ ได้อย่างมีสติและสร้างความร่วมมือที่ดี ตัวเลือก 2 ถูกต้องตามหลักจิตวิทยาองค์กร"

- number: 46
  question_id: tgat3-60-q46
  topic: tgat3.civic_engagement
  skill: moral_courage
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณพบว่าเพื่อนร่วมงานสนิทแอบนำวัสดุอุปกรณ์สำนักงานราคาแพงของบริษัทกลับไปใช้ที่บ้านเป็นประจำ ในฐานะพลเมืองที่มีจริยธรรมในองค์กร คุณควรปฏิบัติอย่างไร"
  options:
  - id: '1'
    text: "แกล้งทำเป็นไม่เห็นเพราะเป็นเพื่อนสนิทกันและไม่อยากผิดใจกัน"
    correct: false
    error_tag: passive_bystander
    explanation: "เพิกเฉยต่อการทุจริตและละเลยหน้าที่ความซื่อสัตย์ต่อองค์กร"
  - id: '2'
    text: "ตักเตือนเพื่อนอย่างจริงจังว่าเป็นการกระทำที่ผิดระเบียบและกฎหมาย หากเพื่อนไม่หยุด จะต้องรายงานต่อผู้บังคับบัญชาตามขั้นตอน"
    correct: true
    explanation: "กล้าหาญทางจริยธรรมในการตักเตือนเพื่อน และยึดมั่นในความซื่อสัตย์ต่อองค์กรตามระเบียบ"
  - id: '3'
    text: "ร่วมมือกับเพื่อนเพื่อช่วยกันขโมยอุปกรณ์เพิ่มขึ้นเพื่อไม่ให้เพื่อนโดนจับคนเดียว"
    correct: false
    error_tag: ethical_violation
    explanation: "ร่วมกระทำความผิดและละเมิดกฎหมายอย่างร้ายแรง"
  - id: '4'
    text: "โพสต์ประจานชื่อเพื่อนลงในสื่อสังคมออนไลน์โดยไม่บอกกล่าว"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ละเมิดสิทธิส่วนบุคคลและไม่ปฏิบัติตามกระบวนการทางวินัยที่ถูกต้อง"
  correct_answer: '2'
  solution: "ความกล้าหาญทางจริยธรรม (Moral Courage) เริ่มจากการตักเตือนเพื่อนโดยตรงเพื่อยุติพฤติกรรม และพร้อมทำตามระเบียบหากยังฝ่าฝืน ตัวเลือก 2 รักษาทั้งหลักการและความซื่อสัตย์"

- number: 47
  question_id: tgat3-60-q47
  topic: tgat3.civic_engagement
  skill: digital_media_literacy
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "คุณได้รับข้อความส่งต่อในแอปพลิเคชันแชตอ้างว่า 'โรงพยาบาลแห่งหนึ่งมีการระบาดของโรคร้ายแรงที่ไม่มียารักษา ห้ามใครไปเด็ดขาด' โดยไม่มีชื่อแหล่งข่าวอ้างอิง การเป็นพลเมืองดิจิทัลที่มีความรับผิดชอบควรทำอย่างไร"
  options:
  - id: '1'
    text: "รีบแชร์ข้อความต่อไปยังทุกกลุ่มแชตทันทีเพื่อเตือนภัยคนอื่นไว้ก่อน"
    correct: false
    error_tag: irresponsible_information_sharing
    explanation: "แพร่กระจายข่าวลือที่ยังไม่ผ่านการตรวจสอบและสร้างความตระหนกในสังคม"
  - id: '2'
    text: "เพิ่มข้อความขยายความให้น่ากลัวยิ่งขึ้นก่อนส่งต่อเพื่อความตื่นเต้น"
    correct: false
    error_tag: ethical_violation
    explanation: "บิดเบือนข้อมูลเท็จและสร้างความเสียหายต่อความมั่นคงสาธารณะ"
  - id: '3'
    text: "ตรวจสอบข้อเท็จจริง (Fact-checking) จากเว็บไซต์ทางการของกระทรวงสาธารณสุขหรือสำนักข่าวที่น่าเชื่อถือก่อน และชี้แจงข้อเท็จจริงในกลุ่มแชต"
    correct: true
    explanation: "ตรวจสอบแหล่งข่าวปฐมภูมิก่อนส่งต่อ และช่วยสกัดกั้นข่าวปลอมด้วยข้อมูลที่ถูกต้อง"
  - id: '4'
    text: "เชื่อทันทีและเดินทางไปประท้วงหน้าโรงพยาบาล"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ตกเป็นเหยื่อข่าวปลอมและกระทำการที่ไร้เหตุผล"
  correct_answer: '3'
  solution: "การรู้เท่าทันสื่อดิจิทัล (Digital Literacy) กำหนดให้ต้องตรวจสอบความถูกต้องจากแหล่งข้อมูลปฐมภูมิที่เชื่อถือก่อนเชื่อหรือแชร์ ตัวเลือก 3 ป้องกัน Fake News ได้อย่างมีความรับผิดชอบ"

- number: 48
  question_id: tgat3-60-q48
  topic: tgat3.civic_engagement
  skill: civic_legal_action
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ชุมชนของคุณประสบปัญหากลิ่นเหม็นรบกวนจากโรงงานอุตสาหกรรมใกล้เคียง แนวทางการมีส่วนร่วมของพลเมือง (Civic Action) ที่เป็นไปตามหลักกฎหมายและสร้างสรรค์คือข้อใด"
  options:
  - id: '1'
    text: "ชวนเพื่อนบ้านนำก้อนหินไปขว้างปาโรงงานและจุดไฟเผาป้ายเพื่อระบายความโกรธ"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ละเมิดกฎหมายอาญาและทำลายความชอบธรรมในการเรียกร้อง"
  - id: '2'
    text: "บันทึกข้อมูลวัน เวลา และระดับกลิ่นอย่างเป็นระบบ รวบรวมรายชื่อผู้ได้รับผลกระทบ และยื่นเรื่องต่อหน่วยงานภาครัฐเพื่อขอให้ตรวจสอบตาม พ.ร.บ. สาธารณสุข"
    correct: true
    explanation: "ใช้หลักฐานเชิงประจักษ์และช่องทางกฎหมายอย่างมีส่วนร่วมในการแก้ปัญหาสิ่งแวดล้อม"
  - id: '3'
    text: "ย้ายบ้านหนีทันทีโดยไม่พยายามพูดคุยหรือแก้ปัญหาร่วมกับชุมชน"
    correct: false
    error_tag: passive_resignation
    explanation: "ยอมจำนนและปล่อยให้ปัญหาสิ่งแวดล้อมยังคงทำร้ายคนอื่นต่อไป"
  - id: '4'
    text: "ติดสินบนเจ้าหน้าที่โรงงานเพื่อให้ติดตั้งเครื่องกรองอากาศเฉพาะบ้านของตนเองคนเดียว"
    correct: false
    error_tag: prioritizes_private_over_public_interest
