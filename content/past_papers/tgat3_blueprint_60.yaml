questions:
- number: 1
  question_id: tgat3-60-q01
  topic: tgat3.value_creation
  skill: customer_centricity
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ทีมพัฒนานวัตกรรมต้องการออกแบบแอปพลิเคชันสั่งซื้อสินค้าสำหรับผู้สูงอายุในชุมชน ขั้นตอนแรกที่สอดคล้องกับแนวคิด Design Thinking มากที่สุดคือข้อใด"
  options:
  - id: '1'
    text: "สัมภาษณ์และสังเกตพฤติกรรมการใช้ชีวิตประจำวันของผู้สูงอายุเพื่อทำความเข้าใจอุปสรรคที่แท้จริง"
    correct: true
    explanation: "การทำความเข้าใจผู้ใช้อย่างลึกซึ้ง (Empathize) ผ่านการสังเกตและพูดคุยเป็นจุดเริ่มต้นสำคัญของนวัตกรรม"
  - id: '2'
    text: "พัฒนาแอปพลิเคชันฉบับสมบูรณ์แล้วเปิดให้ดาวน์โหลดทดลองใช้ฟรีในทันที"
    correct: false
    error_tag: premature_scaling
    explanation: "ข้ามขั้นตอนการทำความเข้าใจผู้ใช้และเสี่ยงสูญเสียงบประมาณมหาศาลโดยไม่ตอบโจทย์"
  - id: '3'
    text: "นำฟีเจอร์ของแอปพลิเคชันยอดนิยมในกลุ่มวัยรุ่นมาปรับใช้ทั้งหมดเพื่อความทันสมัย"
    correct: false
    error_tag: ignores_user_pain_points
    explanation: "กลุ่มวัยรุ่นและผู้สูงอายุมีบริบทและข้อจำกัดการใช้งานที่แตกต่างกันอย่างสิ้นเชิง"
  - id: '4'
    text: "จัดสรรงบประมาณส่วนใหญ่ไปกับการโฆษณาประชาสัมพันธ์ผ่านสื่อสังคมออนไลน์"
    correct: false
    error_tag: superficial_innovation
    explanation: "การตลาดไม่สามารถแก้ปัญหาตัวผลิตภัณฑ์ที่ยังไม่ตอบโจทย์ความต้องการของผู้ใช้"
  correct_answer: '1'
  solution: "ขั้นตอนแรกของกระบวนการ Design Thinking คือ Empathize ซึ่งเน้นการทำความเข้าใจผู้ใช้อย่างลึกซึ้งผ่านการสังเกตและพูดคุย ตัวเลือก 1 จึงถูกต้องที่สุด ส่วนตัวเลือก 2, 3, 4 ข้ามขั้นตอนสำคัญและไม่ตอบโจทย์บริบทผู้สูงอายุ"

- number: 2
  question_id: tgat3-60-q02
  topic: tgat3.value_creation
  skill: value_proposition
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เกษตรกรในชุมชนประสบปัญหาสับปะรดราคาตกต่ำเนื่องจากผลผลิตล้นตลาด หากต้องการสร้างคุณค่าและเพิ่มมูลค่าสินค้าอย่างยั่งยืน แนวทางใดเหมาะสมที่สุด"
  options:
  - id: '1'
    text: "ยื่นข้อเรียกร้องให้หน่วยงานรัฐเข้ามารับซื้อผลผลิตทั้งหมดในราคาสูงกว่าตลาด"
    correct: false
    error_tag: short_term_bias
    explanation: "เป็นการพึ่งพาภาครัฐเฉพาะหน้า ไม่ได้สร้างความสามารถในการแข่งขันหรือมูลค่าเพิ่มในระยะยาว"
  - id: '2'
    text: "แปรรูปเป็นผลิตภัณฑ์มูลค่าสูง เช่น สารสกัดเอนไซม์บรอมมีเลนสำหรับเวชสำอาง และพัฒนาแบรนด์ชุมชน"
    correct: true
    explanation: "การแปรรูปสู่ผลิตภัณฑ์เวชสำอางและสร้างแบรนด์ช่วยยกระดับราคาและขยายตลาดใหม่ได้อย่างยั่งยืน"
  - id: '3'
    text: "เทผลผลิตทิ้งเพื่อประท้วงและสร้างกระแสเรียกร้องความสนใจจากสื่อมวลชน"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ก่อให้เกิดความสูญเสียทางเศรษฐกิจและภาพลักษณ์เชิงลบโดยไม่เกิดคุณค่าใหม่"
  - id: '4'
    text: "ขายลดราคาให้พ่อค้าคนกลางในราคาขาดทุนเพื่อระบายผลผลิตให้หมดโดยเร็ว"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "ทำให้เกษตรกรขาดทุนซ้ำซากและไม่เกิดการแก้ปัญหาเชิงโครงสร้าง"
  correct_answer: '2'
  solution: "การสร้างคุณค่า (Value Creation) มุ่งเน้นการยกระดับผลผลิตขั้นปฐมภูมิไปสู่สินค้าแปรรูปมูลค่าสูงที่ตอบสนองความต้องการของตลาดใหม่ ตัวเลือก 2 จึงเป็นแนวทางที่ยั่งยืนที่สุด"

- number: 3
  question_id: tgat3-60-q03
  topic: tgat3.value_creation
  skill: sustainable_business_model
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ร้านกาแฟขนาดเล็กต้องการลดปริมาณขยะพลาสติกแบบใช้ครั้งเดียวทิ้ง แต่กังวลเรื่องต้นทุนบรรจุภัณฑ์ที่เป็นมิตรต่อสิ่งแวดล้อมที่สูงขึ้น ข้อใดคือการริเริ่มสร้างคุณค่าที่ตอบโจทย์ทั้งความยั่งยืนและความเป็นไปได้ทางธุรกิจ"
  options:
  - id: '1'
    text: "สั่งซื้อแก้วพลาสติกราคาถูกที่สุดต่อไปและไม่สนใจปัญหาสิ่งแวดล้อม"
    correct: false
    error_tag: environmental_negligence
    explanation: "ละเลยความรับผิดชอบต่อสังคมและสวนทางกับค่านิยมของผู้บริโภคยุคใหม่"
  - id: '2'
    text: "บังคับเก็บเงินค่าแก้วเพิ่มขึ้น 50% ทันทีโดยไม่มีทางเลือกอื่นให้ลูกค้า"
    correct: false
    error_tag: ignores_user_pain_points
    explanation: "ผลักภาระให้ลูกค้าฝ่ายเดียวและอาจทำให้สูญเสียฐานลูกค้าเดิม"
  - id: '3'
    text: "จัดแคมเปญให้ส่วนลดสำหรับลูกค้านำแก้วมาเอง พร้อมนำกากกาแฟมาแปรรูปเป็นของที่ระลึกจำหน่าย"
    correct: true
    explanation: "สร้างแรงจูงใจให้ลูกค้ามีส่วนร่วมลดขยะ และสร้างรายได้เสริมจากของเหลือใช้ (Circular Economy)"
  - id: '4'
    text: "ปิดให้บริการเครื่องดื่มเย็นทั้งหมดเพื่อหลีกเลี่ยงการใช้แก้วพลาสติก"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ส่งผลกระทบอย่างรุนแรงต่อรายได้หลักของร้านและไม่สอดคล้องกับความเป็นจริง"
  correct_answer: '3'
  solution: "การสร้างสรรค์นวัตกรรมธุรกิจต้องคำนึงถึงความสมดุลระหว่างผลกระทบทางสิ่งแวดล้อมและผลตอบแทนทางธุรกิจ การจูงใจด้วยส่วนลดและการสร้างรายได้เสริมจากกากกาแฟในตัวเลือก 3 เป็น win-win solution"

- number: 4
  question_id: tgat3-60-q04
  topic: tgat3.value_creation
  skill: mvp_validation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "กลุ่มนักศึกษาต้องการสร้างแพลตฟอร์มแลกเปลี่ยนหนังสือเรียนมือสองในมหาวิทยาลัย เพื่อทดสอบสมมติฐานว่ามีผู้สนใจจริงหรือไม่ด้วยต้นทุนต่ำสุด (MVP) ควรเริ่มต้นอย่างไร"
  options:
  - id: '1'
    text: "กู้ยืมเงินก้อนใหญ่เพื่อจ้างบริษัทซอฟต์แวร์เขียนแอปพลิเคชันเต็มรูปแบบ"
    correct: false
    error_tag: premature_scaling
    explanation: "ลงทุนสูงก่อนพิสูจน์ความต้องการของตลาด เสี่ยงต่อความล้มเหลวทางการเงิน"
  - id: '2'
    text: "ทำใบปลิวแจกหน้ามหาวิทยาลัยโดยยังไม่มีช่องทางให้ผู้ใช้งานแลกเปลี่ยนหนังสือได้จริง"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขาดกลไกการทดสอบพฤติกรรมจริงของผู้ใช้งาน"
  - id: '3'
    text: "รอจนกว่าจะได้รับการสนับสนุนงบประมาณจากทางมหาวิทยาลัยจึงค่อยลงมือทำ"
    correct: false
    error_tag: passive_resignation
    explanation: "ขาดความคิดริเริ่มและการลงมือปฏิบัติการทดสอบสมมติฐาน"
  - id: '4'
    text: "สร้างกลุ่มสนทนาออนไลน์หรือหน้าเพจง่ายๆ เพื่อเป็นสื่อกลางจับคู่ผู้แลกเปลี่ยนหนังสือและเก็บข้อมูลการใช้งานจริง"
    correct: true
    explanation: "เป็น MVP ที่ทดสอบพฤติกรรมการแลกเปลี่ยนจริงได้ทันทีด้วยต้นทุนเกือบเป็นศูนย์"
  correct_answer: '4'
  solution: "แนวคิด Minimum Viable Product (MVP) คือการสร้างเครื่องมือทดสอบสมมติฐานหลักด้วยทรัพยากรน้อยที่สุด เพื่อเรียนรู้พฤติกรรมผู้ใช้จริง ตัวเลือก 4 ตอบโจทย์กระบวนการทดสอบนวัตกรรมได้ดีที่สุด"

- number: 5
  question_id: tgat3-60-q05
  topic: tgat3.value_creation
  skill: creative_ideation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการระดมสมอง (Brainstorming) เพื่อคิดค้นบริการใหม่ในองค์กร พฤติกรรมของผู้นำกลุ่มในข้อใดช่วยส่งเสริมให้เกิดความคิดสร้างสรรค์ได้มากที่สุด"
  options:
  - id: '1'
    text: "รีบตัดสินและวิจารณ์ไอเดียที่ดูแปลกประหลาดทันทีเพื่อไม่ให้เสียเวลาการประชุม"
    correct: false
    error_tag: resists_constructive_feedback
    explanation: "การด่วนตัดสินจะปิดกั้นความคิดนอกกรอบและทำให้สมาชิกไม่กล้าเสนอความคิดเห็น"
  - id: '2'
    text: "กำหนดให้ทุกคนต้องเห็นพ้องกับแนวคิดของผู้บริหารที่มีประสบการณ์มากที่สุด"
    correct: false
    error_tag: unilateral_decision_making
    explanation: "ขัดขวางความหลากหลายทางความคิดและสร้างบรรยากาศเผด็จการ"
  - id: '3'
    text: "เปิดรับทุกความคิดเห็นโดยยังไม่ด่วนตัดสิน ส่งเสริมการต่อยอดไอเดีย และเน้นปริมาณไอเดียในรอบแรก"
    correct: true
    explanation: "การชะลอการตัดสิน (Defer Judgment) ช่วยให้เกิดบรรยากาศที่ปลอดภัยและกระตุ้นไอเดียใหม่ๆ"
  - id: '4'
    text: "คัดเลือกเฉพาะไอเดียที่เคยทำสำเร็จมาแล้วในอดีตเท่านั้นเพื่อความปลอดภัย"
    correct: false
    error_tag: copies_without_differentiation
    explanation: "ทำให้ได้เพียงผลลัพธ์เดิมๆ ไม่เกิดนวัตกรรมหรือคุณค่าใหม่"
  correct_answer: '3'
  solution: "หลักการระดมสมองที่มีประสิทธิภาพคือ Defer Judgment (ชะลอการตัดสิน) มุ่งเน้นปริมาณความคิดสร้างสรรค์ และส่งเสริมการต่อยอดความคิด ตัวเลือก 3 เป็นแนวทางที่ถูกต้องตามหลักสากล"

- number: 6
  question_id: tgat3-60-q06
  topic: tgat3.value_creation
  skill: customer_discovery
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "แพลตฟอร์มเรียนออนไลน์พบว่าผู้เรียนกว่า 70% เรียนไม่จบหลักสูตร ทีมงานควรใช้เทคนิคใดในการค้นหาคุณค่าใหม่เพื่อแก้ไขปัญหานี้"
  options:
  - id: '1'
    text: "วิเคราะห์ข้อมูลจุดที่ผู้เรียนหยุดเรียน ร่วมกับการสัมภาษณ์เชิงลึกเพื่อออกแบบการเรียนรู้แบบสั้นและมีปฏิสัมพันธ์ (Micro-learning)"
    correct: true
    explanation: "การวิเคราะห์พฤติกรรมจริงและสัมภาษณ์เชิงลึกช่วยค้นพบ Pain Point และออกแบบการเรียนรู้ที่กระชับ"
  - id: '2'
    text: "ขู่ตัดสิทธิ์การใช้งานหากผู้เรียนไม่เข้าเรียนตามเวลาที่กำหนด"
    correct: false
    error_tag: aggressive_imposition
    explanation: "การลงโทษไม่ได้แก้ปัญหาเนื้อหาหรือรูปแบบการเรียนที่ไม่ดึงดูด"
  - id: '3'
    text: "ปรับลดเนื้อหาทั้งหมดให้เหลือเพียงบทสรุปสั้น 5 นาทีโดยไม่คำนึงถึงคุณภาพความรู้"
    correct: false
    error_tag: superficial_innovation
    explanation: "ทำลายมาตรฐานทางวิชาการและคุณค่าหลักของการศึกษา"
  - id: '4'
    text: "เพิ่มราคาคอร์สเรียนเพื่อคัดกรองเฉพาะผู้ที่มีความตั้งใจสูงจริงๆ"
    correct: false
    error_tag: ignores_user_pain_points
    explanation: "กีดกันผู้เรียนและไม่ได้แก้ไขปัญหาข้อบกพร่องของระบบการสอน"
  correct_answer: '1'
  solution: "การสร้างคุณค่าใหม่ต้องตั้งต้นจากข้อมูลเชิงพฤติกรรมและความต้องการของผู้เรียน การออกแบบ Micro-learning ที่มี Interactive ตามตัวเลือก 1 ช่วยเพิ่ม Engagement และแก้ปัญหาได้อย่างตรงจุด"

- number: 7
  question_id: tgat3-60-q07
  topic: tgat3.value_creation
  skill: scamper_ideation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หากต้องการใช้เทคนิค SCAMPER ในส่วน 'Combine' (การผสมผสาน) เพื่อสร้างนวัตกรรมผลิตภัณฑ์เครื่องดื่มสมุนไพร ข้อใดคือตัวอย่างที่ชัดเจนที่สุด"
  options:
  - id: '1'
    text: "การเปลี่ยนขนาดบรรจุภัณฑ์จากขวดแก้วเป็นซองพลาสติกขนาดเล็กลง"
    correct: false
    error_tag: superficial_innovation
    explanation: "เป็นการดัดแปลงขนาด (Modify/Minify) ไม่ใช่การผสมผสานสิ่งใหม่"
  - id: '2'
    text: "การลดปริมาณน้ำตาลลง 50% เพื่อให้รสชาติหวานน้อยลง"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "เป็นการปรับลดส่วนประกอบเดิม (Eliminate/Modify) ไม่ใช่การ Combine"
  - id: '3'
    text: "การยกเลิกสารกันเสียในเครื่องดื่มทั้งหมด"
    correct: false
    error_tag: copies_without_differentiation
    explanation: "เป็นการตัดทิ้ง (Eliminate) ตามมาตรฐานทั่วไป"
  - id: '4'
    text: "การนำน้ำขิงสกัดมาผสมผสานกับน้ำผึ้งมะนาวและสปาร์กลิ้งโซดาเพื่อเป็นเครื่องดื่มเพื่อสุขภาพสำหรับคนรุ่นใหม่"
    correct: true
    explanation: "ผสมผสานสมุนไพรดั้งเดิมเข้ากับเครื่องดื่มโซดาและน้ำผึ้งมะนาวเพื่อสร้างผลิตภัณฑ์หมวดหมู่ใหม่"
  correct_answer: '4'
  solution: "เทคนิค SCAMPER: C = Combine คือการรวมแนวคิด วัตถุดิบ หรือฟังก์ชันที่แตกต่างกันเข้าด้วยกันเพื่อสร้างสิ่งใหม่ ตัวเลือก 4 ผสมผสานสมุนไพรดั้งเดิมเข้ากับโซดาและน้ำผึ้งมะนาวเป็นนวัตกรรมเครื่องดื่มอย่างชัดเจน"

- number: 8
  question_id: tgat3-60-q08
  topic: tgat3.value_creation
  skill: agile_iteration
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เมื่อสตาร์ทอัพเปิดตัวฟีเจอร์ใหม่แล้วพบว่ามีคำติชมเชิงลบจากผู้ใช้จำนวนมากเกี่ยวกับความซับซ้อนของเมนู ทีมงานที่มีทัศนคติการสร้างนวัตกรรมควรดำเนินการอย่างไร"
  options:
  - id: '1'
    text: "ลบข้อความติชมเหล่านั้นทิ้งเพื่อรักษาภาพลักษณ์ที่ดีของแบรนด์"
    correct: false
    error_tag: resists_constructive_feedback
    explanation: "หลอกลวงตนเองและปิดกั้นโอกาสในการพัฒนาผลิตภัณฑ์"
  - id: '2'
    text: "รวบรวมข้อเสนอแนะ นำมาจัดกลุ่มปัญหาหลัก และปรับปรุงการออกแบบ UI/UX ให้ใช้งานง่ายขึ้นอย่างรวดเร็ว"
    correct: true
    explanation: "นำเสียงสะท้อนจากผู้ใช้มาเป็นโจทย์ในการพัฒนาปรับปรุงแบบ Agile Iteration"
  - id: '3'
    text: "โพสต์ชี้แจงว่าผู้ใช้งานไม่เข้าใจวิธีการใช้งานที่ถูกต้องและควรศึกษาคู่มือเพิ่มเติม"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "โทษผู้ใช้งานแทนที่จะปรับปรุงการออกแบบที่บกพร่อง"
  - id: '4'
    text: "ยกเลิกโครงการและปลดทีมพัฒนาซอฟต์แวร์ออกทันที"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ตื่นตระหนกและตัดสินใจแบบทำลายล้างโดยไม่พยายามปรับปรุง"
  correct_answer: '2'
  solution: "วงจรนวัตกรรม (Build-Measure-Learn) ถือว่าคำติชมเชิงลบคือข้อมูลอันมีค่าสำหรับการเรียนรู้ (Feedback Loop) ตัวเลือก 2 สะท้อนถึง Agile Iteration ในการรับฟังและปรับปรุงอย่างรวดเร็ว"

- number: 9
  question_id: tgat3-60-q09
  topic: tgat3.value_creation
  skill: product_differentiation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "บริษัทผลิตเฟอร์นิเจอร์ต้องการขยายตลาดไปยังกลุ่มคนทำงานในคอนโดมิเนียมขนาดเล็ก ข้อใดคือการสร้างความแตกต่าง (Differentiation) ที่ตอบสนองความต้องการได้ดีที่สุด"
  options:
  - id: '1'
    text: "ลดคุณภาพของไม้ลงเพื่อขายราคาถูกที่สุดในตลาด"
    correct: false
    error_tag: short_term_bias
    explanation: "สินค้าเสื่อมสภาพง่าย ทำลายชื่อเสียงของแบรนด์และไม่ตรงกับความต้องการด้านฟังก์ชัน"
  - id: '2'
    text: "ลอกเลียนแบบดีไซน์ของแบรนด์หรูจากต่างประเทศทุกมิติ"
    correct: false
    error_tag: copies_without_differentiation
    explanation: "ละเมิดทรัพย์สินทางปัญญาและไม่สร้างเอกลักษณ์เฉพาะตัว"
  - id: '3'
    text: "ออกแบบเฟอร์นิเจอร์อเนกประสงค์ที่พับเก็บได้และปรับเปลี่ยนการใช้งานได้หลากหลายตามพื้นที่จำกัด"
    correct: true
    explanation: "ชูจุดเด่นด้านฟังก์ชันประหยัดพื้นที่ (Space-saving) ที่ตอบโจทย์การอยู่อาศัยในคอนโดมิเนียมโดยตรง"
  - id: '4'
    text: "ผลิตเฟอร์นิเจอร์ขนาดใหญ่พิเศษระดับคฤหาสน์เพื่อเน้นความหรูหรา"
    correct: false
    error_tag: ignores_user_pain_points
    explanation: "ไม่ตรงกับกลุ่มเป้าหมายที่มีพื้นที่จำกัดอย่างสิ้นเชิง"
  correct_answer: '3'
  solution: "การสร้างความแตกต่างที่มีคุณค่าต้องสอดรับกับข้อจำกัดของผู้ใช้ เฟอร์นิเจอร์แบบ Multi-functional ประหยัดพื้นที่ตามตัวเลือก 3 มอบประโยชน์ใช้สอยที่โดดเด่นและตรงจุด"

- number: 10
  question_id: tgat3-60-q10
  topic: tgat3.value_creation
  skill: innovation_culture
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "องค์กรต้องการสร้างวัฒนธรรมที่สนับสนุนนวัตกรรม (Innovative Culture) ควรมีแนวทางในการปฏิบัติต่อ 'ความล้มเหลวจากการทดลองสิ่งใหม่' อย่างไร"
  options:
  - id: '1'
    text: "ลงโทษตัดโบนัสพนักงานที่ริเริ่มโครงการแล้วไม่ประสบความสำเร็จ"
    correct: false
    error_tag: resists_constructive_feedback
    explanation: "ทำให้พนักงานเกิดความกลัวและไม่มีใครกล้าคิดค้นสิ่งใหม่"
  - id: '2'
    text: "กำหนดให้พนักงานทุกคนต้องขออนุมัติจากผู้บริหารระดับสูงในทุกขั้นตอนย่อย"
    correct: false
    error_tag: unilateral_decision_making
    explanation: "สร้างขั้นตอนราชการที่ล่าช้าและทำลายความคล่องตัว"
  - id: '3'
    text: "ปกปิดความล้มเหลวนั้นไม่ให้คนอื่นในองค์กรทราบเพื่อรักษาขวัญกำลังใจ"
    correct: false
    error_tag: ignores_root_cause
    explanation: "พลาดโอกาสในการเรียนรู้และอาจทำให้ทีมอื่นทำผิดพลาดซ้ำรอยเดิม"
  - id: '4'
    text: "จัดเวทีถอดบทเรียนร่วมกันเพื่อวิเคราะห์สิ่งที่ได้เรียนรู้และนำไปต่อยอดในการทดลองรอบถัดไป"
    correct: true
    explanation: "การถอดบทเรียน (Post-mortem Learning) ช่วยเปลี่ยนความล้มเหลวเป็นสินทรัพย์ทางปัญญาขององค์กร"
  correct_answer: '4'
  solution: "วัฒนธรรมนวัตกรรมต้องมี Psychological Safety ที่มองความล้มเหลวจากการทดลองเป็นโอกาสในการเรียนรู้ (Failing Forward) ตัวเลือก 4 จึงส่งเสริมการเติบโตอย่างยั่งยืน"

- number: 11
  question_id: tgat3-60-q11
  topic: tgat3.value_creation
  skill: social_innovation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "โรงเรียนต้องการแก้ปัญหาเศษอาหารเหลือทิ้งจำนวนมากในแต่ละวัน การสร้างนวัตกรรมทางสังคม (Social Innovation) ในข้อใดมีความยั่งยืนและสร้างการมีส่วนร่วมสูงสุด"
  options:
  - id: '1'
    text: "ติดกล้องวงจรปิดเพื่อจดชื่อและลงโทษนักเรียนที่ทานอาหารไม่หมด"
    correct: false
    error_tag: aggressive_imposition
    explanation: "บังคับด้วยความกลัว ไม่ได้ปลูกจิตสำนึกและก่อให้เกิดความคับข้องใจ"
  - id: '2'
    text: "ร่วมมือกับนักเรียนและแม่ครัวปรับปรุงรสชาติ จัดปริมาณตามความต้องการ และนำเศษอาหารไปทำปุ๋ยหมักชีวภาพใช้ในแปลงผักโรงเรียน"
    correct: true
    explanation: "แก้ปัญหาทั้งที่ต้นทาง (ความต้องการ) และปลายทาง (แปรรูปเศษอาหาร) พร้อมสร้างการมีส่วนร่วมอย่างยั่งยืน"
  - id: '3'
    text: "จ้างบริษัทเอกชนนำเศษอาหารไปกำจัดนอกโรงเรียนโดยไม่แจ้งให้นักเรียนทราบ"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "เพิ่มภาระค่าใช้จ่ายและไม่ได้สร้างการเรียนรู้แก่เยาวชน"
  - id: '4'
    text: "ยกเลิกการจำหน่ายอาหารกลางวันและให้นักเรียนนำอาหารมาจากบ้านเอง"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ผลักภาระให้ผู้ปกครองและสร้างความเหลื่อมล้ำ"
  correct_answer: '2'
  solution: "นวัตกรรมสังคมต้องผสานการแก้ปัญหาที่ต้นเหตุ (ปรับปริมาณ/รสชาติ) และปลายเหตุ (แปรรูปเศษอาหาร) พร้อมสร้างความตระหนักรู้ ตัวเลือก 2 เป็นโมเดลเศรษฐกิจหมุนเวียน (Circular Economy) ที่ยั่งยืน"

- number: 12
  question_id: tgat3-60-q12
  topic: tgat3.value_creation
  skill: technology_enablement
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ธุรกิจร้านค้าปลีกต้องการนำระบบปัญญาประดิษฐ์ (AI) มาปรับใช้ในร้าน ขั้นตอนการวางแผนที่แสดงถึงความเข้าใจในการสร้างคุณค่าคือข้อใด"
  options:
  - id: '1'
    text: "ระบุปัญหาเฉพาะเจาะจง เช่น การคาดการณ์สินค้าหมดสต็อก แล้วนำ AI มาช่วยวิเคราะห์ข้อมูลเพื่อลดต้นทุนการจัดเก็บ"
    correct: true
    explanation: "กำหนดโจทย์ปัญหาและจุดประสงค์ทางธุรกิจที่ชัดเจนก่อนนำเทคโนโลยีมาเป็นเครื่องมือช่วยแก้ปัญหา"
  - id: '2'
    text: "ซื้อระบบ AI ที่แพงที่สุดในตลาดมาติดตั้งทันทีโดยยังไม่ระบุปัญหาที่ต้องการแก้ไข"
    correct: false
    error_tag: premature_scaling
    explanation: "เทคโนโลยีไม่ใช่เป้าหมายในตัวเอง แต่เป็นเครื่องมือ การลงทุนโดยไร้ทิศทางก่อให้เกิดความสิ้นเปลือง"
  - id: '3'
    text: "เลิกจ้างพนักงานหน้าร้านทั้งหมดเพื่อแสดงว่าร้านมีความทันสมัยและใช้เทคโนโลยีเต็มรูปแบบ"
    correct: false
    error_tag: short_term_bias
    explanation: "ทำลายประสบการณ์การบริการลูกค้าและสร้างผลกระทบทางสังคม"
  - id: '4'
    text: "รอให้คู่แข่งทุกรายใช้งานจนเป็นมาตรฐานทั่วไปก่อนแล้วค่อยทำตาม"
    correct: false
    error_tag: copies_without_differentiation
    explanation: "สูญเสียความสามารถในการแข่งขันและโอกาสในการเป็นผู้นำตลาด"
  correct_answer: '1'
  solution: "การนำเทคโนโลยีมาใช้อย่างมีคุณค่าต้องเริ่มจากการกำหนดโจทย์ทางธุรกิจและ Pain Point ให้ชัดเจน ตัวเลือก 1 นำ AI มาแก้ปัญหาการจัดการสต็อกได้อย่างมีประสิทธิภาพและวัดผลได้"

- number: 13
  question_id: tgat3-60-q13
  topic: tgat3.value_creation
  skill: kpi_metrics
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "หากต้องการวัดผลความสำเร็จของการพัฒนานวัตกรรมผลิตภัณฑ์ใหม่ ตัวชี้วัด (KPI) ในข้อใดสะท้อน 'คุณค่าที่แท้จริงต่อผู้ใช้งาน' ได้ดีที่สุด"
  options:
  - id: '1'
    text: "จำนวนเงินงบประมาณที่ทีมงานใช้ไปในการพัฒนาโครงการ"
    correct: false
    error_tag: resource_waste_without_diagnosis
    explanation: "เป็นตัวชี้วัดด้านทรัพยากรขาเข้า (Input) ไม่ใช่ผลลัพธ์หรือคุณค่าที่เกิดขึ้นจริง"
  - id: '2'
    text: "จำนวนชั่วโมงที่ทีมงานทำงานล่วงเวลาเพื่อส่งมอบผลิตภัณฑ์"
    correct: false
    error_tag: superficial_innovation
    explanation: "ชี้วัดเพียงความพยายามในการทำงาน ไม่ได้รับประกันว่าผลิตภัณฑ์ตอบโจทย์ตลาด"
  - id: '3'
    text: "อัตราการกลับมาใช้งานซ้ำและความพึงพอใจของผู้ใช้งานจริง (Retention Rate & Customer Satisfaction)"
    correct: true
    explanation: "สะท้อนความผูกพันและประโยชน์ที่ผู้ใช้ได้รับจริงจากการใช้งานผลิตภัณฑ์ในระยะยาว"
  - id: '4'
    text: "จำนวนข่าวประชาสัมพันธ์ที่ได้รับการเผยแพร่ในสื่อต่างๆ"
    correct: false
    error_tag: superficial_innovation
    explanation: "เป็นเพียงผลลัพธ์ด้านการประชาสัมพันธ์ (PR) ไม่ใช่คุณค่าเชิงเนื้อหาของผลิตภัณฑ์"
  correct_answer: '3'
  solution: "คุณค่าของนวัตกรรมวัดได้จากการยอมรับและการใช้งานจริงของกลุ่มเป้าหมาย ตัวชี้วัดด้าน Retention Rate และความพึงพอใจในตัวเลือก 3 จึงสะท้อนคุณค่าที่แท้จริงได้แม่นยำที่สุด"

- number: 14
  question_id: tgat3-60-q14
  topic: tgat3.value_creation
  skill: design_thinking_define
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการทำ Design Thinking ขั้นตอน 'Define' มีเป้าหมายหลักตามข้อใด"
  options:
  - id: '1'
    text: "การลงมือเขียนโค้ดและสร้างชิ้นงานต้นแบบขึ้นมาทันที"
    correct: false
    error_tag: premature_scaling
    explanation: "เป็นขั้นตอนการสร้างต้นแบบ (Prototype) ไม่ใช่การ Define"
  - id: '2'
    text: "การสังเคราะห์ข้อมูลเชิงลึกที่ได้จากการสำรวจเพื่อระบุปัญหาหลักและสร้าง Point of View ที่ชัดเจน"
    correct: true
    explanation: "Define คือการกลั่นกรองข้อมูล Insight มาตั้งเป็นกรอบปัญหาที่ชัดเจนเพื่อหาทางออกต่อไป"
  - id: '3'
    text: "การระดมความคิดเห็นให้ได้จำนวนไอเดียมากที่สุดโดยไม่มีข้อจำกัด"
    correct: false
    error_tag: superficial_innovation
    explanation: "เป็นขั้นตอนการระดมไอเดีย (Ideate)"
  - id: '4'
    text: "การนำผลิตภัณฑ์ไปวางจำหน่ายในตลาดเพื่อเก็บเงินรายได้"
    correct: false
    error_tag: short_term_bias
    explanation: "เป็นขั้นตอนเชิงพาณิชย์ ไม่ใช่ขั้นตอนการนิยามปัญหา"
  correct_answer: '2'
  solution: "ขั้นตอน Define คือการกลั่นกรองและสังเคราะห์ข้อมูลจากขั้นตอน Empathize เพื่อระบุปัญหาที่แท้จริงของผู้ใช้ (Problem Statement) ตัวเลือก 2 จึงตรงตามนิยามทางวิชาการอย่างถูกต้อง"

- number: 15
  question_id: tgat3-60-q15
  topic: tgat3.value_creation
  skill: shared_value_creation
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ชุมชนชายฝั่งทะเลมีปัญหานักท่องเที่ยวทิ้งขยะเกลื่อนหาด การสร้างคุณค่าร่วม (Creating Shared Value: CSV) ในข้อใดช่วยแก้ปัญหาได้อย่างสร้างสรรค์"
  options:
  - id: '1'
    text: "ปิดชายหาดไม่ให้นักท่องเที่ยวเข้าเพื่อป้องกันขยะอย่างถาวร"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ทำลายเศรษฐกิจการท่องเที่ยวของชุมชนอย่างรุนแรง"
  - id: '2'
    text: "จ่ายเงินจ้างคนเก็บขยะเพิ่มขึ้นเรื่อยๆ โดยไม่สร้างแรงจูงใจในการลดขยะ"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "เป็นการแก้ปัญหาที่ปลายเหตุและสร้างภาระงบประมาณต่อเนื่อง"
  - id: '3'
    text: "ปล่อยให้ขยะสะสมจนกว่านักท่องเที่ยวจะรู้สึกผิดและหยุดทิ้งไปเอง"
    correct: false
    error_tag: passive_resignation
    explanation: "ละเลยปัญหาและสร้างความเสียหายต่อระบบนิเวศอย่างไม่อาจฟื้นฟูได้"
  - id: '4'
    text: "การจัดระบบ 'ขยะแลกคูปองส่วนลดร้านค้าชุมชน' พร้อมนำขยะพลาสติกมารีไซเคิลเป็นสินค้าแฟชั่นประจำถิ่น"
    correct: true
    explanation: "ผสานผลประโยชน์ทางเศรษฐกิจของร้านค้าและคุณค่าด้านสิ่งแวดล้อม เกิดแรงจูงใจร่วมกัน"
  correct_answer: '4'
  solution: "CSV มุ่งเน้นการสร้างคุณค่าทางสังคมควบคู่กับคุณค่าทางเศรษฐกิจ การเปลี่ยนขยะเป็นสิทธิประโยชน์และสินค้าตามตัวเลือก 4 สร้างแรงจูงใจให้ทุกฝ่ายร่วมมือกันอย่างยั่งยืน"

- number: 16
  question_id: tgat3-60-q16
  topic: tgat3.complex_problem_solving
  skill: root_cause_diagnosis
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ยอดขายของร้านค้าออนไลน์ลดลง 30% อย่างต่อเนื่องในรอบ 2 เดือนที่ผ่านมา ในฐานะผู้จัดการฝ่ายการตลาด ขั้นตอนแรกที่ควรดำเนินการคือข้อใด"
  options:
  - id: '1'
    text: "จัดโปรโมชันลดราคา 50% ทันทีเพื่อกระตุ้นยอดขายกลับมาอย่างรวดเร็ว"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "การลดราคาเป็นการแก้ปัญหาเฉพาะหน้าที่ปลายเหตุ และอาจทำลายกำไรโดยไม่ทราบสาเหตุที่แท้จริง"
  - id: '2'
    text: "รวบรวมข้อมูล Customer Journey และอัตราการยกเลิกคำสั่งซื้อเพื่อวิเคราะห์สาเหตุที่แท้จริง"
    correct: true
    explanation: "การวิเคราะห์ข้อมูลและหาสาเหตุรากเหง้า (Root Cause) เป็นขั้นตอนแรกตามกระบวนการแก้ปัญหาอย่างเป็นระบบ"
  - id: '3'
    text: "เปลี่ยนทีมงานฝ่ายขายและบริการลูกค้าทั้งหมดเพื่อล้างระบบ"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "การลงโทษหรือเปลี่ยนทีมงานโดยไม่มีข้อมูลชี้ชัดเป็นการด่วนสรุป"
  - id: '4'
    text: "เพิ่มงบโฆษณาเป็น 2 เท่าในทุกแพลตฟอร์มเพื่อเพิ่มการมองเห็น"
    correct: false
    error_tag: resource_waste_without_diagnosis
    explanation: "เพิ่มงบประมาณโดยไม่ปรับปรุงจุดบกพร่องจะทำให้สูญเสียงบโดยเปล่าประโยชน์"
  correct_answer: '2'
  solution: "ขั้นตอนแรกของการแก้ปัญหาที่ซับซ้อนคือการรวบรวมข้อมูลเพื่อระบุสาเหตุที่แท้จริง (Define & Analyze the Problem) ตัวเลือก 2 เป็นการแก้ปัญหาตามหลักเหตุและผล"

- number: 17
  question_id: tgat3-60-q17
  topic: tgat3.complex_problem_solving
  skill: fishbone_analysis
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "โรงงานผลิตอาหารพบว่ามีสินค้าไม่ได้มาตรฐานหลุดรอดไปถึงมือลูกค้า หากต้องการใช้ 'แผนผังก้างปลา' (Fishbone Diagram) ทีมงานควรเริ่มต้นวิเคราะห์จากมิติใด"
  options:
  - id: '1'
    text: "จำแนกปัจจัยสาเหตุออกเป็น 4M ได้แก่ Man (คน), Machine (เครื่องจักร), Method (วิธีการ), และ Material (วัตถุดิบ)"
    correct: true
    explanation: "การจำแนกสาเหตุตามหมวดหมู่หลักช่วยให้มองเห็นปัจจัยแวดล้อมของกระบวนการผลิตได้อย่างครอบคลุม"
  - id: '2'
    text: "เริ่มต้นมองหาตัวบุคคลที่ต้องรับผิดชอบเพื่อลงโทษตัดเงินเดือนทันที"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "มุ่งจับผิดบุคคลแทนที่จะวิเคราะห์ระบบการทำงานอย่างรอบด้าน"
  - id: '3'
    text: "จ่ายเงินชดเชยให้ลูกค้าทุกคนโดยไม่ต้องตรวจสอบกระบวนการผลิตภายใน"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "กลบเกลื่อนปัญหาเฉพาะหน้าแต่ความผิดพลาดในสายการผลิตยังคงอยู่"
  - id: '4'
    text: "ซื้อเครื่องจักรใหม่ทั้งหมดโดยไม่ตรวจสอบว่าเครื่องเดิมเสียหรือไม่"
    correct: false
    error_tag: lacks_feasibility
    explanation: "สิ้นเปลืองงบประมาณโดยใช่เหตุและอาจไม่ใช่สาเหตุของปัญหา"
  correct_answer: '1'
  solution: "แผนผังก้างปลา (Ishikawa Diagram) ใช้หลักการจำแนกสาเหตุตามหมวดหมู่หลัก เช่น 4M เพื่อมองภาพรวมของปัญหาอย่างเป็นระบบ ตัวเลือก 1 ถูกต้องตามหลักการจัดการคุณภาพ"

- number: 18
  question_id: tgat3-60-q18
  topic: tgat3.complex_problem_solving
  skill: change_management
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "โครงการพัฒนาระบบซอฟต์แวร์ประสบปัญหาความล่าช้ากว่ากำหนด 2 เดือน เนื่องจากฝ่ายผู้ใช้งานร้องขอให้เพิ่มคุณสมบัติใหม่ (Scope Creep) ตลอดเวลา ผู้จัดการโครงการควรแก้ปัญหาอย่างไร"
  options:
  - id: '1'
    text: "ยอมรับทุกข้อเรียกร้องและสั่งให้ทีมงานโปรแกรมเมอร์ทำงานข้ามคืนทุกวัน"
    correct: false
    error_tag: short_term_bias
    explanation: "ทำให้ทีมงานหมดไฟและคุณภาพงานลดลงโดยไม่แก้ปัญหาการบริหารขอบเขตงาน"
  - id: '2'
    text: "ตัดการติดต่อกับฝ่ายผู้ใช้งานและส่งมอบเฉพาะงานเดิมที่เคยตกลงกันไว้"
    correct: false
    error_tag: unilateral_decision_making
    explanation: "สร้างความขัดแย้งและทำให้ระบบที่พัฒนาขึ้นอาจไม่ตอบโจทย์การใช้งานจริง"
  - id: '3'
    text: "จัดประชุมร่วมกับผู้มีส่วนได้ส่วนเสียเพื่อจัดลำดับความสำคัญ จัดทำ Change Request และปรับแผนงานตามความเป็นจริง"
    correct: true
    explanation: "ใช้กระบวนการ Change Management อย่างเป็นทางการเพื่อประเมินผลกระทบและข้อตกลงร่วมกัน"
  - id: '4'
    text: "ลาออกจากตำแหน่งเพื่อหลีกเลี่ยงความรับผิดชอบต่อความล่าช้า"
    correct: false
    error_tag: passive_resignation
    explanation: "ละทิ้งหน้าที่และไม่แสดงภาวะผู้นำในการแก้ไขปัญหา"
  correct_answer: '3'
  solution: "การจัดการ Scope Creep ต้องอาศัยกระบวนการบริหารการเปลี่ยนแปลง (Change Management) และการเจรจากับผู้มีส่วนได้ส่วนเสียเพื่อจัดลำดับความสำคัญ ตัวเลือก 3 เป็นแนวทางบริหารโครงการมืออาชีพ"

- number: 19
  question_id: tgat3-60-q19
  topic: tgat3.complex_problem_solving
  skill: bottleneck_analysis
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "โรงพยาบาลพบว่าระยะเวลารอคอยของผู้ป่วยนอก (OPD) เฉลี่ยอยู่ที่ 3.5 ชั่วโมง การวิเคราะห์เพื่อระบุปัญหาคอขวด (Bottleneck) ควรทำอย่างไร"
  options:
  - id: '1'
    text: "ทำผังกระบวนการไหลของผู้ป่วย (Value Stream Mapping) และจับเวลาในแต่ละจุดบริการเพื่อหาจุดที่เกิดความล่าช้าสูงสุด"
    correct: true
    explanation: "การทำ Process Mapping เชิงปริมาณช่วยระบุจุดสะสมของงานและค้นพบคอขวดได้อย่างแม่นยำ"
  - id: '2'
    text: "เพิ่มจำนวนเก้าอี้พักคอยเพื่อให้ผู้ป่วยรู้สึกสบายขึ้นขณะรอ"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "บรรเทาความไม่สะดวกภายนอกแต่ไม่ได้ลดระยะเวลาการรอคอยจริง"
  - id: '3'
    text: "สั่งให้แพทย์ลดเวลาในการตรวจรักษาผู้ป่วยแต่ละรายลงเหลือ 2 นาที"
    correct: false
    error_tag: ignores_systemic_ripple_effects
    explanation: "ทำลายคุณภาพและความปลอดภัยในการรักษาพยาบาล"
  - id: '4'
    text: "ปฏิเสธการรับผู้ป่วยเกินวันละ 50 คนเพื่อลดความแออัด"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขัดต่อจรรยาบรรณทางการแพทย์และภารกิจของโรงพยาบาล"
  correct_answer: '1'
  solution: "การระบุคอขวดต้องอาศัยการวิเคราะห์กระบวนการ (Process Mapping) เชิงปริมาณเพื่อดูจุดที่งานสะสม ตัวเลือก 1 ช่วยให้เห็นข้อเท็จจริงและแก้ปัญหาได้อย่างตรงจุด"

- number: 20
  question_id: tgat3-60-q20
  topic: tgat3.complex_problem_solving
  skill: cross_functional_alignment
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "องค์กรพบว่าพนักงานแผนกไอทีและแผนกการตลาดมักขัดแย้งกันเรื่องการอนุมัติแคมเปญดิจิทัล ทำให้งานสะดุด ผู้บริหารระดับสูงควรแก้ไขปัญหานี้เชิงโครงสร้างอย่างไร"
  options:
  - id: '1'
    text: "ยุบแผนกการตลาดทิ้งแล้วให้ฝ่ายไอทีเป็นผู้ทำหน้าที่แทนทั้งหมด"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ผิดหลักการจัดองค์กรตามความเชี่ยวชาญเฉพาะด้าน"
  - id: '2'
    text: "สั่งห้ามไม่ให้ทั้งสองแผนกสื่อสารกันโดยตรง และให้ส่งเอกสารผ่านเลขาฯ เท่านั้น"
    correct: false
    error_tag: ignores_root_cause
    explanation: "เพิ่มขั้นตอนที่ล่าช้าและทำลายความร่วมมือระหว่างทีม"
  - id: '3'
    text: "ให้ทั้งสองแผนกทะเลาะกันจนกว่าจะได้ข้อสรุปเองเพื่อฝึกความอดทน"
    correct: false
    error_tag: passive_resignation
    explanation: "ละเลยความขัดแย้งและปล่อยให้องค์กรสูญเสียประสิทธิภาพ"
  - id: '4'
    text: "จัดตั้งทีมทำงานข้ามสายงาน (Cross-functional Team) พร้อมกำหนดเป้าหมายร่วมกัน (Shared KPI) และกระบวนการทำงานที่ชัดเจน"
    correct: true
    explanation: "การรวมศูนย์เป้าหมายด้วย Shared KPI และกระบวนการทำงานที่ชัดเจนช่วยทลายปัญหาไซโลระหว่างแผนก"
  correct_answer: '4'
  solution: "ปัญหาไซโล (Silo Effect) และความขัดแย้งข้ามสายงานแก้ไขได้ดีที่สุดด้วยการตั้ง Cross-functional Team และสร้าง Shared KPI เพื่อให้เห็นเป้าหมายเดียวกัน ตัวเลือก 4 ถูกต้อง"

- number: 21
  question_id: tgat3-60-q21
  topic: tgat3.complex_problem_solving
  skill: five_whys_inquiry
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "บริษัทขนส่งสินค้าพบว่าอัตราการเกิดอุบัติเหตุบนท้องถนนเพิ่มขึ้น 20% ในรอบไตรมาส การใช้เทคนิค '5 Whys' เพื่อหาสาเหตุรากเหง้ามีความสำคัญอย่างไร"
  options:
  - id: '1'
    text: "เพื่อถามหาตัวคนขับรถที่ทำผิดและไล่ออกให้เร็วที่สุด"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "เป็นการเพ่งโทษบุคคล ไม่ได้ค้นหาสาเหตุเชิงระบบ"
  - id: '2'
    text: "เพื่อสืบค้นลึกลงไปทีละระดับจนพบสาเหตุเชิงระบบ เช่น นโยบายตารางงานที่บีบให้คนขับต้องอดนอน"
    correct: true
    explanation: "เทคนิค 5 Whys ช่วยเจาะลึกผ่านอาการผิวเผินไปจนถึงสาเหตุเชิงโครงสร้างของระบบงาน"
  - id: '3'
    text: "เพื่อเขียนข้ออ้าง 5 ข้อในการปฏิเสธการจ่ายค่าสินไหมทดแทนประกันภัย"
    correct: false
    error_tag: ethical_violation
    explanation: "เป็นการหลีกเลี่ยงความรับผิดชอบและขัดต่อกฎหมาย"
  - id: '4'
    text: "เพื่อให้ครบตามขั้นตอนเอกสารแต่ยังคงใช้นโยบายเดิมต่อไป"
    correct: false
    error_tag: superficial_innovation
    explanation: "ทำเป็นพิธีการโดยไม่นำผลลัพธ์ไปสู่การเปลี่ยนแปลงจริง"
  correct_answer: '2'
  solution: "เทคนิค 5 Whys มุ่งเจาะลึกจากอาการภายนอกลงสู่รากเหง้าเชิงโครงสร้างหรือระบบ ตัวเลือก 2 แสดงให้เห็นว่าอุบัติเหตุอาจเกิดจากนโยบายการจัดตารางเวลา ซึ่งเป็น Root Cause ที่แท้จริง"

- number: 22
  question_id: tgat3-60-q22
  topic: tgat3.complex_problem_solving
  skill: trade_off_analysis
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการแก้ปัญหาซับซ้อนที่ต้องเลือกระหว่าง 'การลดต้นทุนทันที 20%' กับ 'การรักษามาตรฐานสิ่งแวดล้อม' ผู้บริหารควรใช้หลักการ Trade-off Analysis อย่างไร"
  options:
  - id: '1'
    text: "เลือกวิธีที่ลดต้นทุนทันทีเสมอโดยไม่ต้องคำนึงถึงผลกระทบด้านอื่น"
    correct: false
    error_tag: short_term_bias
    explanation: "มองเพียงผลกำไรระยะสั้นแต่สร้างความเสี่ยงด้านกฎหมายและชื่อเสียง"
  - id: '2'
    text: "โยนเหรียญหัวก้อยเพื่อความรวดเร็วและยุติธรรม"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขาดความเป็นมืออาชีพและละเลยการใช้ข้อมูลวิเคราะห์"
  - id: '3'
    text: "ประเมินผลกระทบ ต้นทุนแฝง ความเสี่ยงทางกฎหมาย และคุณค่าระยะยาวของทั้งสองทางเลือกอย่างรอบด้านก่อนตัดสินใจ"
    correct: true
    explanation: "การชั่งน้ำหนักข้อดีข้อเสียอย่างรอบด้านทั้งมิติการเงิน สังคม และสิ่งแวดล้อมสะท้อนการตัดสินใจที่มีคุณภาพ"
  - id: '4'
    text: "เลื่อนการตัดสินใจออกไปอย่างไม่มีกำหนดจนกว่าปัญหาจะคลี่คลายเอง"
    correct: false
    error_tag: passive_resignation
    explanation: "การไม่ตัดสินใจคือความเสี่ยงที่ทำให้ปัญหาบานปลาย"
  correct_answer: '3'
  solution: "การวิเคราะห์ Trade-off ต้องชั่งน้ำหนักผลได้ผลเสียทั้งในมิติการเงิน สิ่งแวดล้อม สังคม และความเสี่ยงระยะยาว ตัวเลือก 3 เป็นการตัดสินใจที่มีวุฒิภาวะและรอบด้าน"

- number: 23
  question_id: tgat3-60-q23
  topic: tgat3.complex_problem_solving
  skill: proactive_maintenance
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "โรงงานแห่งหนึ่งพบว่าเครื่องจักรหลักหยุดทำงานกะทันหันบ่อยครั้ง ส่งผลให้สูญเสียกำลังการผลิตมหาศาล แนวทางป้องกันในระยะยาวที่สะท้อนการแก้ปัญหาเชิงรุก (Proactive) คือข้อใด"
  options:
  - id: '1'
    text: "รอให้เครื่องจักรพังก่อนแล้วค่อยเรียกช่างมาซ่อมแซมเป็นครั้งๆ ไป"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "เป็นการบำรุงรักษาเชิงรับ (Reactive) ที่สร้างความสูญเสียสูง"
  - id: '2'
    text: "ติดตั้งระบบเซนเซอร์และนำแผนการบำรุงรักษาเชิงพยากรณ์และเชิงป้องกัน (Predictive & Preventive Maintenance) มาใช้"
    correct: true
    explanation: "การตรวจสอบและบำรุงรักษาตามรอบเวลาเชิงป้องกันช่วยตัดวงจรเครื่องจักรชำรุดกะทันหัน"
  - id: '3'
    text: "ซื้อเครื่องจักรสำรองมาวางไว้เฉยๆ อีก 5 เครื่องโดยไม่ดูแลรักษา"
    correct: false
    error_tag: resource_waste_without_diagnosis
    explanation: "สิ้นเปลืองเงินลงทุนโดยไม่ปรับปรุงระบบการจัดการ"
  - id: '4'
    text: "สั่งเดินเครื่องด้วยความเร็วสูงสุดต่อไปเพื่อชดเชยเวลาที่เสียไป"
    correct: false
    error_tag: ignores_systemic_ripple_effects
    explanation: "ยิ่งเร่งให้เครื่องจักรชำรุดเสียหายหนักขึ้นและเสี่ยงต่ออุบัติเหตุ"
  correct_answer: '2'
  solution: "การแก้ปัญหาเชิงรุกมุ่งเน้นการตรวจจับสัญญาณเตือนล่วงหน้าและการป้องกันก่อนเกิดความเสียหาย ตัวเลือก 2 เป็นมาตรฐานการจัดการสมัยใหม่ที่ยั่งยืน"

- number: 24
  question_id: tgat3-60-q24
  topic: tgat3.complex_problem_solving
  skill: risk_management
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ทีมงานได้รับมอบหมายให้จัดกิจกรรมกลางแจ้งขนาดใหญ่ในฤดูมรสุม การบริหารความเสี่ยง (Risk Management) ที่เหมาะสมที่สุดคือข้อใด"
  options:
  - id: '1'
    text: "อธิษฐานขอให้ฝนไม่ตกและดำเนินงานตามแผนเดิมโดยไม่มีแผนรองรับ"
    correct: false
    error_tag: lack_of_contingency_planning
    explanation: "พึ่งพาโชคชะตาโดยไม่มีแผนรองรับความเสี่ยง"
  - id: '2'
    text: "ยกเลิกการจัดงานล่วงหน้า 3 เดือนทันทีแม้ยังไม่มีพยากรณ์อากาศที่แน่นอน"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ตื่นตระหนกเกินเหตุและทำให้สูญเสียโอกาสทางธุรกิจ"
  - id: '3'
    text: "จัดงานต่อไปกลางสายฝนและบังคับให้ผู้ร่วมงานยืนตากฝนจนจบงาน"
    correct: false
    error_tag: ignores_systemic_ripple_effects
    explanation: "เพิกเฉยต่อความปลอดภัยและสุขภาพของผู้เข้าร่วมงาน"
  - id: '4'
    text: "ประเมินความน่าจะเป็นและผลกระทบของพายุ จัดเตรียมเต็นท์กันฝน แผนย้ายเข้าอาคารสำรอง และระบบแจ้งเตือนฉุกเฉิน"
    correct: true
    explanation: "การจัดทำ Contingency Plan และแผนสำรองตามระดับความเสี่ยงช่วยลดผลกระทบได้อย่างเป็นรูปธรรม"
  correct_answer: '4'
  solution: "การบริหารความเสี่ยงที่มีประสิทธิภาพต้องประเมินความเป็นไปได้และเตรียมแผนฉุกเฉิน (Contingency Plan) ที่ปฏิบัติได้จริง ตัวเลือก 4 ครอบคลุมการป้องกันและการบรรเทาผลกระทบ"

- number: 25
  question_id: tgat3-60-q25
  topic: tgat3.complex_problem_solving
  skill: data_verification
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "เมื่อพบว่ามีข้อมูลสถิติสองชุดที่ขัดแย้งกันเกี่ยวกับพฤติกรรมลูกค้า นักวิเคราะห์ควรปฏิบัติอย่างไรตามหลัก Data-Driven Problem Solving"
  options:
  - id: '1'
    text: "เลือกใช้เฉพาะชุดข้อมูลที่สนับสนุนความคิดเห็นเดิมของตนเองและทิ้งอีกชุดไป"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "เกิดอคติ Confirmation Bias และทำให้การตัดสินใจผิดพลาด"
  - id: '2'
    text: "ตรวจสอบระเบียบวิธีวิจัย ขนาดกลุ่มตัวอย่าง แหล่งที่มา และบริบทการเก็บข้อมูลของทั้งสองชุดเพื่อหาสาเหตุของความแตกต่าง"
    correct: true
    explanation: "การตรวจสอบ Methodology และ Sampling ช่วยให้เข้าใจว่าทำไมผลลัพธ์จึงต่างกันและนำไปสู่ข้อสรุปที่ถูกต้อง"
  - id: '3'
    text: "สรุปว่าข้อมูลตัวเลขทั้งสองชุดไม่น่าเชื่อถือและหันไปใช้สัญชาตญาณส่วนตัวแทน"
    correct: false
    error_tag: ignores_root_cause
    explanation: "ละทิ้งหลักฐานเชิงประจักษ์โดยไม่มีเหตุผลอันสมควร"
  - id: '4'
    text: "นำตัวเลขของข้อมูลทั้งสองชุดมาหาค่าเฉลี่ยทางคณิตศาสตร์ทันทีโดยไม่ตรวจสอบ"
    correct: false
    error_tag: symptomatic_treatment
    explanation: "การเฉลี่ยข้อมูลที่มีข้อผิดพลาดจะยิ่งทำให้ผลลัพธ์บิดเบือน"
  correct_answer: '2'
  solution: "เมื่อข้อมูลขัดแย้งกัน ต้องตรวจสอบความถูกต้องของ Methodology, Sample Size และ Source เพื่อเข้าใจบริบทที่แท้จริง ตัวเลือก 2 สะท้อนกระบวนการคิดทางวิทยาศาสตร์"

- number: 26
  question_id: tgat3-60-q26
  topic: tgat3.complex_problem_solving
  skill: pattern_recognition
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ระบบเครือข่ายของบริษัทล่มซ้ำซากในทุกวันศุกร์สิ้นเดือน การสืบสวนปัญหาควรให้ความสำคัญกับปัจจัยใดมากที่สุด"
  options:
  - id: '1'
    text: "วิเคราะห์ปริมาณทราฟฟิก กิจกรรมประมวลผลระบบบัญชี และพฤติกรรมการดึงข้อมูลพร้อมกันในเวลาดังกล่าว"
    correct: true
    explanation: "รูปแบบที่เกิดซ้ำตามรอบเวลาชี้ชัดว่าสัมพันธ์กับโหลดของกิจกรรมทางธุรกิจ เช่น การปิดงบสิ้นเดือน"
  - id: '2'
    text: "โทษว่าเป็นเพราะสภาพอากาศวันศุกร์"
    correct: false
    error_tag: premature_blame_without_evidence
    explanation: "สรุปแบบไร้ตรรกะและไม่มีข้อมูลทางเทคนิครองรับ"
  - id: '3'
    text: "ปิดระบบเครือข่ายทุกวันศุกร์เพื่อไม่ให้ระบบล่ม"
    correct: false
    error_tag: lacks_feasibility
    explanation: "ขัดขวางการทำงานของทั้งบริษัทและไม่แก้ปัญหาความจุเครือข่าย"
  - id: '4'
    text: "ปรับเงินพนักงานฝ่ายไอทีทุกคนทุกวันศุกร์"
    correct: false
    error_tag: ethical_violation
    explanation: "ลงโทษโดยไร้เหตุผลและสร้างความไม่เป็นธรรม"
  correct_answer: '1'
  solution: "รูปแบบความผิดพลาดที่เกิดขึ้นเป็นวงรอบ (Periodic Pattern) มักสัมพันธ์กับกิจกรรมเฉพาะกิจ เช่น การปิดยอดบัญชีสิ้นเดือน ตัวเลือก 1 นำไปสู่การระบุปัจจัยกระตุ้นปัญหาได้อย่างแม่นยำ"

- number: 27
  question_id: tgat3-60-q27
  topic: tgat3.complex_problem_solving
  skill: supplier_quality_management
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ผู้จัดการฝ่ายผลิตพบว่าวัตถุดิบจากซัพพลายเออร์รายใหญ่มีคุณภาพไม่สม่ำเสมอ ส่งผลให้สินค้าสำเร็จรูปมีตำหนิ การเจรจาแก้ปัญหาควรเป็นไปในทิศทางใด"
  options:
  - id: '1'
    text: "ยกเลิกสัญญาและฟ้องร้องดำเนินคดีทันทีโดยไม่แจ้งเตือนล่วงหน้า"
    correct: false
    error_tag: emotional_reactivity
    explanation: "ทำให้สายการผลิตหยุดชะงักเนื่องจากขาดวัตถุดิบทดแทน"
  - id: '2'
    text: "ยอมรับวัตถุดิบที่ชำรุดต่อไปและแอบนำไปผสมกับสินค้าเพื่อลดต้นทุน"
    correct: false
    error_tag: ethical_violation
    explanation: "หลอกลวงผู้บริโภคและทำลายชื่อเสียงของบริษัท"
  - id: '3'
    text: "แชร์ข้อมูลสถิติข้อบกพร่อง กำหนดเกณฑ์คุณภาพ (SLA) ร่วมกัน และตั้งทีมตรวจสอบคุณภาพต้นทางก่อนส่งมอบ"
    correct: true
    explanation: "การใช้ข้อมูลและเกณฑ์ SLA ช่วยให้คู่ค้าร่วมมือกันควบคุมคุณภาพได้อย่างโปร่งใสและสร้างสรรค์"
  - id: '4'
    text: "ด่าทอตัวแทนฝ่ายขายของซัพพลายเออร์เพื่อระบายความโกรธ"
    correct: false
    error_tag: emotional_reactivity
    explanation: "พฤติกรรมไม่เป็นมืออาชีพและไม่ช่วยปรับปรุงคุณภาพสินค้า"
  correct_answer: '3'
  solution: "การจัดการห่วงโซ่อุปทาน (Supply Chain Management) ต้องร่วมมือกันพัฒนาคุณภาพด้วยข้อมูลเชิงประจักษ์และการควบคุมคุณภาพร่วมกัน ตัวเลือก 3 เป็น win-win approach"

- number: 28
  question_id: tgat3-60-q28
  topic: tgat3.complex_problem_solving
  skill: prioritization_matrix
  score: 1.6666666666666667
  answer_type: single_choice
  stem: "ในการแก้ปัญหาข้อร้องเรียนเรื่องการบริการล่าช้า การจัดลำดับความสำคัญของปัญหา (Prioritization) ควรใช้เกณฑ์ใด"
  options:
  - id: '1'
    text: "เลือกแก้ปัญหาของลูกค้าที่ส่งเสียงโวยวายดังที่สุดก่อนเสมอ"
