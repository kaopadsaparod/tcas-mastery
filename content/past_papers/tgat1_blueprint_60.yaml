  answer_type: single_choice
  stem: 'Directions: Read the public health advisory on cardiovascular wellness below and choose the best answer for questions
    31-35.


    Contemporary epidemiological data reveals that sedentary behavior constitutes a major contributing factor to early cardiovascular
    morbidity worldwide. Health authorities emphasize that individuals who engage in desk-bound occupations (31) ________
    adopting structured physical routines into their daily regimens. Even modest lifestyle modifications, such as brisk walking
    for thirty minutes each morning, (32) ________ demonstrated to yield substantial reductions in hypertension risk.


    Furthermore, nutritional scientists underscore the protective role of whole dietary fiber, (33) ________ biochemical properties
    facilitate the clearance of low-density lipoprotein cholesterol from arterial walls. (34) ________, the widespread consumption
    of ultra-processed snacks often counteracts these cardiovascular advantages by inundating the bloodstream with trans fats
    and excessive sodium. Consequently, healthcare practitioners urge that patients (35) ________ certified nutritionists
    when designing long-term lifestyle interventions.


    Choose the best option for blank (31):'
  options:
  - id: '1'
    text: are strongly encouraged to consider
    correct: true
    error_tag: null
    explanation: Passive construction ('are encouraged to consider') correctly indicates healthcare authorities recommending
      action to individuals.
  - id: '2'
    text: have encouraged strongly to consider
    correct: false
    error_tag: active_voice_mismatch
    explanation: Active voice implies the individuals are encouraging others, which reverses the medical recommendation relationship.
  - id: '3'
    text: to be strongly encouraging for
    correct: false
    error_tag: infinitive_fragment
