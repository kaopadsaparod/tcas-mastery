  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'IT Helpdesk: "IT Support Helpdesk, this is Kevin speaking. How may I assist you today?"

    Staff Member: "Good morning, Kevin. I have been locked out of my university email portal after changing my password yesterday."

