    text: Buy a brand new laptop because locked email accounts can never be recovered.
    correct: false
    error_tag: factually_absurd_advice
    explanation: Nonsensical advice for a standard password lockout.
  correct_answer: '2'
  solution: 'ตัวเลือกที่ 2 ถูกต้อง เจ้าหน้าที่ IT เสนอปลดล็อกและส่งลิงก์รีเซ็ตรหัสผ่าน โดยขอให้ยืนยันรหัสพนักงานและอีเมลสำรอง
