  - id: '2'
    text: thereby
    correct: true
    error_tag: null
    explanation: '''Thereby'' means ''by that means / as a result of that'', linking the destabilization of voltage to the
      resulting blackouts with a present participle (''causing'').'
  - id: '3'
    text: whereas
    correct: false
    error_tag: subordinating_conjunction_error
    explanation: '''Whereas'' introduces a contrasting dependent clause with subject and finite verb, not a participial result
