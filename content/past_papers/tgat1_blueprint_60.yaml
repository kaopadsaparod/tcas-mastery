questions:
- number: 1
  question_id: tgat1-60-q01
  topic: tgat1.speaking.question_response
  skill: polite_workplace_refusal
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'Your supervisor asks: ''Could you stay an extra two hours tonight to finalize the quarterly audit report?'' You have
    a non-negotiable family emergency. What is the most appropriate professional response?'
  options:
  - id: '1'
    text: I sincerely apologize, but I have an urgent family matter tonight that I cannot reschedule. May I come in an hour
      early tomorrow morning to complete it?
    correct: true
    error_tag: null
    explanation: Apologizes courteously, provides a clear valid reason without oversharing, and proactively offers an early
      morning solution.
  - id: '2'
    text: No, my working hours ended fifteen minutes ago and I need to go home.
    correct: false
    error_tag: blunt_and_confrontational
    explanation: Unprofessionally blunt and lacks diplomatic courtesy required in workplace communication.
  - id: '3'
    text: Why does the audit report always have to be done at the very last minute?
    correct: false
    error_tag: accusatory_complaint
    explanation: Complains and questions supervisor's management instead of directly addressing the overtime request.
  - id: '4'
    text: I will stay, but only if you promise to give me a promotion next month.
    correct: false
    error_tag: inappropriate_quid_pro_quo
    explanation: Unprofessional bargaining that violates organizational ethics.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 เหมาะสมที่สุดในการปฏิเสธงานล่วงเวลาอย่างมืออาชีพ โดยขออภัย แจ้งเหตุจำเป็นของครอบครัวอย่างสุภาพ
    และเสนอทางออกด้วยการมาทำงานเช้าตรู่วันรุ่งขึ้น

    ตัวเลือก 2 ห้วนกระด้างเกินไป, ตัวเลือก 3 บ่นตัดพ้อ, ตัวเลือก 4 ต่อรองผลประโยชน์อย่างไม่เหมาะสม'
- number: 2
  question_id: tgat1-60-q02
  topic: tgat1.speaking.question_response
  skill: academic_collaboration_sharing_notes
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'A classmate who was absent due to illness asks: ''Would you mind sharing your chemistry lecture notes from yesterday?''
    How do you respond positively and helpfully?'
  options:
  - id: '1'
    text: Yes, I would mind because taking notes requires a lot of effort.
    correct: false
    error_tag: misunderstood_would_you_mind
    explanation: Misunderstands the idiom 'Would you mind' which requires 'Not at all' or 'Of course not' to express willingness.
  - id: '2'
    text: Not at all! I have already digitized them into a PDF. Let me send the link to your email.
    correct: true
    error_tag: null
    explanation: Correctly answers 'Not at all' to indicate willingness, followed by immediate helpful action.
  - id: '3'
    text: You should pay me 100 Baht for the time I spent writing them.
    correct: false
    error_tag: transactional_greed
    explanation: Unfriendly and contrary to peer cooperative learning culture.
  - id: '4'
    text: Why did you skip chemistry class in the first place?
    correct: false
    error_tag: unwarranted_interrogation
    explanation: Interrogates the classmate aggressively despite their valid illness.
  correct_answer: '2'
  solution: 'ตัวเลือกที่ 2 ถูกต้องตามสำนวนภาษาอังกฤษ ''Would you mind...?'' หากยินดีช่วยเหลือต้องตอบปฏิเสธความรังเกียจ เช่น
    ''Not at all'' (ไม่รังเกียจเลย/ยินดีอย่างยิ่ง) พร้อมส่งไฟล์ให้

    ตัวเลือก 1 ตีความสำนวนผิด, ตัวเลือก 3 และ 4 แสดงความไม่เป็นมิตรและซักไซ้เพื่อนที่ป่วย'
- number: 3
  question_id: tgat1-60-q03
  topic: tgat1.speaking.question_response
  skill: asking_for_software_assistance
  score: 1.6666666666666667
  answer_type: single_choice
  stem: You are struggling to create a dynamic pivot table in a new data spreadsheet at your internship. How should you ask
    a senior colleague for guidance politely?
  options:
  - id: '1'
    text: Excuse me, David. When you have a brief moment, could you show me how to configure this pivot table? I am having
      trouble with the data range.
    correct: true
    error_tag: null
    explanation: Respectfully asks for a brief moment, identifies the specific issue, and maintains polite deference to senior's
      time.
  - id: '2'
    text: Do this pivot table for me right now because I have never used this software before.
    correct: false
    error_tag: demanding_command
    explanation: Demands the colleague do the work instead of asking for guidance.
  - id: '3'
    text: This software program is completely terrible and useless.
    correct: false
    error_tag: venting_frustration
    explanation: Vents unconstructive frustration without asking for assistance.
  - id: '4'
    text: Hey David, are you busy playing games or can you work?
    correct: false
    error_tag: unprofessional_sarcasm
    explanation: Sarcastic and disrespectful to a senior colleague.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 ถูกต้องตามมารยาทการขอความช่วยเหลือในที่ทำงาน (Asking for assistance) โดยขอเวลาสั้นๆ เมื่อพี่ว่าง
    และระบุจุดที่ติดขัดอย่างชัดเจน

    ตัวเลือก 2 สั่งให้ทำให้, ตัวเลือก 3 โทษโปรแกรม, ตัวเลือก 4 พูดจาเสียดสีรุ่นพี่'
- number: 4
  question_id: tgat1-60-q04
  topic: tgat1.speaking.question_response
  skill: expressing_condolences_and_sympathy
  score: 1.6666666666666667
  answer_type: single_choice
  stem: A close colleague has just returned to work after losing her grandmother. What is the most empathetic and supportive
    remark to make?
  options:
  - id: '1'
    text: Cheer up! Everyone has to pass away eventually, so don't be sad.
    correct: false
    error_tag: dismissive_of_grief
    explanation: Minimizes grief with toxic positivity and insensitive clichés.
  - id: '2'
    text: Did your grandmother leave you any valuable inheritance?
    correct: false
    error_tag: deeply_inappropriate_curiosity
    explanation: Inappropriate inquiry about financial inheritance during bereavement.
  - id: '3'
    text: I was so deeply sorry to hear about your loss. Please know that we are all thinking of you, and let me know if you
      need any support with your workload.
    correct: true
    error_tag: null
    explanation: Expresses sincere sympathy, solidarity, and offers practical workplace support during bereavement.
  - id: '4'
    text: You missed three critical client presentations while you were absent.
    correct: false
    error_tag: callous_reproach
    explanation: Callously reproaches the colleague about work duties during a period of mourning.
  correct_answer: '3'
  solution: 'ตัวเลือกที่ 3 เป็นการแสดงความเสียใจอย่างจริงใจ (Expressing condolences) แสดงความห่วงใย และเสนอช่วยเหลืองานเพื่อแบ่งเบาภาระ

    ตัวเลือก 1 ปลอบใจแบบไม่ใส่ใจความรู้สึก, ตัวเลือก 2 ถามเรื่องมรดกซึ่งเสียมารยาทอย่างยิ่ง, ตัวเลือก 4 ตำหนิเรื่องงานอย่างไร้ความเห็นอกเห็นใจ'
- number: 5
  question_id: tgat1-60-q05
  topic: tgat1.speaking.question_response
  skill: asking_for_directions_politely
  score: 1.6666666666666667
  answer_type: single_choice
  stem: You are lost in an unfamiliar shopping district and need to find the nearest MRT subway station. How do you approach
    a pedestrian politely?
  options:
  - id: '1'
    text: Pardon me, could you please tell me which direction leads to the nearest MRT station?
    correct: true
    error_tag: null
    explanation: Polite opening ('Pardon me') and clear indirect question asking for directions.
  - id: '2'
    text: MRT station! Where is it? Answer me quickly!
    correct: false
    error_tag: aggressive_interrogation
    explanation: Aggressive, fragmented, and demanding tone.
  - id: '3'
    text: You must walk with me until we find the subway station.
    correct: false
    error_tag: unreasonable_imposition
    explanation: Unreasonable demand on a stranger's time and personal space.
  - id: '4'
    text: Why are there no signposts anywhere in this city?
    correct: false
    error_tag: rhetorical_complaint
    explanation: Complains rhetorically to a stranger rather than asking for directions.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 ถูกต้องตามการถามทาง (Asking for directions) เริ่มต้นด้วย Pardon me และใช้โครงสร้างคำถามที่สุภาพนุ่มนวล (could
    you please tell me...)

    ตัวเลือก 2 ตะคอกถาม, ตัวเลือก 3 บังคับให้เดินไปด้วย, ตัวเลือก 4 บ่นเรื่องป้ายบอกทาง'
- number: 6
  question_id: tgat1-60-q06
  topic: tgat1.speaking.question_response
  skill: responding_to_compliments
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'After delivering a group presentation, your instructor says: ''Your explanation of the economic models was exceptionally
    clear and articulate!'' How should you reply graciously?'
  options:
  - id: '1'
    text: I know, I am clearly the smartest presenter in this entire class.
    correct: false
    error_tag: arrogant_boasting
    explanation: Boastful and condescending to peers.
  - id: '2'
    text: Thank you very much, Professor. Our whole group spent a lot of time refining the explanations, so I truly appreciate
      your feedback.
    correct: true
    error_tag: null
    explanation: Graciously thanks the instructor, shares credit with the presentation team, and values the academic feedback.
  - id: '3'
    text: Actually, my presentation was mediocre and full of embarrassing errors.
    correct: false
    error_tag: excessive_self_deprecation
    explanation: Excessive self-deprecation that rejects sincere academic praise uncomfortably.
  - id: '4'
    text: Does this compliment mean I am guaranteed an A grade for the course?
    correct: false
    error_tag: presumptuous_grade_bargaining
    explanation: Inappropriately bargains for grades upon receiving qualitative praise.
  correct_answer: '2'
  solution: 'ตัวเลือกที่ 2 เป็นการรับคำชมอย่างถ่อมตนและเป็นมืออาชีพ (Accepting compliments graciously) โดยขอบคุณอาจารย์และแบ่งปันความดีความชอบให้เพื่อนร่วมกลุ่ม

    ตัวเลือก 1 หยิ่งยะโส, ตัวเลือก 3 ถ่อมตัวเกินเหตุจนดูปฏิเสธคำชม, ตัวเลือก 4 ทวงเกรด A ทันที'
- number: 7
  question_id: tgat1-60-q07
  topic: tgat1.speaking.question_response
  skill: academic_office_hours_inquiry
  score: 1.6666666666666667
  answer_type: single_choice
  stem: You need to discuss your graduation thesis proposal with your faculty advisor. What is the most appropriate way to
    request an appointment via email or conversation?
  options:
  - id: '1'
    text: Dear Dr. Bennett, would you have 20 minutes available during your office hours this Thursday to discuss my thesis
      proposal?
    correct: true
    error_tag: null
    explanation: Formal academic address, specifies duration and preferred time slot, and clarifies the academic purpose.
  - id: '2'
    text: Wait in your office on Thursday because I will come by whenever I finish lunch.
    correct: false
    error_tag: presumptuous_command
    explanation: Disrespectful command that assumes the advisor must wait on the student's schedule.
  - id: '3'
    text: I need to talk to you right now, stop whatever research you are doing.
    correct: false
    error_tag: disrespectful_urgency
    explanation: Blatantly disrespectful of a faculty member's time.
  - id: '4'
    text: Let's meet up at a bar tonight to talk about my thesis.
    correct: false
    error_tag: inappropriate_informality
    explanation: Inappropriate social setting and informal boundary violation for faculty consultation.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 เหมาะสมที่สุดในการนัดหมายอาจารย์ที่ปรึกษา (Requesting an academic appointment) ใช้คำขึ้นต้นทางการ
    ระบุเวลาที่ต้องการ และแจ้งหัวข้อปรึกษาชัดเจน

    ตัวเลือก 2 สั่งให้อาจารย์รอ, ตัวเลือก 3 รบกวนเวลาอย่างก้าวร้าว, ตัวเลือก 4 ชวนไปร้านเหล้าซึ่งผิดกาลเทศะ'
- number: 8
  question_id: tgat1-60-q08
  topic: tgat1.speaking.question_response
  skill: apologizing_for_email_delay
  score: 1.6666666666666667
  answer_type: single_choice
  stem: You were away on field research without internet access for three days and need to respond to an important client
    inquiry. How should you open your email?
  options:
  - id: '1'
    text: Better late than never! Here are the answers you wanted.
    correct: false
    error_tag: flippant_cliche
    explanation: Uses a flippant cliché unsuited for professional client correspondence.
  - id: '2'
    text: Why were you sending emails while I was out of the office?
    correct: false
    error_tag: defensive_blame
    explanation: Defensively faults the client for sending legitimate business inquiries.
  - id: '3'
    text: Please accept my apologies for the delayed response. I was conducting remote field research with limited connectivity,
      but I am pleased to address your questions below.
    correct: true
    error_tag: null
    explanation: Sincere apology, concise factual reason, and immediate transition to addressing client needs.
  - id: '4'
    text: I saw your message three days ago but didn't feel like replying until today.
    correct: false
    error_tag: admitting_unprofessional_neglect
    explanation: Unprofessional and damages client trust by claiming indifference.
  correct_answer: '3'
  solution: 'ตัวเลือกที่ 3 ถูกต้องตามหลักการสื่อสารธุรกิจ (Business email etiquette) เมื่อตอบอีเมลล่าช้า ต้องขออภัย ชี้แจงเหตุผลทางเทคนิค/การทำงานสั้นๆ
    และตอบคำถามของลูกค้าทันที

    ตัวเลือก 1 ใช้สำนวนเล่นลิ้น, ตัวเลือก 2 โทษลูกค้า, ตัวเลือก 4 พูดจาไม่ใส่ใจลูกค้า'
- number: 9
  question_id: tgat1-60-q09
  topic: tgat1.speaking.question_response
  skill: declining_retail_sales_politely
  score: 1.6666666666666667
  answer_type: single_choice
  stem: While browsing in an electronics boutique, an aggressive sales associate repeatedly urges you to purchase an extended
    warranty you do not want. How do you decline firmly yet politely?
  options:
  - id: '1'
    text: Get away from me before I call the security guards!
    correct: false
    error_tag: overreacting_hostility
    explanation: Disproportionate hostility toward a standard retail interaction.
  - id: '2'
    text: Thank you for the explanation, but I am confident with the standard manufacturer warranty and will decline the extended
      coverage today.
    correct: true
    error_tag: null
    explanation: Acknowledges the pitch politely ('Thank you'), states firm decision objectively, and closes the discussion
      without conflict.
  - id: '3'
    text: Warranties are complete scams designed to steal money from foolish shoppers.
    correct: false
    error_tag: accusatory_insult
    explanation: Insults the business and employees needlessly.
  - id: '4'
    text: Maybe I will buy five warranties tomorrow if I win the national lottery.
    correct: false
    error_tag: mocking_sarcasm
    explanation: Sarcastic and unconstructive.
  correct_answer: '2'
  solution: 'ตัวเลือกที่ 2 เป็นการปฏิเสธข้อเสนอทางการค้าอย่างสุภาพแต่มั่นคง (Declining a sales offer firmly and politely)
    ขอบคุณข้อมูล ยืนยันว่าพอใจกับการรับประกันปกติ และปฏิเสธอย่างชัดเจน

    ตัวเลือก 1 ขู่รปภ.เกินเหตุ, ตัวเลือก 3 กล่าวหาว่าเป็นมิจฉาชีพ, ตัวเลือก 4 ประชดประชัน'
- number: 10
  question_id: tgat1-60-q10
  topic: tgat1.speaking.question_response
  skill: diplomatic_meeting_rescheduling
  score: 1.6666666666666667
  answer_type: single_choice
  stem: A group project meeting was scheduled for Tuesday at 4 PM, but your biology laboratory exam was moved to that exact
    hour. How do you notify your group mates?
  options:
  - id: '1'
    text: Hi team, my biology lab exam was just rescheduled to Tuesday at 4 PM. Could we move our meeting to 6 PM that evening
      or Wednesday afternoon instead? I apologize for the inconvenience.
    correct: true
    error_tag: null
    explanation: Promptly informs the team with the specific academic conflict, apologizes, and proposes concrete alternative
      times.
  - id: '2'
    text: I am not coming on Tuesday because my biology exam is way more important than this silly group project.
    correct: false
    error_tag: belittling_group_work
    explanation: Belittles the team effort and exhibits uncooperative arrogance.
  - id: '3'
    text: Cancel the entire presentation since I won't be available at 4 PM.
    correct: false
    error_tag: destructive_ultimatum
    explanation: Issues a destructive ultimatum rather than collaborating to find a solution.
  - id: '4'
    text: Whatever you guys decide without me is fine, but don't blame me if we fail.
    correct: false
    error_tag: passive_aggressive_disengagement
    explanation: Passive-aggressively disengages from team responsibility.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 เหมาะสมที่สุดในการแจ้งเลื่อนการนัดหมายกลุ่ม (Rescheduling a group meeting) โดยระบุเหตุผลสอบชน ขออภัยในความไม่สะดวก
    และเสนอช่วงเวลาใหม่ให้เพื่อนเลือกทันที

    ตัวเลือก 2 ดูถูกโครงงานกลุ่ม, ตัวเลือก 3 สั่งยกเลิกงาน, ตัวเลือก 4 ปัดความรับผิดชอบล่วงหน้า'
- number: 11
  question_id: tgat1-60-q11
  topic: tgat1.speaking.short_conversations
  skill: cafe_customization_order
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'Barista: "Welcome to Roast & Bloom. What can I get started for you today?"

    Customer: "I''d like an iced oat milk latte, please."

    Barista: "Certainly. ________________________"

    Customer: "Medium size, and just light sweetness with 25% syrup, please."

    Which question best completes the Barista''s turn?'
  options:
  - id: '1'
    text: What size would you prefer, and do you have any sweetness preference?
    correct: true
    error_tag: null
    explanation: Directly prompts for the size and sweetness level that the customer answers in the next turn.
  - id: '2'
    text: Why do you always order oat milk instead of whole dairy milk?
    correct: false
    error_tag: inappropriate_customer_inquiry
    explanation: Intrusive inquiry questioning customer dietary choice.
  - id: '3'
    text: Can you pay me cash because our credit card machine is broken?
    correct: false
    error_tag: payment_timing_mismatch
    explanation: Payment inquiry comes after finalizing order details, not during beverage specification.
  - id: '4'
    text: Would you like a hot croissant or a blueberry muffin today?
    correct: false
    error_tag: irrelevant_food_upsell
    explanation: Customer's answer specifies size and sweetness, not pastry selections.
  correct_answer: '1'
  solution: 'ตัวเลือกที่ 1 ถูกต้องที่สุด ลูกค้าตอบว่า ''Medium size, and just light sweetness...'' แสดงว่าคำถามของบาริสต้าต้องถามเกี่ยวกับขนาดแก้วและระดับความหวาน
    (size and sweetness preference)

    ตัวเลือก 2 ซักไซ้เรื่องนม, ตัวเลือก 3 ถามเรื่องเงินสดก่อนสั่งเสร็จ, ตัวเลือก 4 เสนอขายขนม'
- number: 12
  question_id: tgat1-60-q12
  topic: tgat1.speaking.short_conversations
  skill: hotel_reservation_checkin
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'Front Desk Agent: "Good afternoon, sir. Welcome to the Grand Meridian Hotel."

    Guest: "Hello, I have a reservation under the name Julian Vance for two nights."

    Front Desk Agent: "Yes, Mr. Vance, I see your booking for a Deluxe King Room. ________________________"

    Guest: "A high floor with a city view away from the elevator would be fantastic."

    Which phrase best fits the blank?'
  options:
  - id: '1'
    text: Did you bring enough cash to pay for your room right now?
    correct: false
    error_tag: impolite_payment_assumption
    explanation: Impolite hospitality phrasing that ignores standard credit card holds.
  - id: '2'
    text: Do you have any specific room location preferences before I assign your key?
    correct: true
    error_tag: null
    explanation: Matches the guest's response specifying a high floor with a city view away from the elevator.
  - id: '3'
    text: Our hotel pool is currently closed for annual maintenance.
    correct: false
    error_tag: unprompted_facility_notice
    explanation: Facility notice does not elicit the guest's room preference response.
  - id: '4'
    text: Would you like to cancel your reservation and find another hotel?
    correct: false
    error_tag: absurd_service_inversion
    explanation: Absurdly hostile and contrary to hospitality standards.
  correct_answer: '2'
  solution: 'ตัวเลือกที่ 2 ถูกต้อง แขกตอบว่า ''A high floor with a city view...'' แสดงว่าพนักงานต้อนรับสอบถามเกี่ยวกับความต้องการพิเศษเรื่องตำแหน่งห้องพัก
    (room location preferences)

    ตัวเลือกอื่นถามเรื่องเงินสด แจ้งสระว่ายน้ำปิด หรือเสนอให้ยกเลิกห้องพัก ซึ่งไม่เข้ากับบทสนทนา'
- number: 13
  question_id: tgat1-60-q13
  topic: tgat1.speaking.short_conversations
  skill: library_reserved_book_inquiry
  score: 1.6666666666666667
  answer_type: single_choice
  stem: 'Student: "Hi, I received an automated email notification stating that my book hold is ready for pickup."

