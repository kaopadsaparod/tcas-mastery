    text: เลือกสูตรและพิจารณาเครื่องหมายให้ถูกต้อง
  solution:
    steps:
    - id: s1
      text: แนวคิดคือความเร็วคูณเวลา
    summary: แนวคิดคือความเร็วคูณเวลา
