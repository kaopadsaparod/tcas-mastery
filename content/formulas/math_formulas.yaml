# บัตรสูตรคณิตศาสตร์ที่ต้องรู้สำหรับ TCAS (High-Yield Active Formula Recall Cards)

- id: form-mat-quad-01
  subject: math
  topic: math.algebra
  title: "สูตรแก้สมการกำลังสอง (Quadratic Formula)"
  latex: "x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}"
  conditions:
    - "สมการต้องอยู่ในรูปมาตรฐาน ax^2 + bx + c = 0"
    - "สัมประสิทธิ์ a \\ne 0"
    - "ค่าดิสคริมิแนนต์ D = b^2 - 4ac กำหนดลักษณะคำตอบ (D > 0 มี 2 คำตอบจริง, D = 0 มี 1 คำตอบจริง, D < 0 ไม่มีคำตอบจริง)"
  variables:
    a: "สัมประสิทธิ์หน้า x² (a ≠ 0)"
    b: "สัมประสิทธิ์หน้า x"
    c: "ค่าคงที่"
    D: "ดิสคริมิแนนต์ b² - 4ac"
  selection_cues:
    - "เมื่อไม่สามารถแยกตัวประกอบพหุนาม (Factorization) ได้อย่างรวดเร็วด้วยตาเปล่า"
    - "เมื่อโจทย์ถามหาจำนวนคำตอบจริง หรือค่ารากที่ติดค่ากรณฑ์ (สแควรูท)"
  recall_questions:
    - prompt: "สมการกำลังสอง ax² + bx + c = 0 จะมีคำตอบเป็นจำนวนจริงคำตอบเดียวซ้ำกันเมื่อใด?"
      options:
        a: "b² - 4ac > 0"
        b: "b² - 4ac = 0"
        c: "b² - 4ac < 0"
      answer: "b"
      explanation: "เมื่อ b² - 4ac = 0 พจน์ในสแควรูทเป็นศูนย์ ทำให้ได้คำตอบเพียงค่าเดียวคือ x = -b/(2a)"
    - prompt: "ผลบวกของคำตอบทั้งหมดของสมการ ax² + bx + c = 0 มีค่าเท่ากับข้อใด?"
      options:
        a: "-b / a"
        b: "c / a"
        c: "b / 2a"
      answer: "a"
      explanation: "จากความสัมพันธ์รากและสัมประสิทธิ์ (Vieta's Formulas) ผลบวกรากคือ -b/a และผลคูณรากคือ c/a"

- id: form-mat-seq-01
  subject: math
  topic: math.sequences_series
  title: "พจน์ทั่วไปของลำดับเลขคณิต (Arithmetic Sequence)"
  latex: "a_n = a_1 + (n - 1)d"
  conditions:
    - "ผลต่างร่วม (Common Difference) d = a_{n} - a_{n-1} ต้องคงที่ทุกคู่พจน์ติดกัน"
    - "n เป็นจำนวนเต็มบวก (n ∈ {1, 2, 3, ...})"
  variables:
    a_n: "พจน์ที่ n ของลำดับ"
    a_1: "พจน์แรกสุดของลำดับ"
    n: "ลำดับที่ของพจน์ (จำนวนเต็มบวก)"
    d: "ผลต่างร่วม (a_{k+1} - a_k)"
  selection_cues:
    - "เมื่อโจทย์ระบุว่าระยะห่างระหว่างพจน์ที่ติดกันเพิ่มขึ้นหรือลดลงด้วยอัตราคงที่"
    - "เมื่อต้องการหาพจน์ใดพจน์หนึ่ง หรือนับจำนวนพจน์ทั้งหมดในลำดับ"
  recall_questions:
    - prompt: "ถ้าลำดับมีค่า 3, 7, 11, 15, ... ผลต่างร่วม d มีค่าเท่าใด?"
      options:
        a: "3"
        b: "4"
        c: "7"
      answer: "b"
      explanation: "d = a_2 - a_1 = 7 - 3 = 4"
    - prompt: "พจน์ทั่วไป a_n สามารถเขียนในรูปฟังก์ชันเชิงเส้น f(n) ได้อย่างไร?"
      options:
        a: "f(n) = d·n + (a_1 - d)"
        b: "f(n) = a_1·n + d"
        c: "f(n) = (a_1 + d)·n"
      answer: "a"
      explanation: "กระจายสูตรได้ a_n = a_1 + nd - d = d·n + (a_1 - d) ซึ่งมีความชันเท่ากับ d"

- id: form-mat-ser-01
  subject: math
  topic: math.sequences_series
  title: "ผลบวกอนุกรมเลขคณิต (Arithmetic Series)"
  latex: "S_n = \\frac{n}{2}(a_1 + a_n) = \\frac{n}{2}[2a_1 + (n - 1)d]"
  conditions:
    - "ต้องเป็นอนุกรมที่มาจากลำดับเลขคณิตเท่านั้น (d คงที่)"
    - "n คือจำนวนพจน์ที่นำมาบวกกัน"
  variables:
    S_n: "ผลบวก n พจน์แรกของอนุกรม"
    n: "จำนวนพจน์"
    a_1: "พจน์แรก"
    a_n: "พจน์สุดท้ายที่นำมาบวก"
    d: "ผลต่างร่วม"
  selection_cues:
    - "เมื่อต้องการหาผลรวมของลำดับเลขคณิตตั้งแต่พจน์แรกถึงพจน์ที่ n"
    - "เมื่อทราบพจน์แรกและพจน์สุดท้าย (ใช้สูตร n/2(a_1 + a_n))"
  recall_questions:
    - prompt: "สูตร S_n = (n/2)(a_1 + a_n) เหมาะที่จะหยิบมาใช้ที่สุดในสถานการณ์ใด?"
      options:
        a: "เมื่อทราบพจน์แรก พจน์สุดท้าย และจำนวนพจน์"
        b: "เมื่อไม่ทราบจำนวนพจน์ n"
        c: "เมื่อเป็นอนุกรมเรขาคณิต"
      answer: "a"
      explanation: "เมื่อทราบ a_1, a_n และ n สามารถแทนค่าลงใน (n/2)(a_1 + a_n) ได้ทันทีโดยไม่ต้องคำนวณหา d"

- id: form-mat-seq-02
  subject: math
  topic: math.sequences_series
  title: "พจน์ทั่วไปของลำดับเรขาคณิต (Geometric Sequence)"
  latex: "a_n = a_1 r^{n-1}"
  conditions:
    - "อัตราส่วนร่วม (Common Ratio) r = a_{k+1} / a_k ต้องคงที่"
    - "พจน์แรก a_1 ≠ 0 และ r ≠ 0"
  variables:
    a_n: "พจน์ที่ n ของลำดับเรขาคณิต"
    a_1: "พจน์แรก"
    r: "อัตราส่วนร่วม (Common Ratio)"
    n: "ลำดับที่ของพจน์"
  selection_cues:
    - "เมื่อพจน์ถัดไปเกิดจากการ 'คูณ' ด้วยค่าคงที่ซ้ำๆ (เช่น การเติบโตของประชากร, การทบต้นของดอกเบี้ย)"
  recall_questions:
    - prompt: "ถ้าลำดับเรขาคณิตมี a_1 = 2 และ r = 3 พจน์ที่ 4 มีค่าเท่าใด?"
      options:
        a: "18"
        b: "54"
        c: "162"
      answer: "b"
      explanation: "a_4 = 2 × 3^(4-1) = 2 × 3^3 = 2 × 27 = 54"

- id: form-mat-ser-02
  subject: math
  topic: math.sequences_series
  title: "ผลบวกอนุกรมเรขาคณิตอนันต์ (Infinite Geometric Series)"
  latex: "S_\\infty = \\frac{a_1}{1 - r}"
  conditions:
    - "อนุกรมต้องลู่เข้า (Convergent): ค่าสัมบูรณ์ของอัตราส่วนร่วม |r| < 1 (-1 < r < 1)"
    - "หาก |r| ≥ 1 อนุกรมจะลู่ออก (Divergent) หาผลบวกอนันต์ไม่ได้"
  variables:
    S_\\infty: "ผลบวกอนันต์"
    a_1: "พจน์แรก"
    r: "อัตราส่วนร่วม (|r| < 1)"
  selection_cues:
    - "เมื่อโจทย์ถามผลบวกอนันต์ของลูกบอลเด้งกลับ, ผลบวกทศนิยมซ้ำ, หรือรูปเรขาคณิตซ้อนอนันต์"
  recall_questions:
    - prompt: "อนุกรมเรขาคณิต 1 + 2 + 4 + 8 + ... สามารถหาผลบวกอนันต์ด้วยสูตร S_∞ ได้หรือไม่?"
      options:
        a: "ได้ เพราะเป็นอนุกรมเรขาคณิต"
        b: "ไม่ได้ เพราะ r = 2 ซึ่ง |r| ≥ 1 ทำให้อนุกรมลู่ออก"
        c: "ได้ และมีผลบวกเท่ากับ -1"
      answer: "b"
      explanation: "สูตร S_∞ = a_1 / (1 - r) ใช้ได้เฉพาะเมื่อ |r| < 1 เท่านั้น สำหรับ r = 2 อนุกรมจะลู่ออกสู่ค่าอนันต์"

- id: form-mat-log-01
  subject: math
  topic: math.functions_algebra
  title: "สมบัติลอการิทึม: ผลคูณและผลหาร"
  latex: "\\log_a(M \\cdot N) = \\log_a M + \\log_a N, \\quad \\log_a\\left(\\frac{M}{N}\\right) = \\log_a M - \\log_a N"
  conditions:
    - "ฐาน a > 0 และ a ≠ 1"
    - "อาร์กิวเมนต์ภายในล็อก M > 0 และ N > 0 เสมอ"
  variables:
    a: "ฐานของลอการิทึม (a > 0, a ≠ 1)"
    M: "ค่าจำนวนจริงบวกตัวแรก"
    N: "ค่าจำนวนจริงบวกตัวที่สอง"
  selection_cues:
    - "เมื่อต้องการยุบพจน์ล็อกหลายพจน์ที่มีฐานเดียวกันให้เหลือพจน์เดียวเพื่อแก้สมการ"
    - "เมื่อต้องการแยกผลคูณ/ผลหารเพื่อหาค่าตัวแปร"
  recall_questions:
    - prompt: "ค่าของ log₂ 6 - log₂ 3 มีค่าเท่าใด?"
      options:
        a: "log₂ 3"
        b: "1"
        c: "2"
      answer: "b"
      explanation: "log₂ 6 - log₂ 3 = log₂ (6/3) = log₂ 2 = 1"
    - prompt: "เงื่อนไขที่สำคัญที่สุดของตัวแปร x ใน log_a(x) คือข้อใด?"
      options:
        a: "x ต้องเป็นจำนวนจริงบวก (x > 0)"
        b: "x ต้องเป็นจำนวนเต็ม"
        c: "x สามารถติดลบได้ถ้า a ติดลบ"
      answer: "a"
      explanation: "อาร์กิวเมนต์ของฟังก์ชันลอการิทึมต้องเป็นจำนวนจริงบวกมากกว่าศูนย์เสมอ (x > 0)"

- id: form-mat-trig-01
  subject: math
  topic: math.trigonometry
  title: "เอกลักษณ์พีทาโกรัสตรีโกณมิติ (Pythagorean Identity)"
  latex: "\\sin^2\\theta + \\cos^2\\theta = 1"
  conditions:
    - "ใช้ได้กับทุกจำนวนจริง θ"
    - "เอกลักษณ์ต่อยอด: 1 + tan²θ = sec²θ และ 1 + cot²θ = cosec²θ"
  variables:
    \\theta: "มุมหรือจำนวนจริงใดๆ"
    \\sin\\theta: "ค่าฟังก์ชันไซน์"
    \\cos\\theta: "ค่าฟังก์ชันโคไซน์"
  selection_cues:
    - "เมื่อต้องการแปลงระหว่าง sin²θ และ cos²θ ในสมการตรีโกณมิติ"
    - "เมื่อทราบค่า sin θ และต้องการหา cos θ (หรือกลับกัน)"
  recall_questions:
    - prompt: "หากหารทั้งสองข้างของสมการ sin²θ + cos²θ = 1 ด้วย cos²θ จะได้เอกลักษณ์ใด?"
      options:
        a: "tan²θ + 1 = sec²θ"
        b: "1 + cot²θ = cosec²θ"
        c: "tan²θ + cot²θ = 1"
      answer: "a"
      explanation: "(sin²θ / cos²θ) + (cos²θ / cos²θ) = 1 / cos²θ ได้ผลลัพธ์เป็น tan²θ + 1 = sec²θ"

- id: form-mat-trig-02
  subject: math
  topic: math.trigonometry
  title: "สูตรมุมสองเท่า (Double-Angle Formulas)"
  latex: "\\sin(2\\theta) = 2\\sin\\theta\\cos\\theta, \\quad \\cos(2\\theta) = \\cos^2\\theta - \\sin^2\\theta"
  conditions:
    - "ใช้ได้กับทุกมุม θ"
    - "cos(2θ) แปลงรูปได้อีก 2 แบบ: 2cos²θ - 1 หรือ 1 - 2sin²θ"
  variables:
    \\theta: "ขนาดมุม (เรเดียน หรือ องศา)"
    \\sin(2\\theta): "ค่าไซน์ของมุมสองเท่า"
    \\cos(2\\theta): "ค่าโคไซน์ของมุมสองเท่า"
  selection_cues:
    - "เมื่อโจทย์มีเทอม sin θ cos θ คูณกันอยู่ (สามารถยุบเป็น (1/2)sin 2θ ได้)"
    - "เมื่อโจทย์ถามหามุมสองเท่า หรือต้องการลดทอนกำลังสองของฟังก์ชันตรีโกณ"
  recall_questions:
    - prompt: "ถ้า sin θ cos θ = 0.4 ค่าของ sin(2θ) มีค่าเท่ากับเท่าใด?"
      options:
        a: "0.2"
        b: "0.8"
        c: "0.4"
      answer: "b"
      explanation: "จาก sin(2θ) = 2 sin θ cos θ ดังนั้น sin(2θ) = 2 × 0.4 = 0.8"

- id: form-mat-geom-01
  subject: math
  topic: math.analytic_geometry
  title: "ระยะห่างระหว่างจุดกับเส้นตรง (Point-to-Line Distance)"
  latex: "d = \\frac{|Ax_1 + By_1 + C|}{\\sqrt{A^2 + B^2}}"
  conditions:
    - "สมการเส้นตรงต้องจัดรูปทั่วไป Ax + By + C = 0"
    - "จุด (x_1, y_1) อยู่บนระนาบ 2 มิติ"
    - "A และ B ต้องไม่เป็นศูนย์พร้อมกัน (A² + B² ≠ 0)"
  variables:
    (x_1, y_1): "พิกัดของจุดที่ต้องการวัดระยะ"
    A, B, C: "สัมประสิทธิ์ในสมการเส้นตรง Ax + By + C = 0"
    d: "ระยะตั้งฉากที่สั้นที่สุด (มีค่า ≥ 0 เสมอ)"
  selection_cues:
    - "เมื่อโจทย์ถามหาระยะห่างที่สั้นที่สุดจากจุดไปยังเส้นตรง"
    - "เมื่อหาความยาวรัศมีวงกลมที่สัมผัสกับเส้นตรงที่กำหนด"
  recall_questions:
    - prompt: "ระยะทาง d ที่คำนวณได้มีทิศทางอย่างไรเมื่อเทียบกับเส้นตรง?"
      options:
        a: "ทำมุมตั้งฉาก (90°) กับเส้นตรง"
        b: "ทำมุม 45° กับเส้นตรง"
        c: "ขนานกับเส้นตรง"
      answer: "a"
      explanation: "ระยะทางระหว่างจุดกับเส้นตรงหมายถึงความยาวของเส้นที่ลากจากจุดมาตั้งฉากกับเส้นตรงนั้นเสมอ"

- id: form-mat-stat-01
  subject: math
  topic: math.statistics
  title: "ค่าเฉลี่ยเลขคณิตและค่ามาตรฐาน Z (Mean & Z-Score)"
  latex: "\\bar{x} = \\frac{\\sum x_i}{N}, \\quad z = \\frac{x - \\mu}{\\sigma}"
  conditions:
    - "Z-Score แสดงว่าข้อมูลอยู่ห่างจากค่าเฉลี่ยกี่เท่าของส่วนเบี่ยงเบนมาตรฐาน"
    - "ข้อมูลที่มีการแจกแจงปกติมาตรฐาน (Standard Normal) มี μ = 0, σ = 1"
  variables:
    \\bar{x}, \\mu: "ค่าเฉลี่ยเลขคณิต (กลุ่มตัวอย่าง / ประชากร)"
    \\sigma: "ส่วนเบี่ยงเบนมาตรฐาน (Standard Deviation)"
    z: "คะแนนมาตรฐาน (Z-Score)"
    x: "ค่าข้อมูลที่ต้องการเปรียบเทียบ"
  selection_cues:
    - "เมื่อต้องการเปรียบเทียบคะแนนสอบจากสองวิชาที่มีค่าเฉลี่ยและความแปรปรวนต่างกัน"
    - "เมื่อเปิดตารางพื้นที่ใต้โค้งปกติมาตรฐาน"
  recall_questions:
    - prompt: "ถ้าคะแนนสอบมีค่าเฉลี่ย μ = 50 และ σ = 10 นักเรียนที่สอบได้ 70 คะแนนจะมีค่า z เท่าใด?"
      options:
        a: "1.0"
        b: "2.0"
        c: "0.5"
      answer: "b"
      explanation: "z = (70 - 50) / 10 = 20 / 10 = 2.0"

- id: form-mat-calc-01
  subject: math
  topic: math.calculus
  title: "สูตรอนุพันธ์ของเลขยกกำลังและกฎลูกโซ่ (Power Rule & Chain Rule)"
  latex: "\\frac{d}{dx}[x^n] = n x^{n-1}, \\quad \\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)"
  conditions:
    - "n เป็นจำนวนจริงใดๆ"
    - "กฎลูกโซ่ใช้เมื่อฟังก์ชันมีการประกอบกัน (Composite Functions)"
  variables:
    n: "เลขชี้กำลังของ x"
    f, g: "ฟังก์ชันที่หาอนุพันธ์ได้"
    f', g': "อนุพันธ์ของฟังก์ชัน f และ g"
  selection_cues:
    - "เมื่อต้องการหาความชันของเส้นสัมผัสเส้นโค้ง (Slope of Tangent Line)"
    - "เมื่อต้องการหาอัตราการเปลี่ยนแปลง, จุดสูงสุด/ต่ำสุดสัมพัทธ์ (Extreme Values)"
  recall_questions:
    - prompt: "อนุพันธ์ของ f(x) = (3x + 1)⁴ มีค่าเท่ากับข้อใด?"
      options:
        a: "4(3x + 1)³"
        b: "12(3x + 1)³"
        c: "12(3x + 1)⁴"
      answer: "b"
