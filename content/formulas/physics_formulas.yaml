# บัตรสูตรฟิสิกส์และการทดสอบเงื่อนไข (Active Formula Recall Cards)

- id: form-kin-01
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้การกระจัด s"
  latex: "v = u + at"
  conditions:
    - "ความเร่ง a ต้องคงตัวทั้งขนาดและทิศทาง"
    - "เป็นการเคลื่อนที่ในแนวเส้นตรง (1 มิติ) หรือแยกคิดทีละแกน"
  variables:
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
    a: "ความเร่ง (m/s²)"
    t: "ช่วงเวลา (s)"
  selection_cues:
    - "เมื่อโจทย์ไม่กล่าวถึงการกระจัด s และไม่ได้ถามหา s"
  recall_questions:
    - prompt: "สมการ v = u + at นำมาใช้ได้ภายใต้เงื่อนไขใดเป็นสำคัญ?"
      options:
        a: "ความเร็ว v ต้องคงที่เสมอ"
        b: "ความเร่ง a ต้องมีค่าคงตัว"
        c: "วัตถุต้องตกอย่างอิสระเท่านั้น"
      answer: "b"
      explanation: "สูตรนี้เป็น 1 ใน 5 สูตรการเคลื่อนที่ภายใต้ความเร่งคงตัว หากความเร่งไม่คงตัวต้องใช้แคลคูลัสอินทิเกรต"
    - prompt: "เมื่อโจทย์ไม่บอกและไม่ถามตัวแปรใด ควรหยิบใช้สมการ v = u + at?"
      options:
        a: "การกระจัด s"
        b: "เวลา t"
        c: "ความเร็วต้น u"
      answer: "a"
      explanation: "สมการนี้ไม่มีตัวแปร s เหมาะที่สุดเมื่อไม่ทราบและไม่สนใจ s"

- id: form-kin-02
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้เวลา t"
  latex: "v^2 = u^2 + 2as"
  conditions:
    - "ความเร่ง a ต้องคงตัว"
    - "ทิศทางของ u, a, s ต้องกำหนดเครื่องหมายเวกเตอร์บวก-ลบให้สอดคล้องกัน"
  variables:
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
    a: "ความเร่ง (m/s²)"
    s: "การกระจัด (m)"
  selection_cues:
    - "เมื่อโจทย์ไม่ให้เวลา t และไม่ถามหาเวลา t"
  recall_questions:
    - prompt: "หากโจทย์บอกระยะทาง ความเร็วต้น ความเร็วปลาย แต่ไม่มีข้อมูลเวลา t เลย ควรใช้สูตรใด?"
      options:
        a: "s = ut + (1/2)at^2"
        b: "v^2 = u^2 + 2as"
        c: "v = u + at"
      answer: "b"
      explanation: "v^2 = u^2 + 2as เป็นสูตรเดียวในกลุ่มที่ไม่เกี่ยวข้องกับเวลา t"
    - prompt: "ในสูตร v^2 = u^2 + 2as หากรถกำลังเบรกจนหยุดนิ่ง ความเร่ง a ต้องมีเครื่องหมายอย่างไรเมื่อให้ทิศการวิ่งเป็นบวก?"
      options:
        a: "เป็นบวก (+)"
        b: "เป็นลบ (-)"
        c: "เป็นศูนย์"
      answer: "b"
      explanation: "การเบรกหมายถึงความเร่งมีทิศต้านการเคลื่อนที่ จึงต้องติดลบ"

- id: form-kin-03
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้ความเร็วปลาย v"
  latex: "s = ut + \\frac{1}{2}at^2"
  conditions:
    - "ความเร่ง a ต้องคงตัว"
  variables:
    s: "การกระจัด (m)"
    u: "ความเร็วต้น (m/s)"
    t: "เวลา (s)"
    a: "ความเร่ง (m/s²)"
  selection_cues:
    - "เมื่อโจทย์ไม่บอกความเร็วปลาย v และไม่ถามหา v"
  recall_questions:
    - prompt: "ปล่อยวัตถุจากหยุดนิ่ง (u = 0) ตกอิสระใต้แรงโน้มถ่วง g สูตรการกระจัด s คือข้อใด?"
      options:
        a: "s = (1/2)gt^2"
        b: "s = gt"
        c: "s = 2gt^2"
      answer: "a"
      explanation: "เมื่อ u = 0 พจน์ ut จะหายไป เหลือเพียง s = (1/2)gt^2"

- id: form-frc-01
  subject: physics
  topic: physics.forces_energy
  title: "กฎข้อที่สองของนิวตัน"
  latex: "\\Sigma F = ma"
  conditions:
    - "ใช้ในกรอบอ้างอิงเฉื่อย (Inertial Frame)"
    - "แรงลัพธ์ \\Sigma F และความเร่ง a มีทิศทางเดียวกันเสมอ"
  variables:
    \\Sigma F: "แรงลัพธ์ (N หรือ kg·m/s²)"
    m: "มวลของวัตถุ (kg)"
    a: "ความเร่ง (m/s²)"
  selection_cues:
    - "เมื่อต้องการหาความเร่งจากแรงที่มากระทำ หรือหามวล/แรงลัพธ์"
  recall_questions:
    - prompt: "หน่วยเอสไอ (SI Unit) ของแรงนิวตัน (N) เทียบเท่ากับหน่วยฐานข้อใด?"
      options:
        a: "kg·m/s²"
        b: "kg·m²/s²"
        c: "kg/m·s"
      answer: "a"
      explanation: "จาก F = ma หน่วยคือ kg คูณกับ m/s² จึงเป็น kg·m/s²"

- id: form-eng-01
  subject: physics
  topic: physics.forces_energy
  title: "ทฤษฎีบทงาน-พลังงานจลน์"
  latex: "W_{net} = \\Delta E_k = \\frac{1}{2}mv^2 - \\frac{1}{2}mu^2"
  conditions:
    - "W_{net} คืองานของแรงลัพธ์ทั้งหมดที่กระทำต่อวัตถุ"
  variables:
    W: "งานของแรงลัพธ์ (J)"
    E_k: "พลังงานจลน์ (J)"
    m: "มวล (kg)"
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
  selection_cues:
    - "โจทย์เกี่ยวกับแรง ระยะทาง และการเปลี่ยนแปลงอัตราเร็ว"
  recall_questions:
    - prompt: "ถ้าแรงตั้งฉากกับการเคลื่อนที่เสมอ งานของแรงนั้นจะมีค่าเท่าใด?"
      options:
        a: "มีค่าเป็นศูนย์ (W = 0)"
        b: "มีค่าสูงสุด"
        c: "มีค่าติดลบ"
      answer: "a"
      explanation: "จาก W = F·s·cos(θ) เมื่อตั้งฉาก θ = 90° ทำให้ cos 90° = 0 งานจึงเป็นศูนย์"

- id: form-kin-04
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้ความเร่ง a"
  latex: "s = \\frac{u + v}{2} t"
  conditions:
    - "ความเร่ง a ต้องคงตัว"
    - "อัตราเร็วเฉลี่ยเท่ากับกึ่งหนึ่งของผลบวกความเร็วต้นและปลาย"
  variables:
    s: "การกระจัด (m)"
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
    t: "ช่วงเวลา (s)"
  selection_cues:
    - "เมื่อโจทย์ไม่บอกความเร่ง a และไม่ถามหา a"
  recall_questions:
    - prompt: "สมการ s = ((u + v)/2)t สามารถนำมาใช้ได้เมื่อใด?"
      options:
        a: "เมื่อวัตถุเคลื่อนที่ด้วยความเร่งคงตัว"
        b: "เมื่อวัตถุเคลื่อนที่ด้วยความเร็วคงที่เท่านั้น"
        c: "ใช้ได้กับทุกการเคลื่อนที่ไม่ว่าจะมีความเร่งเท่าใดก็ตาม"
      answer: "a"
      explanation: "สูตรนี้ยังคงอยู่ในกลุ่ม 5 สมการการเคลื่อนที่ภายใต้ความเร่งคงตัว"

- id: form-frc-02
  subject: physics
  topic: physics.forces_energy
  title: "แรงเสียดทานสถิตสูงสุดและแรงเสียดทานจลน์"
  latex: "f_{s,\\max} = \\mu_s N, \\quad f_k = \\mu_k N"
  conditions:
    - "N คือแรงปฏิกิริยาตั้งฉากระหว่างผิวสัมผัส (ไม่ใช่ mg เสมอไป ต้องเขียน Free Body Diagram)"
    - "แรงเสียดทานสถิต f_s มีค่าได้ตั้งแต่ 0 ถึง μ_s N (f_s ≤ μ_s N)"
  variables:
    f_s: "แรงเสียดทานสถิต (N)"
    f_k: "แรงเสียดทานจลน์ (N)"
    \\mu_s: "สัมประสิทธิ์ความเสียดทานสถิต"
    \\mu_k: "สัมประสิทธิ์ความเสียดทานจลน์"
    N: "แรงปฏิกิริยาในแนวตั้งฉากกับผิวสัมผัส (N)"
  selection_cues:
    - "เมื่อวัตถุ 'เริ่มจะเคลื่อนที่' (ใช้ f_s,max = μ_s N)"
    - "เมื่อวัตถุกำลังเคลื่อนที่ไถลบนพื้น (ใช้ f_k = μ_k N)"
  recall_questions:
    - prompt: "ขณะที่วัตถุอยู่นิ่งบนพื้นราบและมีแรงดึง 5 N แต่ยังไม่เคลื่อนที่ หาก f_s,max = 10 N แรงเสียดทานสถิตขณะนั้นมีค่าเท่าใด?"
      options:
        a: "10 N"
        b: "5 N"
        c: "0 N"
      answer: "b"
      explanation: "เมื่อวัตถุยังอยู่นิ่ง แรงเสียดทานสถิตจะปรับค่าเท่ากับแรงดึงพอดีเพื่อรักษาสมดุล (f_s = F = 5 N)"

- id: form-eng-02
  subject: physics
  topic: physics.forces_energy
  title: "กฎการอนุรักษ์พลังงานกล (Work-Energy Principle)"
  latex: "E_1 + W_{\\text{other}} = E_2"
  conditions:
    - "E_1, E_2 คือผลรวมของพลังงานจลน์และพลังงานศักย์ (E = E_k + E_p)"
    - "W_{other} คืองานของแรงภายนอก แรงดึง หรือแรงต้านทาน/แรงเสียดทาน (ถ้ามีแรงเสียดทาน f จะมีงานเป็น -f·s)"
  variables:
    E_1: "พลังงานกลรวมที่ตำแหน่งเริ่มต้น (J)"
    E_2: "พลังงานกลรวมที่ตำแหน่งปลายทาง (J)"
    W_{\\text{other}}: "งานของแรงภายนอกหรือแรงเสียดทาน (J)"
  selection_cues:
    - "เมื่อมีการเปลี่ยนรูปพลังงานระหว่างความเร็ว ความสูง หรือสปริง"
    - "เมื่อมีงานจากแรงภายนอกหรือมีแรงเสียดทานสูญเสียเป็นความร้อน"
  recall_questions:
    - prompt: "ถ้าไม่มีแรงภายนอกหรือแรงเสียดทานกระทำต่องานในระบบ (W_other = 0) จะได้ข้อสรุปใด?"
      options:
        a: "พลังงานกลคงที่เสมอ (E_1 = E_2)"
        b: "ความเร็วต้องเป็นศูนย์"
        c: "วัตถุไม่มีพลังงานศักย์"
      answer: "a"
      explanation: "นี่คือกฎการอนุรักษ์พลังงานกล: พลังงานกลรวมของระบบจะมีค่าคงตัว"

- id: form-mom-01
  subject: physics
  topic: physics.momentum
  title: "กฎการอนุรักษ์โมเมนตัม (Conservation of Linear Momentum)"
  latex: "\\sum \\vec{p}_i = \\sum \\vec{p}_f \\implies m_1 \\vec{u}_1 + m_2 \\vec{u}_2 = m_1 \\vec{v}_1 + m_2 \\vec{v}_2"
  conditions:
    - "ใช้ได้เมื่อไม่มีแรงลัพธ์ภายนอกมากระทำต่อระบบ (\\Sigma F_{ext} = 0)"
    - "โมเมนตัมเป็นปริมาณเวกเตอร์ ต้องคำนึงถึงทิศทาง (กำหนดเครื่องหมายบวก-ลบ)"
  variables:
    \\vec{p}: "โมเมนตัมเชิงเส้น (kg·m/s)"
    m: "มวลของวัตถุ (kg)"
    \\vec{u}: "ความเร็วก่อนชน (m/s)"
    \\vec{v}: "ความเร็วหลังชน (m/s)"
  selection_cues:
    - "โจทย์การชนกันของวัตถุ (ทั้งแบบยืดหยุ่นและไม่ยืดหยุ่น) หรือการระเบิดแยกตัวออกจากกัน"
  recall_questions:
    - prompt: "ในการชนแบบไม่ยืดหยุ่นสมบูรณ์ (ชนแล้วติดกันไป) ปริมาณใดที่ยังคงอนุรักษ์ (มีค่าคงที่)?"
      options:
        a: "โมเมนตัมเชิงเส้นเท่านั้น"
        b: "พลังงานจลน์เท่านั้น"
        c: "ทั้งโมเมนตัมและพลังงานจลน์"
      answer: "a"
      explanation: "ในการชนทุกแบบที่ไม่มีแรงภายนอก โมเมนตัมจะคงตัวเสมอ แต่การชนแบบไม่ยืดหยุ่นจะมีการสูญเสียพลังงานจลน์"

- id: form-shm-01
  subject: physics
  topic: physics.harmonic_motion
  title: "คาบการแกว่งแบบฮาร์มอนิกอย่างง่าย (Simple Harmonic Motion)"
  latex: "T_{\\text{spring}} = 2\\pi \\sqrt{\\frac{m}{k}}, \\quad T_{\\text{pendulum}} = 2\\pi \\sqrt{\\frac{L}{g}}"
  conditions:
    - "มวลติดสปริง: สปริงเป็นไปตามกฎของฮุก (Hooke's Law) ไร้แรงเสียดทาน"
    - "ลูกตุ้มอย่างง่าย: มุมการแกว่งต้องมีขนาดเล็กมาก (θ < 10° เพื่อให้ sin θ ≈ θ)"
  variables:
    T: "คาบของการเคลื่อนที่ (s)"
    m: "มวลของวัตถุ (kg)"
    k: "ค่านิจสปริง (N/m)"
    L: "ความยาวเชือกของลูกตุ้ม (m)"
    g: "ความเร่งโน้มถ่วง (m/s²)"
  selection_cues:
    - "เมื่อโจทย์กล่าวถึงการแกว่งครบรอบของลูกตุ้มนาฬิกา หรือการสั่นขึ้นลงของมวลติดสปริง"
  recall_questions:
    - prompt: "คาบการแกว่งของลูกตุ้มอย่างง่าย (Simple Pendulum) ขึ้นอยู่กับมวลของลูกตุ้มหรือไม่?"
      options:
        a: "ไม่ขึ้นกับมวล (คาบเท่าเดิมไม่ว่าจะเปลี่ยนเป็นมวลหนักหรือเบา)"
        b: "ขึ้นอยู่กับมวล (มวลมากคาบจะยาวนานขึ้น)"
        c: "ขึ้นอยู่กับมวลเฉพาะเมื่อ g เปลี่ยน"
      answer: "a"
      explanation: "จากสูตร T = 2π√(L/g) ไม่มีตัวแปรมวล m เลย คาบจึงขึ้นอยู่กับความยาวเชือก L และค่า g เท่านั้น"

- id: form-elec-01
  subject: physics
  topic: physics.electricity
  title: "กฎของโอห์มและกำลังไฟฟ้า (Ohm's Law & Electric Power)"
  latex: "V = IR, \\quad P = IV = I^2 R = \\frac{V^2}{R}"
  conditions:
    - "ใช้ได้กับตัวนำโอห์มมิก (Ohmic Conductor) ที่อุณหภูมิคงที่"
    - "หน่วยต้องเป็น SI: V (โวลต์), I (แอมแปร์), R (โอห์ม), P (วัตต์)"
  variables:
    V: "ความต่างศักย์ไฟฟ้า (V)"
    I: "กระแสไฟฟ้า (A)"
    R: "ความต้านทานไฟฟ้า (Ω)"
    P: "กำลังไฟฟ้า (W หรือ J/s)"
  selection_cues:
    - "การวิเคราะห์วงจรไฟฟ้ากระแสตรง การหาค่ากระแส ความต่างศักย์ หรือพลังงานความร้อนที่เกิดขึ้นในตัวต้านทาน"
  recall_questions:
    - prompt: "ถ้าความต่างศักย์ไฟฟ้าตกคร่อมตัวต้านทานเพิ่มขึ้นเป็น 2 เท่า (โดยที่ R คงที่) กำลังไฟฟ้า P จะเปลี่ยนไปอย่างไร?"
      options:
        a: "เพิ่มขึ้นเป็น 2 เท่า"
        b: "เพิ่มขึ้นเป็น 4 เท่า"
        c: "ลดลงเหลือครึ่งหนึ่ง"
      answer: "b"
      explanation: "จาก P = V² / R เมื่อ V เพิ่ม 2 เท่า P จะเพิ่มขึ้นเป็น 2² = 4 เท่า"

