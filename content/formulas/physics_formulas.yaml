# บัตรสูตรฟิสิกส์และการทดสอบเงื่อนไข (Active Formula Recall Cards)

- id: form-kin-01
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้การกระจัด s"
  latex: "v = u + at"
  conditions:
    - "ความเร่ง a ต้องคงตัวทั้งขนาดและทิศทาง"
    - "เป็นการเคลื่อนที่ในแนวเส้นตรง (1 มิติ) หรือแยกคิดทีละแกน"
  variables:
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
    a: "ความเร่ง (m/s²)"
    t: "ช่วงเวลา (s)"
  selection_cues:
    - "เมื่อโจทย์ไม่กล่าวถึงการกระจัด s และไม่ได้ถามหา s"
  recall_questions:
    - prompt: "สมการ v = u + at นำมาใช้ได้ภายใต้เงื่อนไขใดเป็นสำคัญ?"
      options:
        a: "ความเร็ว v ต้องคงที่เสมอ"
        b: "ความเร่ง a ต้องมีค่าคงตัว"
        c: "วัตถุต้องตกอย่างอิสระเท่านั้น"
      answer: "b"
      explanation: "สูตรนี้เป็น 1 ใน 5 สูตรการเคลื่อนที่ภายใต้ความเร่งคงตัว หากความเร่งไม่คงตัวต้องใช้แคลคูลัสอินทิเกรต"
    - prompt: "เมื่อโจทย์ไม่บอกและไม่ถามตัวแปรใด ควรหยิบใช้สมการ v = u + at?"
      options:
        a: "การกระจัด s"
        b: "เวลา t"
        c: "ความเร็วต้น u"
      answer: "a"
      explanation: "สมการนี้ไม่มีตัวแปร s เหมาะที่สุดเมื่อไม่ทราบและไม่สนใจ s"

- id: form-kin-02
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้เวลา t"
  latex: "v^2 = u^2 + 2as"
  conditions:
    - "ความเร่ง a ต้องคงตัว"
    - "ทิศทางของ u, a, s ต้องกำหนดเครื่องหมายเวกเตอร์บวก-ลบให้สอดคล้องกัน"
  variables:
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
    a: "ความเร่ง (m/s²)"
    s: "การกระจัด (m)"
  selection_cues:
    - "เมื่อโจทย์ไม่ให้เวลา t และไม่ถามหาเวลา t"
  recall_questions:
    - prompt: "หากโจทย์บอกระยะทาง ความเร็วต้น ความเร็วปลาย แต่ไม่มีข้อมูลเวลา t เลย ควรใช้สูตรใด?"
      options:
        a: "s = ut + (1/2)at^2"
        b: "v^2 = u^2 + 2as"
        c: "v = u + at"
      answer: "b"
      explanation: "v^2 = u^2 + 2as เป็นสูตรเดียวในกลุ่มที่ไม่เกี่ยวข้องกับเวลา t"
    - prompt: "ในสูตร v^2 = u^2 + 2as หากรถกำลังเบรกจนหยุดนิ่ง ความเร่ง a ต้องมีเครื่องหมายอย่างไรเมื่อให้ทิศการวิ่งเป็นบวก?"
      options:
        a: "เป็นบวก (+)"
        b: "เป็นลบ (-)"
        c: "เป็นศูนย์"
      answer: "b"
      explanation: "การเบรกหมายถึงความเร่งมีทิศต้านการเคลื่อนที่ จึงต้องติดลบ"

- id: form-kin-03
  subject: physics
  topic: physics.kinematics.1d
  title: "สมการความเร่งคงตัว: ไร้ความเร็วปลาย v"
  latex: "s = ut + \\frac{1}{2}at^2"
  conditions:
    - "ความเร่ง a ต้องคงตัว"
  variables:
    s: "การกระจัด (m)"
    u: "ความเร็วต้น (m/s)"
    t: "เวลา (s)"
    a: "ความเร่ง (m/s²)"
  selection_cues:
    - "เมื่อโจทย์ไม่บอกความเร็วปลาย v และไม่ถามหา v"
  recall_questions:
    - prompt: "ปล่อยวัตถุจากหยุดนิ่ง (u = 0) ตกอิสระใต้แรงโน้มถ่วง g สูตรการกระจัด s คือข้อใด?"
      options:
        a: "s = (1/2)gt^2"
        b: "s = gt"
        c: "s = 2gt^2"
      answer: "a"
      explanation: "เมื่อ u = 0 พจน์ ut จะหายไป เหลือเพียง s = (1/2)gt^2"

- id: form-frc-01
  subject: physics
  topic: physics.forces_energy
  title: "กฎข้อที่สองของนิวตัน"
  latex: "\\Sigma F = ma"
  conditions:
    - "ใช้ในกรอบอ้างอิงเฉื่อย (Inertial Frame)"
    - "แรงลัพธ์ \\Sigma F และความเร่ง a มีทิศทางเดียวกันเสมอ"
  variables:
    \\Sigma F: "แรงลัพธ์ (N หรือ kg·m/s²)"
    m: "มวลของวัตถุ (kg)"
    a: "ความเร่ง (m/s²)"
  selection_cues:
    - "เมื่อต้องการหาความเร่งจากแรงที่มากระทำ หรือหามวล/แรงลัพธ์"
  recall_questions:
    - prompt: "หน่วยเอสไอ (SI Unit) ของแรงนิวตัน (N) เทียบเท่ากับหน่วยฐานข้อใด?"
      options:
        a: "kg·m/s²"
        b: "kg·m²/s²"
        c: "kg/m·s"
      answer: "a"
      explanation: "จาก F = ma หน่วยคือ kg คูณกับ m/s² จึงเป็น kg·m/s²"

- id: form-eng-01
  subject: physics
  topic: physics.forces_energy
  title: "ทฤษฎีบทงาน-พลังงานจลน์"
  latex: "W_{net} = \\Delta E_k = \\frac{1}{2}mv^2 - \\frac{1}{2}mu^2"
  conditions:
    - "W_{net} คืองานของแรงลัพธ์ทั้งหมดที่กระทำต่อวัตถุ"
  variables:
    W: "งานของแรงลัพธ์ (J)"
    E_k: "พลังงานจลน์ (J)"
    m: "มวล (kg)"
    u: "ความเร็วต้น (m/s)"
    v: "ความเร็วปลาย (m/s)"
  selection_cues:
    - "โจทย์เกี่ยวกับแรง ระยะทาง และการเปลี่ยนแปลงอัตราเร็ว"
  recall_questions:
    - prompt: "ถ้าแรงตั้งฉากกับการเคลื่อนที่เสมอ งานของแรงนั้นจะมีค่าเท่าใด?"
      options:
        a: "มีค่าเป็นศูนย์ (W = 0)"
        b: "มีค่าสูงสุด"
        c: "มีค่าติดลบ"
      answer: "a"
      explanation: "จาก W = F·s·cos(θ) เมื่อตั้งฉาก θ = 90° ทำให้ cos 90° = 0 งานจึงเป็นศูนย์"
